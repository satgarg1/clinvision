<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>End of day: ClinVision</title>
<script>if (localStorage.getItem('qlinic_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231e1b4b'/%3E%3Ctext x='50' y='70' font-family='Georgia, serif' font-size='60' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3Crect x='30' y='80' width='40' height='7' rx='3' fill='%23c9973e'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=293" />
</head>
<body style="visibility:hidden;">
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand">
        <span class="brand-top">
        <span class="brand-word-wrap">
          <span class="brand-word">ClinVision</span>
          <span class="brand-word-bar"></span>
        </span>
      </span>
      <span class="brand-tagline">Where clinics run better</span>
      </a>
      <div class="clinic-name-row">
        <img class="clinic-logo-thumb" id="clinicLogoThumb" style="display:none;" alt="" />
        <div class="clinic-name" id="clinicName">Loading…</div>
      </div>
      <nav>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="reception.html" class="nav-link" id="receptionNavLink">Reception</a>
        <a href="doctor.html" class="nav-link">Doctor View</a>
        <a href="billing.html" class="nav-link">Billing</a>
        <a href="revenue.html" class="nav-link" id="revenueNavLink">Revenue</a>
        <a href="trends.html" class="nav-link" id="trendsNavLink">Insights</a>
        <a href="end-of-day.html" class="nav-link active" id="endOfDayNavLink">End of day</a>
        <a href="display.html" class="nav-link" id="displayNavLink">Display Screen</a>
        <a href="settings.html" class="nav-link pinned-bottom" id="settingsNavLink">Settings</a>
      </nav>
    </aside>

    <main class="app-main">
      <div class="app-topbar">
        <h1>End of day</h1>
      </div>

      <div class="panel" id="endOfDayPanel"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=92"></script>
  <script>
    (async function () {
      if (!(await Qlinic.requireLogin('login.html'))) return;

      document.querySelector('a.brand').addEventListener('click', async (e) => {
        e.preventDefault();
        if (await Qlinic.confirmDialog({ message: "Going to the homepage will end your session here, you'll need to log in again to get back in." })) {
          window.location.href = 'index.html';
        }
      });

      if (!(await Qlinic.isAdmin())) {
        window.location.href = 'dashboard.html';
        return;
      }
      // Body starts hidden (see the <body> tag) specifically so a non-
      // admin hitting this URL never sees this admin-only page's content
      // even for a moment before the redirect above fires -- reveal only
      // once we know for certain they're allowed to be here.
      document.body.style.visibility = 'visible';

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      // Its own page, off the sidebar below Revenue, rather than a panel on
      // Dashboard (glanced at constantly) or bolted onto Revenue (visited
      // for a different reason): admin/reception have to come here
      // deliberately, so this can't be clicked by accident. Reopening only
      // clears the closed flag, it doesn't try to undo the no-shows
      // closing just created, since there's no reliable way to tell those
      // apart from a no-show marked manually earlier in the day.
      async function renderEndOfDay() {
        const clinic = await Qlinic.getClinic();
        const closedToday = clinic && clinic.last_closed_date === Qlinic.getTodayDate();
        const panel = document.getElementById('endOfDayPanel');
        if (closedToday) {
          panel.innerHTML = `
            <div class="panel-header"><h2>End of day</h2></div>
            <span class="badge badge-no-show" style="margin-bottom:12px;display:inline-block;">Day closed</span>
            <p class="panel-note">Today's no-shows have been finalized. Reopening just unlocks the button below, it won't undo them.</p>
            <button class="btn-sm accent-outline" id="reopenDayBtn">Reopen the day</button>
          `;
          document.getElementById('reopenDayBtn').addEventListener('click', async () => {
            if (await Qlinic.confirmDialog({ title: 'Reopen the day?', message: "This only unlocks the close button again, it won't undo any no-shows already finalized.", confirmLabel: 'Reopen' })) {
              try {
                await Qlinic.reopenDay();
              } catch (err) {
                showToast(err.message || 'Could not reopen the day — please try again.');
                return;
              }
              showToast('Day reopened');
              renderEndOfDay();
            }
          });
        } else {
          panel.innerHTML = `
            <div class="panel-header"><h2>End of day</h2></div>
            <p class="panel-note">Anyone still marked "booked" (never arrived) today will be closed out as a no-show.</p>
            <button class="btn-sm primary" id="closeDayBtn">Close the day &amp; finalize no-shows</button>
          `;
          document.getElementById('closeDayBtn').addEventListener('click', async () => {
            if (await Qlinic.confirmDialog({ title: 'Close the day?', message: 'Everyone still "booked" and not arrived today will be marked as no-show.', confirmLabel: 'Close the day' })) {
              try {
                await Qlinic.closeDayNoShows();
              } catch (err) {
                showToast(err.message || 'Could not close the day — please try again.');
                return;
              }
              showToast('Day closed, no-shows finalized');
              renderEndOfDay();
            }
          });
        }
      }

      const clinic = await Qlinic.getClinic();
      document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
      if (clinic && clinic.logo_url) {
        document.getElementById('clinicLogoThumb').src = clinic.logo_url;
        document.getElementById('clinicLogoThumb').style.display = 'block';
      } else {
        document.getElementById('clinicLogoThumb').style.display = 'none';
      }
      await renderEndOfDay();
      Qlinic.onLiveChange(renderEndOfDay);
    })();
  </script>

</body>
</html>
