<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Patient Directory: ClinVision</title>
<script>if (localStorage.getItem('qlinic_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231e1b4b'/%3E%3Ctext x='50' y='70' font-family='Georgia, serif' font-size='60' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3Crect x='30' y='80' width='40' height='7' rx='3' fill='%23c9973e'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=270" />
</head>
<body style="visibility:hidden;">
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand">
        <span class="brand-top">
        <span class="brand-word-wrap">
          <span class="brand-word">ClinVision</span>
          <span class="brand-word-bar"></span>
        </span>
      </span>
      <span class="brand-tagline">Where clinics run better</span>
      </a>
      <div class="clinic-name-row">
        <img class="clinic-logo-thumb" id="clinicLogoThumb" style="display:none;" alt="" />
        <div class="clinic-name" id="clinicName">Loading…</div>
      </div>
      <nav>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="reception.html" class="nav-link" id="receptionNavLink">Reception</a>
        <a href="doctor.html" class="nav-link">Doctor View</a>
        <a href="billing.html" class="nav-link" id="billingNavLink">Billing</a>
        <a href="revenue.html" class="nav-link" id="revenueNavLink">Revenue</a>
        <a href="trends.html" class="nav-link" id="trendsNavLink">Insights</a>
        <a href="end-of-day.html" class="nav-link" id="endOfDayNavLink">End of day</a>
        <a href="display.html" class="nav-link" id="displayNavLink">Display Screen</a>
        <a href="settings.html" class="nav-link active pinned-bottom">Settings</a>
      </nav>
    </aside>

    <main class="app-main">
      <div class="app-topbar" style="margin-bottom:16px;">
        <div>
          <div class="breadcrumb"><a href="settings.html">Settings</a> <span>/</span> Patient Directory</div>
          <h1>Patient Directory</h1>
        </div>
      </div>

      <input type="text" id="directorySearch" placeholder="Search by name, phone, or address..." />

      <!-- One shared row instead of "Period" sitting alone above a
           separate row of From/To fields - customPeriodFilters is still
           toggled by the exact same JS (.style.display = 'flex'/'none'),
           just nested here as a flex child instead of a separate
           top-level block, so it simply drops out of this row's flow
           when hidden. Both already carry real labels, so no spacer
           trick is needed - flex-end (matching Revenue/No-shows/
           Insights' own filter rows) bottom-aligns Period's dropdown
           with From/To's inputs directly off their shared label height. -->
      <div style="display:flex;align-items:flex-end;flex-wrap:wrap;gap:16px 24px;margin-bottom:10px;">
        <div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px;">
          <label class="pill-label">Period</label>
          <select id="periodPresetSelect" class="pill-select"></select>
        </div>

        <div style="display:none;gap:16px 24px;flex-wrap:wrap;" id="customPeriodFilters">
          <div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px;">
            <label class="pill-label">From</label>
            <input type="date" lang="en-GB" id="periodStartDate" class="pill-input" />
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-start;gap:6px;">
            <label class="pill-label">To</label>
            <input type="date" lang="en-GB" id="periodEndDate" class="pill-input" />
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2 id="directorySummary">Loading…</h2>
          <button type="button" class="btn-sm primary" id="exportCsvBtn">Export CSV</button>
          <div id="activeFilterChipsRow" class="active-filter-chips" style="margin-bottom:0;"></div>
          <button type="button" class="btn-sm primary" id="resetFiltersBtn" style="margin-left:auto;">Reset filters</button>
        </div>
        <div id="directoryTableWrap"></div>
        <div class="pager" id="directoryPager"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=87"></script>
  <script>
    (async function () {
      if (!(await Qlinic.requireLogin('login.html'))) return;

      document.querySelector('a.brand').addEventListener('click', async (e) => {
        e.preventDefault();
        if (await Qlinic.confirmDialog({ message: "Going to the homepage will end your session here, you'll need to log in again to get back in." })) {
          window.location.href = 'index.html';
        }
      });

      if (await Qlinic.isDoctor()) {
        window.location.href = 'dashboard.html';
        return;
      }
      if (!(await Qlinic.isAdmin())) {
        document.getElementById('revenueNavLink').style.display = 'none';
        document.getElementById('trendsNavLink').style.display = 'none';
        document.getElementById('endOfDayNavLink').style.display = 'none';
      }
      // Body starts hidden (see the <body> tag) so a doctor hitting this
      // URL never sees it flash before the redirect above fires, and so
      // nobody sees the full nav for a moment before the role-based
      // hiding above finishes.
      document.body.style.visibility = 'visible';

      const PAGE_SIZE = 100;
      let allEntries = [];
      let doctorById = {};
      let currentPage = 1;
      let periodPreset = 'all';
      let doctorFilterIds = new Set();
      let genderFilterValues = new Set();
      let customPeriodRange = null;
      const GENDER_LABELS = { male: 'Male', female: 'Female', other: 'Other' };
      function genderKey(g) { return g || '__unspecified__'; }
      function genderLabel(g) { return g ? (GENDER_LABELS[g] || g) : 'Not specified'; }

      function pad2(n) { return String(n).padStart(2, '0'); }
      function toDateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }

      // Filters by last-visit date, so "Last month" here means "patients
      // last seen last month," not everyone ever seen.
      function computeCurrentMonthRange() {
        const today = new Date();
        const first = new Date(today.getFullYear(), today.getMonth(), 1);
        const last = new Date(today.getFullYear(), today.getMonth() + 1, 0);
        const todayStr = toDateStr(today);
        const lastStr = toDateStr(last);
        return { start: toDateStr(first), end: lastStr > todayStr ? todayStr : lastStr };
      }
      function computeLastMonthRange() {
        const today = new Date();
        const firstOfThisMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        const lastOfLastMonth = new Date(firstOfThisMonth.getFullYear(), firstOfThisMonth.getMonth(), 0);
        const firstOfLastMonth = new Date(lastOfLastMonth.getFullYear(), lastOfLastMonth.getMonth(), 1);
        return { start: toDateStr(firstOfLastMonth), end: toDateStr(lastOfLastMonth) };
      }
      // N complete calendar months immediately before the current one —
      // "Current month" covers the in-progress one separately.
      function computeLastNMonthsRange(n) {
        const today = new Date();
        const firstOfThisMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        const end = new Date(firstOfThisMonth.getFullYear(), firstOfThisMonth.getMonth(), 0);
        const start = new Date(firstOfThisMonth.getFullYear(), firstOfThisMonth.getMonth() - n, 1);
        return { start: toDateStr(start), end: toDateStr(end) };
      }
      // Custom is the only preset with visible fields - real From/To
      // calendars (Qlinic.attachDatePicker) rather than Month/Year
      // dropdowns, so an exact day can be picked, not just "somewhere in
      // March 2026."
      const PERIOD_PRESETS = [
        { key: 'all', label: 'All time' },
        { key: 'currentmonth', label: 'Current month' },
        { key: 'lastmonth', label: 'Last month' },
        { key: 'last3months', label: 'Last 3 months' },
        { key: 'last6months', label: 'Last 6 months' },
        { key: 'last12months', label: 'Last 12 months' },
        { key: 'custom', label: 'Custom' },
      ];
      function periodRange(preset) {
        if (preset === 'currentmonth') return computeCurrentMonthRange();
        if (preset === 'lastmonth') return computeLastMonthRange();
        if (preset === 'last3months') return computeLastNMonthsRange(3);
        if (preset === 'last6months') return computeLastNMonthsRange(6);
        if (preset === 'last12months') return computeLastNMonthsRange(12);
        if (preset === 'custom') return customPeriodRange;
        return null; // 'all'
      }

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      function csvCell(value) {
        const s = String(value == null ? '' : value);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }
      function downloadCsv(filename, csvText) {
        const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function FILTER_ICON_SVG(className) {
        return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>`;
      }

      function doctorNames(doctorIds) {
        return doctorIds.map((id) => (doctorById[id] ? Qlinic.escapeHtml(doctorById[id].name) : null)).filter(Boolean).join(', ') || '—';
      }

      function searchTerm() {
        return document.getElementById('directorySearch').value.trim().toLowerCase();
      }

      // Search + period only — the base set every column-filter checklist
      // counts against, so "Doctors seen" and "Gender" show how many
      // patients each option would match given the current search/period,
      // not zeroed out by whatever's already selected in that same
      // checklist (and not narrowed by the other checklist either, which
      // would make the two column filters interact in a confusing way).
      function searchAndPeriodEntries() {
        const term = searchTerm();
        const range = periodRange(periodPreset);
        return allEntries.filter((e) => {
          if (term && !(
            e.name.toLowerCase().includes(term) ||
            e.phone.toLowerCase().includes(term) ||
            (e.address || '').toLowerCase().includes(term)
          )) return false;
          if (range && !(e.lastVisitDate >= range.start && e.lastVisitDate <= range.end)) return false;
          return true;
        });
      }

      function filteredEntries() {
        return searchAndPeriodEntries().filter((e) => {
          if (doctorFilterIds.size > 0 && !e.doctorIds.some((id) => doctorFilterIds.has(id))) return false;
          if (genderFilterValues.size > 0 && !genderFilterValues.has(genderKey(e.gender))) return false;
          return true;
        });
      }

      // ---------------- Excel-style column-header filter dropdowns ----------------
      // Checking/unchecking a box filters instantly and closes the
      // dropdown right away, so the filtered table is immediately
      // visible — picking a second value in the same column means
      // reopening it (one filter decision at a time), which reads more
      // predictably than a dropdown that lingers open. Clearing every
      // active filter at once (across all columns) is the separate
      // global Reset button next to Export CSV, not a per-dropdown one.
      let openFilterColumn = null;
      function closeColumnFilter() {
        openFilterColumn = null;
        document.querySelectorAll('.filter-dropdown').forEach((el) => el.remove());
      }
      function openColumnFilter(column, anchorTh, options, selectedSet, onChange) {
        if (openFilterColumn === column) { closeColumnFilter(); return; }
        closeColumnFilter();
        openFilterColumn = column;
        const dropdown = document.createElement('div');
        dropdown.className = 'filter-dropdown';
        dropdown.innerHTML = options.map((o) => `
          <label><input type="checkbox" value="${Qlinic.escapeHtml(o.value)}" ${selectedSet.has(o.value) ? 'checked' : ''} /> ${Qlinic.escapeHtml(o.label)}<span class="fd-count">${o.count}</span></label>
        `).join('');
        dropdown.addEventListener('click', (e) => e.stopPropagation());
        dropdown.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
          cb.addEventListener('change', () => {
            if (cb.checked) selectedSet.add(cb.value); else selectedSet.delete(cb.value);
            closeColumnFilter();
            onChange();
          });
        });
        anchorTh.appendChild(dropdown);
      }
      function onDirectoryFilterChange() {
        currentPage = 1;
        renderTable();
      }
      function resetAllFilters() {
        doctorFilterIds.clear();
        genderFilterValues.clear();
        onDirectoryFilterChange();
      }
      document.addEventListener('click', () => closeColumnFilter());

      function doctorFilterOptions() {
        const counting = searchAndPeriodEntries();
        return Object.values(doctorById)
          .map((d) => ({ value: d.id, label: d.name, count: counting.filter((e) => e.doctorIds.includes(d.id)).length }))
          .filter((o) => o.count > 0)
          .sort((a, b) => b.count - a.count);
      }
      function genderFilterOptions() {
        const counting = searchAndPeriodEntries();
        const keys = Array.from(new Set(counting.map((e) => genderKey(e.gender))));
        return keys.map((k) => ({
          value: k,
          label: genderLabel(k === '__unspecified__' ? null : k),
          count: counting.filter((e) => genderKey(e.gender) === k).length,
        })).sort((a, b) => b.count - a.count);
      }

      // One removable chip per active column filter, so a filtered
      // directory is visibly and specifically flagged as filtered
      // (which column, which values) rather than looking identical to
      // the unfiltered table.
      function activeFilterChipsHtml() {
        const chips = [];
        if (doctorFilterIds.size > 0) {
          const labels = Object.values(doctorById).filter((d) => doctorFilterIds.has(d.id)).map((d) => d.name);
          chips.push({ key: 'doctor', label: `Doctors seen: ${labels.join(', ')}` });
        }
        if (genderFilterValues.size > 0) {
          const labels = [...genderFilterValues].map((v) => genderLabel(v === '__unspecified__' ? null : v));
          chips.push({ key: 'gender', label: `Gender: ${labels.join(', ')}` });
        }
        if (chips.length === 0) return '';
        return `<div class="active-filter-chips">${chips.map((c) => `<div class="filter-chip">${Qlinic.escapeHtml(c.label)}<button type="button" class="clear-filter-chip" data-key="${c.key}" aria-label="Clear filter">×</button></div>`).join('')}</div>`;
      }
      function clearFilterByKey(key) {
        if (key === 'doctor') doctorFilterIds.clear();
        else if (key === 'gender') genderFilterValues.clear();
        onDirectoryFilterChange();
      }

      function renderPager(total) {
        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PAGE_SIZE;
        const end = Math.min(start + PAGE_SIZE, total);
        const summary = `<span class="pager-summary">Showing ${total === 0 ? 0 : start + 1}-${end} of ${total}</span>`;
        const pager = document.getElementById('directoryPager');
        if (totalPages <= 1) {
          pager.innerHTML = summary;
          return;
        }
        pager.innerHTML = `
          ${summary}
          <div class="pager-controls">
            <button class="btn-sm" id="pagerPrev" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>
            <span class="pager-label">Page ${currentPage} of ${totalPages}</span>
            <button class="btn-sm" id="pagerNext" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
          </div>
        `;
        document.getElementById('pagerPrev').addEventListener('click', () => { currentPage -= 1; renderTable(); });
        document.getElementById('pagerNext').addEventListener('click', () => { currentPage += 1; renderTable(); });
      }

      function renderTable() {
        const filtered = filteredEntries();
        const wrap = document.getElementById('directoryTableWrap');
        // CSV export already respects the active filters (filteredEntries()
        // below) — this count is the only place that was still quoting the
        // unfiltered total, which read as "82 patients" even with a doctor
        // selected and only a handful actually shown.
        const isFiltered = filtered.length !== allEntries.length;
        document.getElementById('directorySummary').textContent = isFiltered
          ? `${filtered.length} of ${allEntries.length} patients`
          : `${allEntries.length} patient${allEntries.length === 1 ? '' : 's'} on file`;

        // Rendered into the panel-header row (next to Export CSV/Reset
        // filters) rather than as its own block above the table, so
        // filtering doesn't shift the table down or move it back up when
        // cleared — and it stays visible even when a filter zeroes out
        // every row, so there's still something to clear.
        document.getElementById('activeFilterChipsRow').innerHTML = activeFilterChipsHtml();
        document.querySelectorAll('#activeFilterChipsRow .clear-filter-chip').forEach((btn) => {
          btn.addEventListener('click', () => clearFilterByKey(btn.dataset.key));
        });

        if (allEntries.length === 0) {
          wrap.innerHTML = '<div class="empty-state">No patients on file yet.</div>';
          document.getElementById('directoryPager').innerHTML = '';
          return;
        }
        if (filtered.length === 0) {
          wrap.innerHTML = '<div class="empty-state">No patients match these filters.</div>';
          document.getElementById('directoryPager').innerHTML = '';
          return;
        }

        const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageItems = filtered.slice(start, start + PAGE_SIZE);

        const genderIconClass = genderFilterValues.size > 0 ? 'th-filter-icon active' : 'th-filter-icon';
        const doctorIconClass = doctorFilterIds.size > 0 ? 'th-filter-icon active' : 'th-filter-icon';
        wrap.innerHTML = `
          <table class="qtable qtable-fixed">
            <colgroup>
              <col style="width:15%;"><col style="width:11%;"><col style="width:6%;">
              <col style="width:10%;"><col style="width:13%;"><col style="width:10%;">
              <col style="width:10%;"><col style="width:10%;"><col style="width:15%;">
            </colgroup>
            <thead><tr>
              <th>Name</th><th>Phone</th><th>Age</th>
              <th class="th-filterable"><span class="th-filter-trigger" id="genderFilterTrigger">Gender ${FILTER_ICON_SVG(genderIconClass)}</span></th>
              <th>Address</th><th>Total visits</th><th>First visit</th><th>Last visit</th>
              <th class="th-filterable"><span class="th-filter-trigger" id="doctorFilterTrigger">Doctors seen ${FILTER_ICON_SVG(doctorIconClass)}</span></th>
            </tr></thead>
            <tbody>
              ${pageItems.map((e) => `
                <tr>
                  <td class="qtable-wrap">${Qlinic.escapeHtml(e.name)}</td>
                  <td>${Qlinic.escapeHtml(e.phone)}</td>
                  <td>${e.age || '—'}</td>
                  <td>${genderLabel(e.gender)}</td>
                  <td class="qtable-wrap">${e.address ? Qlinic.escapeHtml(e.address) : '—'}</td>
                  <td>${e.totalVisits}</td>
                  <td>${Qlinic.formatDateLabel(e.firstVisitDate)}</td>
                  <td>${Qlinic.formatDateLabel(e.lastVisitDate)}</td>
                  <td class="qtable-wrap">${doctorNames(e.doctorIds)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        document.getElementById('genderFilterTrigger').addEventListener('click', (e) => {
          e.stopPropagation();
          openColumnFilter('gender', e.currentTarget.closest('th'), genderFilterOptions(), genderFilterValues, onDirectoryFilterChange);
        });
        document.getElementById('doctorFilterTrigger').addEventListener('click', (e) => {
          e.stopPropagation();
          openColumnFilter('doctor', e.currentTarget.closest('th'), doctorFilterOptions(), doctorFilterIds, onDirectoryFilterChange);
        });
        renderPager(filtered.length);
      }

      document.getElementById('directorySearch').addEventListener('input', () => {
        currentPage = 1;
        renderTable();
      });
      document.getElementById('resetFiltersBtn').addEventListener('click', resetAllFilters);

      function renderPeriodPresetOptions() {
        document.getElementById('periodPresetSelect').innerHTML = PERIOD_PRESETS.map((p) =>
          `<option value="${p.key}" ${p.key === periodPreset ? 'selected' : ''}>${p.label}</option>`
        ).join('');
      }
      document.getElementById('periodPresetSelect').addEventListener('change', (e) => {
        periodPreset = e.target.value;
        document.getElementById('customPeriodFilters').style.display = periodPreset === 'custom' ? 'flex' : 'none';
        currentPage = 1;
        renderTable();
      });

      // ISO "YYYY-MM-DD" strings compare correctly with plain <=/>=, so
      // no Date parsing needed here - just swap if From ends up after To
      // rather than silently returning an empty/backwards range.
      function updateCustomPeriodFromInputs() {
        const s = document.getElementById('periodStartDate').value;
        const e = document.getElementById('periodEndDate').value;
        customPeriodRange = (s && e) ? { start: s <= e ? s : e, end: s <= e ? e : s } : null;
        currentPage = 1;
        renderTable();
      }
      ['periodStartDate', 'periodEndDate'].forEach((id) => {
        document.getElementById(id).addEventListener('change', updateCustomPeriodFromInputs);
      });

      document.getElementById('exportCsvBtn').addEventListener('click', () => {
        const rows = [['Name', 'Phone', 'Age', 'Gender', 'Address', 'Total visits', 'First visit', 'Last visit', 'Doctors seen']];
        filteredEntries().forEach((e) => {
          rows.push([e.name, e.phone, e.age || '', e.gender || '', e.address || '', e.totalVisits, e.firstVisitDate, e.lastVisitDate, doctorNames(e.doctorIds)]);
        });
        const csv = rows.map((r) => r.map(csvCell).join(',')).join('\r\n');
        downloadCsv(`patient-directory-${Qlinic.getTodayDate()}.csv`, csv);
      });

      // Today/Tomorrow/In a week dropped - jumping just one end of a
      // custom range to "today" independent of the other rarely makes
      // sense as a range boundary.
      Qlinic.attachDatePicker(document.getElementById('periodStartDate'), { quickButtons: false });
      Qlinic.attachDatePicker(document.getElementById('periodEndDate'), { quickButtons: false });
      document.getElementById('periodStartDate').max = Qlinic.getTodayDate();
      document.getElementById('periodEndDate').max = Qlinic.getTodayDate();
      renderPeriodPresetOptions();

      const clinic = await Qlinic.getClinic();
      document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
      if (clinic && clinic.logo_url) {
        document.getElementById('clinicLogoThumb').src = clinic.logo_url;
        document.getElementById('clinicLogoThumb').style.display = 'block';
      } else {
        document.getElementById('clinicLogoThumb').style.display = 'none';
      }

      const doctors = await Qlinic.getDoctors({ includeInactive: true });
      doctorById = Object.fromEntries(doctors.map((d) => [d.id, d]));
      allEntries = await Qlinic.getPatientDirectory();
      // Most recently active patients first — the ones most likely to be
      // relevant to whatever admin is looking this page up for.
      allEntries.sort((a, b) => (b.lastVisitDate || '').localeCompare(a.lastVisitDate || ''));
      renderTable();
    })();
  </script>

</body>
</html>
