  <script>
    window.DisplaySound = (function () {
      var MUTE_KEY = 'clinvision_display_sound_muted';
      var muted = localStorage.getItem(MUTE_KEY) === '1';
      var ctx = null;

      function unlock() {
        if (!ctx) {
          try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
        }
        if (ctx.state === 'suspended') ctx.resume();
      }

      function tone(freq, start, dur, peak, type) {
        var now = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now + start);
        gain.gain.exponentialRampToValueAtTime(peak, now + start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now + start);
        osc.stop(now + start + dur + 0.05);
      }

      function playChime() {
        if (muted || !ctx) return;
        tone(1046, 0, 0.35, 0.6, 'sine');
        tone(880, 0.28, 0.55, 0.6, 'sine');
      }

      function playBreakChime() {
        if (muted || !ctx) return;
        tone(392, 0, 0.6, 0.45, 'triangle');
      }
      function playEmergencyChime() {
        if (muted || !ctx) return;
        [0, 0.14, 0.28, 0.42].forEach(function (start, i) {
          tone(i % 2 === 0 ? 784 : 988, start, 0.12, 0.65, 'square');
        });
      }
      function playAvailableChime() {
        if (muted || !ctx) return;
        tone(659, 0, 0.22, 0.45, 'sine');
        tone(880, 0.16, 0.35, 0.45, 'sine');
      }

      document.addEventListener('click', unlock, { once: true });

      var btn = document.getElementById('displaySoundToggle');
      var onIcon = btn.querySelector('.icon-sound-on');
      var offIcon = btn.querySelector('.icon-sound-off');
      function reflectMuted() {
        onIcon.style.display = muted ? 'none' : '';
        offIcon.style.display = muted ? '' : 'none';
        btn.setAttribute('aria-label', muted ? 'Turn call sound on' : 'Turn call sound off');
      }
      reflectMuted();
      btn.addEventListener('click', function () {
        unlock();
        muted = !muted;
        localStorage.setItem(MUTE_KEY, muted ? '1' : '0');
        reflectMuted();
        if (!muted) playChime();
      });

      return {
        playChime: playChime,
        playBreakChime: playBreakChime,
        playEmergencyChime: playEmergencyChime,
        playAvailableChime: playAvailableChime,
      };
    })();
  </script>

  <script>
    (function () {
      var ZOOM_KEY = 'clinvision_display_zoom';
      var MIN_ZOOM = 0.5, MAX_ZOOM = 1.5, STEP = 0.05;
      var wrap = document.getElementById('displayScaleWrap');
      var saved = parseFloat(localStorage.getItem(ZOOM_KEY));
      var zoom = isNaN(saved) ? 1 : Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, saved));

      function apply() {
        wrap.style.transform = zoom === 1 ? '' : 'scale(' + zoom.toFixed(2) + ')';
      }
      apply();

      function setZoom(next) {
        zoom = Math.round(Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, next)) * 100) / 100;
        localStorage.setItem(ZOOM_KEY, String(zoom));
        apply();
      }

      document.getElementById('displayZoomOut').addEventListener('click', function () { setZoom(zoom - STEP); });
      document.getElementById('displayZoomIn').addEventListener('click', function () { setZoom(zoom + STEP); });
    })();
  </script>

    (async function () {
      const urlParams = new URLSearchParams(location.search);
      // localStorage, not sessionStorage: mobile browsers routinely clear
      // sessionStorage on a hard refresh (and some webviews treat a
      // background/foreground cycle as a fresh session), which was
      // sending patients straight to the login screen after refreshing
      // a page they'd reached anonymously via QR code. localStorage
      // survives a refresh reliably; the session still expires
      // server-side after 4 hours regardless of what the client holds.
      const SESSION_STORAGE_KEY = 'clinvision_display_session_id';
      let publicSessionId = urlParams.get('session') || localStorage.getItem(SESSION_STORAGE_KEY) || null;
      const scannedClinicId = urlParams.get('clinic');
      const scannedDailyCode = urlParams.get('daily');
      let isPublicMode = !!publicSessionId;

      if (!isPublicMode && !(scannedClinicId && scannedDailyCode)) {
        if (!(await Qlinic.requireLogin('login.html'))) return;
      }

      if (!isPublicMode && !(scannedClinicId && scannedDailyCode) && await Qlinic.isDoctor()) {
        window.location.href = 'dashboard.html';
        return;

      function phoneticToDevanagari(word) {
        const w = word.toLowerCase();
        const consonants = [
          ['ksh', 'क्ष'], ['gy', 'ज्ञ'], ['shh', 'ष'], ['chh', 'छ'],
          ['kh', 'ख'], ['gh', 'घ'], ['ch', 'च'], ['jh', 'झ'], ['ng', 'ङ'], ['ny', 'ञ'],
          ['th', 'थ'], ['dh', 'ध'], ['ph', 'फ'], ['bh', 'भ'], ['sh', 'श'],
          ['k', 'क'], ['g', 'ग'], ['c', 'क'], ['j', 'ज'], ['t', 'त'], ['d', 'द'],
          ['n', 'न'], ['p', 'प'], ['b', 'ब'], ['m', 'म'], ['y', 'य'], ['r', 'र'],
          ['l', 'ल'], ['v', 'व'], ['w', 'व'], ['s', 'स'], ['h', 'ह'], ['f', 'फ़'],
          ['z', 'ज़'], ['q', 'क़'], ['x', 'क्स'],
        ];
        const vowels = [
          ['aa', 'आ', 'ा'], ['ee', 'ई', 'ी'], ['ii', 'ई', 'ी'], ['oo', 'ऊ', 'ू'],
          ['ai', 'ऐ', 'ै'], ['au', 'औ', 'ौ'],
          ['a', 'अ', ''], ['i', 'इ', 'ि'], ['u', 'उ', 'ु'], ['e', 'ए', 'े'], ['o', 'ओ', 'ो'],
        ];
        let out = '';
        let i = 0;
        while (i < w.length) {
          const cons = consonants.find(([pat]) => w.startsWith(pat, i));
          if (cons) {
            i += cons[0].length;
            const vow = vowels.find(([pat]) => w.startsWith(pat, i));
            if (vow) { out += cons[1] + vow[2]; i += vow[0].length; }
            else { out += cons[1]; }
            continue;
          }
          const vow = vowels.find(([pat]) => w.startsWith(pat, i));
          if (vow) { out += vow[1]; i += vow[0].length; continue; }
          out += w[i];
          i += 1;
        }
        return out;
      }

      function toDevanagari(text) {
        if (!text) return text;
        return text.split(/(\s+)/).map((token) => {
          if (/^\s*$/.test(token)) return token;
          const m = token.match(/^([A-Za-z]+)([^A-Za-z]*)$/);
          if (!m) return token;
          const [, word, rest] = m;
          return (HI_WORD_DICT[word.toLowerCase()] || phoneticToDevanagari(word)) + rest;
        }).join('');
      }

      const SPECIALTY_HI = {
        'General Physician': 'सामान्य चिकित्सक',
        'Pediatrician': 'बाल रोग विशेषज्ञ',
        'Gynecologist': 'स्त्री रोग विशेषज्ञ',
        'Dermatologist': 'त्वचा रोग विशेषज्ञ',
        'Dentist': 'दंत चिकित्सक',
        'ENT Specialist': 'कान-नाक-गला विशेषज्ञ',
        'Ophthalmologist': 'नेत्र रोग विशेषज्ञ',
        'Orthopedic': 'अस्थि रोग विशेषज्ञ',
        'Cardiologist': 'हृदय रोग विशेषज्ञ',
        'Neurologist': 'तंत्रिका रोग विशेषज्ञ',
        'Psychiatrist': 'मनोचिकित्सक',
        'General Surgeon': 'सामान्य सर्जन',
        'Urologist': 'मूत्र रोग विशेषज्ञ',
        'Gastroenterologist': 'पेट रोग विशेषज्ञ',
        'Endocrinologist': 'अंतःस्रावी रोग विशेषज्ञ',
        'Pulmonologist': 'फेफड़ा रोग विशेषज्ञ',
        'Diabetologist': 'मधुमेह विशेषज्ञ',
        'Physiotherapist': 'फिजियोथेरेपिस्ट',
      };

      function localizeName(text) {
        return escapeHtml(T === STRINGS.hi ? toDevanagari(text) : text);
      }
      function localizeSpecialty(text) {
        if (T !== STRINGS.hi) return escapeHtml(text);
        return escapeHtml(SPECIALTY_HI[text] || toDevanagari(text));
      }

      function statusLabel(status) {
        return {
          on_time: T.onTime,
          on_break: T.onBreak,
          emergency: T.emergency,
        }[status] || status;
      }

      function statusDetailLine(doctor) {
        const since = Qlinic.formatTimestamp(doctor.statusUpdatedAt);
        const note = Qlinic.isRealStatusReason(doctor.statusNote) ? `<br>${escapeHtml(doctor.statusNote)}` : '';
        if (doctor.status === 'on_break') return T.onBreakDetail(T.formatDuration(doctor.delayMins || 0), since) + note;
        if (doctor.status === 'emergency') return T.emergencyDetail;
        return '';
      }

      let walkinRanks = new Map();
      function buildWalkinRanks(allQueues) {
        const ranks = new Map();
        allQueues.forEach(({ queue }) => {
          const walkins = [
            ...(queue.nowServing ? [queue.nowServing] : []),
            ...queue.waiting, ...queue.booked, ...queue.done, ...queue.noShow,
          ].filter((p) => p.type === 'walkin');
          walkins.sort((a, b) => (a.tokenNumber || 0) - (b.tokenNumber || 0));
          walkins.forEach((p, i) => ranks.set(p.id, i + 1));
        });
        return ranks;
      }
      function formatToken(p) {
        if (!p || p.tokenNumber == null) return null;
        if (p.type === 'walkin') return 'W' + (walkinRanks.get(p.id) || '?');
        return String(p.tokenNumber);
      }

      function buildNextChips(waiting) {
        if (!waiting.length) return '';
        const shown = waiting.slice(0, 4).map((p) => formatToken(p)).filter(Boolean);
        const extra = waiting.length - shown.length;
        const chips = shown.map((t) => `<span class="tile-next-chip">#${t}</span>`).join('');
        const more = extra > 0 ? `<span class="tile-next-chip more">${T.othersLabel(extra)}</span>` : '';
        return `<div class="tile-next"><span class="tile-next-label">${T.nextLabel}</span>${chips}${more}</div>`;
      }

      function renderDoctorStrip(all) {
        let someoneNewlyCalled = false;
        let someoneWentOnBreak = false;
        let someoneWentEmergency = false;
        let someoneCameBack = false;
        const nextServedByDoctor = {};
        const nextStatusByDoctor = {};
        all.forEach(({ doctor, queue }) => {
          const servingId = queue.nowServing ? queue.nowServing.id : null;
          nextServedByDoctor[doctor.id] = servingId;
          if (hasRenderedOnce && servingId && servingId !== lastServedByDoctor[doctor.id]) {
            someoneNewlyCalled = true;
          }

          nextStatusByDoctor[doctor.id] = doctor.status;
          const prevStatus = lastStatusByDoctor[doctor.id];
          if (hasRenderedOnce && doctor.status !== prevStatus) {
            if (doctor.status === 'on_break') someoneWentOnBreak = true;
            else if (doctor.status === 'emergency') someoneWentEmergency = true;
            else if (doctor.status === 'on_time' && (prevStatus === 'on_break' || prevStatus === 'emergency' || prevStatus === 'running_late')) someoneCameBack = true;
          }
        });
        lastServedByDoctor = nextServedByDoctor;
        lastStatusByDoctor = nextStatusByDoctor;
        hasRenderedOnce = true;
        if (someoneNewlyCalled) window.DisplaySound.playChime();
        if (someoneWentOnBreak) window.DisplaySound.playBreakChime();
        if (someoneWentEmergency) window.DisplaySound.playEmergencyChime();
        if (someoneCameBack) window.DisplaySound.playAvailableChime();

        const isWide = all.length === 1;
        const colsClass = all.length <= 1 ? 'cols-1'
          : all.length === 2 ? 'cols-2'
          : all.length === 3 ? 'cols-3'
          : all.length === 4 ? 'cols-4'
          : all.length === 5 ? 'cols-5'
          : 'cols-6plus';
        const stripEl = document.getElementById('doctorStrip');
        stripEl.className = `display-strip ${colsClass}`;

        stripEl.innerHTML = all.map(({ doctor, queue }, index) => {
          const closedToday = !!doctor.dayClosedAt && (Date.now() - new Date(doctor.dayClosedAt).getTime() < DAY_CLOSED_FADE_MS);
          const notArrived = !!doctor.dayClosedAt && !closedToday;
          const statusText = (closedToday || notArrived) ? '' : statusDetailLine(doctor);
          const isEmergency = !closedToday && !notArrived && doctor.status === 'emergency';
          const isOnBreak = !closedToday && !notArrived && doctor.status === 'on_break';

          let bottomHtml;
          if (closedToday) {
            bottomHtml = `<div class="tile-detail-line tile-detail-muted" data-day-closed-at="${doctor.dayClosedAt}"></div>`;
          } else if (notArrived) {
            bottomHtml = `<div class="tile-detail-line tile-detail-muted">${T.notArrivedSub}</div>`;
          } else if (statusText) {
            bottomHtml = `<div class="tile-detail-line">${statusText}</div>`;
          } else {
            const waitingCount = isWide ? '' : `<div class="tile-waiting"><b>${queue.waiting.length}</b> ${T.waitingLabel}</div>`;
            bottomHtml = `<div class="tile-bottom${isWide ? ' next-only' : ''}">${waitingCount}${buildNextChips(queue.waiting)}</div>`;
          }

          const nowServingToken = queue.nowServing ? formatToken(queue.nowServing) : null;
          const servingHtml = queue.nowServing
            ? `
              <div class="tile-serving-label">${T.nowServing}</div>
              <div class="tile-token-row">
                ${nowServingToken ? `<span class="tile-token">#${nowServingToken}</span>` : ''}
                <span class="tile-token-name">${localizeName(queue.nowServing.name)}</span>
              </div>
              ${queue.nowServing.calledAt ? `<div class="tile-called">${T.calledAtLabel(Qlinic.formatTimestamp(queue.nowServing.calledAt))}</div>` : ''}
            `
            : `<div class="tile-serving-label">${T.nowServing}</div><div class="tile-idle">—</div>`;

          const pillHtml = closedToday
            ? `<span class="tile-pill tile-pill-warn"><span class="dot"></span>${T.dayClosed}</span>`
            : notArrived
              ? `<span class="tile-pill tile-pill-warn"><span class="dot"></span>${T.notArrived}</span>`
              : doctor.status === 'on_time'
                ? `<span class="tile-pill tile-pill-ok"><span class="dot"></span>${T.onTime}</span>`
                : isEmergency
                  ? `<span class="tile-pill tile-pill-danger"><span class="dot"></span>${statusLabel(doctor.status)}</span>`
                  : `<span class="tile-pill tile-pill-warn"><span class="dot"></span>${statusLabel(doctor.status)}</span>`;

          return `
          <div class="doc-tile${isWide ? ' wide' : ''}${isEmergency ? ' is-emergency' : ''}${isOnBreak ? ' is-on-break' : ''}" style="--tile-accent: var(--mkt-${ACCENT_COLORS[index % ACCENT_COLORS.length]});">
            <div class="tile-top">
              <div>
                <div class="tile-name">${T.drPrefix}${localizeName(doctor.name)}</div>
                <div class="tile-spec">${localizeSpecialty(doctor.specialty)}</div>
              </div>
              ${pillHtml}
            </div>
            <div class="tile-serving">${servingHtml}</div>
            ${bottomHtml}
          </div>
        `;
        }).join('');
      }

      function computeCombinedWaiting(all) {
        const rows = [];
        all.forEach(({ doctor, queue }, index) => {
          const doctorAccent = ACCENT_COLORS[index % ACCENT_COLORS.length];
          queue.waiting.forEach((p) => {
            rows.push({
              name: p.name,
              address: p.address,
              type: p.type,
              doctorName: doctor.name,
              doctorAccent,
              position: p.position,
              effectiveTime: p.effectiveTime,
              intendedTime: p.intendedTime,
              arrivedAt: p.arrivedAt,
              createdAt: p.createdAt,
              isPriority: p.isPriority,
              tokenNumber: p.tokenNumber,
              tokenDisplay: formatToken(p),
            });
          });
        });
        rows.sort((a, b) => {
          if (!!a.isPriority !== !!b.isPriority) return a.isPriority ? -1 : 1;
          return (a.effectiveTime - b.effectiveTime) || (a.intendedTime - b.intendedTime) || (new Date(a.createdAt) - new Date(b.createdAt));
        });
        return rows;
      }

      function boardTimeCell(p) {
        const intended = p.intendedTime instanceof Date ? p.intendedTime : new Date(p.intendedTime);
        const arrived = p.arrivedAt ? new Date(p.arrivedAt) : null;
        const arrivedLate = p.type === 'appointment' && arrived && arrived.getTime() > intended.getTime();
        const timeSpan = `<span class="board-time-value">${Qlinic.formatTimestamp(intended)}</span>`;
        if (arrivedLate) {
          return `${timeSpan}<span class="board-time-arrived-late">${T.arrivedLate}</span>`;
        }
        const LATE_GRACE_MS = 10 * 60 * 1000;
        const isLate = Date.now() - intended.getTime() >= LATE_GRACE_MS;
        return `${timeSpan}${isLate ? `<span class="board-time-late">${T.runningLate}</span>` : ''}`;
      }

      function buildRowsHTML(pageItems, startIdx) {
        if (pageItems.length === 0) {
          return `<div class="board-empty">${T.empty}</div>`;
        }
        return pageItems.map((p, i) => `
          <div class="board-row">
            <span class="board-pos">${p.tokenDisplay ? '#' + p.tokenDisplay : '·'}</span>
            <span class="board-time-cell">${boardTimeCell(p)}</span>
            <span class="board-name-row">${localizeName(p.name)}${p.isPriority ? `<span class="board-priority">${T.priority}</span>` : ''}</span>
            ${showDoctorCol ? `<span class="board-doc">${T.drPrefix}${localizeName(p.doctorName)}</span>` : ''}
          </div>
        `).join('');
      }

      function applyStaticStrings() {
        document.getElementById('liveStatusText').textContent = T.liveStatusLabel;
        document.getElementById('queueTitleText').textContent = T.queueTitle;
        document.getElementById('patientsWaitingLabel').textContent = T.patientsWaitingLabel;
        document.getElementById('displayQrLabel').textContent = T.viewOnPhone;
        document.getElementById('displayQrSub').textContent = T.scanWithPhone;
        document.getElementById('colPos').textContent = T.colPos;
        document.getElementById('colTime').textContent = T.colTime;
        document.getElementById('colPatient').textContent = T.colPatient;
        document.getElementById('colDoctor').textContent = T.colDoctor;
      }

      function renderDots(totalPages) {
        const dotsEl = document.getElementById('pageDots');
        if (totalPages <= 1) { dotsEl.innerHTML = ''; return; }
        dotsEl.innerHTML = Array.from({ length: totalPages }).map((_, i) =>
          `<span class="dot ${i === currentPage ? 'active' : ''}"></span>`
        ).join('');
      }

      function renderPage() {
        const totalPages = Math.max(1, Math.ceil(combined.length / PAGE_SIZE));
        if (currentPage >= totalPages) currentPage = 0;
        const start = currentPage * PAGE_SIZE;
        const pageItems = combined.slice(start, start + PAGE_SIZE);
        document.getElementById('boardRows').innerHTML = buildRowsHTML(pageItems, start);
        document.getElementById('boardCount').textContent = combined.length;
        renderDots(totalPages);
      }

      const DAY_CLOSED_FADE_MS = 3 * 60 * 1000;

      const RESET_HOUR = 4;
      function nextResetAfter(closedAtIso) {
        const closedAt = new Date(closedAtIso);
        const reset = new Date(closedAt);
        reset.setHours(RESET_HOUR, 0, 0, 0);
        if (reset <= closedAt) reset.setDate(reset.getDate() + 1);
        return reset;
      }

      function formatCountdown(dayClosedAtIso) {
        const remainingMs = Math.max(0, DAY_CLOSED_FADE_MS - (Date.now() - new Date(dayClosedAtIso).getTime()));
        const totalSec = Math.ceil(remainingMs / 1000);
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        return `${m}:${String(s).padStart(2, '0')}`;
      }
      function tickFadeCountdowns() {
        document.querySelectorAll('.tile-detail-line[data-day-closed-at]').forEach((el) => {
          el.textContent = `${T.fadingLabel} ${formatCountdown(el.getAttribute('data-day-closed-at'))}`;
        });
      }

      function showExpiredLinkMessage() {
        document.getElementById('doctorStrip').style.display = 'none';
        document.getElementById('boardPanel').style.display = 'none';
        document.querySelector('.stat-card').style.display = 'none';
        const el = document.getElementById('allClosedMessage');
        el.style.display = 'block';
        document.getElementById('allClosedTitle').textContent = 'Your session has ended';
        document.getElementById('allClosedSub').textContent = 'Please scan the QR code on the display screen in the waiting room again.';
        localStorage.removeItem(SESSION_STORAGE_KEY);
      }

      async function refreshData() {
        const now = new Date();
        document.getElementById('clockTime').textContent = Qlinic.formatTimestamp(now);
        document.getElementById('clockDate').textContent = now.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' });

        let clinic, allQueues;
        if (isPublicMode) {
          try {
            const result = await Qlinic.getDisplayBoardBySession(publicSessionId);
            clinic = result.clinic;
            allQueues = result.allQueues;
          } catch (err) {
            showExpiredLinkMessage();
            return;
          }
        } else {
          clinic = await Qlinic.getClinic();
          allQueues = await Qlinic.getAllQueues();
        }
        T = STRINGS[clinic && clinic.display_language] || STRINGS.en;
        applyStaticStrings();
        document.getElementById('taglineText').textContent = (clinic && clinic.name) || T.taglineFull;
        walkinRanks = buildWalkinRanks(allQueues);
        const all = allQueues.filter(({ doctor }) => {
          if (!doctor.dayClosedAt) return true;
          if (Date.now() - new Date(doctor.dayClosedAt).getTime() < DAY_CLOSED_FADE_MS) return true;
          return Date.now() >= nextResetAfter(doctor.dayClosedAt).getTime();
        });

        // Doctor column in the queue table reflects the clinic's real
        // roster size (allQueues), not just who's currently open — a
        // 2-doctor clinic keeps the column even if one doctor happens
        // to be closed for the day right now.
        showDoctorCol = allQueues.length > 1;
        document.getElementById('boardPanel').classList.toggle('single-doctor-mode', !showDoctorCol);

        const clinicClosedNow = Qlinic.isClinicClosedToday(clinic);
        const allClosedToday = clinicClosedNow || (allQueues.length > 0 && all.length === 0);
        document.getElementById('doctorStrip').style.display = allClosedToday ? 'none' : '';
        document.getElementById('boardPanel').style.display = allClosedToday ? 'none' : '';
        document.getElementById('allClosedMessage').style.display = allClosedToday ? 'block' : 'none';
        if (allClosedToday) {
          document.getElementById('allClosedTitle').textContent = clinicClosedNow ? T.clinicClosedTitle : T.allClosedTitle;
          document.getElementById('allClosedSub').textContent = clinicClosedNow ? T.clinicClosedSub : T.allClosedSub;
        }

        renderDoctorStrip(all);
        tickFadeCountdowns();
        combined = computeCombinedWaiting(all);
        renderPage();
      }

      function rotatePage() {
        const totalPages = Math.max(1, Math.ceil(combined.length / PAGE_SIZE));
        if (totalPages <= 1) return;
        const rows = document.getElementById('boardRows');
        rows.classList.add('flip-out');
        setTimeout(() => {
          currentPage = (currentPage + 1) % totalPages;
          renderPage();
          rows.classList.remove('flip-out');
        }, 320);
      }

      async function refreshDisplayCode() {
        try {
          const { clinicId, code } = await Qlinic.getDailyBoardCode();
          const url = new URL('display.html', location.href);
          url.searchParams.set('clinic', clinicId);
          url.searchParams.set('daily', code);
          const qr = qrcode(0, 'M');
          qr.addData(url.toString());
          qr.make();
          document.getElementById('displayQrCode').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2 });
          document.getElementById('displayQrPanel').style.display = '';
        } catch (err) {
          // Non-fatal — the board itself still works without the QR panel.
          document.getElementById('displayQrPanel').style.display = 'none';
        }
      }

      refreshData();
      setInterval(refreshData, REFRESH_MS);
      setInterval(tickFadeCountdowns, 1000);
      setInterval(rotatePage, ROTATE_MS);
      if (!isPublicMode) {
        Qlinic.onLiveChange(refreshData);
        refreshDisplayCode();
        // The code is deterministic for (clinic, board day) — no expiry
        // math to get right here, just re-fetch on a safety-net
        // interval so a stuck/throttled tab still self-corrects if it
        // somehow missed the 2am board-day rollover. Refetching costs
        // nothing extra: the code comes back identical until the day
        // actually changes.
        setInterval(refreshDisplayCode, 60 * 60 * 1000);
        // Smart TV / embedded browsers throttle or suspend background
        // timers for a tab left running unattended for hours — this
        // catches a missed rollover the moment the tab actually wakes
        // up (user interaction, TV coming out of standby, etc.),
        // rather than depending solely on the interval firing on time.
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') refreshDisplayCode();
        });
      }
    })();
  </script>
</body>
</html>
