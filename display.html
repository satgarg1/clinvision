<body class="display-body">
  <!-- Applied synchronously, before anything else renders, so a device
       already set to light doesn't flash dark first. Per-device only
       (localStorage) -- this screen's own toggle below, not a clinic
       setting; see BACKLOG.md, "Day/night mode on the waiting-room
       display screen". -->
  <script>document.body.setAttribute('data-board-mode', localStorage.getItem('clinvision_display_board_theme') === 'light' ? 'light' : 'dark');</script>

  <!-- Deliberately outside .display-header so it doesn't become a third
       flex item in that row -- sits in the page's own top padding
       instead, right above the clock, small enough (17px) that a patient
       glancing at the board reads it as a faint mark, not a control. -->
  <button class="display-theme-toggle" id="displayThemeToggle" aria-label="Change screen appearance">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="4,16 12,7 20,16 12,13"/></svg>
  </button>
  <div class="display-theme-menu" id="displayThemeMenu">
    <button type="button" data-mode="dark" aria-label="Dark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg></button>
    <button type="button" data-mode="light" aria-label="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/></svg></button>
  </div>
  <script>
    (function () {
      var STORAGE_KEY = 'clinvision_display_board_theme';
      var toggle = document.getElementById('displayThemeToggle');
      var menu = document.getElementById('displayThemeMenu');
      var buttons = menu.querySelectorAll('button');

      function markActive(mode) {
        buttons.forEach(function (btn) {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });
      }
      markActive(document.body.getAttribute('data-board-mode'));

      toggle.addEventListener('click', function () {
        var isOpen = menu.classList.toggle('open');
        toggle.classList.toggle('open', isOpen);
      });

      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var mode = btn.dataset.mode;
          localStorage.setItem(STORAGE_KEY, mode);
          document.body.setAttribute('data-board-mode', mode);
          markActive(mode);
          setTimeout(function () {
            menu.classList.remove('open');
            toggle.classList.remove('open');
          }, 450);
        });
      });
    })();
  </script>

  <div class="display-header">
    <div class="brand">
      <!-- Wordmark-led sitewide now, no icon -- the old inverted clock
           mark (needed only because this board's background is
           permanently dark) is gone along with the icon concept
           itself. White fill on brand-word specifically, since the
           usual navy ink would disappear into this dark background
           exactly the way the old dark-filled icon used to. Full
           wordmark+bar+tagline stack now, same as every other page --
           this board had been left as a bare single-line wordmark,
           which was the one place the rebrand didn't actually land. -->
      <span class="brand-word-wrap">
        <span class="brand-word">ClinVision</span>
        <span class="brand-word-bar"></span>
      </span>
      <span class="brand-tagline" id="taglineText">Where clinics run better</span>
    </div>
    <div style="text-align:right;">
      <div class="clock"><span id="clockTime">--</span></div>
      <div class="clock-date" id="clockDate"></div>
      <!-- Same green-dot-blinks pattern as queue.html's own live
           indicator, not the old bare live-dot pulse next to the
           clock (unlabeled, and now redundant next to this). Sits
           below the date, not the time -- reads as a status footnote
           to "today", not a rival to the clock itself. -->
      <div class="display-live-line"><span class="dot" aria-hidden="true"></span><span id="liveStatusText">Live queue</span></div>
    </div>
  </div>

  <!-- "Doctor status" label removed -- each row already shows a name and
       an AVAILABLE/ON A BREAK pill, so the section heading was just
       taking up a line without telling a patient anything the rows
       don't already say. Freed-up space lets the strip sit closer to
       the header, leaving more room for the waiting-list rows below. -->
  <div class="display-strip" id="doctorStrip"></div>

  <div class="display-all-closed" id="allClosedMessage" style="display:none;">
    <div class="display-all-closed-title" id="allClosedTitle"></div>
    <div class="display-all-closed-sub" id="allClosedSub"></div>
  </div>

  <div class="board" id="boardPanel">
    <div class="board-head">
      <p class="section-label" style="margin:0;"><span id="waitingNowText">Waiting now</span> <span id="boardCount" class="count"></span></p>
      <div class="board-page-indicator" id="pageDots"></div>
    </div>
    <div class="board-cols">
      <span id="colPos">#</span><span id="colPatient">Patient</span><span id="colDoctor">Doctor</span><span id="colType">Type</span>
    </div>
    <div class="board-rows" id="boardRows"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=92"></script>
  <script>
    (async function () {
      if (!(await Qlinic.requireLogin('login.html'))) return;

      if (await Qlinic.isDoctor()) {
        window.location.href = 'dashboard.html';
        return;
      }

      // Every name/address/reason rendered on this board is free text
      // typed by staff (or a patient's own booking reason) — this screen
      // is meant to run unattended on a waiting-room TV, so it's escaped
      // before going into innerHTML anywhere it appears.
      const escapeHtml = Qlinic.escapeHtml;

      const PAGE_SIZE = 8;
      const ROTATE_MS = 7000; // digital-signage convention is 5-8s per page; 7s gives enough time to actually read a name before it flips
      const REFRESH_MS = 5000;

      let combined = [];
      let currentPage = 0;

      // Same 5-color identity palette used on reception and the doctor view:
      // each doctor keeps the same color everywhere, so on a board mixing
      // every doctor's patients together, a glance at the dot tells you
      // whose it is without reading the name column.
      const ACCENT_COLORS = ['teal', 'blue', 'purple', 'coral', 'pink'];

      // This board is read by patients, not staff, so its language follows
      // the clinic-wide "Display screen" setting (Settings), not the
      // per-device day/night theme. Patient/doctor names and addresses are
      // real data, never translated; only these fixed UI labels are.
      const STRINGS = {
        en: {
          taglineFull: 'Where clinics run better',
          liveStatusLabel: 'Live queue',
          waitingLabel: 'Waiting',
          nextLabel: 'Next',
          othersLabel: (n) => `+${n} others`,
          waitingNow: 'Waiting now',
          colPos: 'Token',
          colPatient: 'Patient',
          colDoctor: 'Doctor',
          colType: 'Type',
          nowServing: 'Now serving',
          onTime: 'Available',
          onBreak: 'On a break',
          emergency: 'Emergency',
          dayClosed: 'Day closed',
          fadingLabel: 'Fading from screen in',
          onBreakDetail: (m, since) => `On a break for ${m} minutes since ${since}`,
          emergencyDetail: 'Attending an emergency, please bear with us',
          appointment: 'Appointment',
          walkin: 'Walk-in',
          priority: 'Priority',
          empty: 'No one waiting right now. The waiting room is clear.',
          acrossAllDoctors: (n) => `(${n} across all doctors)`,
          allClosedTitle: 'No doctor is available right now',
          allClosedSub: 'All doctors have closed for the day. Please check back tomorrow.',
          clinicClosedTitle: "We're closed for the day",
          clinicClosedSub: 'Thanks for your patience today — the clinic will reopen tomorrow.',
          notArrived: 'Not arrived yet',
          notArrivedSub: 'Queue will start once they arrive',
          calledAtLabel: (t) => `called in at ${t}`,
        },
        hi: {
          taglineFull: 'जहाँ क्लीनिक बेहतर चलते हैं',
          liveStatusLabel: 'लाइव कतार',
          waitingLabel: 'प्रतीक्षा में',
          nextLabel: 'अगले',
          othersLabel: (n) => `+${n} और`,
          waitingNow: 'अभी प्रतीक्षा में',
          colPos: 'टोकन',
          colPatient: 'मरीज़',
          colDoctor: 'डॉक्टर',
          colType: 'प्रकार',
          nowServing: 'अभी देखा जा रहा है',
          onTime: 'उपलब्ध',
          onBreak: 'ब्रेक पर',
          emergency: 'आपातकाल',
          dayClosed: 'दिन समाप्त',
          fadingLabel: 'स्क्रीन से हटने में',
          onBreakDetail: (m, since) => `${m} मिनट के लिए ब्रेक पर ${since} से`,
          emergencyDetail: 'आपातकाल में व्यस्त, कृपया प्रतीक्षा करें',
          appointment: 'अपॉइंटमेंट',
          walkin: 'वॉक-इन',
          priority: 'प्राथमिकता',
          empty: 'अभी कोई प्रतीक्षा में नहीं है। प्रतीक्षालय खाली है।',
          acrossAllDoctors: (n) => `(सभी डॉक्टरों को मिलाकर ${n})`,
          allClosedTitle: 'अभी कोई डॉक्टर उपलब्ध नहीं है',
          allClosedSub: 'आज सभी डॉक्टर बंद हो चुके हैं। कृपया कल फिर देखें।',
          clinicClosedTitle: 'आज के लिए बंद हैं',
          clinicClosedSub: 'आज आपके धैर्य के लिए धन्यवाद — क्लिनिक कल फिर खुलेगा।',
          notArrived: 'अभी नहीं पहुंचे',
          notArrivedSub: 'डॉक्टर के आते ही कतार शुरू होगी',
          calledAtLabel: (t) => `${t} पर बुलाया गया`,
        },
      };
      let T = STRINGS.en;

      // Doctor/patient names and addresses are free text typed by staff in
      // Latin script; there's no fixed translation for a person's name,
      // only a phonetic transliteration into Devanagari. Plain English
      // spelling is genuinely ambiguous about Hindi vowel length (e.g.
      // "Yadav" is pronounced with a long first "a", यादव, not यदव, that
      // a purely mechanical letter-by-letter pass can't know), so common
      // Indian names/surnames/place-words are special-cased here for
      // accuracy; anything not in this list falls back to the phonetic
      // approximation below, which won't always be perfect. This only
      // affects what's rendered on this board; the stored data (and every
      // other screen) always shows exactly what was typed.
      const HI_WORD_DICT = {
        garg: 'गर्ग', gupta: 'गुप्ता', sharma: 'शर्मा', verma: 'वर्मा', yadav: 'यादव',
        singh: 'सिंह', kumar: 'कुमार', kumari: 'कुमारी', devi: 'देवी', khan: 'खान',
        rao: 'राव', mehta: 'मेहता', patel: 'पटेल', reddy: 'रेड्डी', nair: 'नायर',
        iyer: 'अय्यर', chopra: 'चोपड़ा', malhotra: 'मल्होत्रा', kapoor: 'कपूर',
        agarwal: 'अग्रवाल', bansal: 'बंसल', jain: 'जैन', shah: 'शाह', joshi: 'जोशी',
        pandey: 'पांडे', mishra: 'मिश्रा', tiwari: 'तिवारी', chauhan: 'चौहान',
        rajput: 'राजपूत', thakur: 'ठाकुर', naidu: 'नायडू', rai: 'राय', dubey: 'दुबे',
        trivedi: 'त्रिवेदी', saxena: 'सक्सेना', srivastava: 'श्रीवास्तव', bhatt: 'भट्ट',
        menon: 'मेनन', mohammed: 'मोहम्मद', mohd: 'मोहम्मद', irfan: 'इरफ़ान',
        ramesh: 'रमेश', suresh: 'सुरेश', rajesh: 'राजेश', mahesh: 'महेश',
        dinesh: 'दिनेश', naresh: 'नरेश', mukesh: 'मुकेश', rakesh: 'राकेश',
        ganesh: 'गणेश', umesh: 'उमेश', satyam: 'सत्यम', amit: 'अमित', sumit: 'सुमित',
        vikram: 'विक्रम', vikas: 'विकास', ankit: 'अंकित', rohit: 'रोहित',
        mohit: 'मोहित', sunil: 'सुनील', anil: 'अनिल', kapil: 'कपिल', nikhil: 'निखिल',
        akhil: 'अखिल', sanjay: 'संजय', vijay: 'विजय', ajay: 'अजय', vinay: 'विनय',
        uday: 'उदय', ravi: 'रवि', anand: 'आनंद', mohan: 'मोहन', rohan: 'रोहन',
        karan: 'करण', arjun: 'अर्जुन', krishna: 'कृष्ण', ram: 'राम', shyam: 'श्याम',
        deepak: 'दीपक', pankaj: 'पंकज', rajiv: 'राजीव', sanjiv: 'संजीव',
        sanjeev: 'संजीव', manoj: 'मनोज', pramod: 'प्रमोद', vinod: 'विनोद',
        ashok: 'अशोक', prakash: 'प्रकाश', subhash: 'सुभाष', venu: 'वेणु',
        raghav: 'राघव', vishal: 'विशाल', rahul: 'राहुल', akash: 'आकाश', aakash: 'आकाश',
        khushi: 'खुशी', priya: 'प्रिया', anjali: 'अंजलि', pooja: 'पूजा',
        sunita: 'सुनीता', geeta: 'गीता', gita: 'गीता', rekha: 'रेखा', kavita: 'कविता',
        sita: 'सीता', meena: 'मीना', reena: 'रीना', seema: 'सीमा', neha: 'नेहा',
        neeta: 'नीता', anita: 'अनीता', sarita: 'सरिता', savita: 'सविता',
        lata: 'लता', mamta: 'ममता', kiran: 'किरण', nisha: 'निशा', shanti: 'शांति',
        radha: 'राधा', uma: 'उमा', usha: 'उषा', asha: 'आशा', vandana: 'वंदना',
        archana: 'अर्चना', kalpana: 'कल्पना', indira: 'इंदिरा', sushma: 'सुष्मा',
        kamla: 'कमला', kamala: 'कमला', vimla: 'विमला', nirmala: 'निर्मला',
        vidya: 'विद्या', lakshmi: 'लक्ष्मी', saraswati: 'सरस्वती', durga: 'दुर्गा',
        parvati: 'पार्वती', ganga: 'गंगा',
        nagar: 'नगर', colony: 'कॉलोनी', sector: 'सेक्टर', vihar: 'विहार',
        puram: 'पुरम', marg: 'मार्ग', chowk: 'चौक', bazaar: 'बाज़ार', gali: 'गली',
        road: 'रोड', society: 'सोसाइटी', enclave: 'एन्क्लेव', park: 'पार्क',
        mohalla: 'मोहल्ला', basti: 'बस्ती', camp: 'कैंप', ganj: 'गंज',
        gandhi: 'गांधी', civil: 'सिविल', lines: 'लाइंस', shastri: 'शास्त्री',
        model: 'मॉडल', town: 'टाउन', old: 'ओल्ड', city: 'सिटी', new: 'न्यू',
        near: 'नियर', market: 'मार्केट', demo: 'डेमो', patient: 'पेशेंट',
        // The phonetic fallback below has no notion of a consonant
        // cluster needing a halant ("cl" -> just "क"+"ल" reads as two
        // full syllables, "ka-li-nik" instead of "kli-nik") - clinic
        // names virtually always contain this word, so it's worth its
        // own entry rather than a wrong sound on every single one.
        clinic: 'क्लिनिक',
      };

      function phoneticToDevanagari(word) {
        const w = word.toLowerCase();
        const consonants = [
          ['ksh', 'क्ष'], ['gy', 'ज्ञ'], ['shh', 'ष'], ['chh', 'छ'],
          ['kh', 'ख'], ['gh', 'घ'], ['ch', 'च'], ['jh', 'झ'], ['ng', 'ङ'], ['ny', 'ञ'],
          ['th', 'थ'], ['dh', 'ध'], ['ph', 'फ'], ['bh', 'भ'], ['sh', 'श'],
          ['k', 'क'], ['g', 'ग'], ['c', 'क'], ['j', 'ज'], ['t', 'त'], ['d', 'द'],
          ['n', 'न'], ['p', 'प'], ['b', 'ब'], ['m', 'म'], ['y', 'य'], ['r', 'र'],
          ['l', 'ल'], ['v', 'व'], ['w', 'व'], ['s', 'स'], ['h', 'ह'], ['f', 'फ़'],
          ['z', 'ज़'], ['q', 'क़'], ['x', 'क्स'],
        ];
        const vowels = [
          ['aa', 'आ', 'ा'], ['ee', 'ई', 'ी'], ['ii', 'ई', 'ी'], ['oo', 'ऊ', 'ू'],
          ['ai', 'ऐ', 'ै'], ['au', 'औ', 'ौ'],
          ['a', 'अ', ''], ['i', 'इ', 'ि'], ['u', 'उ', 'ु'], ['e', 'ए', 'े'], ['o', 'ओ', 'ो'],
        ];
        let out = '';
        let i = 0;
        while (i < w.length) {
          const cons = consonants.find(([pat]) => w.startsWith(pat, i));
          if (cons) {
            i += cons[0].length;
            const vow = vowels.find(([pat]) => w.startsWith(pat, i));
            if (vow) { out += cons[1] + vow[2]; i += vow[0].length; }
            else { out += cons[1]; }
            continue;
          }
          const vow = vowels.find(([pat]) => w.startsWith(pat, i));
          if (vow) { out += vow[1]; i += vow[0].length; continue; }
          out += w[i]; // digits/punctuation pass through
          i += 1;
        }
        return out;
      }

      function toDevanagari(text) {
        if (!text) return text;
        return text.split(/(\s+)/).map((token) => {
          if (/^\s*$/.test(token)) return token;
          const m = token.match(/^([A-Za-z]+)([^A-Za-z]*)$/);
          if (!m) return token;
          const [, word, rest] = m;
          return (HI_WORD_DICT[word.toLowerCase()] || phoneticToDevanagari(word)) + rest;
        }).join('');
      }

      // Specialty is picked from a fixed dropdown (Settings > Doctors), so
      // unlike names it has a real, known-good Hindi translation rather
      // than a phonetic guess, used whenever the value matches a known
      // specialty; free-text "Other" specialties fall back to transliteration.
      const SPECIALTY_HI = {
        'General Physician': 'सामान्य चिकित्सक',
        'Pediatrician': 'बाल रोग विशेषज्ञ',
        'Gynecologist': 'स्त्री रोग विशेषज्ञ',
        'Dermatologist': 'त्वचा रोग विशेषज्ञ',
        'Dentist': 'दंत चिकित्सक',
        'ENT Specialist': 'कान-नाक-गला विशेषज्ञ',
        'Ophthalmologist': 'नेत्र रोग विशेषज्ञ',
        'Orthopedic': 'अस्थि रोग विशेषज्ञ',
        'Cardiologist': 'हृदय रोग विशेषज्ञ',
        'Neurologist': 'तंत्रिका रोग विशेषज्ञ',
        'Psychiatrist': 'मनोचिकित्सक',
        'General Surgeon': 'सामान्य सर्जन',
        'Urologist': 'मूत्र रोग विशेषज्ञ',
        'Gastroenterologist': 'पेट रोग विशेषज्ञ',
        'Endocrinologist': 'अंतःस्रावी रोग विशेषज्ञ',
        'Pulmonologist': 'फेफड़ा रोग विशेषज्ञ',
        'Diabetologist': 'मधुमेह विशेषज्ञ',
        'Physiotherapist': 'फिजियोथेरेपिस्ट',
      };

      // Escaped first, then transliterated — toDevanagari only rewrites
      // Latin letters, so any HTML-special characters in the original
      // text pass through it unchanged and reach escapeHtml either way.
      function localizeName(text) {
        return escapeHtml(T === STRINGS.hi ? toDevanagari(text) : text);
      }
      function localizeSpecialty(text) {
        if (T !== STRINGS.hi) return escapeHtml(text);
        return escapeHtml(SPECIALTY_HI[text] || toDevanagari(text));
      }

      function statusLabel(status) {
        return {
          on_time: T.onTime,
          on_break: T.onBreak,
          emergency: T.emergency,
        }[status] || status;
      }

      // Spells the delay out in full words on its own line, rather than
      // burying "+20m" inside the pill: patients should be able to read
      // it at a glance from across the waiting room, not squint at an
      // abbreviation.
      function statusDetailLine(doctor) {
        const since = Qlinic.formatTimestamp(doctor.statusUpdatedAt);
        // The reason goes on its own line, not tacked onto the end of the
        // duration/time sentence with a dash — that read as one long
        // run-on line that wrapped wherever it happened to run out of
        // room, instead of breaking in a sensible place.
        const note = Qlinic.isRealStatusReason(doctor.statusNote) ? `<br>${escapeHtml(doctor.statusNote)}` : '';
        if (doctor.status === 'on_break') return T.onBreakDetail(doctor.delayMins || 0, since) + note;
        if (doctor.status === 'emergency') return T.emergencyDetail;
        return '';
      }

      // Walk-ins share the same underlying token_number sequence as
      // appointments (that single shared ordering is what the public
      // queue-status page uses to compute "how many ahead of me," so it
      // can't be split into independent per-type counters without also
      // rewriting that RPC's position math). Rather than touch the
      // database, walk-ins just get their own 1-based "W" label computed
      // here for display only: rank a doctor's walk-ins today by their
      // existing token_number and prefix the rank. Scoped per doctor,
      // rebuilt fresh from the full day's patients (not just whoever's
      // currently on the board) every refresh, so a walk-in's number
      // never changes as they move between waiting/booked/done.
      let walkinRanks = new Map();
      function buildWalkinRanks(allQueues) {
        const ranks = new Map();
        allQueues.forEach(({ queue }) => {
          const walkins = [
            ...(queue.nowServing ? [queue.nowServing] : []),
            ...queue.waiting, ...queue.booked, ...queue.done, ...queue.noShow,
          ].filter((p) => p.type === 'walkin');
          walkins.sort((a, b) => (a.tokenNumber || 0) - (b.tokenNumber || 0));
          walkins.forEach((p, i) => ranks.set(p.id, i + 1));
        });
        return ranks;
      }
      function formatToken(p) {
        if (!p || p.tokenNumber == null) return null;
        if (p.type === 'walkin') return 'W' + (walkinRanks.get(p.id) || '?');
        return String(p.tokenNumber);
      }

      // Departure-board style: up to 3 upcoming tokens, then a "+N" chip
      // rather than trying to list every waiting patient — at busy times
      // (10+ waiting) that would either wrap the row or run off the edge.
      function buildNextChips(waiting) {
        if (!waiting.length) return '';
        const shown = waiting.slice(0, 3).map((p) => formatToken(p)).filter(Boolean);
        const extra = waiting.length - shown.length;
        const chips = shown.map((t) => `<span class="dboard-next-chip">#${t}</span>`).join('');
        const more = extra > 0 ? `<span class="dboard-next-chip more">${T.othersLabel(extra)}</span>` : '';
        return `<div class="dboard-next"><span class="dboard-next-label">${T.nextLabel}</span>${chips}${more}</div>`;
      }

      function renderDoctorStrip(all) {
        document.getElementById('doctorStrip').innerHTML = all.map(({ doctor, queue }, index) => {
          // Reaching this function at all means the doctor already passed
          // the refreshData filter above, so they're either still inside
          // their 3-minute "just closed" window, or past their 4am reset —
          // never in between (that gap is exactly what's hidden).
          const closedToday = !!doctor.dayClosedAt && (Date.now() - new Date(doctor.dayClosedAt).getTime() < DAY_CLOSED_FADE_MS);
          const notArrived = !!doctor.dayClosedAt && !closedToday;
          const statusText = (closedToday || notArrived) ? '' : statusDetailLine(doctor);

          // The detail column always has something useful in it, not just
          // when a doctor is running late: a fade countdown while closing,
          // "not arrived yet" while stale-closed, the delay/break reason
          // while away, or a preview of who's up next while available —
          // never empty space next to the doctor's row.
          let detailHtml;
          if (closedToday) {
            detailHtml = `<div class="dboard-detail-line dboard-detail-muted" data-day-closed-at="${doctor.dayClosedAt}"></div>`;
          } else if (notArrived) {
            detailHtml = `<div class="dboard-detail-line dboard-detail-muted">${T.notArrivedSub}</div>`;
          } else if (statusText) {
            detailHtml = `<div class="dboard-detail-line">${statusText}</div>`;
          } else {
            detailHtml = buildNextChips(queue.waiting);
          }

          const nowServingToken = queue.nowServing ? formatToken(queue.nowServing) : null;
          const servingHtml = queue.nowServing
            ? `
              ${nowServingToken ? `<div class="dboard-serving-token">#${nowServingToken}</div>` : ''}
              <div class="dboard-serving-name">${localizeName(queue.nowServing.name)}</div>
              ${queue.nowServing.calledAt ? `<div class="dboard-serving-called">${T.calledAtLabel(Qlinic.formatTimestamp(queue.nowServing.calledAt))}</div>` : ''}
            `
            : `<div class="dboard-serving-idle">—</div>`;

          return `
          <div class="dboard-row accent-${ACCENT_COLORS[index % ACCENT_COLORS.length]}">
            <div class="dboard-doc">
              <div class="dboard-doc-name">${localizeName(doctor.name)}</div>
              <div class="dboard-doc-spec">${localizeSpecialty(doctor.specialty)}</div>
            </div>
            <div class="dboard-status">
              ${closedToday
                ? `<span class="dboard-pill dboard-pill-warn"><span class="dot"></span>${T.dayClosed}</span>`
                : notArrived
                  ? `<span class="dboard-pill dboard-pill-warn"><span class="dot"></span>${T.notArrived}</span>`
                  : doctor.status === 'on_time'
                    ? `<span class="dboard-pill dboard-pill-ok"><span class="dot"></span>${T.onTime}</span>`
                    : `<span class="dboard-pill dboard-pill-warn"><span class="dot"></span>${statusLabel(doctor.status)}</span>`}
            </div>
            <div class="dboard-serving">
              <div class="dboard-serving-label">${T.nowServing}</div>
              ${servingHtml}
            </div>
            <div class="dboard-waiting">
              <div class="dboard-waiting-num">${queue.waiting.length}</div>
              <div class="dboard-waiting-lbl">${T.waitingLabel}</div>
            </div>
            <div class="dboard-detail">${detailHtml}</div>
          </div>
        `;
        }).join('');
      }

      // One combined, clinic-wide board sorted by scheduled/effective time:
      // an appointment for 9:15 outranks a walk-in that happened to arrive
      // first, same as the reception and doctor screens.
      function computeCombinedWaiting(all) {
        const rows = [];
        all.forEach(({ doctor, queue }, index) => {
          const doctorAccent = ACCENT_COLORS[index % ACCENT_COLORS.length];
          queue.waiting.forEach((p) => {
            rows.push({
              name: p.name,
              address: p.address,
              type: p.type,
              doctorName: doctor.name,
              doctorAccent,
              position: p.position,
              effectiveTime: p.effectiveTime,
              intendedTime: p.intendedTime,
              createdAt: p.createdAt,
              isPriority: p.isPriority,
              tokenNumber: p.tokenNumber,
              tokenDisplay: formatToken(p),
            });
          });
        });
        // Mirrors compareQueueOrder in clinic-data.js: priority patients
        // first, then effectiveTime (doctor-availability-aware), then
        // each patient's own unclamped intendedTime as the tiebreak for
        // patients bunched at the same delay floor, then createdAt as a
        // purely technical last resort for a genuine coincidence — never
        // token number, which only reflects booking order.
        rows.sort((a, b) => {
          if (!!a.isPriority !== !!b.isPriority) return a.isPriority ? -1 : 1;
          return (a.effectiveTime - b.effectiveTime) || (a.intendedTime - b.intendedTime) || (new Date(a.createdAt) - new Date(b.createdAt));
        });
        return rows;
      }

      function buildRowsHTML(pageItems, startIdx) {
        if (pageItems.length === 0) {
          return `<div class="board-empty">${T.empty}</div>`;
        }
        return pageItems.map((p, i) => `
          <div class="board-row">
            <span class="board-pos">${p.tokenDisplay ? '#' + p.tokenDisplay : '·'}</span>
            <span class="board-name">
              <span class="board-name-row">${localizeName(p.name)}${p.isPriority ? `<span class="board-priority">${T.priority}</span>` : ''}</span>
              ${p.address ? `<span class="board-sub">${localizeName(p.address)}</span>` : ''}
            </span>
            <span class="board-doc"><span class="board-doc-dot dot-${p.doctorAccent}"></span>${localizeName(p.doctorName)}</span>
            <span class="board-type">${p.type === 'appointment' ? T.appointment : T.walkin}</span>
          </div>
        `).join('');
      }

      function applyStaticStrings() {
        document.getElementById('taglineText').textContent = T.taglineFull;
        document.getElementById('liveStatusText').textContent = T.liveStatusLabel;
        document.getElementById('waitingNowText').textContent = T.waitingNow;
        document.getElementById('colPos').textContent = T.colPos;
        document.getElementById('colPatient').textContent = T.colPatient;
        document.getElementById('colDoctor').textContent = T.colDoctor;
        document.getElementById('colType').textContent = T.colType;
      }

      function renderDots(totalPages) {
        const dotsEl = document.getElementById('pageDots');
        if (totalPages <= 1) { dotsEl.innerHTML = ''; return; }
        dotsEl.innerHTML = Array.from({ length: totalPages }).map((_, i) =>
          `<span class="dot ${i === currentPage ? 'active' : ''}"></span>`
        ).join('');
      }

      function renderPage() {
        const totalPages = Math.max(1, Math.ceil(combined.length / PAGE_SIZE));
        if (currentPage >= totalPages) currentPage = 0;
        const start = currentPage * PAGE_SIZE;
        const pageItems = combined.slice(start, start + PAGE_SIZE);
        document.getElementById('boardRows').innerHTML = buildRowsHTML(pageItems, start);
        document.getElementById('boardCount').textContent = combined.length ? T.acrossAllDoctors(combined.length) : '';
        renderDots(totalPages);
      }

      const DAY_CLOSED_FADE_MS = 3 * 60 * 1000;

      // 4am, not midnight: comparing calendar dates meant a doctor who
      // closed at 11:58pm and one who closed at 12:03am landed on
      // opposite sides of "today" purely because the clock ticked over —
      // one kept showing "Not arrived yet" for hours, the other vanished
      // within minutes, for what's functionally the same event. No
      // clinic operates through 4am, so anchoring the reset there instead
      // means every closure — 5pm or 2am — waits for the SAME next
      // checkpoint, and two closures a few minutes apart behave the same.
      const RESET_HOUR = 4;
      function nextResetAfter(closedAtIso) {
        const closedAt = new Date(closedAtIso);
        const reset = new Date(closedAt);
        reset.setHours(RESET_HOUR, 0, 0, 0);
        if (reset <= closedAt) reset.setDate(reset.getDate() + 1);
        return reset;
      }

      // Runs every second (independent of the 5s REFRESH_MS data poll) so
      // the "3:00, 2:59, ..." countdown actually ticks in real time instead
      // of jumping in 5-second steps. Reads the closed-at timestamp back
      // off the DOM rather than keeping separate JS state, so it stays
      // correct across every re-render without extra bookkeeping.
      function formatCountdown(dayClosedAtIso) {
        const remainingMs = Math.max(0, DAY_CLOSED_FADE_MS - (Date.now() - new Date(dayClosedAtIso).getTime()));
        const totalSec = Math.ceil(remainingMs / 1000);
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        return `${m}:${String(s).padStart(2, '0')}`;
      }
      function tickFadeCountdowns() {
        document.querySelectorAll('.dboard-detail-line[data-day-closed-at]').forEach((el) => {
          el.textContent = `${T.fadingLabel} ${formatCountdown(el.getAttribute('data-day-closed-at'))}`;
        });
      }

      async function refreshData() {
        const now = new Date();
        document.getElementById('clockTime').textContent = Qlinic.formatTimestamp(now);
        document.getElementById('clockDate').textContent = now.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' });
        const clinic = await Qlinic.getClinic();
        T = STRINGS[clinic && clinic.display_language] || STRINGS.en;
        applyStaticStrings();
        const allQueues = await Qlinic.getAllQueues();
        walkinRanks = buildWalkinRanks(allQueues);
        // A doctor who's closed their day keeps showing (with the "Day
        // closed" pill and a live countdown) for a 3-minute grace window,
        // then drops off the board entirely — no patients still waiting
        // on them, nothing left to say. They stay off the board until the
        // next 4am checkpoint after they closed (see nextResetAfter
        // above), at which point renderDoctorStrip brings them back as
        // "Not arrived yet" — signaling a new day's queue can start once
        // they log back in, same as before, just no longer keyed off
        // literal midnight.
        const all = allQueues.filter(({ doctor }) => {
          if (!doctor.dayClosedAt) return true;
          if (Date.now() - new Date(doctor.dayClosedAt).getTime() < DAY_CLOSED_FADE_MS) return true;
          return Date.now() >= nextResetAfter(doctor.dayClosedAt).getTime();
        });

        // Once every doctor is either closed-and-hidden or simply has no
        // data, the strip/board would render empty — indistinguishable
        // from a frozen or broken screen to anyone glancing at it. Swap to
        // one big unmistakable message instead, reusing the same `all`
        // filter above rather than a separate calendar check: the message
        // clears itself the instant even one doctor has something to show
        // (available, or past their reset showing "Not arrived yet").
        //
        // The admin's own clinic-wide "End of day" closure overrides all
        // of that outright — it's checked first and wins regardless of
        // what any individual doctor's own status says, since admin
        // closing the whole clinic doesn't require every doctor to have
        // separately tapped "close my day" first.
        const clinicClosedNow = Qlinic.isClinicClosedToday(clinic);
        const allClosedToday = clinicClosedNow || (allQueues.length > 0 && all.length === 0);
        document.getElementById('doctorStrip').style.display = allClosedToday ? 'none' : '';
        document.getElementById('boardPanel').style.display = allClosedToday ? 'none' : '';
        document.getElementById('allClosedMessage').style.display = allClosedToday ? 'block' : 'none';
        if (allClosedToday) {
          document.getElementById('allClosedTitle').textContent = clinicClosedNow ? T.clinicClosedTitle : T.allClosedTitle;
          document.getElementById('allClosedSub').textContent = clinicClosedNow ? T.clinicClosedSub : T.allClosedSub;
        }

        renderDoctorStrip(all);
        tickFadeCountdowns();
        combined = computeCombinedWaiting(all);
        renderPage();
      }

      function rotatePage() {
        const totalPages = Math.max(1, Math.ceil(combined.length / PAGE_SIZE));
        if (totalPages <= 1) return;
        const rows = document.getElementById('boardRows');
        rows.classList.add('flip-out');
        setTimeout(() => {
          currentPage = (currentPage + 1) % totalPages;
          renderPage();
          rows.classList.remove('flip-out');
        }, 320);
      }

      refreshData();
      setInterval(refreshData, REFRESH_MS); // catches anything Realtime might miss
      setInterval(tickFadeCountdowns, 1000);
      setInterval(rotatePage, ROTATE_MS); // airport-board style: cycle to the next set of names
      Qlinic.onLiveChange(refreshData); // instant update the moment reception/doctor changes anything, genuinely cross-device now
    })();
  </script>
</body>
</html>
