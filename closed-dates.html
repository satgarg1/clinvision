<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Closed Dates: ClinVision</title>
<script>if (localStorage.getItem('qlinic_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231e1b4b'/%3E%3Ctext x='50' y='70' font-family='Georgia, serif' font-size='60' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3Crect x='30' y='80' width='40' height='7' rx='3' fill='%23c9973e'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=297" />
</head>
<body style="visibility:hidden;">
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand">
        <span class="brand-top">
        <span class="brand-word-wrap">
          <span class="brand-word">ClinVision</span>
          <span class="brand-word-bar"></span>
        </span>
      </span>
      <span class="brand-tagline">Where clinics run better</span>
      </a>
      <div class="clinic-name-row">
        <img class="clinic-logo-thumb" id="clinicLogoThumb" style="display:none;" alt="" />
        <div class="clinic-name" id="clinicName">Loading…</div>
      </div>
      <nav>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="reception.html" class="nav-link" id="receptionNavLink">Reception</a>
        <a href="doctor.html" class="nav-link">Doctor View</a>
        <a href="billing.html" class="nav-link" id="billingNavLink">Billing</a>
        <a href="revenue.html" class="nav-link" id="revenueNavLink">Revenue</a>
        <a href="trends.html" class="nav-link" id="trendsNavLink">Insights</a>
        <a href="end-of-day.html" class="nav-link" id="endOfDayNavLink">End of day</a>
        <a href="display.html" class="nav-link" id="displayNavLink">Display Screen</a>
        <a href="settings.html" class="nav-link active pinned-bottom">Settings</a>
      </nav>
    </aside>

    <main class="app-main">
      <div class="app-topbar">
        <div>
          <div class="breadcrumb"><a href="settings.html">Settings</a> <span>/</span> Closed Dates</div>
          <h1>Closed dates</h1>
        </div>
      </div>

      <div class="panel">
        <div id="addClosurePanel">
          <div class="panel-header"><h2>Add a closure</h2></div>
          <p class="panel-note">Reception is warned before booking an appointment on any date listed below.</p>
          <form id="closureForm" class="inline-form">
            <div class="field" style="max-width:200px;">
              <label>Date</label>
              <input type="date" lang="en-GB" id="closureDate" required />
            </div>
            <div class="field" style="flex:1;min-width:220px;">
              <label>Note (optional)</label>
              <input type="text" id="closureNote" placeholder="e.g. Diwali" />
            </div>
            <div class="field" style="flex:0 0 160px;text-align:center;">
              <label>&nbsp;</label>
              <button type="submit" class="btn-sm primary">Add closure</button>
            </div>
          </form>
        </div>

        <div id="closuresTableWrap" style="margin-top:20px;"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=92"></script>
  <script>
    (async function () {
      if (!(await Qlinic.requireLogin('login.html'))) return;

      document.querySelector('a.brand').addEventListener('click', async (e) => {
        e.preventDefault();
        if (await Qlinic.confirmDialog({ message: "Going to the homepage will end your session here, you'll need to log in again to get back in." })) {
          window.location.href = 'index.html';
        }
      });

      const amDoctor = await Qlinic.isDoctor();
      if (!(await Qlinic.isAdmin())) {
        document.getElementById('revenueNavLink').style.display = 'none';
        document.getElementById('trendsNavLink').style.display = 'none';
        document.getElementById('endOfDayNavLink').style.display = 'none';
      }
      // Doctors get read access to the same list reception uses for its
      // booking-time warning — they just can't add or remove one, that
      // stays reception/admin's call (also enforced at the RLS layer, not
      // just by hiding this form).
      if (amDoctor) {
        document.getElementById('receptionNavLink').style.display = 'none';
        document.getElementById('billingNavLink').style.display = 'none';
        document.getElementById('displayNavLink').style.display = 'none';
        document.getElementById('addClosurePanel').style.display = 'none';
      }
      // Body starts hidden (see the <body> tag) so nobody sees the full
      // nav (or the add-closure form a doctor shouldn't have) for a
      // moment before the role-based hiding above finishes.
      document.body.style.visibility = 'visible';

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      let closures = [];

      function fmtDate(dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      }

      function pencilIconSvg() {
        return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
      }
      function trashIconSvg() {
        return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
      }

      function renderClosures() {
        const wrap = document.getElementById('closuresTableWrap');
        if (closures.length === 0) {
          wrap.innerHTML = '<div class="empty-state">No closed dates added yet.</div>';
          return;
        }
        wrap.innerHTML = `
          <table class="qtable">
            <thead><tr><th>Date</th><th>Note</th>${amDoctor ? '' : '<th style="width:90px;"></th>'}</tr></thead>
            <tbody>
              ${closures.map((c) => `
                <tr>
                  <td>${fmtDate(c.date)}</td>
                  <td>${c.note ? Qlinic.escapeHtml(c.note) : '<span class="sub-line">No note</span>'}</td>
                  ${amDoctor ? '' : `
                    <td class="row-actions">
                      <button type="button" class="icon-btn" onclick="doOpenEditClosure('${c.id}')" title="Edit" aria-label="Edit closure on ${fmtDate(c.date)}">${pencilIconSvg()}</button>
                      <button type="button" class="icon-btn danger" onclick="doDeleteClosure('${c.id}')" title="Delete" aria-label="Delete closure on ${fmtDate(c.date)}">${trashIconSvg()}</button>
                    </td>
                  `}
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      async function loadClosures() {
        closures = await Qlinic.getClinicClosures();
        renderClosures();
      }

      async function doDeleteClosure(id) {
        if (!(await Qlinic.confirmDialog({ message: 'Remove this closed date?', confirmLabel: 'Remove', danger: true }))) return;
        try {
          await Qlinic.deleteClinicClosure(id);
        } catch (err) {
          showToast(err.message || 'Could not remove closed date — please try again.');
          return;
        }
        showToast('Closed date removed');
        loadClosures();
      }

      function doOpenEditClosure(id) {
        const closure = closures.find((c) => c.id === id);
        if (closure) openEditClosureModal(closure);
      }

      function openEditClosureModal(closure) {
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        backdrop.innerHTML = `
          <div class="modal-card" role="dialog" aria-modal="true">
            <h2 class="modal-title">Edit closed date</h2>
            <div class="doctor-form-field" style="margin-bottom:14px;">
              <label>Date</label>
              <input type="date" lang="en-GB" id="editClosureDate" value="${closure.date}" />
            </div>
            <div class="doctor-form-field" style="margin-bottom:14px;">
              <label>Note (optional)</label>
              <input type="text" id="editClosureNote" value="${closure.note.replace(/"/g, '&quot;')}" placeholder="e.g. Diwali" />
            </div>
            <div class="modal-actions">
              <button type="button" class="btn-sm primary" id="editClosureSaveBtn">Save</button>
              <button type="button" class="btn-sm" id="editClosureCancelBtn">Cancel</button>
            </div>
          </div>
        `;
        document.body.appendChild(backdrop);
        Qlinic.attachDatePicker(backdrop.querySelector('#editClosureDate'));

        function cleanup() {
          backdrop.remove();
          document.removeEventListener('keydown', onKeydown);
        }
        function onKeydown(e) {
          if (e.key === 'Escape') cleanup();
        }
        document.addEventListener('keydown', onKeydown);
        backdrop.addEventListener('click', (e) => { if (e.target === backdrop) cleanup(); });
        backdrop.querySelector('#editClosureCancelBtn').addEventListener('click', cleanup);

        backdrop.querySelector('#editClosureSaveBtn').addEventListener('click', async () => {
          const date = backdrop.querySelector('#editClosureDate').value;
          const note = backdrop.querySelector('#editClosureNote').value.trim();
          if (!date) { showToast('Pick a date first'); return; }
          if (closures.some((c) => c.date === date && c.id !== closure.id)) { showToast('That date is already on the list'); return; }
          try {
            await Qlinic.updateClinicClosure(closure.id, { date, note });
          } catch (err) {
            showToast(err.message || 'Could not update closed date — please try again.');
            return;
          }
          cleanup();
          showToast('Closed date updated');
          loadClosures();
        });

        // Not the date field: focusing a native date input auto-selects
        // its first segment (a blue-highlighted "14"), which reads as a
        // stray selection rather than an intentional focus state.
        backdrop.querySelector('#editClosureNote').focus();
      }
      window.doDeleteClosure = doDeleteClosure;
      window.doOpenEditClosure = doOpenEditClosure;

      document.getElementById('closureForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const dateInput = document.getElementById('closureDate');
        const noteInput = document.getElementById('closureNote');
        const date = dateInput.value;
        if (!date) { showToast('Pick a date first'); return; }
        if (closures.some((c) => c.date === date)) { showToast('That date is already on the list'); return; }
        try {
          await Qlinic.addClinicClosure({ date, note: noteInput.value.trim() });
        } catch (err) {
          showToast(err.message || 'Could not add closed date — please try again.');
          return;
        }
        dateInput.value = '';
        noteInput.value = '';
        showToast('Closed date added');
        loadClosures();
      });

      const clinic = await Qlinic.getClinic();
      document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
      if (clinic && clinic.logo_url) {
        document.getElementById('clinicLogoThumb').src = clinic.logo_url;
        document.getElementById('clinicLogoThumb').style.display = 'block';
      } else {
        document.getElementById('clinicLogoThumb').style.display = 'none';
      }
      Qlinic.attachDatePicker(document.getElementById('closureDate'));
      await loadClosures();
    })();
  </script>

</body>
</html>
