<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Closed Dates: Qlinic</title>
<script>if (localStorage.getItem('qlinic_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=86" />
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand">
        <span class="brand-top">
          <span class="brand-clock clock-face" id="navClock">
            <svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block;color:var(--black);">
              <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="5"></circle>
              <line class="clock-hour" x1="50" y1="50" x2="50" y2="30" stroke="currentColor" stroke-width="6" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
              <line class="clock-min" x1="50" y1="50" x2="50" y2="18" stroke="currentColor" stroke-width="4" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
              <line class="clock-sec" x1="50" y1="50" x2="50" y2="14" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
              <circle cx="50" cy="50" r="3" fill="currentColor"></circle>
            </svg>
          </span>
          Qlinic
        </span>
        <span class="brand-tagline">Time is the one asset nobody gets back</span>
      </a>
      <div class="clinic-name" id="clinicName">Loading…</div>
      <nav>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="reception.html" class="nav-link">Reception</a>
        <a href="doctor.html" class="nav-link">Doctor View</a>
        <a href="billing.html" class="nav-link" id="billingNavLink">Billing</a>
        <a href="revenue.html" class="nav-link" id="revenueNavLink">Revenue</a>
        <a href="trends.html" class="nav-link" id="trendsNavLink">Trends</a>
        <a href="end-of-day.html" class="nav-link" id="endOfDayNavLink">End of day</a>
        <a href="display.html" class="nav-link">Display Screen</a>
        <a href="settings.html" class="nav-link active pinned-bottom">Settings</a>
      </nav>
    </aside>

    <main class="app-main">
      <div class="app-topbar">
        <div>
          <div class="breadcrumb"><a href="settings.html">Settings</a> <span>/</span> Closed Dates</div>
          <h1>Closed dates</h1>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header"><h2>Add a closure</h2></div>
        <p class="panel-note">Reception is warned before booking an appointment on any date listed below.</p>
        <form id="closureForm" class="inline-form">
          <div class="field" style="max-width:200px;">
            <label>Date</label>
            <input type="date" id="closureDate" required />
          </div>
          <div class="field" style="flex:1;min-width:220px;">
            <label>Note (optional)</label>
            <input type="text" id="closureNote" placeholder="e.g. Diwali" />
          </div>
          <div class="field" style="flex:0;">
            <label>&nbsp;</label>
            <button type="submit" class="btn-sm primary">Add closure</button>
          </div>
        </form>

        <div id="closuresTableWrap" style="margin-top:20px;"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=38"></script>
  <script>
    (async function () {
      await Qlinic.requireLogin('login.html');

      document.querySelector('a.brand').addEventListener('click', (e) => {
        e.preventDefault();
        if (confirm("Going to the homepage will end your session here, you'll need to log in again to get back in. Continue?")) {
          window.location.href = 'index.html';
        }
      });

      if (!(await Qlinic.isAdmin())) {
        window.location.href = 'dashboard.html';
        return;
      }

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      let closures = [];

      function fmtDate(dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      }

      function renderClosures() {
        const wrap = document.getElementById('closuresTableWrap');
        if (closures.length === 0) {
          wrap.innerHTML = '<div class="empty-state">No closed dates added yet.</div>';
          return;
        }
        wrap.innerHTML = `
          <table class="qtable">
            <thead><tr><th>Date</th><th>Note</th><th></th></tr></thead>
            <tbody>
              ${closures.map((c) => `
                <tr>
                  <td>${fmtDate(c.date)}</td>
                  <td>${c.note ? c.note : '<span class="sub-line">No note</span>'}</td>
                  <td style="text-align:right;"><button type="button" class="btn-sm danger" data-id="${c.id}">Delete</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        wrap.querySelectorAll('[data-id]').forEach((btn) => {
          btn.addEventListener('click', () => doDeleteClosure(btn.getAttribute('data-id')));
        });
      }

      async function loadClosures() {
        closures = await Qlinic.getClinicClosures();
        renderClosures();
      }

      async function doDeleteClosure(id) {
        if (!confirm('Remove this closed date?')) return;
        await Qlinic.deleteClinicClosure(id);
        showToast('Closed date removed');
        loadClosures();
      }

      document.getElementById('closureForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const dateInput = document.getElementById('closureDate');
        const noteInput = document.getElementById('closureNote');
        const date = dateInput.value;
        if (!date) { showToast('Pick a date first'); return; }
        if (closures.some((c) => c.date === date)) { showToast('That date is already on the list'); return; }
        await Qlinic.addClinicClosure({ date, note: noteInput.value.trim() });
        dateInput.value = '';
        noteInput.value = '';
        showToast('Closed date added');
        loadClosures();
      });

      const clinic = await Qlinic.getClinic();
      document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
      await loadClosures();
    })();
  </script>
  <script>
    (function () {
      function applyTime(root) {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours() % 12;
        const sec = root.querySelector(".clock-sec");
        const min = root.querySelector(".clock-min");
        const hour = root.querySelector(".clock-hour");
        if (sec) sec.style.transform = `rotate(${s * 6}deg)`;
        if (min) min.style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
        if (hour) hour.style.transform = `rotate(${h * 30 + m * 0.5}deg)`;
      }
      function tickAll() {
        document.querySelectorAll(".clock-face").forEach(applyTime);
      }
      tickAll();
      setInterval(tickAll, 1000);
    })();
  </script>

</body>
</html>
