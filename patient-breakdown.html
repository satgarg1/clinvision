<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Patient breakdown: ClinVision</title>
<script>if (localStorage.getItem('qlinic_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/png" href="clinvision-favicon.png?v=2" />
<link rel="stylesheet" href="styles.css?v=323" />
</head>
<body style="visibility:hidden;">
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand">
        <span class="brand-top">
        <span class="brand-word-wrap">
          <span class="brand-word">ClinVision</span>
          <span class="brand-word-bar"></span>
        </span>
      </span>
      <span class="brand-tagline">Where clinics run better</span>
      </a>
      <div class="clinic-name-row">
        <img class="clinic-logo-thumb" id="clinicLogoThumb" style="display:none;" alt="" />
        <div class="clinic-name" id="clinicName">Loading…</div>
      </div>
      <nav>
        <a href="dashboard.html" class="nav-link active">Dashboard</a>
        <a href="reception.html" class="nav-link" id="receptionNavLink">Reception</a>
        <a href="doctor.html" class="nav-link">Doctor View</a>
        <a href="billing.html" class="nav-link" id="billingNavLink">Billing</a>
        <a href="revenue.html" class="nav-link" id="revenueNavLink">Revenue</a>
        <a href="trends.html" class="nav-link" id="trendsNavLink">Insights</a>
        <a href="display.html" class="nav-link" id="displayNavLink">Display Screen</a>
        <a href="settings.html" class="nav-link pinned-bottom" id="settingsNavLink">Settings</a>
      </nav>
    </aside>

    <main class="app-main">
      <div class="app-topbar" style="margin-bottom:16px;">
        <div>
          <div class="breadcrumb"><a href="dashboard.html">Dashboard</a> <span>/</span> <span id="breadcrumbMetric">Breakdown</span></div>
          <h1 id="pageTitle">Loading…</h1>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header" id="filterHeader" style="display:none;">
          <div class="filter-seg" id="sortToggleSeg" style="display:none;margin-bottom:0;"></div>
          <div id="activeFilterChipsRow" class="active-filter-chips"></div>
          <button type="button" class="btn-sm primary" id="resetFiltersBtn" style="display:none;margin-left:auto;">Reset filters</button>
        </div>
        <p class="panel-note" id="summaryNote"></p>
        <div id="tableWrap"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=109"></script>
  <script>
    (async function () {
      if (!(await Qlinic.requireLogin('login.html'))) return;

      if (await Qlinic.isPharmacist()) { window.location.href = 'pharmacy.html'; return; }

      document.querySelector('a.brand').addEventListener('click', async (e) => {
        e.preventDefault();
        if (await Qlinic.confirmDialog({ message: "Going to the homepage will end your session here, you'll need to log in again to get back in." })) {
          window.location.href = 'index.html';
        }
      });

      const [amAdmin, amDoctor, myProfile] = await Promise.all([Qlinic.isAdmin(), Qlinic.isDoctor(), Qlinic.getMyProfile()]);
      const myDoctorId = amDoctor ? myProfile.doctorId : null;

      if (amDoctor) {
        document.getElementById('receptionNavLink').style.display = 'none';
        document.getElementById('billingNavLink').style.display = 'none';
        document.getElementById('displayNavLink').style.display = 'none';
      }
      if (!amAdmin) {
        document.getElementById('revenueNavLink').style.display = 'none';
      }
      if (!amAdmin && !amDoctor) {
        document.getElementById('trendsNavLink').style.display = 'none';
      }
      await Qlinic.applyFeatureNavGating();
      document.body.style.visibility = 'visible';

      const params = new URLSearchParams(window.location.search);
      const metric = params.get('metric');
      const dateStr = params.get('date') || Qlinic.getTodayDate();
      const requestedDoctorId = params.get('doctor') || null;

      const TYPE_LABELS = { appointment: 'Appointment', walkin: 'Walk-in' };
      function typeLabel(p) {
        if (p.type === 'appointment') return 'Appointment';
        return p.isPriority ? 'Walk-in (Emg)' : 'Walk-in (Standard)';
      }

      const METRICS = {
        footfall: {
          title: 'Footfall so far',
          filter: (p) => ['waiting', 'in_consult', 'done'].includes(p.status),
          columns: ['Name', 'Phone', 'Doctor', 'Type', 'Status'],
          row: (p, doctorName) => [p.name, p.phone, doctorName, typeLabel(p), statusLabel(p.status)],
          filters: ['doctor', 'type'],
          sortKey: (p) => p.arrivedAt || p.createdAt,
        },
        waiting: {
          title: 'Waiting now',
          filter: (p) => p.status === 'waiting',
          columns: ['Name', 'Phone', 'Doctor', 'Type', 'Arrived'],
          row: (p, doctorName) => [p.name, p.phone, doctorName, typeLabel(p), p.arrivedAt ? Qlinic.formatTimestamp(p.arrivedAt) : '—'],
          sortKey: (p) => p.arrivedAt || p.createdAt,
        },
        inConsult: {
          title: 'In consultation',
          filter: (p) => p.status === 'in_consult',
          columns: ['Name', 'Phone', 'Doctor', 'Called in'],
          row: (p, doctorName) => [p.name, p.phone, doctorName, p.calledAt ? Qlinic.formatTimestamp(p.calledAt) : '—'],
          sortKey: (p) => p.calledAt || p.createdAt,
        },
        done: {
          title: 'Seen (done)',
          filter: (p) => p.status === 'done',
          columns: ['Name', 'Phone', 'Doctor', 'Type', 'Seen at'],
          row: (p, doctorName) => [p.name, p.phone, doctorName, typeLabel(p), p.calledAt ? Qlinic.formatTimestamp(p.calledAt) : '—'],
          filters: ['doctor', 'type'],
          sortKey: (p) => p.calledAt || p.createdAt,
        },
        noShow: {
          title: 'No-shows',
          filter: (p) => p.status === 'no_show',
          columns: ['Name', 'Phone', 'Doctor', 'Was booked for'],
          row: (p, doctorName) => [p.name, p.phone, doctorName, p.bookedTime ? Qlinic.formatTime(Qlinic.parseTime(p.bookedTime)) : '—'],
          filters: ['doctor'],
        },
        bookedToday: {
          title: 'Booked today',
          filter: () => true,
          columns: ['Name', 'Phone', 'Doctor', 'Type', 'Status'],
          row: (p, doctorName) => [p.name, p.phone, doctorName, typeLabel(p), statusLabel(p.status)],
          filters: ['type', 'doctor'],
          sortKey: (p) => p.arrivedAt || p.createdAt,
        },
        priorityWaiting: {
          title: 'Priority waiting',
          filter: (p) => p.status === 'waiting' && p.isPriority,
          columns: ['Name', 'Phone', 'Doctor', 'Arrived'],
          row: (p, doctorName) => [p.name, p.phone, doctorName, p.arrivedAt ? Qlinic.formatTimestamp(p.arrivedAt) : '—'],
          ignoreDoctor: true,
          filters: ['doctor'],
          sortKey: (p) => p.arrivedAt || p.createdAt,
        },
        avgWait: {
          title: 'Average wait, by patient',
          filter: (p) => ['waiting', 'in_consult', 'done'].includes(p.status),
          columns: ['Name', 'Phone', 'Doctor', 'Status', 'Wait (min)'],
          row: (p, doctorName, waitMins) => [p.name, p.phone, doctorName, statusLabel(p.status), waitMins],
          needsWait: true,
          filters: ['doctor'],
        },
        longestWait: {
          title: 'Longest wait today, by patient',
          filter: (p) => ['waiting', 'in_consult', 'done'].includes(p.status),
          columns: ['Name', 'Phone', 'Doctor', 'Status', 'Wait (min)'],
          row: (p, doctorName, waitMins) => [p.name, p.phone, doctorName, statusLabel(p.status), waitMins],
          needsWait: true,
          perDoctorTop: true,
        },
      };

      function statusLabel(status) {
        return { booked: 'Booked', waiting: 'Waiting', in_consult: 'In consultation', done: 'Done', no_show: 'No-show' }[status] || status;
      }

      const config = METRICS[metric];
      if (!config) {
        document.getElementById('pageTitle').textContent = 'Unknown breakdown';
        document.getElementById('summaryNote').textContent = 'This link is missing or has an invalid metric.';
        return;
      }

      const supportsDoctorFilter = !!(config.filters && config.filters.includes('doctor'));
      const supportsTypeFilter = !!(config.filters && config.filters.includes('type'));
      const showDoctorFilter = supportsDoctorFilter && (config.ignoreDoctor || !amDoctor);
      const showTypeFilter = supportsTypeFilter;

      const fetchDoctorId = config.ignoreDoctor
        ? null
        : (myDoctorId || (supportsDoctorFilter ? null : requestedDoctorId));

      document.getElementById('breadcrumbMetric').textContent = config.title;
      document.getElementById('pageTitle').textContent = `${config.title} — ${Qlinic.formatDateLabel(dateStr)}`;

      const [doctors, patients] = await Promise.all([
        Qlinic.getDoctors({ includeInactive: true }),
        Qlinic.getPatientsInRange(dateStr, dateStr, fetchDoctorId || undefined),
      ]);
      const doctorById = Object.fromEntries(doctors.map((d) => [d.id, d]));
      const nowMs = Date.now();

      function waitMinsFor(p) {
        const start = Qlinic.effectiveMoment(p, doctorById[p.doctorId]).getTime();
        const end = p.status === 'waiting' ? nowMs : (p.calledAt ? new Date(p.calledAt).getTime() : nowMs);
        return Math.max(0, Math.round((end - start) / 60000));
      }

      const showSortToggle = !config.needsWait;
      let recencyDesc = true;
      function renderSortToggle() {
        document.getElementById('sortToggleSeg').innerHTML = `
          <button type="button" data-sort="desc" class="${recencyDesc ? 'active' : ''}">Newest first</button>
          <button type="button" data-sort="asc" class="${!recencyDesc ? 'active' : ''}">Oldest first</button>
        `;
      }
      document.getElementById('sortToggleSeg').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-sort]');
        if (!btn || (btn.dataset.sort === 'desc') === recencyDesc) return;
        recencyDesc = btn.dataset.sort === 'desc';
        renderSortToggle();
        render();
      });

      let doctorFilterIds = new Set();
      let typeFilterValues = new Set();
      if (showDoctorFilter && requestedDoctorId && !amDoctor) doctorFilterIds.add(requestedDoctorId);

      function baseRows() {
        return patients.filter(config.filter);
      }
      function doctorFilterOptions() {
        const counting = baseRows();
        return doctors
          .map((d) => ({ value: d.id, label: d.name, count: counting.filter((p) => p.doctorId === d.id).length }))
          .filter((o) => o.count > 0)
          .sort((a, b) => b.count - a.count);
      }
      function typeFilterOptions() {
        const counting = baseRows();
        return Object.keys(TYPE_LABELS)
          .map((key) => ({ value: key, label: TYPE_LABELS[key], count: counting.filter((p) => p.type === key).length }))
          .filter((o) => o.count > 0);
      }
      function filteredRows() {
        return baseRows().filter((p) =>
          (doctorFilterIds.size === 0 || doctorFilterIds.has(p.doctorId)) &&
          (typeFilterValues.size === 0 || typeFilterValues.has(p.type))
        );
      }

      let openFilterColumn = null;
      function closeColumnFilter() {
        openFilterColumn = null;
        document.querySelectorAll('.filter-dropdown').forEach((el) => el.remove());
      }
      function openColumnFilter(column, anchorTh, options, selectedSet, onChange) {
        if (openFilterColumn === column) { closeColumnFilter(); return; }
        closeColumnFilter();
        openFilterColumn = column;
        const dropdown = document.createElement('div');
        dropdown.className = 'filter-dropdown';
        dropdown.innerHTML = options.map((o) => `
          <label><input type="checkbox" value="${Qlinic.escapeHtml(o.value)}" ${selectedSet.has(o.value) ? 'checked' : ''} /> ${Qlinic.escapeHtml(o.label)}<span class="fd-count">${o.count}</span></label>
        `).join('');
        dropdown.addEventListener('click', (e) => e.stopPropagation());
        dropdown.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
          cb.addEventListener('change', () => {
            if (cb.checked) selectedSet.add(cb.value); else selectedSet.delete(cb.value);
            closeColumnFilter();
            onChange();
          });
        });
        anchorTh.appendChild(dropdown);
      }
      document.addEventListener('click', () => closeColumnFilter());

      function FILTER_ICON_SVG(className) {
        return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>`;
      }

      function activeFilterChipsHtml() {
        const chips = [];
        if (doctorFilterIds.size > 0) {
          const labels = doctors.filter((d) => doctorFilterIds.has(d.id)).map((d) => d.name);
          chips.push({ key: 'doctor', label: `Doctor: ${labels.join(', ')}` });
        }
        if (typeFilterValues.size > 0) {
          const labels = [...typeFilterValues].map((v) => TYPE_LABELS[v] || v);
          chips.push({ key: 'type', label: `Type: ${labels.join(', ')}` });
        }
        return chips.map((c) => `<div class="filter-chip">${Qlinic.escapeHtml(c.label)}<button type="button" class="clear-filter-chip" data-key="${c.key}" aria-label="Clear filter">×</button></div>`).join('');
      }
      function clearFilterByKey(key) {
        if (key === 'doctor') doctorFilterIds.clear();
        else if (key === 'type') typeFilterValues.clear();
        render();
      }
      function resetAllFilters() {
        doctorFilterIds.clear();
        typeFilterValues.clear();
        render();
      }

      if (showDoctorFilter || showTypeFilter || showSortToggle) {
        document.getElementById('filterHeader').style.display = '';
      }
      if (showDoctorFilter || showTypeFilter) {
        document.getElementById('resetFiltersBtn').style.display = '';
        document.getElementById('resetFiltersBtn').addEventListener('click', resetAllFilters);
      }
      if (showSortToggle) {
        document.getElementById('sortToggleSeg').style.display = '';
        renderSortToggle();
      }

      function render() {
        let rows = filteredRows();
        if (config.needsWait) {
          rows = rows.map((p) => ({ patient: p, waitMins: waitMinsFor(p) }));
          if (config.perDoctorTop) {
            const byDoctor = {};
            rows.forEach((r) => {
              const id = r.patient.doctorId;
              if (!byDoctor[id] || r.waitMins > byDoctor[id].waitMins) byDoctor[id] = r;
            });
            rows = Object.values(byDoctor).sort((a, b) => b.waitMins - a.waitMins);
          } else if (config.sortDesc) {
            rows.sort((a, b) => b.waitMins - a.waitMins);
          }
        } else {
          const sortKey = config.sortKey || ((p) => p.createdAt);
          rows = [...rows].sort((a, b) => recencyDesc
            ? (sortKey(b) || '').localeCompare(sortKey(a) || '')
            : (sortKey(a) || '').localeCompare(sortKey(b) || ''));
        }

        document.getElementById('summaryNote').textContent = config.needsWait
          ? (rows.length
              ? (config.perDoctorTop
                  ? `Longest: ${rows[0].waitMins} min (${rows[0].patient.name}). ${rows.length} doctor${rows.length === 1 ? '' : 's'} counted.`
                  : config.sortDesc
                    ? `Longest: ${rows[0].waitMins} min (${rows[0].patient.name}). ${rows.length} patient${rows.length === 1 ? '' : 's'} counted.`
                    : `Average: ${Math.round(rows.reduce((sum, r) => sum + r.waitMins, 0) / rows.length)} min across ${rows.length} patient${rows.length === 1 ? '' : 's'}.`)
              : 'No patients to measure.')
          : `${rows.length} patient${rows.length === 1 ? '' : 's'}.`;

        if (showDoctorFilter || showTypeFilter) {
          document.getElementById('activeFilterChipsRow').innerHTML = activeFilterChipsHtml();
          document.querySelectorAll('#activeFilterChipsRow .clear-filter-chip').forEach((btn) => {
            btn.addEventListener('click', () => clearFilterByKey(btn.dataset.key));
          });
        }

        const wrap = document.getElementById('tableWrap');
        if (rows.length === 0) {
          wrap.innerHTML = '<div class="empty-state">Nothing here.</div>';
          return;
        }

        const doctorIconClass = doctorFilterIds.size > 0 ? 'th-filter-icon active' : 'th-filter-icon';
        const typeIconClass = typeFilterValues.size > 0 ? 'th-filter-icon active' : 'th-filter-icon';

        wrap.innerHTML = `
          <table class="qtable">
            <thead><tr>${config.columns.map((c) => {
              if (c === 'Doctor' && showDoctorFilter) return `<th class="th-filterable"><span class="th-filter-trigger" id="doctorFilterTrigger" title="Click to filter by Doctor">Doctor ${FILTER_ICON_SVG(doctorIconClass)}</span></th>`;
              if (c === 'Type' && showTypeFilter) return `<th class="th-filterable"><span class="th-filter-trigger" id="typeFilterTrigger" title="Click to filter by Type">Type ${FILTER_ICON_SVG(typeIconClass)}</span></th>`;
              return `<th>${Qlinic.escapeHtml(c)}</th>`;
            }).join('')}</tr></thead>
            <tbody>
              ${rows.map((r) => {
                const p = config.needsWait ? r.patient : r;
                const doctorName = doctorById[p.doctorId] ? doctorById[p.doctorId].name : '—';
                const cells = config.needsWait ? config.row(p, doctorName, r.waitMins) : config.row(p, doctorName);
                return `<tr>${cells.map((c) => `<td>${Qlinic.escapeHtml(String(c))}</td>`).join('')}</tr>`;
              }).join('')}
            </tbody>
          </table>
        `;
        if (showDoctorFilter) {
          document.getElementById('doctorFilterTrigger').addEventListener('click', (e) => {
            e.stopPropagation();
            openColumnFilter('doctor', e.currentTarget.closest('th'), doctorFilterOptions(), doctorFilterIds, render);
          });
        }
        if (showTypeFilter) {
          document.getElementById('typeFilterTrigger').addEventListener('click', (e) => {
            e.stopPropagation();
            openColumnFilter('type', e.currentTarget.closest('th'), typeFilterOptions(), typeFilterValues, render);
          });
        }
      }

      render();

      const clinic = await Qlinic.getClinic();
      document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
      if (clinic && clinic.logo_url) {
        document.getElementById('clinicLogoThumb').src = clinic.logo_url;
        document.getElementById('clinicLogoThumb').style.display = 'block';
      } else {
        document.getElementById('clinicLogoThumb').style.display = 'none';
      }
    })();
  </script>

</body>
</html>
