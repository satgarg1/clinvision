<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<!-- GitHub Pages shows this file for any address that does not exist. A patient queue link such as
     https://clinvision.in/q/K7M2X9QD4F lands here and is passed straight to the queue page. The title and
     preview below are the ones WhatsApp and a browser tab show for such a link, so they say nothing
     about "not found". The page stays blank until the script decides what to show. -->
<title>Your queue on ClinVision</title>
<meta property="og:title" content="Your queue on ClinVision" />
<meta property="og:description" content="Open this link to see where you are in the queue." />
<meta property="og:site_name" content="ClinVision" />
<link rel="icon" type="image/png" href="/clinvision-favicon.png?v=2" />
<script>
  (function () {
    var match = /^\/q\/([A-Za-z0-9]{6,24})\/?$/.exec(window.location.pathname);
    if (match) {
      window.location.replace('/queue.html?c=' + match[1].toUpperCase());
    } else {
      document.documentElement.className = 'nf';
      document.title = 'Page not found: ClinVision';
    }
  })();
</script>
<style>
  html { background: #eaf0ff; }
  html:not(.nf) body { display: none; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #0b1f4d;
    background: linear-gradient(180deg, #dfeaff 0%, #eaf0ff 45%, #e6f3f6 100%); }
  .box { text-align: center; max-width: 380px; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 0 0 18px; font-size: 15px; line-height: 1.5; color: #475569; }
  a { display: inline-block; padding: 12px 26px; border-radius: 999px; background: #1d63e0; color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <div class="box">
    <h1>Page not found</h1>
    <p>The link may be mistyped or no longer in use. If a clinic sent you this link, please ask them to send it again.</p>
    <a href="/">Go to ClinVision</a>
  </div>
</body>
</html>
