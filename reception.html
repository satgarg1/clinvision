<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reception: Qlinic</title>
<script>if (localStorage.getItem('qlinic_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%231d1d1f'/%3E%3Cline x1='50' y1='50' x2='50' y2='26' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='68' y2='58' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%230071e3'/%3E%3C/svg%3E" />

<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand">
        <span class="brand-top">
          <span class="brand-clock clock-face" id="navClock">
            <svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block;color:var(--black);">
              <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="5"></circle>
              <line class="clock-hour" x1="50" y1="50" x2="50" y2="30" stroke="currentColor" stroke-width="6" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
              <line class="clock-min" x1="50" y1="50" x2="50" y2="18" stroke="currentColor" stroke-width="4" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
              <line class="clock-sec" x1="50" y1="50" x2="50" y2="14" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
              <circle cx="50" cy="50" r="3" fill="currentColor"></circle>
            </svg>
          </span>
          Qlinic
        </span>
        <span class="brand-tagline">Time is the one asset nobody gets back</span>
      </a>
      <div class="clinic-name-row">
        <img class="clinic-logo-thumb" id="clinicLogoThumb" style="display:none;" alt="" />
        <div class="clinic-name" id="clinicName">Loading…</div>
      </div>
      <nav>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="reception.html" class="nav-link active">Reception</a>
        <a href="doctor.html" class="nav-link">Doctor View</a>
        <a href="billing.html" class="nav-link" id="billingNavLink">Billing</a>
        <a href="revenue.html" class="nav-link" id="revenueNavLink">Revenue</a>
        <a href="trends.html" class="nav-link" id="trendsNavLink">Trends</a>
        <a href="end-of-day.html" class="nav-link" id="endOfDayNavLink">End of day</a>
        <a href="display.html" class="nav-link">Display Screen</a>
        <a href="settings.html" class="nav-link pinned-bottom" id="settingsNavLink">Settings</a>
      </nav>
    </aside>

    <main class="app-main">
      <div class="closed-day-banner" id="closedDayBanner" style="display:none;"></div>
      <div class="app-topbar">
        <h1>Reception</h1>
        <div class="clock-pill">
          <span><span class="live-dot" style="width:7px;height:7px;margin-right:8px;"></span>Time: <span class="time" id="clockTime">--</span></span>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>Find a Patient</h2>
          <button type="button" class="btn-sm" id="clearSearchBtn" style="display:none;margin-left:auto;">Clear</button>
        </div>
        <div class="field">
          <input type="text" id="searchBox" placeholder="Search by name or phone…" />
        </div>
        <div id="searchResults"></div>
      </div>

      <div class="panel patient-panel mode-appointment" id="patientPanel">
        <div class="panel-header"><h2>Add a patient</h2></div>
        <div class="mode-toggle" role="tablist" aria-label="How is this patient being added">
          <button type="button" class="mode-btn active" data-mode="appointment" role="tab" aria-selected="true">📞 Phoned-in appointment, booking ahead</button>
          <button type="button" class="mode-btn" data-mode="walkin" role="tab" aria-selected="false">🚶 Walk-in, here right now</button>
        </div>
        <p id="modeHint" class="panel-note">
          Booking a call-in appointment ahead of time: pick when they should arrive.
        </p>
        <form id="patientForm">
          <div class="form-grid">
            <div class="field">
              <label>Name</label>
              <input type="text" id="pName" required />
            </div>
            <div class="field">
              <label>Age</label>
              <input type="number" id="pAge" min="0" max="120" />
            </div>
            <div class="field">
              <label>Phone</label>
              <input type="tel" id="pPhone" required />
            </div>
            <div class="field">
              <label>Gender</label>
              <select id="pGender" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="field">
              <label>Address / locality</label>
              <input type="text" id="pAddress" placeholder="e.g., Sector 12, near market" required />
            </div>
            <div class="field">
              <label>Doctor</label>
              <select id="pDoctor" required></select>
            </div>
            <div class="field mode-only mode-only-appointment">
              <label>Appointment date</label>
              <input type="date" id="pDate" />
            </div>
            <div class="field mode-only mode-only-appointment">
              <label>Appointment time</label>
              <div class="time-picker" id="pTimePicker">
                <button type="button" class="time-picker-trigger placeholder" id="pTimeTrigger">
                  <span id="pTimeTriggerText">Select a time</span><span class="time-picker-caret">▾</span>
                </button>
                <input type="hidden" id="pTime" />
                <div class="time-picker-panel" id="pTimePanel" style="display:none;"></div>
              </div>
            </div>
            <div class="field mode-only mode-only-walkin" style="display:none;">
              <label>Preferred time (optional)</label>
              <div class="time-picker" id="pWalkinTimePicker">
                <button type="button" class="time-picker-trigger placeholder" id="pWalkinTimeTrigger">
                  <span id="pWalkinTimeTriggerText">As soon as possible</span><span class="time-picker-caret">▾</span>
                </button>
                <input type="hidden" id="pWalkinTime" />
                <div class="time-picker-panel" id="pWalkinTimePanel" style="display:none;"></div>
              </div>
            </div>
            <div class="field mode-only mode-only-walkin" style="display:none;">
              <label>Walk-in type</label>
              <select id="pWalkinType">
                <option value="standard">Standard</option>
                <option value="emergency">Emergency — see first</option>
              </select>
            </div>
            <div class="field">
              <label>Reason (optional)</label>
              <input type="text" id="pReason" />
            </div>
            <div class="field" style="margin-top:24px;">
              <button type="submit" class="btn-sm primary" id="patientSubmitBtn" style="width:100%;">Add appointment</button>
            </div>
          </div>
          <div id="closedDayHint" class="slot-hint error" style="display:none;"></div>
          <div id="doctorClosedHint" class="slot-hint" style="display:none;"></div>
          <div id="patientLookupHint" class="slot-hint" style="display:none;"></div>
          <div id="followUpHint" class="slot-hint" style="display:none;"></div>
          <div id="slotHint" class="slot-hint"></div>
        </form>
      </div>

      <div class="panel">
        <div class="panel-header"><h2>Viewing queue for</h2></div>
        <div class="inline-form">
          <div class="field" style="min-width:240px;">
            <label>Doctor</label>
            <select id="queueDoctorFilter" class="doctor-select"></select>
          </div>
          <div class="field" style="min-width:180px;flex:0;">
            <label>Date</label>
            <input type="date" id="queueDateFilter" />
          </div>
          <div class="field" style="flex:0;">
            <label>&nbsp;</label>
            <button type="button" class="btn-sm" id="queueTodayBtn">Today</button>
          </div>
        </div>
      </div>

      <div id="queuePanel"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=41"></script>
  <script>
    (async function () {
      await Qlinic.requireLogin('login.html');

      // The sidebar logo links to the marketing site, which has no way
      // back into the app without logging in again, worth a heads-up
      // before someone loses their place by accident.
      document.querySelector('a.brand').addEventListener('click', (e) => {
        e.preventDefault();
        if (confirm("Going to the homepage will end your session here, you'll need to log in again to get back in. Continue?")) {
          window.location.href = 'index.html';
        }
      });

      if (!(await Qlinic.isAdmin())) {
        document.getElementById('settingsNavLink').style.display = 'none';
      }

      const canBill = await Qlinic.canAccessBilling();
      if (!canBill) {
        document.getElementById('billingNavLink').style.display = 'none';
        document.getElementById('revenueNavLink').style.display = 'none';
        document.getElementById('trendsNavLink').style.display = 'none';
        document.getElementById('endOfDayNavLink').style.display = 'none';
      }

      const BOOKED_PAGE_SIZE = 10;
      const WAITING_PAGE_SIZE = 10;
      let patientMode = 'appointment';
      let clinicOpenMin = 0;
      let clinicCloseMin = 1440;
      let clinicWeeklyOffDays = [];
      let clinicClosureByDate = {};
      let queueDoctorId = null;
      let queueViewDate = null;
      let bookedExpanded = false;
      let bookedPage = 0;
      let waitingPage = 0;
      // Generation counters for async renders that can overlap (rapid
      // submissions, or a direct call racing Realtime's own onLiveChange
      // firing for the same change): each call captures its own number,
      // and bails without touching the DOM if a newer call has since
      // started — otherwise a slower, older response can resolve last
      // and clobber fresher data with stale data, which is exactly what
      // produced the flickering counts and the patient that seemed to
      // vanish and reappear.
      let queueRenderToken = 0;
      let slotHintToken = 0;
      let patientLookupToken = 0;
      let followUpHintToken = 0;
      let doctorsCache = [];
      let todayInvoices = [];
      let editingInvoiceId = null;

      // Same 5-color identity palette used app-wide; each doctor keeps the
      // same color on reception, the doctor view, and the waiting-room board.
      const ACCENT_COLORS = ['teal', 'blue', 'purple', 'coral', 'pink'];
      function accentForDoctor(doctorId) {
        const idx = doctorsCache.findIndex((d) => d.id === doctorId);
        return ACCENT_COLORS[Math.max(idx, 0) % ACCENT_COLORS.length];
      }

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      async function refreshDoctorsCache() {
        doctorsCache = await Qlinic.getDoctors();
        return doctorsCache;
      }

      function fillDoctorSelects() {
        const opts = doctorsCache.map((d) => `<option value="${d.id}">${Qlinic.escapeHtml(d.name)}, ${Qlinic.escapeHtml(d.specialty)}</option>`).join('');
        document.getElementById('pDoctor').innerHTML = opts;
      }

      // Custom time picker: a native <input type="time"> renders a
      // different, unstylable scrolling wheel per browser/OS, and a plain
      // <select> can't filter out past times or control where the list
      // opens. Values stay "HH:MM" 24-hour strings in a hidden input, so
      // nothing else that reads/sets pTime.value has to change.
      let timePickerOptions = [];

      // Parsed manually (not new Date(dateStr)) so the weekday check is
      // always against local calendar time, not thrown off by the
      // UTC-midnight parsing a plain "YYYY-MM-DD" string gets otherwise.
      const DAY_NAMES = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
      // Checks both the weekly off days and any one-off closure (holidays,
      // etc. — see Settings > Closed Dates) against a single date, and
      // returns why it's closed so callers can show a specific message
      // instead of a generic "clinic is closed."
      function closureReason(dateStr) {
        if (!dateStr) return null;
        if (clinicWeeklyOffDays.length) {
          const [y, m, d] = dateStr.split('-').map(Number);
          const dayName = DAY_NAMES[new Date(y, m - 1, d).getDay()];
          if (clinicWeeklyOffDays.includes(dayName)) {
            const dayLabel = dayName[0].toUpperCase() + dayName.slice(1);
            return `Clinic is closed on this date (${dayLabel}s)`;
          }
        }
        if (clinicClosureByDate[dateStr] !== undefined) {
          const note = clinicClosureByDate[dateStr];
          return note ? `Clinic is closed on this date (${note})` : 'Clinic is closed on this date';
        }
        return null;
      }
      function isClosedDate(dateStr) {
        return !!closureReason(dateStr);
      }
      function updateClosedDayHint() {
        const hint = document.getElementById('closedDayHint');
        const reason = closureReason(document.getElementById('pDate').value);
        if (reason) {
          hint.textContent = `${reason} — choose a different date.`;
          hint.style.display = 'block';
        } else {
          hint.style.display = 'none';
        }
      }

      // Names up to 2 closed doctors; from 3 up to (total - 1) it switches
      // to a count + a Dashboard pointer, since a name list that long gets
      // hard to scan. Once EVERY doctor is closed, that count collapses to
      // "All doctors" instead — a clearer, stronger signal than "5 doctors"
      // when 5 happens to be all of them, and "check Dashboard" stops
      // making sense once there's no one left to find there. But only once
      // total is 3+: a solo or two-doctor clinic's last closure still names
      // them — "All doctors" reads like clinic-wide news on a roster that
      // small, where naming the one or two people involved is clearer, not
      // vaguer. Time-bound to today only — see isDoctorClosedToday — so
      // this clears itself at midnight without anyone reopening a day.
      function renderClosedDayBanner() {
        const banner = document.getElementById('closedDayBanner');
        const closed = doctorsCache.filter((d) => Qlinic.isDoctorClosedToday(d));
        const total = doctorsCache.length;
        if (closed.length === 0) {
          banner.style.display = 'none';
          banner.innerHTML = '';
          return;
        }
        let msg;
        if (total >= 3 && closed.length === total) {
          msg = `<strong>All doctors</strong> have closed for the day — don't book any more appointments today.`;
        } else if (closed.length === 1) {
          msg = `<strong>${Qlinic.escapeHtml(closed[0].name)}</strong> has closed for the day — don't book any more appointments for them today.`;
        } else if (closed.length === 2) {
          msg = `<strong>${Qlinic.escapeHtml(closed[0].name)}</strong> and <strong>${Qlinic.escapeHtml(closed[1].name)}</strong> have closed for the day — don't book any more appointments for them today.`;
        } else {
          msg = `<strong>${closed.length} doctors</strong> have closed for the day — check <strong>Dashboard</strong> to see who's still available before booking.`;
        }
        banner.innerHTML = `<span class="dot"></span><span>${msg}</span>`;
        banner.style.display = 'flex';
      }

      // The banner covers the common case, but with enough doctors on the
      // roster it's easy to miss — this is the safety net right where
      // booking actually happens, checked for BOTH walk-ins (always today)
      // and phoned-in appointments (only when booked for today; booking a
      // closed doctor for tomorrow is fine and stays allowed).
      function doctorBookingBlockReason() {
        const doctorId = document.getElementById('pDoctor').value;
        const doctor = doctorsCache.find((d) => d.id === doctorId);
        if (!doctor || !Qlinic.isDoctorClosedToday(doctor)) return null;
        const date = document.getElementById('pDate').value;
        const bookingForToday = patientMode === 'walkin' || date === Qlinic.getTodayDate();
        if (!bookingForToday) return null;
        return `${Qlinic.escapeHtml(doctor.name)} has closed for the day and can't take any more patients today. Pick another doctor, or book them for a different date.`;
      }
      function updateDoctorClosedHint() {
        const hint = document.getElementById('doctorClosedHint');
        const reason = doctorBookingBlockReason();
        if (reason) {
          hint.className = 'slot-hint error';
          hint.innerHTML = `⛔ ${reason}`;
          hint.style.display = 'block';
        } else {
          hint.style.display = 'none';
        }
      }

      function buildTimePickerOptions() {
        const dateVal = document.getElementById('pDate').value;
        const isToday = dateVal === Qlinic.getTodayDate();
        let startMin = clinicOpenMin;
        if (isToday) {
          const now = new Date();
          const nowMin = Math.ceil((now.getHours() * 60 + now.getMinutes()) / 5) * 5;
          startMin = Math.max(startMin, nowMin);
        }
        const opts = [];
        for (let m = startMin; m < clinicCloseMin; m += 5) {
          const hh = String(Math.floor(m / 60)).padStart(2, '0');
          const mm = String(m % 60).padStart(2, '0');
          opts.push({ value: `${hh}:${mm}`, label: Qlinic.formatTime(m) });
        }
        timePickerOptions = opts;
      }

      function renderTimePanel() {
        const panel = document.getElementById('pTimePanel');
        const currentVal = document.getElementById('pTime').value;
        if (timePickerOptions.length === 0) {
          panel.innerHTML = '<div class="time-picker-empty">No times left today, pick another date.</div>';
          return;
        }
        panel.innerHTML = timePickerOptions.map((o) => `
          <div class="time-picker-option ${o.value === currentVal ? 'selected' : ''}" data-value="${o.value}" data-label="${o.label}">${o.label}</div>
        `).join('');
      }

      function openTimePanel() {
        buildTimePickerOptions();
        renderTimePanel();
        document.getElementById('pTimePanel').style.display = 'block';
        const panel = document.getElementById('pTimePanel');
        const target = panel.querySelector('.selected') || panel.querySelector('.time-picker-option');
        if (target) target.scrollIntoView({ block: 'nearest' });
      }

      function closeTimePanel() {
        document.getElementById('pTimePanel').style.display = 'none';
      }

      function selectTime(value, label) {
        document.getElementById('pTime').value = value;
        const trigger = document.getElementById('pTimeTrigger');
        document.getElementById('pTimeTriggerText').textContent = label;
        trigger.classList.remove('placeholder');
        closeTimePanel();
        updateSlotHint();
      }

      function resetTimePicker() {
        document.getElementById('pTime').value = '';
        document.getElementById('pTimeTriggerText').textContent = 'Select a time';
        document.getElementById('pTimeTrigger').classList.add('placeholder');
        closeTimePanel();
      }

      // Same picker component and interaction as the appointment time
      // field above, kept as its own instance (not a shared function)
      // since it's simpler in one real way: always today (walk-ins are
      // same-day only, no date field to read), and selecting a time
      // here doesn't touch updateSlotHint, which is appointment-slot-
      // capacity specific and doesn't apply to a walk-in's preferred time.
      let walkinTimePickerOptions = [];
      function buildWalkinTimePickerOptions() {
        const now = new Date();
        const nowMin = Math.ceil((now.getHours() * 60 + now.getMinutes()) / 5) * 5;
        const startMin = Math.max(clinicOpenMin, nowMin);
        const opts = [];
        for (let m = startMin; m < clinicCloseMin; m += 5) {
          const hh = String(Math.floor(m / 60)).padStart(2, '0');
          const mm = String(m % 60).padStart(2, '0');
          opts.push({ value: `${hh}:${mm}`, label: Qlinic.formatTime(m) });
        }
        walkinTimePickerOptions = opts;
      }
      function renderWalkinTimePanel() {
        const panel = document.getElementById('pWalkinTimePanel');
        const currentVal = document.getElementById('pWalkinTime').value;
        if (walkinTimePickerOptions.length === 0) {
          panel.innerHTML = '<div class="time-picker-empty">No times left today.</div>';
          return;
        }
        panel.innerHTML = walkinTimePickerOptions.map((o) => `
          <div class="time-picker-option ${o.value === currentVal ? 'selected' : ''}" data-value="${o.value}" data-label="${o.label}">${o.label}</div>
        `).join('');
      }
      function openWalkinTimePanel() {
        buildWalkinTimePickerOptions();
        renderWalkinTimePanel();
        document.getElementById('pWalkinTimePanel').style.display = 'block';
        const panel = document.getElementById('pWalkinTimePanel');
        const target = panel.querySelector('.selected') || panel.querySelector('.time-picker-option');
        if (target) target.scrollIntoView({ block: 'nearest' });
      }
      function closeWalkinTimePanel() {
        document.getElementById('pWalkinTimePanel').style.display = 'none';
      }
      function selectWalkinTime(value, label) {
        document.getElementById('pWalkinTime').value = value;
        const trigger = document.getElementById('pWalkinTimeTrigger');
        document.getElementById('pWalkinTimeTriggerText').textContent = label;
        trigger.classList.remove('placeholder');
        closeWalkinTimePanel();
      }
      function resetWalkinTimePicker() {
        document.getElementById('pWalkinTime').value = '';
        document.getElementById('pWalkinTimeTriggerText').textContent = 'As soon as possible';
        document.getElementById('pWalkinTimeTrigger').classList.add('placeholder');
        closeWalkinTimePanel();
      }
      document.getElementById('pWalkinTimeTrigger').addEventListener('click', (e) => {
        e.stopPropagation();
        const panel = document.getElementById('pWalkinTimePanel');
        if (panel.style.display === 'block') closeWalkinTimePanel();
        else openWalkinTimePanel();
      });
      document.getElementById('pWalkinTimePanel').addEventListener('click', (e) => {
        const opt = e.target.closest('.time-picker-option');
        if (!opt) return;
        selectWalkinTime(opt.getAttribute('data-value'), opt.getAttribute('data-label'));
      });

      document.getElementById('pTimeTrigger').addEventListener('click', (e) => {
        e.stopPropagation();
        const panel = document.getElementById('pTimePanel');
        if (panel.style.display === 'block') closeTimePanel();
        else openTimePanel();
      });
      document.getElementById('pTimePanel').addEventListener('click', (e) => {
        const opt = e.target.closest('.time-picker-option');
        if (!opt) return;
        selectTime(opt.getAttribute('data-value'), opt.getAttribute('data-label'));
      });
      // Delegated (not bound to one specific .time-picker) so it also
      // covers the search-edit row's time picker, which is rebuilt fresh
      // on every render and can't hold a persistent listener of its own.
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.time-picker')) {
          document.querySelectorAll('.time-picker-panel').forEach((p) => { p.style.display = 'none'; });
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          document.querySelectorAll('.time-picker-panel').forEach((p) => { p.style.display = 'none'; });
        }
      });

      // Walk-in and phoned-appointment used to be two separate, near-identical
      // forms stacked on the page; easy to fill in the wrong one by habit.
      // One form with an explicit mode toggle means there's only one place
      // to type, and the choice of "who is this" has to be made on purpose
      // first.
      function setPatientMode(mode) {
        patientMode = mode;
        document.querySelectorAll('.mode-btn').forEach((btn) => {
          const active = btn.getAttribute('data-mode') === mode;
          btn.classList.toggle('active', active);
          btn.setAttribute('aria-selected', String(active));
        });
        document.getElementById('patientPanel').classList.toggle('mode-walkin', mode === 'walkin');
        document.getElementById('patientPanel').classList.toggle('mode-appointment', mode === 'appointment');
        document.querySelectorAll('.mode-only-appointment').forEach((el) => { el.style.display = mode === 'appointment' ? '' : 'none'; });
        document.querySelectorAll('.mode-only-walkin').forEach((el) => { el.style.display = mode === 'walkin' ? '' : 'none'; });
        document.getElementById('pDate').required = mode === 'appointment';
        document.getElementById('modeHint').textContent = mode === 'walkin'
          ? "They're standing at the desk, this queues them immediately."
          : 'Booking a call-in appointment ahead of time: pick when they should arrive.';
        document.getElementById('patientSubmitBtn').textContent = mode === 'walkin' ? 'Add walk-in' : 'Add appointment';
        updateSlotHint();
        checkFollowUpHint();
        updateDoctorClosedHint();
      }

      document.querySelectorAll('.mode-btn').forEach((btn) => {
        btn.addEventListener('click', () => setPatientMode(btn.getAttribute('data-mode')));
      });

      // Two "Ramesh Kumar"s look identical in a name-only list; the address
      // line is what actually tells reception (or the doctor) which one is
      // which.
      function nameCell(p) {
        const priorityBadge = p.isPriority ? ' <span class="badge badge-no-show">Priority</span>' : '';
        return `<div>${Qlinic.escapeHtml(p.name)}${priorityBadge}</div><div class="sub-line">${p.address ? Qlinic.escapeHtml(p.address) : 'No address on file'}</div>`;
      }

      // The Waiting list is sorted by scheduled/effective time, not raw
      // arrival time: a walk-in's "effective" slot is when they arrived, an
      // appointment's is its booked time plus any doctor delay.
      // Only ever called on patients already in the live queue (status
      // 'waiting'), where arrivedAt is always set regardless of type — so
      // the sub-line always shows when they actually walked in, not when
      // an appointment was originally booked (which is often identical to
      // the primary time above it and tells reception nothing new).
      function queueTimeCell(p) {
        const primary = Qlinic.formatTimestamp(p.effectiveTime);
        return `<div>${primary}</div><div class="sub-line">arrived ${Qlinic.formatTimestamp(p.arrivedAt)}</div>`;
      }

      // Every arriving patient gets billed automatically the instant they
      // hit "waiting" (see migration 016) — cash, consultation fee, paid
      // in full. This cell just shows that, and lets reception correct
      // the rare exception (wrong payment method, an emergency fee, a
      // genuinely free visit) without ever requiring it. Adjust rewrites
      // the row in place instead of navigating anywhere, since 200+ of
      // these a day can't each cost a page load.
      const PAYMENT_MODE_SHORT_LABELS = { cash: 'Cash', upi: 'UPI', card: 'Card' };

      function billingCell(p, invoiceByPatientId, doctor) {
        const inv = invoiceByPatientId[p.id];
        if (!inv) return '<span class="sub-line">Not yet billed</span>';
        if (editingInvoiceId === inv.id) {
          return `
            <div class="adj-box">
              <select class="adj-fee-type" data-fee-normal="${doctor.feeNormal || 0}" data-fee-emergency="${doctor.feeEmergency || 0}" onchange="syncAdjustAmount(this)">
                <option value="consultation" ${inv.feeType === 'consultation' ? 'selected' : ''}>Consultation</option>
                <option value="emergency" ${inv.feeType === 'emergency' ? 'selected' : ''}>Emergency</option>
                <option value="waived" ${inv.feeType === 'waived' ? 'selected' : ''}>Follow up</option>
              </select>
              <select class="adj-payment-mode">
                <option value="cash" ${inv.paymentMode === 'cash' ? 'selected' : ''}>Cash</option>
                <option value="upi" ${inv.paymentMode === 'upi' ? 'selected' : ''}>UPI</option>
                <option value="card" ${inv.paymentMode === 'card' ? 'selected' : ''}>Card</option>
              </select>
              <input type="number" min="0" step="1" class="adj-amount-received" value="${inv.amountReceived}" />
              <div class="adj-actions">
                <button type="button" class="btn-sm primary" onclick="saveInvoiceEdit('${inv.id}')">Save</button>
                <button type="button" class="btn-sm" onclick="cancelInvoiceEdit()">Cancel</button>
              </div>
            </div>
          `;
        }
        const amountLabel = inv.feeType === 'waived' ? 'Follow up' : `₹${inv.amount} · ${PAYMENT_MODE_SHORT_LABELS[inv.paymentMode] || inv.paymentMode}`;
        return `
          <div>${amountLabel}</div>
          <div class="sub-line">
            <a href="#" onclick="startEditInvoice('${inv.id}'); return false;" style="color:var(--accent);text-decoration:none;">Adjust</a>
            &middot;
            <a href="billing-consultation.html?invoiceId=${inv.id}" target="_blank" style="color:var(--accent);text-decoration:none;">Print</a>
          </div>
        `;
      }

      // The amount field previewing the new fee the instant fee type
      // changes isn't just cosmetic: it's what keeps the amount actually
      // submitted on Save correct. Without this, switching to Emergency
      // or No charge left the old amount sitting in the field, which then
      // got saved as amount_received against the new (different) total —
      // producing a receipt with a balance nobody intended.
      function syncAdjustAmount(selectEl) {
        const cell = selectEl.closest('td');
        const amountInput = cell.querySelector('.adj-amount-received');
        const feeType = selectEl.value;
        const amount = feeType === 'waived' ? 0
          : feeType === 'emergency' ? Number(selectEl.dataset.feeEmergency) || 0
          : Number(selectEl.dataset.feeNormal) || 0;
        amountInput.value = amount;
      }
      window.syncAdjustAmount = syncAdjustAmount;

      function csvCell(value) {
        const s = String(value == null ? '' : value);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }

      // Now-serving/waiting are live-queue concepts that only apply to
      // today; booked/done/no-show are meaningful for any date, so the
      // export covers the full day, not just what's still in progress.
      function buildQueueCsv(isTodayView, queue) {
        const rows = [['Name', 'Phone', 'Type', 'Time', 'Status', 'Address', 'Reason']];
        function pushRow(p, timeStr, status) {
          rows.push([p.name, p.phone, p.type === 'appointment' ? 'Appointment' : 'Walk-in', timeStr, status, p.address || '', p.reason || '']);
        }
        if (isTodayView) {
          if (queue.nowServing) pushRow(queue.nowServing, Qlinic.formatTimestamp(queue.nowServing.arrivedAt), 'In consultation');
          queue.waiting.forEach((p) => pushRow(p, Qlinic.formatTimestamp(p.effectiveTime), 'Waiting'));
        }
        queue.booked.forEach((p) => pushRow(p, Qlinic.formatTime(Qlinic.parseTime(p.bookedTime)), p.likelyNoShow ? 'Likely no-show' : 'Expected'));
        queue.done.forEach((p) => pushRow(p, Qlinic.formatTimestamp(p.arrivedAt), 'Seen'));
        queue.noShow.forEach((p) => pushRow(p, p.bookedTime ? Qlinic.formatTime(Qlinic.parseTime(p.bookedTime)) : '', 'No-show'));
        return rows.map((r) => r.map(csvCell).join(',')).join('\r\n');
      }

      function downloadCsv(filename, csvText) {
        const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      async function updateSlotHint() {
        const myToken = ++slotHintToken;
        const hint = document.getElementById('slotHint');
        if (patientMode !== 'appointment') { hint.className = 'slot-hint'; hint.innerHTML = ''; return; }
        const doctorId = document.getElementById('pDoctor').value;
        const date = document.getElementById('pDate').value;
        const time = document.getElementById('pTime').value;
        if (!doctorId || !date || !time) { hint.className = 'slot-hint'; hint.innerHTML = ''; return; }
        // Checked against the REAL device clock: a phone call happens in
        // real time. Hard block, nothing to override.
        if (Qlinic.isPastRealDateTime(date, time)) {
          hint.className = 'slot-hint error';
          hint.innerHTML = `⛔ That date and time has already passed. Pick a later time.`;
          return;
        }
        const avail = await Qlinic.getSlotAvailability(doctorId, date, time);
        if (myToken !== slotHintToken) return;
        if (!avail) { hint.className = 'slot-hint'; hint.innerHTML = ''; return; }
        // Names the actual booking window (e.g. "9:20–9:30 pm") instead of
        // a vague "around this time" — two times that look comfortably
        // apart, like 9:20 and 9:25, can land in the same slot once Queue
        // Rules' slot length is wider than 5 minutes, and that's genuinely
        // baffling without seeing the window it's actually checking.
        const windowLabel = `${Qlinic.formatTime(Qlinic.parseTime(avail.windowStart))}–${Qlinic.formatTime(Qlinic.parseTime(avail.windowEnd))}`;
        if (avail.isFull) {
          hint.className = 'slot-hint warn';
          hint.innerHTML = `⚠ ${avail.count} patients already booked between <strong>${windowLabel}</strong> (max ${avail.capacity} per slot). Next open slot: <strong>${Qlinic.formatTime(Qlinic.parseTime(avail.suggestion))}</strong> <button type="button" class="btn-sm" id="useSuggestedTimeBtn">Use this time</button>`;
          document.getElementById('useSuggestedTimeBtn').addEventListener('click', () => {
            selectTime(avail.suggestion, Qlinic.formatTime(Qlinic.parseTime(avail.suggestion)));
          });
        } else {
          hint.className = 'slot-hint ok';
          hint.innerHTML = `✓ ${avail.count}/${avail.capacity} booked between ${windowLabel}, room to add.`;
        }
      }

      let editingSearchPatientId = null;

      function searchStatusBadge(p) {
        if (p.status === 'waiting') return '<span class="badge badge-done">Waiting</span>';
        return p.likelyNoShow ? '<span class="badge badge-likely">Likely no-show</span>' : '<span class="badge badge-booked">Not yet arrived</span>';
      }

      async function renderSearch() {
        const q = document.getElementById('searchBox').value;
        const box = document.getElementById('searchResults');
        document.getElementById('clearSearchBtn').style.display = q.trim() ? '' : 'none';
        if (!q.trim()) { box.innerHTML = ''; return; }
        const results = await Qlinic.searchBookedPatients(q);
        // The box fires on every keystroke with no debounce, so a slower
        // response for an earlier character can resolve after a later
        // (or empty) one already rendered. Discard it if the input has
        // since moved on, otherwise it stomps the newer/cleared state.
        if (document.getElementById('searchBox').value !== q) return;
        if (results.length === 0) {
          box.innerHTML = '<div class="empty-state">No match for "' + Qlinic.escapeHtml(q) + '" in today\'s queue. Add them as a walk-in instead.</div>';
          return;
        }
        const doctorById = Object.fromEntries(doctorsCache.map((d) => [d.id, d]));
        box.innerHTML = `
          <table class="qtable">
            <thead><tr><th>Name</th><th>Phone</th><th>Doctor</th><th>Booked</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${results.map((p) => {
                const doc = doctorById[p.doctorId];
                // Checks type, not bookedTime truthiness — a walk-in can
                // now carry a real bookedTime too (a staff-assigned
                // preferred time), which must still read as "Walk-in"
                // here, not silently look like a formal appointment.
                const bookedCell = p.type === 'appointment' ? Qlinic.formatTime(Qlinic.parseTime(p.bookedTime)) : '<span class="badge badge-neutral">Walk-in</span>';
                if (editingSearchPatientId === p.id) {
                  const doctorOptions = doctorsCache.map((d) => `<option value="${d.id}" ${d.id === p.doctorId ? 'selected' : ''}>${Qlinic.escapeHtml(d.name)}</option>`).join('');
                  const bookedEditCell = p.type === 'appointment'
                    ? `<input type="date" class="search-edit-date" value="${p.bookedDate || ''}" />
                       <div class="time-picker" id="searchEditTimePicker">
                         <button type="button" class="time-picker-trigger ${p.bookedTime ? '' : 'placeholder'}" id="searchEditTimeTrigger">
                           <span id="searchEditTimeTriggerText">${p.bookedTime ? Qlinic.formatTime(Qlinic.parseTime(p.bookedTime)) : 'Select a time'}</span><span class="time-picker-caret">▾</span>
                         </button>
                         <input type="hidden" class="search-edit-time" value="${p.bookedTime || ''}" />
                         <div class="time-picker-panel" id="searchEditTimePanel" style="display:none;"></div>
                       </div>`
                    : '<span class="badge badge-neutral">Walk-in</span>';
                  return `
                    <tr class="search-edit-row">
                      <td><input type="text" class="search-edit-name" value="${Qlinic.escapeHtml(p.name)}" /></td>
                      <td><input type="text" class="search-edit-phone" value="${Qlinic.escapeHtml(p.phone)}" /></td>
                      <td><select class="search-edit-doctor">${doctorOptions}</select></td>
                      <td>${bookedEditCell}</td>
                      <td>${searchStatusBadge(p)}</td>
                      <td>
                        <button class="btn-sm primary" onclick="doSaveSearchEdit('${p.id}')">Save</button>
                        <button class="btn-sm" onclick="doCancelSearchEdit()">Cancel</button>
                      </td>
                    </tr>
                  `;
                }
                return `
                  <tr>
                    <td>${nameCell(p)}</td>
                    <td>${Qlinic.escapeHtml(p.phone)}</td>
                    <td>${doc ? Qlinic.escapeHtml(doc.name) : '·'}</td>
                    <td>${bookedCell}</td>
                    <td>${searchStatusBadge(p)}</td>
                    <td>
                      ${p.status === 'booked' ? `<button class="btn-sm primary" onclick="doMarkArrived('${p.id}', this)">Mark arrived</button>` : ''}
                      <button class="btn-sm" onclick="doStartSearchEdit('${p.id}')">Edit</button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
        const editingPatient = results.find((p) => p.id === editingSearchPatientId);
        if (editingPatient && editingPatient.type === 'appointment') wireSearchEditTimePicker();
      }

      // Same 5-min-step dropdown as the main Appointment time field, wired
      // fresh each render since the row (and its DOM) is rebuilt every time
      // — no "now" restriction here, unlike the new-booking picker, since
      // this is fixing an existing booking's time, not scheduling a new one;
      // doSaveSearchEdit still hard-blocks saving an actually-past time.
      function wireSearchEditTimePicker() {
        const trigger = document.getElementById('searchEditTimeTrigger');
        const panel = document.getElementById('searchEditTimePanel');
        const hidden = document.querySelector('.search-edit-time');
        if (!trigger) return;
        const options = [];
        for (let m = clinicOpenMin; m < clinicCloseMin; m += 5) {
          const hh = String(Math.floor(m / 60)).padStart(2, '0');
          const mm = String(m % 60).padStart(2, '0');
          options.push({ value: `${hh}:${mm}`, label: Qlinic.formatTime(m) });
        }
        function renderPanel() {
          panel.innerHTML = options.map((o) => `
            <div class="time-picker-option ${o.value === hidden.value ? 'selected' : ''}" data-value="${o.value}" data-label="${o.label}">${o.label}</div>
          `).join('');
        }
        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
          renderPanel();
          panel.style.display = 'block';
          const sel = panel.querySelector('.selected') || panel.querySelector('.time-picker-option');
          if (sel) sel.scrollIntoView({ block: 'nearest' });
        });
        panel.addEventListener('click', (e) => {
          const opt = e.target.closest('.time-picker-option');
          if (!opt) return;
          hidden.value = opt.getAttribute('data-value');
          document.getElementById('searchEditTimeTriggerText').textContent = opt.getAttribute('data-label');
          trigger.classList.remove('placeholder');
          panel.style.display = 'none';
        });
      }

      function doStartSearchEdit(id) {
        editingSearchPatientId = id;
        renderSearch();
      }
      function doCancelSearchEdit() {
        editingSearchPatientId = null;
        renderSearch();
      }
      async function doSaveSearchEdit(id) {
        const row = document.querySelector(`[onclick*="doSaveSearchEdit('${id}')"]`).closest('tr');
        const name = row.querySelector('.search-edit-name').value.trim();
        const phone = row.querySelector('.search-edit-phone').value.trim();
        if (!name || !phone) { showToast('Name and phone are both required'); return; }
        if (!isValidPhone(phone)) { showToast('Enter a valid 10-digit phone number'); return; }
        const doctorSelect = row.querySelector('.search-edit-doctor');
        const update = { name, phone, doctorId: doctorSelect.value };
        const dateInput = row.querySelector('.search-edit-date');
        const timeInput = row.querySelector('.search-edit-time');
        if (dateInput && timeInput) {
          const bookedDate = dateInput.value;
          const bookedTime = timeInput.value;
          if (!bookedDate || !bookedTime) { showToast('Appointment date and time are both required'); return; }
          if (Qlinic.isPastRealDateTime(bookedDate, bookedTime)) { showToast("Can't set an appointment time that's already passed"); return; }
          const bookedDateReason = closureReason(bookedDate);
          if (bookedDateReason) { showToast(`${bookedDateReason} — choose a different date`); return; }
          update.bookedDate = bookedDate;
          update.bookedTime = bookedTime;
        }
        await Qlinic.updatePatientContact(id, update);
        editingSearchPatientId = null;
        showToast('Patient details updated');
        renderSearch();
        renderQueues();
      }
      window.doStartSearchEdit = doStartSearchEdit;
      window.doCancelSearchEdit = doCancelSearchEdit;
      window.doSaveSearchEdit = doSaveSearchEdit;

      // Disabling the button the instant it's clicked (rather than waiting
      // for the async round-trip to finish) is what actually fixed the
      // shaky/bouncy feel reported here: while the button stayed enabled
      // during the network wait, the cursor sitting over it kept the
      // hover-lift transform active, which then snapped away the moment the
      // table re-rendered out from under it — reads as a jolt, not a click.
      async function doMarkArrived(id, btn) {
        if (btn) btn.disabled = true;
        await Qlinic.markArrived(id);
        // Search results used to be cleared here on the assumption
        // reception was done once one patient was marked — but working
        // through a whole batch of arrivals means re-typing the same
        // search after every single click. Leaving the query in place
        // just re-renders the same results with the updated status, so
        // the rest of the matches stay right where they were.
        renderSearch();
        renderQueues();
        showToast('Marked arrived, added to the live queue');
      }

      async function doMarkNoShow(id) {
        if (confirm('Mark this patient as a no-show?')) {
          await Qlinic.markNoShow(id);
          renderQueues();
          showToast('Marked as no-show');
        }
      }
      window.doMarkArrived = doMarkArrived;
      window.doMarkNoShow = doMarkNoShow;

      function startEditInvoice(invoiceId) {
        editingInvoiceId = invoiceId;
        renderQueues();
      }
      function cancelInvoiceEdit() {
        editingInvoiceId = null;
        renderQueues();
      }
      async function saveInvoiceEdit(invoiceId) {
        const row = document.querySelector(`[onclick*="saveInvoiceEdit('${invoiceId}')"]`).closest('td');
        const feeType = row.querySelector('.adj-fee-type').value;
        const paymentMode = row.querySelector('.adj-payment-mode').value;
        const amountReceived = row.querySelector('.adj-amount-received').value;
        await Qlinic.updateInvoicePayment({ invoiceId, feeType, paymentMode, amountReceived });
        editingInvoiceId = null;
        showToast('Billing updated');
        renderQueues();
      }
      window.startEditInvoice = startEditInvoice;
      window.cancelInvoiceEdit = cancelInvoiceEdit;
      window.saveInvoiceEdit = saveInvoiceEdit;

      // A dropdown per doctor (mirroring the "Viewing as" pattern on the
      // Doctor View page) instead of stacking every doctor's full queue on
      // the page. Counts shown reflect whichever date is currently selected.
      async function fillQueueDoctorFilter() {
        const sel = document.getElementById('queueDoctorFilter');
        const doctors = doctorsCache;
        if (!queueDoctorId || !doctors.find((d) => d.id === queueDoctorId)) {
          queueDoctorId = doctors.length ? doctors[0].id : null;
        }
        const queues = await Promise.all(doctors.map((d) => Qlinic.getQueueForDoctor(d.id, queueViewDate)));
        const isToday = queueViewDate === Qlinic.getTodayDate();
        sel.innerHTML = doctors.map((d, i) => {
          const q = queues[i];
          const countLabel = isToday ? `${q.waiting.length} waiting, ${q.booked.length} booked` : `${q.booked.length} booked`;
          return `<option value="${d.id}" ${d.id === queueDoctorId ? 'selected' : ''}>${Qlinic.escapeHtml(d.name)}, ${Qlinic.escapeHtml(d.specialty)} (${countLabel})</option>`;
        }).join('');
      }

      document.getElementById('queueDoctorFilter').addEventListener('change', (e) => {
        queueDoctorId = e.target.value;
        bookedExpanded = false;
        bookedPage = 0;
        waitingPage = 0;
        renderQueues();
      });

      document.getElementById('queueDateFilter').addEventListener('change', (e) => {
        queueViewDate = e.target.value || Qlinic.getTodayDate();
        bookedExpanded = false;
        bookedPage = 0;
        waitingPage = 0;
        renderQueues();
      });

      document.getElementById('queueTodayBtn').addEventListener('click', () => {
        queueViewDate = Qlinic.getTodayDate();
        document.getElementById('queueDateFilter').value = queueViewDate;
        bookedExpanded = false;
        bookedPage = 0;
        waitingPage = 0;
        renderQueues();
      });

      async function renderQueues() {
        const myToken = ++queueRenderToken;
        await refreshDoctorsCache();
        if (myToken !== queueRenderToken) return;
        renderClosedDayBanner();
        updateDoctorClosedHint();
        if (!queueViewDate) queueViewDate = Qlinic.getTodayDate();
        document.getElementById('queueDateFilter').value = queueViewDate;

        const panelEl = document.getElementById('queuePanel');
        if (doctorsCache.length === 0) {
          panelEl.innerHTML = '<div class="panel"><div class="empty-state">No doctors set up yet. Add one from the <a href="dashboard.html">Dashboard</a> first.</div></div>';
          document.getElementById('queueDoctorFilter').innerHTML = '';
          return;
        }

        await fillQueueDoctorFilter();
        if (myToken !== queueRenderToken) return;
        if (!queueDoctorId) { panelEl.innerHTML = ''; return; }

        const isTodayView = queueViewDate === Qlinic.getTodayDate();
        const doctor = doctorsCache.find((d) => d.id === queueDoctorId);
        const queue = await Qlinic.getQueueForDoctor(queueDoctorId, queueViewDate);
        if (myToken !== queueRenderToken) return;

        const invoiceByPatientId = {};
        if (canBill && isTodayView) {
          todayInvoices = await Qlinic.getTodayInvoices();
          if (myToken !== queueRenderToken) return;
          todayInvoices.forEach((inv) => { if (inv.patientId) invoiceByPatientId[inv.patientId] = inv; });
        }

        // Both lists paginate at 10/page now — a busy clinic's Waiting
        // list can run just as long as Booked once appointments pile up,
        // and an unbounded table here was the same problem in a list
        // reception is actively working from minute to minute, not just
        // scanning. Search (renderSearch, above) is unaffected either
        // way: it queries the server directly, not this paginated slice.
        const totalWaitingPages = Math.max(1, Math.ceil(queue.waiting.length / WAITING_PAGE_SIZE));
        if (waitingPage >= totalWaitingPages) waitingPage = 0;
        const waitingPageItems = queue.waiting.slice(waitingPage * WAITING_PAGE_SIZE, waitingPage * WAITING_PAGE_SIZE + WAITING_PAGE_SIZE);

        const totalBookedPages = Math.max(1, Math.ceil(queue.booked.length / BOOKED_PAGE_SIZE));
        if (bookedPage >= totalBookedPages) bookedPage = 0;
        const bookedPageItems = queue.booked.slice(bookedPage * BOOKED_PAGE_SIZE, bookedPage * BOOKED_PAGE_SIZE + BOOKED_PAGE_SIZE);
        const likelyCount = queue.booked.filter((p) => p.likelyNoShow).length;
        const dateLabel = Qlinic.formatDateLabel(queueViewDate);

        panelEl.innerHTML = `
          <div class="panel accent-${accentForDoctor(queueDoctorId)}">
            <div class="panel-header"><span class="board-doc-dot dot-${accentForDoctor(queueDoctorId)}"></span><h2>${Qlinic.escapeHtml(doctor.name)}, ${Qlinic.escapeHtml(doctor.specialty)}</h2><span class="date-pill">${dateLabel}</span><button type="button" class="btn-sm primary" id="exportCsvBtn">Export CSV</button></div>
            ${isTodayView ? `
              ${queue.nowServing ? `<p style="font-size:14px;margin:0 0 14px;"><strong>Now with:</strong> ${Qlinic.escapeHtml(queue.nowServing.name)}</p>` : '<p style="font-size:14px;color:var(--grey-500);margin:0 0 14px;">No one in consultation right now.</p>'}

              <h3 style="font-size:14px;margin:0 0 8px;color:var(--grey-700);">Waiting (${queue.waiting.length}) <span class="order-note">· ordered by scheduled time, not arrival order</span></h3>
              ${queue.waiting.length === 0 ? '<div class="empty-state">No one waiting.</div>' : `
                <table class="qtable">
                  <thead><tr><th>#</th><th>Name</th><th>Type</th><th>Queue time</th>${canBill ? '<th>Billing</th>' : ''}</tr></thead>
                  <tbody>
                    ${waitingPageItems.map((p) => `
                      <tr>
                        <td>${p.position}</td>
                        <td>${nameCell(p)}</td>
                        <td>${p.type === 'appointment' ? 'Appointment' : 'Walk-in'}</td>
                        <td>${queueTimeCell(p)}</td>
                        ${canBill ? `<td>${billingCell(p, invoiceByPatientId, doctor)}</td>` : ''}
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
                ${totalWaitingPages > 1 ? `
                  <div class="pager">
                    <button type="button" class="btn-sm" id="waitingPrevBtn" ${waitingPage === 0 ? 'disabled' : ''}>‹ Prev</button>
                    <span class="pager-label">Page ${waitingPage + 1} of ${totalWaitingPages}</span>
                    <button type="button" class="btn-sm" id="waitingNextBtn" ${waitingPage >= totalWaitingPages - 1 ? 'disabled' : ''}>Next ›</button>
                  </div>
                ` : ''}
              `}
            ` : `
              <p class="panel-note">Live queue details (now serving, waiting) only apply to today: this is showing what's booked for ${dateLabel}.</p>
            `}

            <div class="booked-section">
              <button type="button" class="booked-toggle" id="bookedToggleBtn" aria-expanded="${bookedExpanded}">
                <span>${bookedExpanded ? '▾' : '▸'} Booked${isTodayView ? ', not yet arrived' : ''} (${queue.booked.length})</span>
                ${likelyCount > 0 ? `<span class="badge badge-likely">${likelyCount} likely no-show</span>` : ''}
              </button>
              <div class="booked-body" style="display:${bookedExpanded ? 'block' : 'none'};">
                ${queue.booked.length === 0 ? `<div class="empty-state">${isTodayView ? 'Everyone booked has arrived.' : 'Nothing booked for ' + dateLabel + '.'}</div>` : `
                  <table class="qtable">
                    <thead><tr><th>Name</th><th>Booked</th><th>Status</th>${isTodayView ? '<th></th>' : ''}</tr></thead>
                    <tbody>
                      ${bookedPageItems.map((p) => `
                        <tr>
                          <td>${nameCell(p)}</td>
                          <td>${Qlinic.formatTime(Qlinic.parseTime(p.bookedTime))}</td>
                          <td>${p.likelyNoShow ? '<span class="badge badge-likely">Likely no-show</span>' : '<span class="badge badge-booked">Expected</span>'}</td>
                          ${isTodayView ? `
                            <td>
                              <button class="btn-sm primary" onclick="doMarkArrived('${p.id}', this)">Mark arrived</button>
                              <button class="btn-sm danger" onclick="doMarkNoShow('${p.id}')">No-show</button>
                            </td>
                          ` : ''}
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                  ${totalBookedPages > 1 ? `
                    <div class="pager">
                      <button type="button" class="btn-sm" id="bookedPrevBtn" ${bookedPage === 0 ? 'disabled' : ''}>‹ Prev</button>
                      <span class="pager-label">Page ${bookedPage + 1} of ${totalBookedPages}</span>
                      <button type="button" class="btn-sm" id="bookedNextBtn" ${bookedPage >= totalBookedPages - 1 ? 'disabled' : ''}>Next ›</button>
                    </div>
                  ` : ''}
                `}
              </div>
            </div>
          </div>
        `;

        document.getElementById('exportCsvBtn').addEventListener('click', () => {
          const csv = buildQueueCsv(isTodayView, queue);
          const safeDoctor = doctor.name.replace(/[^a-z0-9]+/gi, '-');
          downloadCsv(`${safeDoctor}-${queueViewDate}.csv`, csv);
        });

        document.getElementById('bookedToggleBtn').addEventListener('click', () => {
          bookedExpanded = !bookedExpanded;
          renderQueues();
        });
        const prevBtn = document.getElementById('bookedPrevBtn');
        const nextBtn = document.getElementById('bookedNextBtn');
        if (prevBtn) prevBtn.addEventListener('click', () => { bookedPage = Math.max(0, bookedPage - 1); renderQueues(); });
        if (nextBtn) nextBtn.addEventListener('click', () => { bookedPage = Math.min(totalBookedPages - 1, bookedPage + 1); renderQueues(); });
        const waitingPrevBtn = document.getElementById('waitingPrevBtn');
        const waitingNextBtn = document.getElementById('waitingNextBtn');
        if (waitingPrevBtn) waitingPrevBtn.addEventListener('click', () => { waitingPage = Math.max(0, waitingPage - 1); renderQueues(); });
        if (waitingNextBtn) waitingNextBtn.addEventListener('click', () => { waitingPage = Math.min(totalWaitingPages - 1, waitingPage + 1); renderQueues(); });
      }

      document.getElementById('searchBox').addEventListener('input', renderSearch);
      document.getElementById('clearSearchBtn').addEventListener('click', () => {
        const box = document.getElementById('searchBox');
        box.value = '';
        renderSearch();
        box.focus();
      });

      // Delegated (not bound per-render) since the edit row's phone input
      // is rebuilt from scratch on every renderSearch() call.
      document.getElementById('searchResults').addEventListener('input', (e) => {
        if (e.target.classList.contains('search-edit-phone')) {
          e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10);
        }
        if (e.target.classList.contains('search-edit-name')) {
          e.target.value = e.target.value.replace(/[0-9]/g, '');
        }
      });

      // Same 10-digit-only rule as signup's mobile number field: strips
      // anything non-numeric as it's typed, so a pasted or typed letter
      // never even lands in the field, and blocks submission on anything
      // short of exactly 10 digits.
      function isValidPhone(value) {
        return /^[0-9]{10}$/.test(value);
      }
      document.getElementById('pPhone').addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 10);
      });

      document.getElementById('pName').addEventListener('input', function () {
        this.value = this.value.replace(/[0-9]/g, '');
      });

      document.getElementById('patientForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('pName').value;
        const phone = document.getElementById('pPhone').value;
        if (!isValidPhone(phone)) {
          const hint = document.getElementById('slotHint');
          hint.className = 'slot-hint error';
          hint.innerHTML = '⛔ Enter a valid 10-digit phone number.';
          document.getElementById('pPhone').focus();
          return;
        }
        const age = document.getElementById('pAge').value ? Number(document.getElementById('pAge').value) : null;
        const gender = document.getElementById('pGender').value;
        const address = document.getElementById('pAddress').value;
        const doctorId = document.getElementById('pDoctor').value;

        const doctorBlock = doctorBookingBlockReason();
        if (doctorBlock) {
          updateDoctorClosedHint();
          document.getElementById('pDoctor').focus();
          return;
        }

        let bookedForToday = true;

        if (patientMode === 'walkin') {
          const walkinTime = document.getElementById('pWalkinTime').value;
          if (walkinTime && Qlinic.isPastRealDateTime(Qlinic.getTodayDate(), walkinTime)) {
            const hint = document.getElementById('slotHint');
            hint.className = 'slot-hint error';
            hint.innerHTML = '⛔ That preferred time has already passed.';
            document.getElementById('pWalkinTimeTrigger').focus();
            return;
          }
          const isPriority = document.getElementById('pWalkinType').value === 'emergency';
          await Qlinic.addWalkIn({
            name, phone, age, gender, address, doctorId,
            reason: document.getElementById('pReason').value,
            bookedTime: walkinTime || null,
            isPriority,
          });
          showToast(isPriority ? 'Emergency walk-in added — seen first' : 'Walk-in added to the queue');
        } else {
          const date = document.getElementById('pDate').value;
          const time = document.getElementById('pTime').value;
          const dateReason = closureReason(date);
          if (dateReason) {
            updateClosedDayHint();
            document.getElementById('pDate').focus();
            return;
          }
          if (!time) {
            // Shown right in the form (not a corner toast that fades in
            // ~2s) since this is the single most common reason "Add
            // appointment" silently does nothing — a receptionist glancing
            // back at the button, not the far corner of the screen, needs
            // to see why nothing happened.
            const hint = document.getElementById('slotHint');
            hint.className = 'slot-hint error';
            hint.innerHTML = '⛔ Pick an appointment time first.';
            document.getElementById('pTimeTrigger').focus();
            return;
          }
          if (Qlinic.isPastRealDateTime(date, time)) {
            updateSlotHint();
            return;
          }
          const avail = await Qlinic.getSlotAvailability(doctorId, date, time);
          if (avail && avail.isFull && !confirm(`The ${Qlinic.formatTime(Qlinic.parseTime(avail.windowStart))}–${Qlinic.formatTime(Qlinic.parseTime(avail.windowEnd))} slot already has ${avail.count} patients booked (max ${avail.capacity}). The next open slot is ${Qlinic.formatTime(Qlinic.parseTime(avail.suggestion))}. Add anyway at the requested time?`)) {
            return;
          }
          await Qlinic.addAppointment({ name, phone, age, gender, address, doctorId, bookedDate: date, bookedTime: time, reason: document.getElementById('pReason').value });
          bookedForToday = date === Qlinic.getTodayDate();
          showToast(bookedForToday ? 'Appointment added' : `Appointment booked for ${Qlinic.formatDateLabel(date)} (${Qlinic.formatTime(Qlinic.parseTime(time))})`);
        }

        // Jump the queue view to whichever doctor this patient was just
        // added for, so reception immediately sees where they landed, but
        // only if they're actually on today's queue.
        if (bookedForToday) {
          queueDoctorId = doctorId;
          bookedExpanded = false;
          bookedPage = 0;
          waitingPage = 0;
        }

        e.target.reset();
        fillDoctorSelects();
        // A native form reset() sends <select id="pDoctor"> back to its
        // first option — whichever doctor reception was actually working
        // with a moment ago gets silently swapped out from under them on
        // the very next patient, which is the opposite of helpful when
        // they're adding several patients in a row for the same doctor.
        document.getElementById('pDoctor').value = doctorId;
        setPatientMode(patientMode);
        document.getElementById('pDate').value = Qlinic.getTodayDate();
        resetTimePicker();
        resetWalkinTimePicker();
        clearPatientLookupHint();
        clearFollowUpHint();
        updateClosedDayHint();
        updateDoctorClosedHint();
        renderQueues();
      });

      document.getElementById('pDoctor').addEventListener('change', () => {
        updateSlotHint();
        updateDoctorClosedHint();
      });
      document.getElementById('pDate').addEventListener('change', () => {
        resetTimePicker();
        updateSlotHint();
        updateClosedDayHint();
        updateDoctorClosedHint();
      });

      // Looking up the phone number on blur (not every keystroke) is a
      // passive heads-up, not a gate: it never blocks or auto-fills
      // anything on its own, reception has to click "Use these details"
      // to apply a match, and the no-show note is informational only.
      function clearPatientLookupHint() {
        const hint = document.getElementById('patientLookupHint');
        hint.style.display = 'none';
        hint.innerHTML = '';
      }
      async function checkPatientLookup() {
        const myToken = ++patientLookupToken;
        const phone = document.getElementById('pPhone').value.trim();
        const hint = document.getElementById('patientLookupHint');
        if (!phone) { clearPatientLookupHint(); return; }
        const match = await Qlinic.getPatientLookupByPhone(phone);
        if (myToken !== patientLookupToken) return;
        if (!match) { clearPatientLookupHint(); return; }
        const visitWord = match.visitsChecked === 1 ? 'visit' : 'visits';
        let html = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <span style="color:var(--accent);font-weight:600;">Found: ${Qlinic.escapeHtml(match.name)}, ${match.address ? Qlinic.escapeHtml(match.address) : 'no address on file'} &middot; ${match.visitsChecked} ${visitWord} on file</span>
          <button type="button" class="btn-sm" id="useLookupBtn">Use these details</button>
        </div>`;
        if (match.noShowCount >= 2) {
          html += `<div style="margin-top:8px;color:var(--warning);background:var(--warning-bg);padding:8px 12px;border-radius:8px;">⚠ Missed ${match.noShowCount} of their last ${match.visitsChecked} visits, consider confirming by call.</div>`;
        }
        hint.innerHTML = html;
        hint.style.display = 'block';
        document.getElementById('useLookupBtn').addEventListener('click', () => {
          document.getElementById('pName').value = match.name;
          document.getElementById('pGender').value = match.gender || 'other';
          document.getElementById('pAddress').value = match.address || '';
          if (match.age) document.getElementById('pAge').value = match.age;
          showToast('Details filled in');
        });
      }
      document.getElementById('pPhone').addEventListener('blur', checkPatientLookup);

      // Advisory only, same spirit as the no-show note above: tells
      // reception whether to expect payment, never blocks or auto-fills
      // anything. Needs phone + doctor + the actual visit date (today for
      // a walk-in, the picked date for an appointment) all present before
      // there's anything to check, so it re-runs on any of those changing.
      function clearFollowUpHint() {
        const hint = document.getElementById('followUpHint');
        hint.style.display = 'none';
        hint.innerHTML = '';
      }
      async function checkFollowUpHint() {
        const myToken = ++followUpHintToken;
        const hint = document.getElementById('followUpHint');
        const phone = document.getElementById('pPhone').value.trim();
        const doctorId = document.getElementById('pDoctor').value;
        const visitDate = patientMode === 'walkin' ? Qlinic.getTodayDate() : document.getElementById('pDate').value;
        if (!phone || !doctorId || !visitDate) { clearFollowUpHint(); return; }
        const result = await Qlinic.checkFollowUpEligibility({ doctorId, phone, visitDate });
        if (myToken !== followUpHintToken) return;
        if (!result) { clearFollowUpHint(); return; }
        const doctor = doctorsCache.find((d) => d.id === doctorId);
        const doctorName = doctor ? Qlinic.escapeHtml(doctor.name) : 'this doctor';
        const lastVisitLabel = Qlinic.formatDateLabel(result.lastVisitDate);
        if (result.eligible) {
          hint.className = 'slot-hint ok';
          hint.innerHTML = `✓ Follow-up visit — no consultation fee needed (last seen by ${doctorName} on ${lastVisitLabel}, within the ${result.bufferDays}-day window).`;
        } else {
          hint.className = 'slot-hint warn';
          hint.innerHTML = `⚠ Outside the follow-up window (last seen by ${doctorName} on ${lastVisitLabel}) — consultation fee applies.`;
        }
        hint.style.display = 'block';
      }
      document.getElementById('pPhone').addEventListener('blur', checkFollowUpHint);
      document.getElementById('pDoctor').addEventListener('change', checkFollowUpHint);
      document.getElementById('pDate').addEventListener('change', checkFollowUpHint);

      const [clinic, closures] = await Promise.all([Qlinic.getClinic(), Qlinic.getClinicClosures()]);
      document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
      if (clinic && clinic.logo_url) {
        document.getElementById('clinicLogoThumb').src = clinic.logo_url;
        document.getElementById('clinicLogoThumb').style.display = 'block';
      } else {
        document.getElementById('clinicLogoThumb').style.display = 'none';
      }
      if (clinic) {
        if (clinic.opening_time) clinicOpenMin = Qlinic.parseTime(clinic.opening_time);
        if (clinic.closing_time) clinicCloseMin = Qlinic.parseTime(clinic.closing_time);
        clinicWeeklyOffDays = clinic.weekly_off_days || [];
      }
      clinicClosureByDate = Object.fromEntries(closures.map((c) => [c.date, c.note]));
      document.getElementById('clockTime').textContent = Qlinic.formatTimestamp(new Date());
      // Also re-checks the closed-day banner/hint on this same tick: they're
      // time-bound to midnight (see isDoctorClosedToday), and without a
      // doctor/patient row actually changing, nothing else would trigger a
      // re-render right at the moment the calendar date rolls over.
      setInterval(() => {
        document.getElementById('clockTime').textContent = Qlinic.formatTimestamp(new Date());
        renderClosedDayBanner();
        updateDoctorClosedHint();
      }, 30000);
      document.getElementById('pDate').min = Qlinic.getTodayDate();
      document.getElementById('pDate').value = Qlinic.getTodayDate();
      updateClosedDayHint();

      await refreshDoctorsCache();
      fillDoctorSelects();
      setPatientMode('appointment');
      renderQueues();

      Qlinic.onLiveChange(() => {
        renderSearch();
        renderQueues();
      });
    })();
  </script>
  <script>
    (function () {
      function applyTime(root) {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours() % 12;
        const sec = root.querySelector(".clock-sec");
        const min = root.querySelector(".clock-min");
        const hour = root.querySelector(".clock-hour");
        if (sec) sec.style.transform = `rotate(${s * 6}deg)`;
        if (min) min.style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
        if (hour) hour.style.transform = `rotate(${h * 30 + m * 0.5}deg)`;
      }
      function tickAll() {
        document.querySelectorAll(".clock-face").forEach(applyTime);
      }
      tickAll();
      setInterval(tickAll, 1000);
    })();
  </script>

</body>
</html>
