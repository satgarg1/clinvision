                          ${isTodayView ? `
                            <td class="actions-cell">
                              <button class="btn-sm primary" onclick="doMarkArrived('${p.id}', this)">Mark arrived</button>
                              <button class="btn-sm danger" onclick="doMarkNoShow('${p.id}')">No-show</button>
                            </td>
                          ` : ''}
                        </tr>
                      `;
                      }).join('')}
                    </tbody>
                  </table>
                  <div id="bookedPagerWrap">${Qlinic.pagerHtml(bookedPage + 1, totalBookedPages)}</div>
                `}
              </div>
            </div>
          </div>
        `;

        document.getElementById('bookedToggleBtn').addEventListener('click', () => {
          bookedExpanded = !bookedExpanded;
          renderQueuePanel();
        });
        Qlinic.wirePager(document.getElementById('bookedPagerWrap'), bookedPage + 1, totalBookedPages, (p) => { bookedPage = p - 1; renderQueuePanel(); });
        Qlinic.wirePager(document.getElementById('waitingPagerWrap'), waitingPage + 1, totalWaitingPages, (p) => { waitingPage = p - 1; renderQueuePanel(); });
      }

      // Debounced: renderSearch hits the database (searchBookedPatients),
      // so firing it on every keystroke meant a query per letter typed.
      // Clearing still calls renderSearch() directly, below, for instant
      // feedback on a deliberate single action rather than rapid typing.
      let searchInputTimer = null;
      document.getElementById('searchBox').addEventListener('input', () => {
        clearTimeout(searchInputTimer);
        searchInputTimer = setTimeout(renderSearch, 300);
      });
      document.getElementById('clearSearchBtn').addEventListener('click', () => {
        clearTimeout(searchInputTimer);
        const box = document.getElementById('searchBox');
        box.value = '';
        renderSearch();
        box.focus();
      });

// Same 10-digit-only rule as signup's mobile number field: strips
      // anything non-numeric as it's typed, so a pasted or typed letter
      // never even lands in the field, and blocks submission on anything
      // short of exactly 10 digits.
      function isValidPhone(value) {
        return /^[0-9]{10}$/.test(value);
      }
      document.getElementById('pPhone').addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 10);
      });

      // Optional field — blank is valid (age just wasn't given). Anything
      // actually entered has to be a whole number 0-120, checked as they
      // type rather than only discovered after Add is pressed.
      function isValidAge(value) {
        if (value === '') return true;
        return /^[0-9]+$/.test(value) && Number(value) <= 120;
      }
      document.getElementById('pAge').addEventListener('input', function () {
        document.getElementById('ageError').style.display = isValidAge(this.value) ? 'none' : '';
      });

      document.getElementById('pName').addEventListener('input', function () {
        this.value = this.value.replace(/[0-9]/g, '');
      });

      document.getElementById('patientForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('pName').value;
        const phone = document.getElementById('pPhone').value;
        if (!isValidPhone(phone)) {
          const hint = document.getElementById('slotHint');
          hint.className = 'slot-hint error';
          hint.innerHTML = '⛔ Enter a valid 10-digit phone number.';
          document.getElementById('pPhone').focus();
          return;
        }
        const ageInput = document.getElementById('pAge');
        if (!isValidAge(ageInput.value)) {
          document.getElementById('ageError').style.display = '';
          ageInput.focus();
          return;
        }
        const age = ageInput.value ? Number(ageInput.value) : null;
        const gender = document.getElementById('pGender').value;
        const address = document.getElementById('pAddress').value;
        const doctorId = document.getElementById('pDoctor').value;

        const doctorBlock = doctorBookingBlockReason();
        if (doctorBlock) {
          updateDoctorClosedHint();
          document.getElementById('pDoctor').focus();
          return;
        }

        let bookedForToday = true;

        if (patientMode === 'walkin') {
          const walkinTime = document.getElementById('pWalkinTime').value;
          if (walkinTime && Qlinic.isPastRealDateTime(Qlinic.getTodayDate(), walkinTime)) {
            const hint = document.getElementById('slotHint');
            hint.className = 'slot-hint error';
            hint.innerHTML = '⛔ That preferred time has already passed.';
            document.getElementById('pWalkinTimeTrigger').focus();
            return;
          }
          const isPriority = document.getElementById('pWalkinType').value === 'emergency';
          // Uncaught before — a DB-side rejection (e.g. a constraint
          // violation) failed completely silently: no toast, no error,
          // "Add walk-in" just did nothing no matter how many times it
          // was clicked. Now it's at least visible when it happens.
          let addResult;
          try {
            addResult = await Qlinic.addWalkIn({
              name, phone, age, gender, address, doctorId,
              reason: document.getElementById('pReason').value,
              bookedTime: walkinTime || null,
              isPriority,
            });
          } catch (err) {
            showToast(err.message || 'Could not add the walk-in — please try again.');
            return;
          }
          showToast(isPriority ? 'Emergency walk-in added — seen first' : 'Walk-in added to the queue');
          renderNotificationPreview(addResult.message);
        } else {
          const date = document.getElementById('pDate').value;
          const time = document.getElementById('pTime').value;
          const dateReason = closureReason(date, doctorId);
          if (dateReason) {
            updateClosedDayHint();
            document.getElementById('pDate').focus();
            return;
          }
          if (!time) {
            // Shown right in the form (not a corner toast that fades in
            // ~2s) since this is the single most common reason "Add
            // appointment" silently does nothing — a receptionist glancing
            // back at the button, not the far corner of the screen, needs
            // to see why nothing happened.
            const hint = document.getElementById('slotHint');
            hint.className = 'slot-hint error';
            hint.innerHTML = '⛔ Pick an appointment time first.';
            document.getElementById('pTimeTrigger').focus();
            return;
          }
          if (Qlinic.isPastRealDateTime(date, time)) {
            updateSlotHint();
            return;
          }
          const avail = await Qlinic.getSlotAvailability(doctorId, date, time);
          if (avail && avail.isFull && !(await Qlinic.confirmDialog({
            message: `The ${Qlinic.formatTime(Qlinic.parseTime(avail.windowStart))}–${Qlinic.formatTime(Qlinic.parseTime(avail.windowEnd))} slot already has ${avail.count} patients booked (max ${avail.capacity}). The next open slot is ${Qlinic.formatTime(Qlinic.parseTime(avail.suggestion))}.`,
            confirmLabel: 'Add at requested time',
            cancelLabel: 'Cancel',
          }))) {
            return;
          }
          let addResult;
          try {
            addResult = await Qlinic.addAppointment({ name, phone, age, gender, address, doctorId, bookedDate: date, bookedTime: time, reason: document.getElementById('pReason').value });
          } catch (err) {
            showToast(err.message || 'Could not add the appointment — please try again.');
            return;
          }
          bookedForToday = date === Qlinic.getTodayDate();
          showToast(bookedForToday ? 'Appointment added' : `Appointment booked for ${Qlinic.formatDateLabel(date)} (${Qlinic.formatTime(Qlinic.parseTime(time))})`);
          renderNotificationPreview(addResult.message);
        }

        // Jump the queue view to whichever doctor this patient was just
        // added for, so reception immediately sees where they landed, but
        // only if they're actually on today's queue.
        if (bookedForToday) {
          queueDoctorId = doctorId;
          bookedExpanded = false;
          bookedPage = 0;
          waitingPage = 0;
        }

        e.target.reset();
        fillDoctorSelects();
        // A native form reset() sends <select id="pDoctor"> back to its
        // first option — whichever doctor reception was actually working
        // with a moment ago gets silently swapped out from under them on
        // the very next patient, which is the opposite of helpful when
        // they're adding several patients in a row for the same doctor.
        document.getElementById('pDoctor').value = doctorId;
        setPatientMode(patientMode);
        document.getElementById('pDate').value = Qlinic.getTodayDate();
        resetTimePicker();
        resetWalkinTimePicker();
        clearPatientLookupHint();
        clearFollowUpHint();
        updateClosedDayHint();
        updateDoctorClosedHint();
        renderQueues();
      });

      document.getElementById('pDoctor').addEventListener('change', () => {
        updateSlotHint();
        updateDoctorClosedHint();
        updateClosedDayHint();
      });
      document.getElementById('pDate').addEventListener('change', () => {
        resetTimePicker();
        updateSlotHint();
        updateClosedDayHint();
        updateDoctorClosedHint();
      });

      // Sits beside the mode toggle (pushed to the far right via
      // margin-left:auto), not inside its own gradient-track pill - it's a
      // regular action button, not one of the toggle's own options -
      // rather than inside either mode's own field set, since this row is
      // the one thing always visible regardless of mode - a single
      // button, no per-mode duplication needed.
      document.getElementById('viewDaySlotsBtn').addEventListener('click', async () => {
        const doctorId = document.getElementById('pDoctor').value;
        if (!doctorId) { showToast('Pick a doctor first'); return; }
        const dateStr = patientMode === 'appointment'
          ? (document.getElementById('pDate').value || Qlinic.getTodayDate())
          : Qlinic.getTodayDate();
        const doctor = doctorsCache.find((d) => d.id === doctorId);
        const rows = await Qlinic.getDaySlotSchedule(doctorId, dateStr);
        await Qlinic.slotScheduleDialog({
          doctorName: doctor ? doctor.name : 'Doctor',
          dateLabel: Qlinic.formatDateLabel(dateStr),
          openMin: clinicOpenMin,
          closeMin: clinicCloseMin,
          // Falls back to 30 if migration 036 hasn't run yet — before it,
          // clinic.schedule_interval_mins is simply undefined.
          intervalMins: (clinic && clinic.schedule_interval_mins) || 30,
          isToday: dateStr === Qlinic.getTodayDate(),
          rows,
        });
      });

      // Looking up the phone number on blur (not every keystroke) is a
      // passive heads-up, not a gate: it never blocks or auto-fills
      // anything on its own, reception has to click "Use these details"
      // to apply a match, and the no-show note is informational only.
      function closePatientInfoPopover() {
        document.getElementById('patientInfoPopover').classList.remove('open');
        document.getElementById('patientInfoChipBtn').setAttribute('aria-expanded', 'false');
      }
      function hidePatientInfoChip() {
        document.getElementById('patientInfoWrap').style.display = 'none';
        closePatientInfoPopover();
      }
      function clearPatientLookupHint() {
        const hint = document.getElementById('patientLookupHint');
        hint.style.display = 'none';
        hint.innerHTML = '';
        hidePatientInfoChip();
      }

      // Same trigger + dropdown mechanics as Insights' own anomaly chip
      // (trends.html/revenue.html) -- re-themed amber and re-purposed
      // here, not a new interaction pattern for the app to learn.
      // Reuses the exact date format patient-directory.html already
      // shows this same data in (Qlinic.formatDateLabel), rather than
      // introducing a second convention for the same kind of date.
      function renderPatientInfoChip(match, phone) {
        const wrap = document.getElementById('patientInfoWrap');
        if (!match.recentVisits || match.recentVisits.length === 0) { hidePatientInfoChip(); return; }
        document.getElementById('patientInfoChipText').textContent =
          `Patient Info · ${match.totalVisits} ${match.totalVisits === 1 ? 'visit' : 'visits'}`;
        const rows = match.recentVisits.map((v) => {
          const doctor = doctorsCache.find((d) => d.id === v.doctorId);
          const doctorLabel = doctor ? `Dr. ${Qlinic.escapeHtml(doctor.name)}` : 'Doctor no longer on roster';
          return `<div class="pi-visit-row"><span class="pi-visit-date">${Qlinic.formatDateLabel(v.date)}</span><span class="pi-visit-doctor">${doctorLabel}</span></div>`;
        }).join('');
        document.getElementById('patientInfoPopover').innerHTML = `
          <div class="pi-eyebrow">Recent visits</div>
          <div class="pi-name">${Qlinic.escapeHtml(match.name)}</div>
          ${rows}
          <a href="patient-directory.html?phone=${encodeURIComponent(phone)}" class="pi-footer-link">View full history (${match.totalVisits} ${match.totalVisits === 1 ? 'visit' : 'visits'}) &rarr;</a>
        `;
        wrap.style.display = '';
      }

      async function checkPatientLookup() {
        const myToken = ++patientLookupToken;
        const phone = document.getElementById('pPhone').value.trim();
        const hint = document.getElementById('patientLookupHint');
        if (!phone) { clearPatientLookupHint(); return; }
        const match = await Qlinic.getPatientLookupByPhone(phone);
        if (myToken !== patientLookupToken) return;
        if (!match) { clearPatientLookupHint(); return; }
        const visitWord = match.totalVisits === 1 ? 'visit' : 'visits';
        let html = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <span style="color:var(--accent);font-weight:600;">Found: ${Qlinic.escapeHtml(match.name)}, ${match.address ? Qlinic.escapeHtml(match.address) : 'no address on file'} &middot; ${match.totalVisits} ${visitWord} on file</span>
          <button type="button" class="btn-sm primary" id="useLookupBtn">Use these details</button>
        </div>`;
        if (match.noShowCount >= 2) {
          html += `<div style="margin-top:8px;color:var(--warning);background:var(--warning-bg);padding:8px 12px;border-radius:8px;">⚠ Missed ${match.noShowCount} of their last ${match.visitsChecked} visits, consider confirming by call.</div>`;
        }
        hint.innerHTML = html;
        hint.style.display = 'block';
        document.getElementById('useLookupBtn').addEventListener('click', () => {
          document.getElementById('pName').value = match.name;
          document.getElementById('pGender').value = match.gender || 'other';
          document.getElementById('pAddress').value = match.address || '';
          if (match.age) document.getElementById('pAge').value = match.age;
          // Once clicked, this hint (the found-line, the button, and any
          // no-show warning alongside it) has done its one job -- nothing
          // left to say. Patient Info stays up on purpose: it's a
          // separate, still-useful reference (visit history), not part
          // of the autofill flow this hint was for.
          hint.style.display = 'none';
          hint.innerHTML = '';
        });
        renderPatientInfoChip(match, phone);
      }
      document.getElementById('pPhone').addEventListener('blur', checkPatientLookup);

      document.getElementById('patientInfoChipBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        const popover = document.getElementById('patientInfoPopover');
        const isOpen = popover.classList.toggle('open');
        document.getElementById('patientInfoChipBtn').setAttribute('aria-expanded', String(isOpen));
      });
      document.addEventListener('click', (e) => {
        if (!document.getElementById('patientInfoWrap').contains(e.target)) closePatientInfoPopover();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closePatientInfoPopover();
      });

      // Advisory only, same spirit as the no-show note above: tells
      // reception whether to expect payment, never blocks or auto-fills
      // anything. Needs phone + doctor + the actual visit date (today for
      // a walk-in, the picked date for an appointment) all present before
      // there's anything to check, so it re-runs on any of those changing.
      function clearFollowUpHint() {
        const hint = document.getElementById('followUpHint');
        hint.style.display = 'none';
        hint.innerHTML = '';
      }
      async function checkFollowUpHint() {
        const myToken = ++followUpHintToken;
        const hint = document.getElementById('followUpHint');
        const phone = document.getElementById('pPhone').value.trim();
        const doctorId = document.getElementById('pDoctor').value;
        const visitDate = patientMode === 'walkin' ? Qlinic.getTodayDate() : document.getElementById('pDate').value;
        if (!phone || !doctorId || !visitDate) { clearFollowUpHint(); return; }
        const result = await Qlinic.checkFollowUpEligibility({ doctorId, phone, visitDate });
        if (myToken !== followUpHintToken) return;
        if (!result) { clearFollowUpHint(); return; }
        const doctor = doctorsCache.find((d) => d.id === doctorId);
        const doctorName = doctor ? Qlinic.escapeHtml(doctor.name) : 'this doctor';
        const lastVisitLabel = Qlinic.formatDateLabel(result.lastVisitDate);
        if (result.eligible) {
          hint.className = 'slot-hint ok';
          hint.innerHTML = `✓ Follow-up visit — no consultation fee needed (last seen by ${doctorName} on ${lastVisitLabel}, within the ${result.bufferDays}-day window).`;
        } else {
          hint.className = 'slot-hint warn';
          hint.innerHTML = `⚠ Outside the follow-up window (last seen by ${doctorName} on ${lastVisitLabel}) — consultation fee applies.`;
        }
        hint.style.display = 'block';
      }
      document.getElementById('pPhone').addEventListener('blur', checkFollowUpHint);
      document.getElementById('pDoctor').addEventListener('change', checkFollowUpHint);
      document.getElementById('pDate').addEventListener('change', checkFollowUpHint);

      const [clinic, closures, doctorHolidays] = await Promise.all([Qlinic.getClinic(), Qlinic.getClinicClosures(), Qlinic.getDoctorHolidays()]);
      document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
      if (clinic && clinic.logo_url) {
        document.getElementById('clinicLogoThumb').src = clinic.logo_url;
        document.getElementById('clinicLogoThumb').style.display = 'block';
      } else {
        document.getElementById('clinicLogoThumb').style.display = 'none';
      }
      if (clinic) {
        if (clinic.opening_time) clinicOpenMin = Qlinic.parseTime(clinic.opening_time);
        if (clinic.closing_time) clinicCloseMin = Qlinic.parseTime(clinic.closing_time);
        clinicWeeklyOffDays = clinic.weekly_off_days || [];
      }
      clinicClosureByDate = Object.fromEntries(closures.map((c) => [c.date, c.note]));
      doctorHolidayByKey = Object.fromEntries(doctorHolidays.map((h) => [`${h.doctorId}::${h.date}`, h.note]));
      document.getElementById('clockTime').textContent = Qlinic.formatTimestamp(new Date());
      // Also re-checks the closed-day banner/hint on this same tick: they're
      // time-bound to midnight (see isDoctorClosedToday), and without a
      // doctor/patient row actually changing, nothing else would trigger a
      // re-render right at the moment the calendar date rolls over.
      // renderQueues() rides along too now — "Now with: X" (and the rest
      // of the queue view) previously only ever updated via
      // Qlinic.onLiveChange()'s Realtime subscription below, with no
      // fallback if a push got missed (a dropped socket, a reconnect
      // gap). Same "catches anything Realtime might miss" reasoning
      // queue.html/display.html already use for their own polls, just
      // riding this existing tick instead of a second timer. 15s, not
      // 30s: reception is what a patient standing at the desk is looking
      // at, so a missed push staying stuck for up to 30s reads as the
      // system being broken, not just a little behind.
      setInterval(() => {
        document.getElementById('clockTime').textContent = Qlinic.formatTimestamp(new Date());
        renderClosedDayBanner();
        updateDoctorClosedHint();
        renderQueues();
      }, 15000);
      document.getElementById('pDate').min = Qlinic.getTodayDate();
      document.getElementById('pDate').value = Qlinic.getTodayDate();
      updateClosedDayHint();

      await refreshDoctorsCache();
      fillDoctorSelects();
      setPatientMode('appointment');
      renderQueues();

      Qlinic.onLiveChange(() => {
        renderSearch();
        renderQueues();
      });
    })();
  </script>

</body>
</html>
