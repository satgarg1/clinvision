  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=138"></script>
  <script src="app-topbar.js?v=5"></script>
  <script>
    (async function () {
      if (!(await Qlinic.requireLogin('login.html'))) return;

      if (await Qlinic.isPharmacist()) { window.location.href = 'pharmacy.html'; return; }

      document.querySelector('a.brand').addEventListener('click', async (e) => {
        e.preventDefault();
        if (await Qlinic.confirmDialog({ message: "Going to the homepage will end your session here, you'll need to log in again to get back in." })) {
          window.location.href = 'index.html';
        }
      });

      const [amAdmin, amDoctor, myProfile] = await Promise.all([Qlinic.isAdmin(), Qlinic.isDoctor(), Qlinic.getMyProfile()]);
      const myDoctorId = amDoctor ? myProfile.doctorId : null;

      if (amDoctor) {
        document.getElementById('receptionNavLink').style.display = 'none';
        document.getElementById('billingNavLink').style.display = 'none';
        document.getElementById('displayNavLink').style.display = 'none';
      }
      if (!amAdmin) {
        document.getElementById('revenueNavLink').style.display = 'none';
      }
      if (!amAdmin && !amDoctor) {
        document.getElementById('trendsNavLink').style.display = 'none';
        document.getElementById('prescriptionsNavLink').style.display = 'none';
      }
      await Qlinic.applyFeatureNavGating();
      if (document.getElementById('displayNavLink').style.display === 'none') document.getElementById('liveQueueViewLink').style.display = 'none';
      document.body.style.visibility = 'visible';

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      let currentCards = [];
      document.getElementById('statCards').addEventListener('click', (e) => {
        const card = e.target.closest('.dash-kpi-card');
        if (!card) return;
        const c = currentCards[Number(card.getAttribute('data-idx'))];
        if (c && c.onClick) c.onClick();
      });

      function statusLabel(status) {
        return {
          on_time: 'Available',
          on_break: 'On a break',
          emergency: 'Emergency',
        }[status] || status;
      }

      function formatDurationLabel(mins) {
        if (mins < 60) return `${mins} min`;
        if (mins % 30 === 0) return `${mins / 60} hr`;
        return `${Math.floor(mins / 60)} hr ${mins % 60} min`;
      }

      // KPI card icon per the card's existing `accent` value -- purely a
      // display lookup, no effect on which cards render or their values.
      const ACCENT_ICON_PATHS = {
        teal: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
        coral: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
        sky: '<path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/>',
        blue: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
        purple: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
        indigo: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
        amber: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="6" x2="12" y2="12"/><line x1="16" y1="14" x2="12" y2="12"/>',
        pink: '<line x1="10" y1="2" x2="14" y2="2"/><line x1="12" y1="14" x2="15" y2="11"/><circle cx="12" cy="14" r="8"/>',
        rose: '<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="18" y1="8" x2="23" y2="13"/><line x1="23" y1="8" x2="18" y2="13"/>',
        cyan: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
        green: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
      };
      function kpiIconSvg(accent) {
        const path = ACCENT_ICON_PATHS[accent] || ACCENT_ICON_PATHS.blue;
        return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
      }
      // Purely decorative -- not a real chart of this metric's history,
      // just the visual language the approved mockup asked for.
      function kpiSparklineSvg(color) {
        return `<svg class="dash-kpi-sparkline" width="38" height="32" viewBox="0 0 50 38">
          <defs><linearGradient id="spark-${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.3"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/>
          </linearGradient></defs>
          <path d="M0,26 C6,20 10,28 16,17 C22,7 28,20 34,13 C40,7 44,14 50,9 L50,38 L0,38 Z" fill="url(#spark-${color.replace('#','')})"/>
          <path d="M0,26 C6,20 10,28 16,17 C22,7 28,20 34,13 C40,7 44,14 50,9" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/>
        </svg>`;
      }
      const ACCENT_HEX = { teal: '#0d9488', coral: '#f97316', sky: '#0284c7', blue: '#2563eb', purple: '#7c3aed', indigo: '#4f46e5', amber: '#f59e0b', pink: '#db2777', rose: '#be123c', cyan: '#0e7490', green: '#16a34a' };

      const AVATAR_ACCENTS = ['teal', 'coral', 'blue', 'purple', 'pink'];
      function avatarAccentFor(doctorId, doctors) {
        const idx = doctors.findIndex((d) => d.id === doctorId);
        return AVATAR_ACCENTS[Math.max(idx, 0) % AVATAR_ACCENTS.length];
      }

      // Free-text specialty -> an emoji. Rules are checked in order, so the
      // specific ones (lasik, gastro) sit before broader words they contain
      // (eye, ent). Anything unmatched falls back to a stethoscope, since a
      // clinic can type any specialty name.
      const SPECIALTY_EMOJI_RULES = [
        [/\bdent|tooth|teeth|orthodont/i, '\u{1F9B7}'],
        [/lasik|ophthal|eye|optom|retina/i, '\u{1F441}️'],
        [/neuro|brain/i, '\u{1F9E0}'],
        [/psych|\bmental\b|counsel/i, '\u{1F4AD}'],
        [/cardio|heart/i, '❤️'],
        [/pulmo|chest|lung|respir/i, '\u{1FAC1}'],
        [/gastro|stomach|digest|liver|hepat/i, '\u{1F37D}️'],
        [/endocrin|thyroid|hormon/i, '\u{1F9EC}'],
        [/diabet/i, '\u{1FA78}'],
        [/nephro|urolog|kidney/i, '\u{1F4A7}'],
        [/gyn|obstet|matern/i, '\u{1F930}'],
        [/pediatr|paediatr|child|neonat/i, '\u{1F476}'],
        [/derma|skin|cosmet|trich|hair/i, '\u{1F9F4}'],
        [/\bent\b|otolaryn|\bear\b|\bnose\b|throat/i, '\u{1F442}'],
        [/ortho|bone|joint|spine/i, '\u{1F9B4}'],
        [/physio|rehab|sports/i, '\u{1F4AA}'],
        [/surg/i, '\u{1F97C}'],
        [/onco|cancer/i, '\u{1F397}️'],
        [/anesth|anaesth/i, '\u{1F634}'],
        [/patholog|\blab\b|laborator/i, '\u{1F52C}'],
        [/diet|nutrition/i, '\u{1F957}'],
        [/ayurved|homeo|homoeo|naturo|unani/i, '\u{1F33F}'],
      ];
      function specialtyIconSvg(specialty) {
        const rule = SPECIALTY_EMOJI_RULES.find(([re]) => re.test(specialty || ''));
        return `<span class="dash-specialty-emoji" aria-hidden="true">${rule ? rule[1] : '\u{1FA7A}'}</span>`;
      }

      function greetingParts() {
        const hour = new Date().getHours();
        if (hour >= 5 && hour < 12) return {
          text: 'Good morning',
          icon: '<svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="#fbbf24"/><g stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="3.5"/><line x1="12" y1="20.5" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="3.5" y2="12"/><line x1="20.5" y1="12" x2="22.5" y2="12"/><line x1="4.7" y1="4.7" x2="6.1" y2="6.1"/><line x1="17.9" y1="17.9" x2="19.3" y2="19.3"/><line x1="17.9" y1="6.1" x2="19.3" y2="4.7"/><line x1="4.7" y1="19.3" x2="6.1" y2="17.9"/></g></svg>',
        };
        if (hour >= 12 && hour < 17) return {
          text: 'Good afternoon',
          icon: '<svg width="28" height="28" viewBox="0 0 24 24"><circle cx="9" cy="10" r="4.5" fill="#fbbf24"/><g stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"><line x1="9" y1="2" x2="9" y2="3.5"/><line x1="2" y1="10" x2="3.5" y2="10"/><line x1="3.4" y1="4.4" x2="4.5" y2="5.5"/></g><path d="M4 19a5 5 0 0 1 5-5c.4 0 .8 0 1.2.1A6 6 0 0 1 22 17a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="#e2e8f0"/></svg>',
        };
        return {
          text: 'Good evening',
          icon: '<svg width="28" height="28" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" fill="#818cf8"/></svg>',
        };
      }

      const ACCENT_COLORS = ['teal', 'blue', 'purple', 'coral', 'pink'];
      function accentForDoctor(doctorId, doctors) {
        const idx = doctors.findIndex((d) => d.id === doctorId);
        return ACCENT_COLORS[Math.max(idx, 0) % ACCENT_COLORS.length];
      }

      function renderHolidayChip(upcoming, doctors) {
        const wrap = document.getElementById('holidayChipWrap');
        if (upcoming.length === 0) {
          wrap.style.display = 'none';
          closeHolidayPopover();
          return;
        }
        wrap.style.display = '';
        const next = upcoming[0];
        document.getElementById('holidayChipText').textContent =
          upcoming.length === 1
            ? `${Qlinic.formatDateLabel(next.date)} — ${next.name}`
            : `${upcoming.length} upcoming`;
        document.getElementById('holidayPopover').innerHTML = `
          <div class="holiday-popover-header">${upcoming.length} upcoming holiday${upcoming.length === 1 ? '' : 's'}</div>
          ${upcoming.map((h, i) => `
            <div class="holiday-row ${i === 0 ? 'soonest' : ''}">
              ${h.role === 'doctor'
                ? `<span class="board-doc-dot dot-${accentForDoctor(h.doctorId, doctors)}"></span>`
                : `<span class="role-tag ${h.role === 'admin' ? 'admin' : 'reception'}">${h.role === 'admin' ? 'Admin' : 'Reception'}</span>`}
              <div class="info">
                <div class="doc-name">${Qlinic.escapeHtml(h.name)}</div>
                ${h.note ? `<div class="doc-note">${Qlinic.escapeHtml(h.note)}</div>` : ''}
              </div>
              <span class="date-badge">${Qlinic.escapeHtml(Qlinic.formatDateLabel(h.date))}</span>
            </div>
          `).join('')}
          <div class="holiday-popover-footer"><a href="doctor-holidays.html">Manage in Team Holidays →</a></div>
        `;
      }
      function roleLabelFor(role) { return role === 'admin' ? 'Admin' : role === 'doctor' ? 'Doctor' : 'Reception'; }
      function personHeadingPhrase(p) {
        return p.role === 'doctor' ? `Dr. ${p.name}` : `${p.name} (${roleLabelFor(p.role)})`;
      }
      function showHolidayPopup(people) {
        const heading = people.length === 1
          ? `${personHeadingPhrase(people[0])} is on holiday today.`
          : people.length === 2
          ? `${personHeadingPhrase(people[0])} and ${personHeadingPhrase(people[1])} are on holiday today.`
          : `${people.length} team members are on holiday today — see who below.`;
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        backdrop.innerHTML = `
          <div class="modal-card holiday-popup-modal" role="alertdialog" aria-modal="true">
            <div class="holiday-popup-icon" aria-hidden="true">🗓️</div>
            <h2 class="modal-title">${Qlinic.escapeHtml(heading)}</h2>
            <div class="holiday-popup-who">
              ${people.map((p) => `
                <div class="holiday-popup-who-row">
                  <span class="role-tag ${p.role === 'admin' ? 'admin' : p.role === 'doctor' ? 'doctor' : 'reception'}">${roleLabelFor(p.role)}</span>
                  <span class="holiday-popup-who-name">${Qlinic.escapeHtml(p.role === 'doctor' ? 'Dr. ' + p.name : p.name)}</span>
                </div>
              `).join('')}
            </div>
            <button type="button" class="btn-sm primary" id="holidayPopupDismiss" style="width:100%;">Got it</button>
          </div>
        `;
        document.body.appendChild(backdrop);
        function cleanup() {
          backdrop.remove();
          document.removeEventListener('keydown', onKeydown);
        }
        function onKeydown(e) { if (e.key === 'Escape') cleanup(); }
        document.addEventListener('keydown', onKeydown);
        backdrop.addEventListener('click', (e) => { if (e.target === backdrop) cleanup(); });
        backdrop.querySelector('#holidayPopupDismiss').addEventListener('click', cleanup);
        backdrop.querySelector('#holidayPopupDismiss').focus();
      }

      function closeHolidayPopover() {
        document.getElementById('holidayPopover').classList.remove('open');
        document.getElementById('holidayChipBtn').setAttribute('aria-expanded', 'false');
      }
      document.getElementById('holidayChipBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        const popover = document.getElementById('holidayPopover');
        const isOpen = popover.classList.toggle('open');
        document.getElementById('holidayChipBtn').setAttribute('aria-expanded', String(isOpen));
      });
      document.addEventListener('click', (e) => {
        if (!document.getElementById('holidayChipWrap').contains(e.target)) closeHolidayPopover();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeHolidayPopover();
      });

      function pad2(n) { return String(n).padStart(2, '0'); }
      function toDateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }

      function percentChip(todayVal, yesterdayVal, higherIsGood) {
        if (!yesterdayVal || todayVal == null) return null;
        const pct = Math.round(((todayVal - yesterdayVal) / yesterdayVal) * 100);
        if (pct === 0) return null;
        const isIncrease = pct > 0;
        return { text: `${Math.abs(pct)}%`, arrow: isIncrease ? '▲' : '▼', good: isIncrease === higherIsGood };
      }
      function minuteChip(todayVal, yesterdayVal, higherIsGood) {
        if (todayVal == null || yesterdayVal == null) return null;
        const diff = Math.round(todayVal - yesterdayVal);
        if (diff === 0) return null;
        const isIncrease = diff > 0;
        return { text: `${Math.abs(diff)} min`, arrow: isIncrease ? '▲' : '▼', good: isIncrease === higherIsGood };
      }

      function updateDateTimeLabel() {
        const dateLabel = new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('todayDateTimeLabel').textContent = `${dateLabel}, ${Qlinic.formatTimestamp(new Date())}`;
      }

      async function render() {
        updateDateTimeLabel();
        const greeting = greetingParts();
        document.getElementById('greetingIcon').innerHTML = greeting.icon;


        if (amDoctor && !myDoctorId) {
          document.getElementById('statCards').innerHTML = '';
          document.getElementById('doctorStatusList').innerHTML =
            '<div class="empty-state">Your account isn\'t linked to a doctor profile yet — ask your admin to link it from Team settings.</div>';
          return;
        }

        const cutoffYesterday = new Date(Date.now() - 24 * 3600000);
        const yesterdayStr = toDateStr(cutoffYesterday);

        const [summary, doctorsRaw, yesterdayPatients, todayPatients] = await Promise.all([
          Qlinic.getDailySummary(undefined, myDoctorId || undefined),
          amDoctor ? Qlinic.getDoctor(myDoctorId) : Qlinic.getDoctors(),
          Qlinic.getPatientsInRange(yesterdayStr, yesterdayStr, myDoctorId || undefined),
          Qlinic.getPatientsInRange(Qlinic.getTodayDate(), Qlinic.getTodayDate(), myDoctorId || undefined),
        ]);
        const doctors = amDoctor ? (doctorsRaw ? [doctorsRaw] : []) : doctorsRaw;
        const greetingName = (await Qlinic.getMyDisplayName()).text;
        document.getElementById('greetingText').textContent = `${greeting.text}, ${greetingName}`;
        const doctorById = Object.fromEntries(doctors.map((d) => [d.id, d]));
        const queues = await Promise.all(doctors.map((d) => Qlinic.getQueueForDoctor(d.id, undefined, d)));

        const today = Qlinic.getTodayDate();
        // Fetched for reception too, not just admin -- the "Doctors away"
        // stat below needs to know a doctor is out on holiday today
        // regardless of who's viewing the dashboard. Skipped only for a
        // doctor's own view, where that card never renders anyway -- not
        // for a clinic that happens to have one doctor (that's what
        // `doctors.length > 1` used to skip too), whose admin and
        // reception still need to see that doctor is on holiday.
        const allDoctorHolidays = !amDoctor ? await Qlinic.getDoctorHolidays() : [];
        const doctorIdsOnHolidayToday = new Set(
          allDoctorHolidays.filter((h) => h.date === today).map((h) => h.doctorId)
        );

        if (amAdmin) {
          const [allStaffHolidays, team] = await Promise.all([
            Qlinic.getStaffHolidays(),
            Qlinic.getTeam(),
          ]);
          const staffById = Object.fromEntries(team.map((p) => [p.id, p]));
          const upcoming = allDoctorHolidays
            .filter((h) => h.date >= today && doctorById[h.doctorId])
            .map((h) => Object.assign({}, h, { name: doctorById[h.doctorId].name, role: 'doctor' }))
            .concat(
              allStaffHolidays
                .filter((h) => h.date >= today && staffById[h.profileId])
                .map((h) => Object.assign({}, h, {
                  name: staffById[h.profileId].fullName || staffById[h.profileId].email,
                  role: staffById[h.profileId].role,
                }))
            )
            .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
          renderHolidayChip(upcoming, doctors);

          const holidayPopupCheckedKey = 'qlinic_holiday_popup_checked_date';
          if (localStorage.getItem(holidayPopupCheckedKey) !== today) {
            const todayPeople = upcoming.filter((h) => h.date === today);
            if (todayPeople.length > 0) showHolidayPopup(todayPeople);
            localStorage.setItem(holidayPopupCheckedKey, today);
          }
        }

        const yesterdayFootfallAtCutoff = yesterdayPatients.filter((p) =>
          ['waiting', 'in_consult', 'done'].includes(p.status) && p.arrivedAt && new Date(p.arrivedAt) <= cutoffYesterday
        ).length;

        const perDoctorById = Object.fromEntries(summary.perDoctor.map((p) => [p.doctorId, p]));

        function breakdownUrl(metric, doctorId) {
          const qs = new URLSearchParams({ metric, date: Qlinic.getTodayDate() });
          if (doctorId) qs.set('doctor', doctorId);
          return `patient-breakdown.html?${qs.toString()}`;
        }
        function perDoctorDialog(title, column, pickFn, metric) {
          return () => Qlinic.statBreakdownDialog({
            title,
            columns: ['Doctor', column],
            rows: doctors.map((d) => [d.name, pickFn(perDoctorById[d.id])]),
            rowHrefs: doctors.map((d) => breakdownUrl(metric, d.id)),
            viewAllHref: breakdownUrl(metric),
          });
        }

        const cards = [
          {
            label: 'Footfall so far',
            value: summary.footfallSoFar,
            accent: 'teal',
            chip: percentChip(summary.footfallSoFar, yesterdayFootfallAtCutoff, true),
            onClick: perDoctorDialog('Footfall so far, by doctor', 'Footfall', (p) => (p ? p.footfall : 0), 'footfall'),
          },
          {
            label: 'Waiting now',
            value: summary.waitingNow,
            accent: 'coral',
            onClick: perDoctorDialog('Waiting now, by doctor', 'Waiting', (p) => (p ? p.waiting : 0), 'waiting'),
          },
          {
            label: 'In consultation',
            value: summary.inConsultCount,
            accent: 'sky',
            onClick: perDoctorDialog('In consultation, by doctor', 'In consultation', (p) => (p ? p.inConsult : 0), 'inConsult'),
          },
          {
            label: 'Seen (done)',
            value: summary.doneCount,
            accent: 'blue',
            onClick: perDoctorDialog('Seen (done), by doctor', 'Seen', (p) => (p ? p.done : 0), 'done'),
          },
          {
            label: 'No-shows',
            value: summary.noShowCount,
            accent: 'purple',
            onClick: perDoctorDialog('No-shows, by doctor', 'No-shows', (p) => (p ? p.noShow : 0), 'noShow'),
          },
          {
            label: 'Booked today',
            value: summary.totalBookedToday,
            accent: 'indigo',
            onClick: perDoctorDialog('Booked today, by doctor', 'Booked', (p) => (p ? p.totalBookedToday : 0), 'bookedToday'),
          },
        ];

        // Declared here (not inside the block below) so the Live Queue
        // sidebar section further down, which runs after that block closes,
        // can still read it without a second fetch.
        let allWaiting = [];
        if (doctors.length > 0) {
          allWaiting = queues.flatMap((q) => q.waiting);
          const nowMs = Date.now();
          const waitMinsFor = (p) => Math.max(0, Math.round((nowMs - p.effectiveTime.getTime()) / 60000));

          const avgWaitMins = allWaiting.length
            ? Math.round(allWaiting.reduce((sum, p) => sum + waitMinsFor(p), 0) / allWaiting.length)
            : null;

          const yesterdayWaitingAtCutoff = yesterdayPatients.filter((p) =>
            p.arrivedAt && new Date(p.arrivedAt) <= cutoffYesterday && (!p.calledAt || new Date(p.calledAt) > cutoffYesterday)
          );
          const yesterdayAvgWaitAtCutoff = yesterdayWaitingAtCutoff.length
            ? Math.round(yesterdayWaitingAtCutoff.reduce((sum, p) => sum + Math.max(0, Math.round((cutoffYesterday - new Date(p.arrivedAt)) / 60000)), 0) / yesterdayWaitingAtCutoff.length)
            : null;
          function perDoctorWaitDialog(title, pickFn, metric) {
            return () => Qlinic.statBreakdownDialog({
              title,
              columns: ['Doctor', 'Minutes'],
              rows: doctors.map((d, i) => {
                const w = queues[i].waiting;
                return [d.name, w.length ? pickFn(w) : '—'];
              }),
              rowHrefs: doctors.map((d) => breakdownUrl(metric, d.id)),
              viewAllHref: breakdownUrl(metric),
            });
          }
          cards.push({
            label: 'Avg wait now (min)',
            value: avgWaitMins === null ? '—' : avgWaitMins,
            accent: 'amber',
            chip: minuteChip(avgWaitMins, yesterdayAvgWaitAtCutoff, false),
            onClick: perDoctorWaitDialog('Average wait now, by doctor',
              (w) => Math.round(w.reduce((sum, p) => sum + waitMinsFor(p), 0) / w.length), 'avgWait'),
          });

          function peakWaitMinsFor(p) {
            const start = Qlinic.effectiveMoment(p, doctorById[p.doctorId]).getTime();
            const end = p.status === 'waiting' ? nowMs : (p.calledAt ? new Date(p.calledAt).getTime() : nowMs);
            return Math.max(0, Math.round((end - start) / 60000));
          }
          const todayWaitCandidates = todayPatients.filter((p) => ['waiting', 'in_consult', 'done'].includes(p.status));
          const longestWaiting = todayWaitCandidates.length
            ? todayWaitCandidates.reduce((longest, p) => (peakWaitMinsFor(p) > peakWaitMinsFor(longest) ? p : longest))
            : null;
          cards.push({
            label: 'Longest wait today (min)',
            value: longestWaiting ? peakWaitMinsFor(longestWaiting) : '—',
            sub: longestWaiting ? null : 'No one has waited today',
            accent: 'pink',
            onClick: () => Qlinic.statBreakdownDialog({
              title: 'Longest wait today, by doctor',
              columns: ['Doctor', 'Minutes'],
              rows: doctors.map((d) => {
                const mine = todayWaitCandidates.filter((p) => p.doctorId === d.id);
                return [d.name, mine.length ? Math.max(...mine.map(peakWaitMinsFor)) : '—'];
              }),
              rowHrefs: doctors.map((d) => breakdownUrl('longestWait', d.id)),
              viewAllHref: breakdownUrl('longestWait'),
            }),
          });

          if (doctors.length > 1) {
            const awayDoctors = doctors.filter((d) =>
              d.status === 'on_break' || d.status === 'emergency' || d.dayClosedAt || doctorIdsOnHolidayToday.has(d.id)
            );
            cards.push({
              label: 'Doctors away',
              value: `${awayDoctors.length}/${doctors.length}`,
              accent: 'rose',
              onClick: () => Qlinic.statBreakdownDialog({
                title: 'Doctors away',
                columns: ['Doctor', 'Status'],
                rows: awayDoctors.map((d) => [
                  d.name,
                  // Holiday is checked first: a doctor out for the day
                  // never opened a session, so status/dayClosedAt are
                  // just whatever they were left at, not the real reason.
                  doctorIdsOnHolidayToday.has(d.id)
                    ? 'On holiday'
                    : d.dayClosedAt
                    ? 'Day closed'
                    : statusLabel(d.status) + (Qlinic.isRealStatusReason(d.statusNote) ? ' - ' + d.statusNote : ''),
                ]),
              }),
            });

            let busiestDoctor = null;
            queues.forEach((q, i) => {
              if (q.waiting.length > 0 && (!busiestDoctor || q.waiting.length > busiestDoctor.count)) {
                busiestDoctor = { name: doctors[i].name, count: q.waiting.length };
              }
            });
            cards.push({
              label: 'Busiest queue',
              value: busiestDoctor ? busiestDoctor.count : '—',
              unit: busiestDoctor ? 'patients in queue' : null,
              sub: busiestDoctor ? busiestDoctor.name : 'All clear',
              accent: 'cyan',
            });
          }

          const priorityWaitingCount = allWaiting.filter((p) => p.isPriority).length;
          cards.push({
            label: 'Priority waiting',
            value: priorityWaitingCount,
            accent: 'green',
            onClick: () => Qlinic.statBreakdownDialog({
              title: 'Priority waiting, by doctor',
              columns: ['Doctor', 'Priority waiting'],
              rows: doctors.map((d) => [d.name, perDoctorById[d.id] ? perDoctorById[d.id].priorityWaiting : 0]),
              viewAllHref: breakdownUrl('priorityWaiting'),
            }),
          });
        }

        currentCards = cards;
        document.getElementById('statCards').innerHTML = cards.map((c, i) => `
          <div class="dash-kpi-card${c.onClick ? ' clickable' : ''}" data-idx="${i}">
            <div class="dash-kpi-left">
              <div class="dash-kpi-label-row">
                <div class="dash-kpi-icon accent-${c.accent}">${kpiIconSvg(c.accent)}</div>
                <div class="dash-kpi-title">${Qlinic.escapeHtml(c.label)}</div>
              </div>
              <div class="dash-kpi-value">${c.value}${c.unit ? ` <span style="font-size:12px;font-weight:600;color:var(--grey-500);">${Qlinic.escapeHtml(c.unit)}</span>` : ''}</div>
              <div class="dash-kpi-trend${c.chip ? (c.chip.good ? ' good' : ' bad') : ''}">${
                c.chip ? `${c.chip.arrow === '▲' ? '&#8593;' : '&#8595;'} ${c.chip.text} vs yesterday` : (c.sub ? Qlinic.escapeHtml(c.sub) : 'Right now')
              }</div>
            </div>
            ${kpiSparklineSvg(ACCENT_HEX[c.accent] || '#2563eb')}
          </div>
        `).join('');

        // Live Queue sidebar: the patients currently waiting, split by kind
        // (priority = Emergency, else Walk-in or Appointment), so the three
        // rows always add up to the "Patients in queue" total. Computed from
        // the same waiting-patient data the KPI cards above already use --
        // not a separate fetch.
        function renderLiveQueue(emergencyCount, walkinCount, appointmentCount) {
          const total = emergencyCount + walkinCount + appointmentCount;
          document.getElementById('liveQueueSummary').innerHTML = `
            <div>
              <div class="dash-sidebar-total">${total}</div>
              <div class="dash-sidebar-total-label">Patients in queue</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;">
              <div class="dash-sidebar-breakdown-row">
                <span class="dash-sidebar-breakdown-label"><span class="dash-sidebar-breakdown-dot" style="background:#2563eb;"></span>Appointment</span>
                <span class="dash-sidebar-breakdown-count">${appointmentCount}</span>
              </div>
              <div class="dash-sidebar-breakdown-row">
                <span class="dash-sidebar-breakdown-label"><span class="dash-sidebar-breakdown-dot" style="background:#0d9488;"></span>Walk-in</span>
                <span class="dash-sidebar-breakdown-count">${walkinCount}</span>
              </div>
              <div class="dash-sidebar-breakdown-row">
                <span class="dash-sidebar-breakdown-label"><span class="dash-sidebar-breakdown-dot" style="background:#be123c;"></span>Emergency</span>
                <span class="dash-sidebar-breakdown-count">${emergencyCount}</span>
              </div>
            </div>
          `;
        }
        if (doctors.length > 0) {
          const emergencyWaitingCount = allWaiting.filter((p) => p.isPriority).length;
          const walkinWaitingCount = allWaiting.filter((p) => !p.isPriority && p.type === 'walkin').length;
          const appointmentWaitingCount = allWaiting.filter((p) => !p.isPriority && p.type !== 'walkin').length;
          renderLiveQueue(emergencyWaitingCount, walkinWaitingCount, appointmentWaitingCount);
        } else {
          renderLiveQueue(0, 0, 0);
        }

        if (doctors.length === 0) {
          document.getElementById('doctorStatusList').innerHTML = '<div class="empty-state">No doctors yet, add one from <a href="settings.html">Settings</a>.</div>';
          return;
        }
        // Paired by index before filtering, not filtered up front -- doctors
        // and queues stay untouched for "Doctors away" and every other stat
        // above, which still need to count/name a doctor on holiday. Only
        // this status list, which is about who's actually working right
        // now, drops them.
        const workingToday = doctors
          .map((d, i) => ({ d, q: queues[i] }))
          .filter(({ d }) => !doctorIdsOnHolidayToday.has(d.id));
        if (workingToday.length === 0) {
          document.getElementById('doctorStatusList').innerHTML = '<div class="empty-state">Every doctor is on holiday today.</div>';
          return;
        }

        function dashStatusPill(d, q) {
          if (d.dayClosedAt) return { key: 'offline', text: 'Offline' };
          if (q.nowServing) return { key: 'in-consultation', text: 'In Consultation' };
          if (d.status === 'on_break') {
            // Same "<duration> since <time>" convention display.html's own
            // on-break detail already uses (T.onBreakDetail) -- delayMins is
            // the estimate entered when going on break, statusUpdatedAt is
            // when that happened, not a live-ticking elapsed timer.
            const duration = d.delayMins ? formatDurationLabel(d.delayMins) : '';
            // Non-breaking space between the time and AM/PM so a line wrap
            // in the status column can't split "9:24" from "PM".
            const since = d.statusUpdatedAt ? Qlinic.formatTimestamp(d.statusUpdatedAt).replace(' ', '&nbsp;') : '';
            const detail = [duration, since ? 'since ' + since : ''].filter(Boolean).join(' ');
            return { key: 'on-break', text: 'On Break' + (detail ? ' &bull; ' + detail : '') };
          }
          if (d.status === 'emergency') return { key: 'emergency', text: 'Emergency' };
          return { key: 'available', text: 'Available' };
        }

        document.getElementById('doctorStatusList').innerHTML = `
          <table class="dash-table">
            <thead>
              <tr>
                <th>Doctor</th>
                <th>Speciality</th>
                <th>Current Patient</th>
                <th>Next Appointment</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${workingToday.map(({ d, q }) => {
                const pill = dashStatusPill(d, q);
                const next = q.booked && q.booked.length ? q.booked[0] : null;
                const waitedMins = q.nowServing && q.nowServing.calledAt
                  ? Math.max(0, Math.round((Date.now() - new Date(q.nowServing.calledAt).getTime()) / 60000))
                  : null;
                const tokenDisplay = (num) => num == null ? '' : (num > 100000 ? 'W' + (num - 100000) : '#' + num);
                const nextTimeLabel = next && next.bookedTime ? Qlinic.formatTime(Qlinic.parseTime(next.bookedTime)) : '&mdash;';
                return `
                  <tr class="dash-doc-row${pill.key === 'on-break' || pill.key === 'emergency' ? ' row-' + pill.key : ''}">
                    <td>
                      <div style="display:flex;align-items:center;gap:10px;">
                        <div class="dash-doc-avatar accent-${avatarAccentFor(d.id, doctors)}">${Qlinic.escapeHtml(Qlinic.initialsFor(d.name))}</div>
                        <div>
                          <div class="dash-doc-name">Dr. ${Qlinic.escapeHtml(d.name)}</div>
                          <div class="dash-doc-specialty">${Qlinic.escapeHtml(d.specialty)}</div>
                        </div>
                      </div>
                    </td>
                    <td>
                      <div class="dash-specialty-cell">${specialtyIconSvg(d.specialty)}${Qlinic.escapeHtml(d.specialty)}</div>
                    </td>
                    <td>
                      ${q.nowServing
                        ? `<div class="dash-cell-primary">${Qlinic.escapeHtml(q.nowServing.name)}</div><div class="dash-cell-sub">Token ${Qlinic.escapeHtml(tokenDisplay(q.nowServing.tokenNumber))}${waitedMins !== null ? ' &bull; ' + waitedMins + ' mins' : ''}</div>`
                        : '<div class="dash-cell-sub">No patient right now</div>'}
                    </td>
                    <td>
                      ${next
                        ? `<div class="dash-cell-primary">${nextTimeLabel}</div><div class="dash-cell-sub">${Qlinic.escapeHtml(next.name)}</div>`
                        : '<div class="dash-cell-sub">No upcoming appointment</div>'}
                    </td>
                    <td>
                      <span class="dash-status-pill status-${pill.key}"><span class="dot"></span>${pill.text}</span>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      }

      // render() makes a run of sequential fetches and writes different
      // sections at different points. Realtime events can fire it again
      // mid-run, and a slow earlier run finishing last would overwrite the
      // newer numbers. So only one run at a time: a change that arrives
      // meanwhile queues exactly one more run, which then reads fresh data.
      let renderRunning = false;
      let renderQueued = false;
      async function scheduleRender() {
        if (renderRunning) { renderQueued = true; return; }
        renderRunning = true;
        try {
          await render();
        } catch (err) {
          console.error('Dashboard render failed:', err);
        } finally {
          renderRunning = false;
          if (renderQueued) { renderQueued = false; scheduleRender(); }
        }
      }

      scheduleRender();
      setInterval(updateDateTimeLabel, 30000);
      Qlinic.onLiveChange(scheduleRender);

      // Chrome/Safari restore this exact page (including its old scroll
      // position) from bfcache on Back/forward instead of reloading it, so
      // returning to the dashboard after visiting another page could leave
      // it scrolled to wherever it was left, looking like a stuck/broken
      // layout until a hard refresh. A plain 'load' handler doesn't fire for
      // a bfcache restore -- 'pageshow' does, with event.persisted true.
      window.addEventListener('pageshow', (e) => {
        if (e.persisted) {
          document.querySelector('.app-main').scrollTop = 0;
        }
      });
    })();
  </script>

</body>
</html>
