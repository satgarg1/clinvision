<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard: Qlinic</title>
<script>if (localStorage.getItem('qlinic_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%231d1d1f'/%3E%3Cline x1='50' y1='50' x2='50' y2='26' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='68' y2='58' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%230071e3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=139" />
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand">
        <span class="brand-top">
          <span class="brand-clock clock-face" id="navClock">
            <svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block;color:var(--black);">
              <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="5"></circle>
              <line class="clock-hour" x1="50" y1="50" x2="50" y2="30" stroke="currentColor" stroke-width="6" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
              <line class="clock-min" x1="50" y1="50" x2="50" y2="18" stroke="currentColor" stroke-width="4" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
              <line class="clock-sec" x1="50" y1="50" x2="50" y2="14" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
              <circle cx="50" cy="50" r="3" fill="currentColor"></circle>
            </svg>
          </span>
          Qlinic
        </span>
        <span class="brand-tagline">Time is the one asset nobody gets back</span>
      </a>
      <div class="clinic-name-row">
        <img class="clinic-logo-thumb" id="clinicLogoThumb" style="display:none;" alt="" />
        <div class="clinic-name" id="clinicName">Loading…</div>
      </div>
      <nav>
        <a href="dashboard.html" class="nav-link active">Dashboard</a>
        <a href="reception.html" class="nav-link" id="receptionNavLink">Reception</a>
        <a href="doctor.html" class="nav-link">Doctor View</a>
        <a href="billing.html" class="nav-link" id="billingNavLink">Billing</a>
        <a href="revenue.html" class="nav-link" id="revenueNavLink">Revenue</a>
        <a href="trends.html" class="nav-link" id="trendsNavLink">Analytics</a>
        <a href="end-of-day.html" class="nav-link" id="endOfDayNavLink">End of day</a>
        <a href="display.html" class="nav-link" id="displayNavLink">Display Screen</a>
        <a href="settings.html" class="nav-link pinned-bottom" id="settingsNavLink">Settings</a>
      </nav>
    </aside>

    <main class="app-main">
      <div class="app-topbar">
        <h1>Dashboard</h1>
        <div class="clock-pill">
          <span><span class="live-dot" style="width:7px;height:7px;margin-right:8px;"></span>Clinic time: <span class="time" id="clockTime">--</span></span>
        </div>
      </div>

      <div class="card-grid" id="statCards"></div>

      <div class="panel">
        <div class="panel-header"><h2>Doctor status</h2></div>
        <div id="doctorStatusList"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=50"></script>
  <script>
    (async function () {
      await Qlinic.requireLogin('login.html');

      // The sidebar logo links to the marketing site, which has no way
      // back into the app without logging in again, worth a heads-up
      // before someone loses their place by accident.
      document.querySelector('a.brand').addEventListener('click', async (e) => {
        e.preventDefault();
        if (await Qlinic.confirmDialog({ message: "Going to the homepage will end your session here, you'll need to log in again to get back in." })) {
          window.location.href = 'index.html';
        }
      });

      const [amAdmin, amDoctor, myProfile] = await Promise.all([Qlinic.isAdmin(), Qlinic.isDoctor(), Qlinic.getMyProfile()]);
      const myDoctorId = amDoctor ? myProfile.doctorId : null;

      // Hidden, not just redirect-blocked: a visible link to a page you
      // can't open is worse than no link at all — it invites a "why
      // can't I get in" question to admin for something that was never
      // meant to be there in the first place.
      if (amDoctor) {
        document.getElementById('receptionNavLink').style.display = 'none';
        document.getElementById('billingNavLink').style.display = 'none';
        document.getElementById('displayNavLink').style.display = 'none';
      }
      if (!amAdmin) {
        document.getElementById('revenueNavLink').style.display = 'none';
        document.getElementById('endOfDayNavLink').style.display = 'none';
      }
      if (!amAdmin && !amDoctor) {
        document.getElementById('trendsNavLink').style.display = 'none';
      }

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      function statusLabel(status) {
        return {
          on_time: 'Available',
          on_break: 'On a break',
          emergency: 'Emergency',
        }[status] || status;
      }

      // Same 5-color identity palette as the rest of the app; each doctor
      // keeps the same color everywhere, based on their position in the
      // clinic's doctor list.
      const ACCENT_COLORS = ['teal', 'blue', 'purple', 'coral', 'pink'];
      function accentForDoctor(doctorId, doctors) {
        const idx = doctors.findIndex((d) => d.id === doctorId);
        return ACCENT_COLORS[Math.max(idx, 0) % ACCENT_COLORS.length];
      }

      function pad2(n) { return String(n).padStart(2, '0'); }
      function toDateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }

      // Percent change vs. yesterday's count AT THE SAME CLOCK TIME — not
      // yesterday's full-day total, which would always read as "behind"
      // until today is actually over and say nothing real. No chip when
      // yesterday's comparable count was 0 (nothing to divide by) or the
      // change rounds to 0% (not worth a chip). higherIsGood decides which
      // direction of change counts as good vs. bad for THIS metric — more
      // footfall is good, but more wait time is not.
      function percentChip(todayVal, yesterdayVal, higherIsGood) {
        if (!yesterdayVal || todayVal == null) return null;
        const pct = Math.round(((todayVal - yesterdayVal) / yesterdayVal) * 100);
        if (pct === 0) return null;
        const isIncrease = pct > 0;
        return { text: `${Math.abs(pct)}%`, arrow: isIncrease ? '▲' : '▼', good: isIncrease === higherIsGood };
      }
      function minuteChip(todayVal, yesterdayVal, higherIsGood) {
        if (todayVal == null || yesterdayVal == null) return null;
        const diff = Math.round(todayVal - yesterdayVal);
        if (diff === 0) return null;
        const isIncrease = diff > 0;
        return { text: `${Math.abs(diff)} min`, arrow: isIncrease ? '▲' : '▼', good: isIncrease === higherIsGood };
      }

      async function render() {
        document.getElementById('clockTime').textContent = Qlinic.formatTimestamp(new Date());

        const clinic = await Qlinic.getClinic();
        document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
        if (clinic && clinic.logo_url) {
          document.getElementById('clinicLogoThumb').src = clinic.logo_url;
          document.getElementById('clinicLogoThumb').style.display = 'block';
        } else {
          document.getElementById('clinicLogoThumb').style.display = 'none';
        }

        // A doctor whose login hasn't been linked to a doctors row yet
        // (see Team settings) has no data to scope to — nothing else on
        // this page can render meaningfully until that's fixed.
        if (amDoctor && !myDoctorId) {
          document.getElementById('statCards').innerHTML = '';
          document.getElementById('doctorStatusList').innerHTML =
            '<div class="empty-state">Your account isn\'t linked to a doctor profile yet — ask your admin to link it from Team settings.</div>';
          return;
        }

        // Exactly 24 hours ago, not just "yesterday's date" — the cutoff
        // itself is what makes the trend chips below a fair comparison
        // (same point in the day on both sides), not just a per-day total.
        const cutoffYesterday = new Date(Date.now() - 24 * 3600000);
        const yesterdayStr = toDateStr(cutoffYesterday);

        const [summary, doctorsRaw, yesterdayPatients] = await Promise.all([
          Qlinic.getDailySummary(undefined, myDoctorId || undefined),
          amDoctor ? Qlinic.getDoctor(myDoctorId) : Qlinic.getDoctors(),
          Qlinic.getPatientsInRange(yesterdayStr, yesterdayStr, myDoctorId || undefined),
        ]);
        // getDoctor() (the doctor's own view) returns one row or null;
        // getDoctors() (everyone else's view) already returns an array.
        const doctors = amDoctor ? (doctorsRaw ? [doctorsRaw] : []) : doctorsRaw;
        const queues = await Promise.all(doctors.map((d) => Qlinic.getQueueForDoctor(d.id)));

        const yesterdayFootfallAtCutoff = yesterdayPatients.filter((p) =>
          ['waiting', 'in_consult', 'done'].includes(p.status) && p.arrivedAt && new Date(p.arrivedAt) <= cutoffYesterday
        ).length;

        const cards = [
          {
            label: 'Footfall so far',
            value: summary.footfallSoFar,
            accent: 'teal',
            chip: percentChip(summary.footfallSoFar, yesterdayFootfallAtCutoff, true),
          },
          { label: 'Waiting now', value: summary.waitingNow, accent: 'coral' },
          { label: 'Seen (done)', value: summary.doneCount, accent: 'blue' },
          { label: 'No-shows', value: summary.noShowCount, accent: 'purple' },
          { label: 'Booked today', value: summary.totalAppointments, accent: 'indigo' },
        ];

        // The queue-health cards below all read from the SAME waiting
        // lists (and doctor statuses) the "Doctor status" panel further
        // down already fetches — computed here once and reused, rather
        // than a second round-trip.
        if (doctors.length > 0) {
          const allWaiting = queues.flatMap((q) => q.waiting);
          const nowMs = Date.now();
          const waitMinsFor = (p) => Math.max(0, Math.round((nowMs - new Date(p.arrivedAt).getTime()) / 60000));

          const avgWaitMins = allWaiting.length
            ? Math.round(allWaiting.reduce((sum, p) => sum + waitMinsFor(p), 0) / allWaiting.length)
            : null;

          // Reconstructs "who was still waiting" at yesterday's cutoff
          // moment from the same fields used for everyone else: arrived by
          // then, and not yet called in by then (or never called at all).
          const yesterdayWaitingAtCutoff = yesterdayPatients.filter((p) =>
            p.arrivedAt && new Date(p.arrivedAt) <= cutoffYesterday && (!p.calledAt || new Date(p.calledAt) > cutoffYesterday)
          );
          const yesterdayAvgWaitAtCutoff = yesterdayWaitingAtCutoff.length
            ? Math.round(yesterdayWaitingAtCutoff.reduce((sum, p) => sum + Math.max(0, Math.round((cutoffYesterday - new Date(p.arrivedAt)) / 60000)), 0) / yesterdayWaitingAtCutoff.length)
            : null;
          cards.push({
            label: 'Avg wait now (min)',
            value: avgWaitMins === null ? '—' : avgWaitMins,
            accent: 'amber',
            chip: minuteChip(avgWaitMins, yesterdayAvgWaitAtCutoff, false),
          });

          const longestWaiting = allWaiting.length
            ? allWaiting.reduce((longest, p) => (waitMinsFor(p) > waitMinsFor(longest) ? p : longest))
            : null;
          cards.push({
            label: 'Longest wait (min)',
            value: longestWaiting ? waitMinsFor(longestWaiting) : '—',
            // Patient names don't belong on a dashboard this visible — the
            // time alone is enough to flag that something needs attention.
            sub: longestWaiting ? null : 'No one waiting',
            accent: 'pink',
          });

          // Both cards below compare doctors against each other (who's
          // away out of how many, whose queue is longest) — with a single
          // doctor there's nothing to compare, and the answer is already
          // fully visible in the one row of the Doctor status panel below,
          // so both are dropped rather than shown as a redundant "1/1" or
          // a "busiest" queue that's trivially the only queue there is.
          if (doctors.length > 1) {
            // dayClosedAt is a separate field from status (see the Doctor
            // status row rendering below) — a doctor can close their day
            // while their last status is still 'on_time', so that has to be
            // checked on its own. Deliberately plain truthiness, matching
            // the "Day closed" badge below exactly (not isDoctorClosedToday,
            // which excludes a stale prior-day closure the doctor forgot to
            // clear — that badge stays up indefinitely until "I'm back" is
            // tapped, so this card should agree with what's actually on screen).
            const doctorsAway = doctors.filter((d) => d.status === 'on_break' || d.status === 'emergency' || d.dayClosedAt).length;
            cards.push({ label: 'Doctors away', value: `${doctorsAway}/${doctors.length}`, accent: 'rose' });

            let busiestDoctor = null;
            queues.forEach((q, i) => {
              if (q.waiting.length > 0 && (!busiestDoctor || q.waiting.length > busiestDoctor.count)) {
                busiestDoctor = { name: doctors[i].name, count: q.waiting.length };
              }
            });
            cards.push({
              label: 'Busiest queue',
              value: busiestDoctor ? busiestDoctor.count : '—',
              sub: busiestDoctor ? busiestDoctor.name : 'All clear',
              accent: 'cyan',
            });
          }

          const priorityWaitingCount = allWaiting.filter((p) => p.isPriority).length;
          cards.push({ label: 'Priority waiting', value: priorityWaitingCount, accent: 'green' });
        }

        document.getElementById('statCards').innerHTML = cards.map((c) => `
          <div class="stat-card accent-${c.accent}">
            <div class="top-row">
              <div class="value">${c.value}</div>
              ${c.chip ? `<span class="trend-chip ${c.chip.good ? 'good' : 'bad'}">${c.chip.arrow} ${c.chip.text}</span>` : ''}
            </div>
            <div class="label">${c.label}</div>
            ${c.sub ? `<div class="stat-sub">${Qlinic.escapeHtml(c.sub)}</div>` : ''}
          </div>
        `).join('');

        if (doctors.length === 0) {
          document.getElementById('doctorStatusList').innerHTML = '<div class="empty-state">No doctors yet, add one from <a href="settings.html">Settings</a>.</div>';
          return;
        }
        document.getElementById('doctorStatusList').innerHTML = doctors.map((d, i) => {
          const q = queues[i];
          // dayClosedAt is a separate field from status (a doctor can close
          // their day while status is still whatever it last was), so it
          // has to be checked on its own — otherwise a closed doctor keeps
          // showing their old "On time"/"On a break" pill here even
          // though doctor.html and the display board both already know
          // they're done for the day.
          const rowClass = d.dayClosedAt ? 'row-status-closed' : (d.status !== 'on_time' ? 'row-status-' + d.status : '');
          const rightCol = d.dayClosedAt
            ? `
                <span class="status-pill status-closed">Day closed</span>
                <div style="font-size:12px;color:var(--grey-500);margin-top:6px;">closed ${Qlinic.formatTimestamp(d.dayClosedAt)}</div>
              `
            : `
                <span class="status-pill status-${d.status}">${statusLabel(d.status)}${d.delayMins ? ' · ' + d.delayMins + ' min' : ''}</span>
                <div style="font-size:12px;color:var(--grey-500);margin-top:6px;">updated ${Qlinic.formatTimestamp(d.statusUpdatedAt)}</div>
              `;
          return `
            <div class="doctor-status-row ${rowClass}">
              <div style="display:flex;align-items:center;gap:10px;">
                <span class="board-doc-dot dot-${accentForDoctor(d.id, doctors)}"></span>
                <div>
                  <div class="doc-name">${Qlinic.escapeHtml(d.name)}</div>
                  <div class="doc-specialty">${Qlinic.escapeHtml(d.specialty)} &middot; ${q.waiting.length} waiting ${q.nowServing ? '&middot; now with ' + Qlinic.escapeHtml(q.nowServing.name) : ''}</div>
                </div>
              </div>
              <div style="text-align:right;">
                ${rightCol}
              </div>
            </div>
          `;
        }).join('');
      }

      render();
      setInterval(() => { document.getElementById('clockTime').textContent = Qlinic.formatTimestamp(new Date()); }, 30000);
      Qlinic.onLiveChange(render);
    })();
  </script>
  <script>
    (function () {
      function applyTime(root) {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours() % 12;
        const sec = root.querySelector(".clock-sec");
        const min = root.querySelector(".clock-min");
        const hour = root.querySelector(".clock-hour");
        if (sec) sec.style.transform = `rotate(${s * 6}deg)`;
        if (min) min.style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
        if (hour) hour.style.transform = `rotate(${h * 30 + m * 0.5}deg)`;
      }
      function tickAll() {
        document.querySelectorAll(".clock-face").forEach(applyTime);
      }
      tickAll();
      setInterval(tickAll, 1000);
    })();
  </script>

</body>
</html>
