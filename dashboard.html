<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard: ClinVision</title>
<script>if (localStorage.getItem('qlinic_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/png" href="clinvision-favicon.png?v=2" />
<link rel="stylesheet" href="styles.css?v=324" />
</head>
<body style="visibility:hidden;">
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand">
        <span class="brand-top">
        <span class="brand-word-wrap">
          <span class="brand-word">ClinVision</span>
          <span class="brand-word-bar"></span>
        </span>
      </span>
      <span class="brand-tagline">Where clinics run better</span>
      </a>
      <div class="clinic-name-row">
        <img class="clinic-logo-thumb" id="clinicLogoThumb" style="display:none;" alt="" />
        <div class="clinic-name" id="clinicName">Loading…</div>
      </div>
      <nav>
        <a href="dashboard.html" class="nav-link active">Dashboard</a>
        <a href="reception.html" class="nav-link" id="receptionNavLink">Reception</a>
        <a href="doctor.html" class="nav-link">Doctor View</a>
        <a href="billing.html" class="nav-link" id="billingNavLink">Billing</a>
        <a href="revenue.html" class="nav-link" id="revenueNavLink">Revenue</a>
        <a href="trends.html" class="nav-link" id="trendsNavLink">Insights</a>
        <a href="display.html" class="nav-link" id="displayNavLink">Display Screen</a>
        <a href="settings.html" class="nav-link pinned-bottom" id="settingsNavLink">Settings</a>
      </nav>
    </aside>

    <main class="app-main">
      <div class="app-topbar">
        <h1>Dashboard</h1>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="holiday-chip-wrap" id="holidayChipWrap" style="display:none;">
            <button type="button" class="holiday-chip" id="holidayChipBtn" aria-expanded="false">
              <span aria-hidden="true">🗓️</span>
              <span id="holidayChipText"></span>
            </button>
            <div class="holiday-popover" id="holidayPopover"></div>
          </div>
          <div class="clock-pill">
            <span><span class="live-dot" style="width:7px;height:7px;margin-right:8px;"></span>Clinic time: <span class="time" id="clockTime">--</span></span>
          </div>
        </div>
      </div>

      <div class="card-grid" id="statCards"></div>

      <div class="panel">
        <div class="panel-header"><h2>Doctor status</h2></div>
        <div id="doctorStatusList"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=110"></script>
  <script>
    (async function () {
      if (!(await Qlinic.requireLogin('login.html'))) return;

      if (await Qlinic.isPharmacist()) { window.location.href = 'pharmacy.html'; return; }

      document.querySelector('a.brand').addEventListener('click', async (e) => {
        e.preventDefault();
        if (await Qlinic.confirmDialog({ message: "Going to the homepage will end your session here, you'll need to log in again to get back in." })) {
          window.location.href = 'index.html';
        }
      });

      const [amAdmin, amDoctor, myProfile] = await Promise.all([Qlinic.isAdmin(), Qlinic.isDoctor(), Qlinic.getMyProfile()]);
      const myDoctorId = amDoctor ? myProfile.doctorId : null;

      if (amDoctor) {
        document.getElementById('receptionNavLink').style.display = 'none';
        document.getElementById('billingNavLink').style.display = 'none';
        document.getElementById('displayNavLink').style.display = 'none';
      }
      if (!amAdmin) {
        document.getElementById('revenueNavLink').style.display = 'none';
      }
      if (!amAdmin && !amDoctor) {
        document.getElementById('trendsNavLink').style.display = 'none';
      }
      await Qlinic.applyFeatureNavGating();
      document.body.style.visibility = 'visible';

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      let currentCards = [];
      document.getElementById('statCards').addEventListener('click', (e) => {
        const card = e.target.closest('.stat-card');
        if (!card) return;
        const c = currentCards[Number(card.getAttribute('data-idx'))];
        if (c && c.onClick) c.onClick();
      });

      function formatStatusTimestamp(value) {
        if (!value) return '·';
        const date = new Date(value);
        return `${date.toLocaleDateString(undefined, { day: 'numeric', month: 'short' })} at ${date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}`;
      }

      function statusLabel(status) {
        return {
          on_time: 'Available',
          on_break: 'On a break',
          emergency: 'Emergency',
        }[status] || status;
      }

      function formatDurationLabel(mins) {
        if (mins < 60) return `${mins} min`;
        if (mins % 30 === 0) return `${mins / 60} hr`;
        return `${Math.floor(mins / 60)} hr ${mins % 60} min`;
      }

      const ACCENT_COLORS = ['teal', 'blue', 'purple', 'coral', 'pink'];
      function accentForDoctor(doctorId, doctors) {
        const idx = doctors.findIndex((d) => d.id === doctorId);
        return ACCENT_COLORS[Math.max(idx, 0) % ACCENT_COLORS.length];
      }

      function renderHolidayChip(upcoming, doctors) {
        const wrap = document.getElementById('holidayChipWrap');
        if (upcoming.length === 0) {
          wrap.style.display = 'none';
          closeHolidayPopover();
          return;
        }
        wrap.style.display = '';
        const next = upcoming[0];
        document.getElementById('holidayChipText').textContent =
          upcoming.length === 1
            ? `${Qlinic.formatDateLabel(next.date)} — ${next.name}`
            : `${upcoming.length} upcoming`;
        document.getElementById('holidayPopover').innerHTML = `
          <div class="holiday-popover-header">${upcoming.length} upcoming holiday${upcoming.length === 1 ? '' : 's'}</div>
          ${upcoming.map((h, i) => `
            <div class="holiday-row ${i === 0 ? 'soonest' : ''}">
              ${h.role === 'doctor'
                ? `<span class="board-doc-dot dot-${accentForDoctor(h.doctorId, doctors)}"></span>`
                : `<span class="role-tag ${h.role === 'admin' ? 'admin' : 'reception'}">${h.role === 'admin' ? 'Admin' : 'Reception'}</span>`}
              <div class="info">
                <div class="doc-name">${Qlinic.escapeHtml(h.name)}</div>
                ${h.note ? `<div class="doc-note">${Qlinic.escapeHtml(h.note)}</div>` : ''}
              </div>
              <span class="date-badge">${Qlinic.escapeHtml(Qlinic.formatDateLabel(h.date))}</span>
            </div>
          `).join('')}
          <div class="holiday-popover-footer"><a href="doctor-holidays.html">Manage in Team Holidays →</a></div>
        `;
      }
      function roleLabelFor(role) { return role === 'admin' ? 'Admin' : role === 'doctor' ? 'Doctor' : 'Reception'; }
      function personHeadingPhrase(p) {
        return p.role === 'doctor' ? `Dr. ${p.name}` : `${p.name} (${roleLabelFor(p.role)})`;
      }
      function showHolidayPopup(people) {
        const heading = people.length === 1
          ? `${personHeadingPhrase(people[0])} is on holiday today.`
          : people.length === 2
          ? `${personHeadingPhrase(people[0])} and ${personHeadingPhrase(people[1])} are on holiday today.`
          : `${people.length} team members are on holiday today — see who below.`;
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        backdrop.innerHTML = `
          <div class="modal-card holiday-popup-modal" role="alertdialog" aria-modal="true">
            <div class="holiday-popup-icon" aria-hidden="true">🗓️</div>
            <h2 class="modal-title">${Qlinic.escapeHtml(heading)}</h2>
            <div class="holiday-popup-who">
              ${people.map((p) => `
                <div class="holiday-popup-who-row">
                  <span class="role-tag ${p.role === 'admin' ? 'admin' : p.role === 'doctor' ? 'doctor' : 'reception'}">${roleLabelFor(p.role)}</span>
                  <span class="holiday-popup-who-name">${Qlinic.escapeHtml(p.role === 'doctor' ? 'Dr. ' + p.name : p.name)}</span>
                </div>
              `).join('')}
            </div>
            <button type="button" class="btn-sm primary" id="holidayPopupDismiss" style="width:100%;">Got it</button>
          </div>
        `;
        document.body.appendChild(backdrop);
        function cleanup() {
          backdrop.remove();
          document.removeEventListener('keydown', onKeydown);
        }
        function onKeydown(e) { if (e.key === 'Escape') cleanup(); }
        document.addEventListener('keydown', onKeydown);
        backdrop.addEventListener('click', (e) => { if (e.target === backdrop) cleanup(); });
        backdrop.querySelector('#holidayPopupDismiss').addEventListener('click', cleanup);
        backdrop.querySelector('#holidayPopupDismiss').focus();
      }

      function closeHolidayPopover() {
        document.getElementById('holidayPopover').classList.remove('open');
        document.getElementById('holidayChipBtn').setAttribute('aria-expanded', 'false');
      }
      document.getElementById('holidayChipBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        const popover = document.getElementById('holidayPopover');
        const isOpen = popover.classList.toggle('open');
        document.getElementById('holidayChipBtn').setAttribute('aria-expanded', String(isOpen));
      });
      document.addEventListener('click', (e) => {
        if (!document.getElementById('holidayChipWrap').contains(e.target)) closeHolidayPopover();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeHolidayPopover();
      });

      function pad2(n) { return String(n).padStart(2, '0'); }
      function toDateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }

      function percentChip(todayVal, yesterdayVal, higherIsGood) {
        if (!yesterdayVal || todayVal == null) return null;
        const pct = Math.round(((todayVal - yesterdayVal) / yesterdayVal) * 100);
        if (pct === 0) return null;
        const isIncrease = pct > 0;
        return { text: `${Math.abs(pct)}%`, arrow: isIncrease ? '▲' : '▼', good: isIncrease === higherIsGood };
      }
      function minuteChip(todayVal, yesterdayVal, higherIsGood) {
        if (todayVal == null || yesterdayVal == null) return null;
        const diff = Math.round(todayVal - yesterdayVal);
        if (diff === 0) return null;
        const isIncrease = diff > 0;
        return { text: `${Math.abs(diff)} min`, arrow: isIncrease ? '▲' : '▼', good: isIncrease === higherIsGood };
      }

      async function render() {
        document.getElementById('clockTime').textContent = Qlinic.formatTimestamp(new Date());

        const clinic = await Qlinic.getClinic();
        document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
        if (clinic && clinic.logo_url) {
          document.getElementById('clinicLogoThumb').src = clinic.logo_url;
          document.getElementById('clinicLogoThumb').style.display = 'block';
        } else {
          document.getElementById('clinicLogoThumb').style.display = 'none';
        }

        if (amDoctor && !myDoctorId) {
          document.getElementById('statCards').innerHTML = '';
          document.getElementById('doctorStatusList').innerHTML =
            '<div class="empty-state">Your account isn\'t linked to a doctor profile yet — ask your admin to link it from Team settings.</div>';
          return;
        }

        const cutoffYesterday = new Date(Date.now() - 24 * 3600000);
        const yesterdayStr = toDateStr(cutoffYesterday);

        const [summary, doctorsRaw, yesterdayPatients, todayPatients] = await Promise.all([
          Qlinic.getDailySummary(undefined, myDoctorId || undefined),
          amDoctor ? Qlinic.getDoctor(myDoctorId) : Qlinic.getDoctors(),
          Qlinic.getPatientsInRange(yesterdayStr, yesterdayStr, myDoctorId || undefined),
          Qlinic.getPatientsInRange(Qlinic.getTodayDate(), Qlinic.getTodayDate(), myDoctorId || undefined),
        ]);
        const doctors = amDoctor ? (doctorsRaw ? [doctorsRaw] : []) : doctorsRaw;
        const doctorById = Object.fromEntries(doctors.map((d) => [d.id, d]));
        const queues = await Promise.all(doctors.map((d) => Qlinic.getQueueForDoctor(d.id, undefined, d)));

        if (amAdmin) {
          const [allDoctorHolidays, allStaffHolidays, team] = await Promise.all([
            Qlinic.getDoctorHolidays(),
            Qlinic.getStaffHolidays(),
            Qlinic.getTeam(),
          ]);
          const staffById = Object.fromEntries(team.map((p) => [p.id, p]));
          const today = Qlinic.getTodayDate();
          const upcoming = allDoctorHolidays
            .filter((h) => h.date >= today && doctorById[h.doctorId])
            .map((h) => Object.assign({}, h, { name: doctorById[h.doctorId].name, role: 'doctor' }))
            .concat(
              allStaffHolidays
                .filter((h) => h.date >= today && staffById[h.profileId])
                .map((h) => Object.assign({}, h, {
                  name: staffById[h.profileId].fullName || staffById[h.profileId].email,
                  role: staffById[h.profileId].role,
                }))
            )
            .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
          renderHolidayChip(upcoming, doctors);

          const holidayPopupCheckedKey = 'qlinic_holiday_popup_checked_date';
          if (localStorage.getItem(holidayPopupCheckedKey) !== today) {
            const todayPeople = upcoming.filter((h) => h.date === today);
            if (todayPeople.length > 0) showHolidayPopup(todayPeople);
            localStorage.setItem(holidayPopupCheckedKey, today);
          }
        }

        const yesterdayFootfallAtCutoff = yesterdayPatients.filter((p) =>
          ['waiting', 'in_consult', 'done'].includes(p.status) && p.arrivedAt && new Date(p.arrivedAt) <= cutoffYesterday
        ).length;

        const perDoctorById = Object.fromEntries(summary.perDoctor.map((p) => [p.doctorId, p]));

        function breakdownUrl(metric, doctorId) {
          const qs = new URLSearchParams({ metric, date: Qlinic.getTodayDate() });
          if (doctorId) qs.set('doctor', doctorId);
          return `patient-breakdown.html?${qs.toString()}`;
        }
        function perDoctorDialog(title, column, pickFn, metric) {
          return () => Qlinic.statBreakdownDialog({
            title,
            columns: ['Doctor', column],
            rows: doctors.map((d) => [d.name, pickFn(perDoctorById[d.id])]),
            rowHrefs: doctors.map((d) => breakdownUrl(metric, d.id)),
            viewAllHref: breakdownUrl(metric),
          });
        }

        const cards = [
          {
            label: 'Footfall so far',
            value: summary.footfallSoFar,
            accent: 'teal',
            chip: percentChip(summary.footfallSoFar, yesterdayFootfallAtCutoff, true),
            onClick: perDoctorDialog('Footfall so far, by doctor', 'Footfall', (p) => (p ? p.footfall : 0), 'footfall'),
          },
          {
            label: 'Waiting now',
            value: summary.waitingNow,
            accent: 'coral',
            onClick: perDoctorDialog('Waiting now, by doctor', 'Waiting', (p) => (p ? p.waiting : 0), 'waiting'),
          },
          {
            label: 'In consultation',
            value: summary.inConsultCount,
            accent: 'sky',
            onClick: perDoctorDialog('In consultation, by doctor', 'In consultation', (p) => (p ? p.inConsult : 0), 'inConsult'),
          },
          {
            label: 'Seen (done)',
            value: summary.doneCount,
            accent: 'blue',
            onClick: perDoctorDialog('Seen (done), by doctor', 'Seen', (p) => (p ? p.done : 0), 'done'),
          },
          {
            label: 'No-shows',
            value: summary.noShowCount,
            accent: 'purple',
            onClick: perDoctorDialog('No-shows, by doctor', 'No-shows', (p) => (p ? p.noShow : 0), 'noShow'),
          },
          {
            label: 'Booked today',
            value: summary.totalBookedToday,
            accent: 'indigo',
            onClick: perDoctorDialog('Booked today, by doctor', 'Booked', (p) => (p ? p.totalBookedToday : 0), 'bookedToday'),
          },
        ];

        if (doctors.length > 0) {
          const allWaiting = queues.flatMap((q) => q.waiting);
          const nowMs = Date.now();
          const waitMinsFor = (p) => Math.max(0, Math.round((nowMs - p.effectiveTime.getTime()) / 60000));

          const avgWaitMins = allWaiting.length
            ? Math.round(allWaiting.reduce((sum, p) => sum + waitMinsFor(p), 0) / allWaiting.length)
            : null;

          const yesterdayWaitingAtCutoff = yesterdayPatients.filter((p) =>
            p.arrivedAt && new Date(p.arrivedAt) <= cutoffYesterday && (!p.calledAt || new Date(p.calledAt) > cutoffYesterday)
          );
          const yesterdayAvgWaitAtCutoff = yesterdayWaitingAtCutoff.length
            ? Math.round(yesterdayWaitingAtCutoff.reduce((sum, p) => sum + Math.max(0, Math.round((cutoffYesterday - new Date(p.arrivedAt)) / 60000)), 0) / yesterdayWaitingAtCutoff.length)
            : null;
          function perDoctorWaitDialog(title, pickFn, metric) {
            return () => Qlinic.statBreakdownDialog({
              title,
              columns: ['Doctor', 'Minutes'],
              rows: doctors.map((d, i) => {
                const w = queues[i].waiting;
                return [d.name, w.length ? pickFn(w) : '—'];
              }),
              rowHrefs: doctors.map((d) => breakdownUrl(metric, d.id)),
              viewAllHref: breakdownUrl(metric),
            });
          }
          cards.push({
            label: 'Avg wait now (min)',
            value: avgWaitMins === null ? '—' : avgWaitMins,
            accent: 'amber',
            chip: minuteChip(avgWaitMins, yesterdayAvgWaitAtCutoff, false),
            onClick: perDoctorWaitDialog('Average wait now, by doctor',
              (w) => Math.round(w.reduce((sum, p) => sum + waitMinsFor(p), 0) / w.length), 'avgWait'),
          });

          function peakWaitMinsFor(p) {
            const start = Qlinic.effectiveMoment(p, doctorById[p.doctorId]).getTime();
            const end = p.status === 'waiting' ? nowMs : (p.calledAt ? new Date(p.calledAt).getTime() : nowMs);
            return Math.max(0, Math.round((end - start) / 60000));
          }
          const todayWaitCandidates = todayPatients.filter((p) => ['waiting', 'in_consult', 'done'].includes(p.status));
          const longestWaiting = todayWaitCandidates.length
            ? todayWaitCandidates.reduce((longest, p) => (peakWaitMinsFor(p) > peakWaitMinsFor(longest) ? p : longest))
            : null;
          cards.push({
            label: 'Longest wait today (min)',
            value: longestWaiting ? peakWaitMinsFor(longestWaiting) : '—',
            sub: longestWaiting ? null : 'No one has waited today',
            accent: 'pink',
            onClick: () => Qlinic.statBreakdownDialog({
              title: 'Longest wait today, by doctor',
              columns: ['Doctor', 'Minutes'],
              rows: doctors.map((d) => {
                const mine = todayWaitCandidates.filter((p) => p.doctorId === d.id);
                return [d.name, mine.length ? Math.max(...mine.map(peakWaitMinsFor)) : '—'];
              }),
              rowHrefs: doctors.map((d) => breakdownUrl('longestWait', d.id)),
              viewAllHref: breakdownUrl('longestWait'),
            }),
          });

          if (doctors.length > 1) {
            const awayDoctors = doctors.filter((d) => d.status === 'on_break' || d.status === 'emergency' || d.dayClosedAt);
            cards.push({
              label: 'Doctors away',
              value: `${awayDoctors.length}/${doctors.length}`,
              accent: 'rose',
              onClick: () => Qlinic.statBreakdownDialog({
                title: 'Doctors away',
                columns: ['Doctor', 'Status'],
                rows: awayDoctors.map((d) => [
                  d.name,
                  d.dayClosedAt
                    ? 'Day closed'
                    : statusLabel(d.status) + (Qlinic.isRealStatusReason(d.statusNote) ? ' - ' + d.statusNote : ''),
                ]),
              }),
            });

            let busiestDoctor = null;
            queues.forEach((q, i) => {
              if (q.waiting.length > 0 && (!busiestDoctor || q.waiting.length > busiestDoctor.count)) {
                busiestDoctor = { name: doctors[i].name, count: q.waiting.length };
              }
            });
            cards.push({
              label: 'Busiest queue',
              value: busiestDoctor ? busiestDoctor.count : '—',
              unit: busiestDoctor ? 'patients in queue' : null,
              sub: busiestDoctor ? busiestDoctor.name : 'All clear',
              accent: 'cyan',
            });
          }

          const priorityWaitingCount = allWaiting.filter((p) => p.isPriority).length;
          cards.push({
            label: 'Priority waiting',
            value: priorityWaitingCount,
            accent: 'green',
            onClick: () => Qlinic.statBreakdownDialog({
              title: 'Priority waiting, by doctor',
              columns: ['Doctor', 'Priority waiting'],
              rows: doctors.map((d) => [d.name, perDoctorById[d.id] ? perDoctorById[d.id].priorityWaiting : 0]),
              viewAllHref: breakdownUrl('priorityWaiting'),
            }),
          });
        }

        currentCards = cards;
        document.getElementById('statCards').innerHTML = cards.map((c, i) => `
          <div class="stat-card accent-${c.accent}${c.onClick ? ' clickable' : ''}" data-idx="${i}">
            <div class="top-row">
              <div class="value">${c.value}${c.unit ? ` <span class="stat-unit">${Qlinic.escapeHtml(c.unit)}</span>` : ''}</div>
              ${c.chip ? `<span class="trend-chip ${c.chip.good ? 'good' : 'bad'}">${c.chip.arrow} ${c.chip.text}</span>` : ''}
            </div>
            <div class="label">${c.label}</div>
            ${c.sub ? `<div class="stat-sub">${Qlinic.escapeHtml(c.sub)}</div>` : ''}
          </div>
        `).join('');

        if (doctors.length === 0) {
          document.getElementById('doctorStatusList').innerHTML = '<div class="empty-state">No doctors yet, add one from <a href="settings.html">Settings</a>.</div>';
          return;
        }
        document.getElementById('doctorStatusList').innerHTML = doctors.map((d, i) => {
          const q = queues[i];
          const rowClass = d.dayClosedAt
            ? 'row-status-closed'
            : (q.nowServing ? 'row-in-consult' : (d.status !== 'on_time' ? 'row-status-' + d.status : ''));
          const rightCol = d.dayClosedAt
            ? `
                <span class="status-pill status-closed">Day closed</span>
                <div style="font-size:12px;color:var(--grey-500);margin-top:6px;">closed ${formatStatusTimestamp(d.dayClosedAt)}</div>
              `
            : `
                <span class="status-pill status-${d.status}">${statusLabel(d.status)}${d.delayMins ? ' for ' + formatDurationLabel(d.delayMins) : ''}${Qlinic.isRealStatusReason(d.statusNote) ? ': "' + Qlinic.escapeHtml(d.statusNote) + '"' : ''}</span>
                <div style="font-size:12px;color:var(--grey-500);margin-top:6px;">last updated ${formatStatusTimestamp(d.statusUpdatedAt)}</div>
              `;
          return `
            <div class="doctor-status-row ${rowClass}">
              <div style="display:flex;align-items:center;gap:10px;">
                <span class="board-doc-dot dot-${accentForDoctor(d.id, doctors)}"></span>
                <div>
                  <div class="doc-name">${Qlinic.escapeHtml(d.name)}</div>
                  <div class="doc-specialty">${Qlinic.escapeHtml(d.specialty)}</div>
                  <div class="doc-status-line">Patients Waiting: ${q.waiting.length}</div>
                  ${q.nowServing ? `<div class="doc-status-line">In consultation with ${Qlinic.escapeHtml(q.nowServing.name)}${q.nowServing.calledAt ? ' from ' + Qlinic.formatTimestamp(q.nowServing.calledAt) : ''}</div>` : ''}
                </div>
              </div>
              <div style="text-align:right;">
                ${rightCol}
              </div>
            </div>
          `;
        }).join('');
      }

      render();
      setInterval(() => { document.getElementById('clockTime').textContent = Qlinic.formatTimestamp(new Date()); }, 30000);
      Qlinic.onLiveChange(render);
    })();
  </script>

</body>
</html>
