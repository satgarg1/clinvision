  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=41"></script>
  <script>
    (async function () {
      await Qlinic.requireLogin('login.html');

      document.querySelector('a.brand').addEventListener('click', (e) => {
        e.preventDefault();
        if (confirm("Going to the homepage will end your session here, you'll need to log in again to get back in. Continue?")) {
          window.location.href = 'index.html';
        }
      });

      if (!(await Qlinic.canAccessBilling())) {
        window.location.href = 'dashboard.html';
        return;
      }
      if (!(await Qlinic.isAdmin())) {
        document.getElementById('settingsNavLink').style.display = 'none';
      }

      const WEEKDAY_LABELS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      // May/June/July aren't shortened — abbreviating them (Jun/Jul) saves
      // nothing worth the ambiguity, so they're spelled out like the rest
      // of the app's date formatting.
      const MONTH_ABBREV = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'June', 'July', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

      function pad2(n) { return String(n).padStart(2, '0'); }
      function toDateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
      function todayStr() { return toDateStr(new Date()); }

      // Same preset family and date math as Revenue (kept as a per-page
      // copy, matching this codebase's no-build-step convention), so
      // "Period" here answers the same question the same way in both
      // places. Custom is additionally capped at 12 months (see
      // updateCustomRangeFromInputs) so its bars stay readable.
      function computeLastWeekRange() {
        const today = new Date();
        const day = today.getDay();
        const diffToMonday = day === 0 ? 6 : day - 1;
        const thisMonday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - diffToMonday);
        const lastMonday = new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate() - 7);
        const lastSunday = new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate() - 1);
        return { start: toDateStr(lastMonday), end: toDateStr(lastSunday) };
      }
      function computeCurrentWeekRange() {
        const today = new Date();
        const day = today.getDay();
        const diffToMonday = day === 0 ? 6 : day - 1;
        const monday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - diffToMonday);
        const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
        const tStr = toDateStr(today);
        const sundayStr = toDateStr(sunday);
        return { start: toDateStr(monday), end: sundayStr > tStr ? tStr : sundayStr };
      }
      function computeCurrentMonthRange() {
        const today = new Date();
        const first = new Date(today.getFullYear(), today.getMonth(), 1);
        const last = new Date(today.getFullYear(), today.getMonth() + 1, 0);
        const tStr = toDateStr(today);
        const lastStr = toDateStr(last);
        return { start: toDateStr(first), end: lastStr > tStr ? tStr : lastStr };
      }
      function computeLastMonthRange() {
        const today = new Date();
        const firstOfThisMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        const lastOfLastMonth = new Date(firstOfThisMonth.getFullYear(), firstOfThisMonth.getMonth(), 0);
        const firstOfLastMonth = new Date(lastOfLastMonth.getFullYear(), lastOfLastMonth.getMonth(), 1);
        return { start: toDateStr(firstOfLastMonth), end: toDateStr(lastOfLastMonth) };
      }
      function computeLastNMonthsRange(n) {
        const today = new Date();
        const firstOfThisMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        const end = new Date(firstOfThisMonth.getFullYear(), firstOfThisMonth.getMonth(), 0);
        const start = new Date(firstOfThisMonth.getFullYear(), firstOfThisMonth.getMonth() - n, 1);
        return { start: toDateStr(start), end: toDateStr(end) };
      }
      // Indian financial year: April 1 - March 31. If we're in Jan-Mar,
      // the current FY started in April of the previous calendar year.
      const CURRENT_FY_START_YEAR = (() => {
        const today = new Date();
        return today.getMonth() >= 3 ? today.getFullYear() : today.getFullYear() - 1;
      })();
      function computeCurrentFYRange() {
        const today = new Date();
        const start = new Date(CURRENT_FY_START_YEAR, 3, 1);
        const naturalEnd = new Date(CURRENT_FY_START_YEAR + 1, 2, 31);
        const tStr = toDateStr(today);
        const naturalEndStr = toDateStr(naturalEnd);
        return { start: toDateStr(start), end: naturalEndStr > tStr ? tStr : naturalEndStr };
      }
      function computeLastFYRange() {
        const lastFYStartYear = CURRENT_FY_START_YEAR - 1;
        const start = new Date(lastFYStartYear, 3, 1);
        const end = new Date(lastFYStartYear + 1, 2, 31);
        return { start: toDateStr(start), end: toDateStr(end) };
      }
      function fyLabel(startYear) {
        return `Apr '${String(startYear).slice(-2)} - Mar '${String(startYear + 1).slice(-2)}`;
      }
      function monthYearToRange(fromMonth, fromYear, toMonth, toYear) {
        if (!fromMonth || !fromYear || !toMonth || !toYear) return null;
        const start = new Date(Number(fromYear), Number(fromMonth) - 1, 1);
        const end = new Date(Number(toYear), Number(toMonth), 0);
        return { start: toDateStr(start), end: toDateStr(end) };
      }
      const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      function populateMonthYearSelects(monthSelectId, yearSelectId) {
        document.getElementById(monthSelectId).innerHTML = MONTH_NAMES.map((name, i) => `<option value="${pad2(i + 1)}">${name}</option>`).join('');
        const thisYear = new Date().getFullYear();
        const years = [];
        for (let y = thisYear - 10; y <= thisYear + 1; y++) years.push(y);
        document.getElementById(yearSelectId).innerHTML = years.map((y) => `<option value="${y}">${y}</option>`).join('');
      }

      const RANGE_PRESETS = [
        { key: 'lastweek', label: 'Last week', compute: computeLastWeekRange },
        { key: 'currentweek', label: 'Current week', compute: computeCurrentWeekRange },
        { key: 'currentmonth', label: 'Current month', compute: computeCurrentMonthRange },
        { key: 'lastmonth', label: 'Last month', compute: computeLastMonthRange },
        { key: 'last3months', label: 'Last 3 months', compute: () => computeLastNMonthsRange(3) },
        { key: 'last6months', label: 'Last 6 months', compute: () => computeLastNMonthsRange(6) },
        { key: 'last12months', label: 'Last 12 months', compute: () => computeLastNMonthsRange(12) },
        { key: 'currentfy', label: `Current financial year (${fyLabel(CURRENT_FY_START_YEAR)})`, compute: computeCurrentFYRange },
        { key: 'lastfy', label: `Last financial year (${fyLabel(CURRENT_FY_START_YEAR - 1)})`, compute: computeLastFYRange },
        { key: 'custom', label: 'Custom', compute: null },
      ];
      function rangeForPreset(preset) {
        const entry = RANGE_PRESETS.find((p) => p.key === preset);
        return entry && entry.compute ? entry.compute() : null;
      }
      function presetLabel() {
        if (rangePreset !== 'custom') {
          const entry = RANGE_PRESETS.find((p) => p.key === rangePreset);
          return entry ? entry.label : '';
        }
        if (!customRange) return 'Custom';
        const [sy, sm] = customRange.start.split('-').map(Number);
        const [ey, em] = customRange.end.split('-').map(Number);
        return `${MONTH_NAMES[sm - 1].slice(0, 3)} ${sy} - ${MONTH_NAMES[em - 1].slice(0, 3)} ${ey}`;
      }

      // Bar granularity adapts to how wide the selected period actually
      // is, not to which preset was picked — that way every preset (and
      // any Custom range) automatically lands on a readable bar count:
      // ~a week or less -> one bar per day, ~a month -> one bar per week
      // (~4-5 bars), anything longer -> one bar per calendar month.
      // Custom is separately capped at 12 months (see
      // updateCustomRangeFromInputs), so the month case never exceeds 12 bars.
      function bucketGranularity(startStr, endStr) {
        const days = Math.round((new Date(endStr) - new Date(startStr)) / 86400000) + 1;
        if (days <= 8) return 'day';
        if (days <= 35) return 'week';
        return 'month';
      }

      // Monday-of-the-week bucket key for a given Date.
      function weekStartStr(d) {
        const day = d.getDay(); // 0 = Sun .. 6 = Sat
        const diffToMonday = day === 0 ? 6 : day - 1;
        const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - diffToMonday);
        return toDateStr(monday);
      }

      function shortDateLabel(dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      }

      // First-of-the-month bucket key for a given Date.
      function monthStartStr(d) { return toDateStr(new Date(d.getFullYear(), d.getMonth(), 1)); }
      function monthLabel(dateStr) {
        const [y, m] = dateStr.split('-').map(Number);
        return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'short', year: 'numeric' });
      }

      // Turns a bucket key into the actual start/end dates a drill-down
      // link should query — capped at today, since a bucket for the
      // current (still in progress) week/month shouldn't claim to cover
      // days that haven't happened yet.
      function weekRangeFromMonday(mondayStr) {
        const [y, m, d] = mondayStr.split('-').map(Number);
        const sunday = toDateStr(new Date(y, m - 1, d + 6));
        return { start: mondayStr, end: sunday > todayStr() ? todayStr() : sunday };
      }
      function monthRangeFromFirst(firstStr) {
        const [y, m] = firstStr.split('-').map(Number);
        const lastDay = toDateStr(new Date(y, m, 0)); // day 0 of month m (1-indexed) = last day of that month
        return { start: firstStr, end: lastDay > todayStr() ? todayStr() : lastDay };
      }

      const GRANULARITY_NOUN = { day: 'day', week: 'week', month: 'month' };

      // Dispatches to the day/week/month bucket-key, drill-down-range, and
      // label helpers above based on the granularity bucketGranularity
      // picked for the current period, so every chart shares one set of
      // bucketing rules instead of each re-implementing the day case.
      function bucketKeyFor(date, granularity) {
        if (granularity === 'day') return toDateStr(date);
        if (granularity === 'week') return weekStartStr(date);
        return monthStartStr(date);
      }
      function bucketRangeFor(key, granularity) {
        if (granularity === 'day') return { start: key, end: key };
        if (granularity === 'week') return weekRangeFromMonday(key);
        return monthRangeFromFirst(key);
      }
      function bucketLabelFor(key, granularity) {
        if (granularity === 'month') return monthLabel(key);
        return shortDateLabel(key);
      }

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      // Buckets every invoice in range by day/week/month (see
      // bucketGranularity) and sums amountReceived per bucket. Each bar
      // links straight into Revenue, pre-filtered to that bucket's exact
      // date range, so "who was billed on this day/week/month" is one
      // click away instead of a separate lookup.
      function renderRevenueOverTime(invoices, granularity) {
        const el = document.getElementById('revenueByWeek');
        document.getElementById('revenueOverTimeHeading').textContent = `Revenue by ${GRANULARITY_NOUN[granularity]}`;
        if (invoices.length === 0) {
          el.innerHTML = '<div class="empty-state">No billed invoices in this period.</div>';
          return;
        }
        const byBucket = {};
        invoices.forEach((inv) => {
          // invoiceDate (migration 024), not createdAt — a backdated bill
          // belongs in the day it's FOR, same as Revenue's own filtering.
          // Built via the y/m/d constructor rather than new Date(string):
          // invoiceDate is a plain "YYYY-MM-DD" with no time component, so
          // parsing it as a string reads as UTC midnight, which rolls back
          // to the previous local calendar day in any timezone behind UTC.
          const [y, m, d] = inv.invoiceDate.split('-').map(Number);
          const key = bucketKeyFor(new Date(y, m - 1, d), granularity);
          byBucket[key] = (byBucket[key] || 0) + inv.amountReceived;
        });
        const buckets = Object.keys(byBucket).sort();
        const maxVal = Math.max(...buckets.map((b) => byBucket[b]), 1);
        el.innerHTML = `
          <div class="trend-bars">
            ${buckets.map((key) => {
              const val = byBucket[key];
              const heightPct = Math.round((val / maxVal) * 100);
              const range = bucketRangeFor(key, granularity);
              const label = bucketLabelFor(key, granularity);
              return `
                <a class="trend-bar-col trend-bar-link" href="revenue.html?start=${range.start}&end=${range.end}">
                  <div class="trend-bar-value">₹${val.toLocaleString('en-IN')}</div>
                  <div class="trend-bar-track"><div class="trend-bar-fill" style="height:${heightPct}%;"></div></div>
                  <div class="trend-bar-label">${label}</div>
                </a>
              `;
            }).join('')}
          </div>
        `;
      }

      // Which bucket's breakdown is currently expanded, plus the data
      // needed to redraw it without a network round-trip: click handling
      // just re-renders from these caches.
      let selectedNoShowBucket = null;
      let noShowBucketsCache = {};
      let noShowGranularityCache = 'week';

      // Only counts patients whose visit outcome is actually known (done
      // or no_show) — someone still booked/waiting hasn't resolved yet,
      // so including them would understate the no-show rate. Buckets by
      // day/week/month (same rule as Revenue over time) so a bar always
      // reads as "this specific day/week/month," never an ambiguous mix
      // of occurrences — clicking a bar expands the per-doctor (and, for
      // week/month bars, day-level) breakdown for exactly that bucket below.
      function renderNoShowOverTime(patients, granularity, doctorById) {
        const el = document.getElementById('noShowByWeekday');
        const breakdownEl = document.getElementById('noShowBreakdown');
        noShowGranularityCache = granularity;
        document.getElementById('noShowHeading').textContent = `No-show rate by ${GRANULARITY_NOUN[granularity]}`;

        const resolved = patients.filter((p) => p.status === 'done' || p.status === 'no_show');
        if (resolved.length === 0) {
          el.innerHTML = '<div class="empty-state">No resolved visits in this period.</div>';
          breakdownEl.innerHTML = '';
          selectedNoShowBucket = null;
          return;
        }

        noShowBucketsCache = {};
        resolved.forEach((p) => {
          const [y, m, d] = p.tokenDate.split('-').map(Number);
          const date = new Date(y, m - 1, d);
          const key = bucketKeyFor(date, granularity);
          (noShowBucketsCache[key] = noShowBucketsCache[key] || []).push(p);
        });

        const buckets = Object.keys(noShowBucketsCache).sort();
        const bucketStats = buckets.map((key) => {
          const items = noShowBucketsCache[key];
          const noShows = items.filter((p) => p.status === 'no_show').length;
          return { key, total: items.length, noShows, rate: (noShows / items.length) * 100 };
        });
        const maxRate = Math.max(...bucketStats.map((b) => b.rate), 1);

        el.innerHTML = `
          <div class="trend-bars">
            ${bucketStats.map((b) => {
              const heightPct = Math.round((b.rate / maxRate) * 100);
              const label = bucketLabelFor(b.key, granularity);
              return `
                <button type="button" class="trend-bar-col trend-bar-link ${b.key === selectedNoShowBucket ? 'trend-bar-selected' : ''}" data-bucket="${b.key}" title="${b.noShows} no-show${b.noShows === 1 ? '' : 's'} of ${b.total} resolved visit${b.total === 1 ? '' : 's'}">
                  <div class="trend-bar-value">${Math.round(b.rate)}%</div>
                  <div class="trend-bar-track"><div class="trend-bar-fill ${b.noShows > 0 ? 'trend-bar-fill-warn' : ''}" style="height:${heightPct}%;"></div></div>
                  <div class="trend-bar-label">${label}</div>
                </button>
              `;
            }).join('')}
          </div>
        `;

        // A live update or period change can make the previously-selected
        // bucket disappear (its key no longer exists in the new data) —
        // collapse rather than render a breakdown for a bucket that's no
        // longer on the chart.
        if (selectedNoShowBucket && noShowBucketsCache[selectedNoShowBucket]) {
          renderNoShowBreakdown(selectedNoShowBucket, doctorById);
        } else {
          selectedNoShowBucket = null;
          breakdownEl.innerHTML = '<p class="panel-note" style="margin:14px 0 0;">Click a bar to see no-shows by day of week and by doctor for that period.</p>';
        }
      }

      function renderNoShowBreakdown(key, doctorById) {
        const breakdownEl = document.getElementById('noShowBreakdown');
        const items = noShowBucketsCache[key] || [];
        const isDayBucket = noShowGranularityCache === 'day';
        const isWeekBucket = noShowGranularityCache === 'week';
        const periodLabel = isDayBucket ? shortDateLabel(key) : isWeekBucket ? `week of ${shortDateLabel(key)}` : monthLabel(key);

        // A day bucket already IS a single day, so there's no further
        // day-level split to show — only "By doctor" renders below. A
        // week bucket has exactly one occurrence of each weekday, so
        // showing the actual calendar date is more useful than a generic
        // "Sat" label. A month bucket has ~4-5 occurrences of each
        // weekday, so those bars stay an aggregate-by-weekday rate.
        let dayLabels;
        const dayTotals = new Array(7).fill(0);
        const dayNoShows = new Array(7).fill(0);
        if (isWeekBucket) {
          const [y, m, d] = key.split('-').map(Number);
          const dates = Array.from({ length: 7 }, (_, i) => toDateStr(new Date(y, m - 1, d + i)));
          dayLabels = dates.map((ds) => {
            const [, mm, dd] = ds.split('-').map(Number);
            return `${dd}-${MONTH_ABBREV[mm - 1]}`;
          });
          items.forEach((p) => {
            const idx = dates.indexOf(p.tokenDate);
            if (idx === -1) return;
            dayTotals[idx]++;
            if (p.status === 'no_show') dayNoShows[idx]++;
          });
        } else if (!isDayBucket) {
          dayLabels = WEEKDAY_LABELS;
          items.forEach((p) => {
            const [y, m, d] = p.tokenDate.split('-').map(Number);
            const jsDay = new Date(y, m - 1, d).getDay();
            const idx = jsDay === 0 ? 6 : jsDay - 1;
            dayTotals[idx]++;
            if (p.status === 'no_show') dayNoShows[idx]++;
          });
        }
        const dayRates = dayTotals.map((t, i) => (t === 0 ? 0 : (dayNoShows[i] / t) * 100));
        const maxDayRate = Math.max(...dayRates, 1);
        const dayLabelClass = isWeekBucket ? 'trend-bar-label trend-bar-label-vertical' : 'trend-bar-label';

        const byDoctor = {};
        items.forEach((p) => {
          if (!byDoctor[p.doctorId]) byDoctor[p.doctorId] = { total: 0, noShows: 0 };
          byDoctor[p.doctorId].total++;
          if (p.status === 'no_show') byDoctor[p.doctorId].noShows++;
        });
        const doctorRows = Object.entries(byDoctor)
          .map(([doctorId, s]) => ({
            name: Qlinic.escapeHtml((doctorById[doctorId] && doctorById[doctorId].name) || 'Unknown'),
            total: s.total,
            noShows: s.noShows,
            rate: (s.noShows / s.total) * 100,
          }))
          .sort((a, b) => b.rate - a.rate);
        const maxDoctorRate = Math.max(...doctorRows.map((r) => r.rate), 1);

        breakdownEl.innerHTML = `
          <p class="panel-note" style="margin:14px 0 12px;">Showing ${periodLabel} · ${items.length} resolved visit${items.length === 1 ? '' : 's'}</p>
          ${isDayBucket ? '' : `
          <div>
            <h3 style="margin:0 0 10px;font-size:14px;color:var(--grey-700);">${isWeekBucket ? 'By day' : 'By day of week'}</h3>
            <div class="trend-bars trend-bars-compact">
              ${dayLabels.map((label, i) => `
                <div class="trend-bar-col trend-bar-hoverable" title="${dayNoShows[i]} no-show${dayNoShows[i] === 1 ? '' : 's'} of ${dayTotals[i]} resolved visit${dayTotals[i] === 1 ? '' : 's'}">
                  <div class="trend-bar-track"><div class="trend-bar-fill ${dayNoShows[i] > 0 ? 'trend-bar-fill-warn' : ''}" style="height:${Math.round((dayRates[i] / maxDayRate) * 100)}%;"></div></div>
                  <div class="${dayLabelClass}">${label}</div>
                </div>
              `).join('')}
            </div>
          </div>
          `}
          <div style="margin-top:${isDayBucket ? '0' : '36px'};">
            <h3 style="margin:0 0 10px;font-size:14px;color:var(--grey-700);">By doctor</h3>
            <div class="trend-bars trend-bars-compact">
              ${doctorRows.map((r) => `
                <div class="trend-bar-col trend-bar-hoverable" title="${r.noShows} no-show${r.noShows === 1 ? '' : 's'} of ${r.total} resolved visit${r.total === 1 ? '' : 's'} (${Math.round(r.rate)}%)">
                  <div class="trend-bar-value">${Math.round(r.rate)}%</div>
                  <div class="trend-bar-track"><div class="trend-bar-fill ${r.noShows > 0 ? 'trend-bar-fill-warn' : ''}" style="height:${Math.round((r.rate / maxDoctorRate) * 100)}%;"></div></div>
                  <div class="trend-bar-label">${r.name}</div>
                  <div class="sub-line">${r.noShows}/${r.total}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      const FEE_TYPE_LABELS = { consultation: 'Consultation', emergency: 'Emergency', waived: 'Follow up' };
      const DOCTOR_TYPE_LEGEND = `
        <p class="panel-note" style="margin:10px 0 0;">
          <span class="board-doc-dot dot-blue"></span>Consultation
          <span class="board-doc-dot dot-coral" style="margin-left:14px;"></span>Emergency
          <span class="board-doc-dot dot-purple" style="margin-left:14px;"></span>Follow up
        </p>
      `;

      // Matches getDailySummary's footfall definition exactly: waiting/
      // in_consult/done are actual visits, booked (hasn't arrived yet)
      // and no_show (booked but never arrived) are both excluded.
      //
      // Built from the full doctor list, not just Object.entries() of the
      // counts — a doctor with zero visits in this period would otherwise
      // never appear as a key at all and silently vanish from the chart,
      // rather than showing as a real 0 bar.
      //
      // Each bar is stacked by visit type (consultation/emergency/follow
      // up), joined via each patient's auto-billed invoice (patientId ->
      // invoice) since visit type is recorded on the invoice, not the
      // patient. A patient with no matching invoice in this period (rare
      // — only if billing data is missing) still counts toward the total
      // via an "unknown" segment, so the bar's total height always
      // matches the visited count even when a segment can't be attributed.
      function renderVisitsPerDoctor(patients, doctors, invoices) {
        const el = document.getElementById('visitsPerDoctor');
        if (doctors.length === 0) {
          el.innerHTML = '<div class="empty-state">No doctors added yet.</div>';
          return;
        }
        const invoiceByPatientId = {};
        invoices.forEach((inv) => { if (inv.patientId) invoiceByPatientId[inv.patientId] = inv; });
        const visited = patients.filter((p) => ['waiting', 'in_consult', 'done'].includes(p.status));
        const counts = {};
        visited.forEach((p) => {
          if (!counts[p.doctorId]) counts[p.doctorId] = { consultation: 0, emergency: 0, waived: 0, unknown: 0, total: 0 };
          const inv = invoiceByPatientId[p.id];
          const type = inv && FEE_TYPE_LABELS[inv.feeType] ? inv.feeType : 'unknown';
          counts[p.doctorId][type]++;
          counts[p.doctorId].total++;
        });
        const rows = doctors
          .map((d) => ({ name: Qlinic.escapeHtml(d.name), ...(counts[d.id] || { consultation: 0, emergency: 0, waived: 0, unknown: 0, total: 0 }) }))
          .sort((a, b) => b.total - a.total);
        const maxCount = Math.max(...rows.map((r) => r.total), 1);
        el.innerHTML = `
          <div class="trend-bars">
            ${rows.map((r) => `
              <div class="trend-bar-col trend-bar-hoverable">
                <div class="trend-bar-value">${r.total}</div>
                <div class="trend-bar-track">
                  <div class="trend-bar-fill-stack" style="height:${Math.round((r.total / maxCount) * 100)}%;">
                    <div class="trend-bar-seg trend-bar-seg-consultation" style="flex-grow:${r.consultation};" title="Consultation: ${r.consultation}"></div>
                    <div class="trend-bar-seg trend-bar-seg-emergency" style="flex-grow:${r.emergency};" title="Emergency: ${r.emergency}"></div>
                    <div class="trend-bar-seg trend-bar-seg-waived" style="flex-grow:${r.waived};" title="Follow up: ${r.waived}"></div>
                    ${r.unknown > 0 ? `<div class="trend-bar-seg trend-bar-seg-unknown" style="flex-grow:${r.unknown};" title="Unbilled: ${r.unknown}"></div>` : ''}
                  </div>
                </div>
                <div class="trend-bar-label">${r.name}</div>
              </div>
            `).join('')}
          </div>
          ${DOCTOR_TYPE_LEGEND}
        `;
      }

      // Same "show every doctor, not just the ones with a matching key"
      // rule as renderVisitsPerDoctor above. Follow-up visits are always
      // waived to ₹0 (see updateInvoicePayment's comment in clinic-data.js),
      // so only consultation and emergency ever contribute real revenue —
      // the bar is stacked by those two alone.
      function renderRevenueByDoctor(invoices, doctors) {
        const el = document.getElementById('revenueByDoctor');
        if (doctors.length === 0) {
          el.innerHTML = '<div class="empty-state">No doctors added yet.</div>';
          return;
        }
        const sums = {};
        invoices.forEach((inv) => {
          if (inv.feeType !== 'consultation' && inv.feeType !== 'emergency') return;
          if (!sums[inv.doctorId]) sums[inv.doctorId] = { consultation: 0, emergency: 0 };
          sums[inv.doctorId][inv.feeType] += inv.amountReceived;
        });
        const rows = doctors
          .map((d) => {
            const s = sums[d.id] || { consultation: 0, emergency: 0 };
            return { name: Qlinic.escapeHtml(d.name), consultation: s.consultation, emergency: s.emergency, total: s.consultation + s.emergency };
          })
          .sort((a, b) => b.total - a.total);
        const maxVal = Math.max(...rows.map((r) => r.total), 1);
        el.innerHTML = `
          <div class="trend-bars">
            ${rows.map((r) => `
              <div class="trend-bar-col trend-bar-hoverable">
                <div class="trend-bar-value">₹${r.total.toLocaleString('en-IN')}</div>
                <div class="trend-bar-track">
                  <div class="trend-bar-fill-stack" style="height:${Math.round((r.total / maxVal) * 100)}%;">
                    <div class="trend-bar-seg trend-bar-seg-consultation" style="flex-grow:${r.consultation};" title="Consultation: ₹${r.consultation.toLocaleString('en-IN')}"></div>
                    <div class="trend-bar-seg trend-bar-seg-emergency" style="flex-grow:${r.emergency};" title="Emergency: ₹${r.emergency.toLocaleString('en-IN')}"></div>
                  </div>
                </div>
                <div class="trend-bar-label">${r.name}</div>
              </div>
            `).join('')}
          </div>
          <p class="panel-note" style="margin:10px 0 0;">
            <span class="board-doc-dot dot-blue"></span>Consultation
            <span class="board-doc-dot dot-coral" style="margin-left:14px;"></span>Emergency
          </p>
        `;
      }

      let rangePreset = 'currentmonth';
      let customRange = null; // exact {start,end} for the 'custom' preset
      let doctorByIdCache = {};

      function currentRange() {
        return rangePreset === 'custom' ? customRange : rangeForPreset(rangePreset);
      }

      async function loadAndRender() {
        const range = currentRange();
        if (!range) return;
        const granularity = bucketGranularity(range.start, range.end);
        const label = presetLabel();
        document.getElementById('visitsPerDoctorHeading').textContent = `Visits per doctor (${label})`;
        document.getElementById('revenueByDoctorHeading').textContent = `Revenue by doctor (${label})`;
        const [invoices, patients, doctors] = await Promise.all([
          Qlinic.getInvoicesForDateRange(range.start, range.end),
          Qlinic.getPatientsInRange(range.start, range.end),
          Qlinic.getDoctors({ includeInactive: true }),
        ]);
        doctorByIdCache = Object.fromEntries(doctors.map((d) => [d.id, d]));
        renderRevenueOverTime(invoices, granularity);
        renderVisitsPerDoctor(patients, doctors, invoices);
        renderRevenueByDoctor(invoices, doctors);
        renderNoShowOverTime(patients, granularity, doctorByIdCache);
      }

      function renderPeriodOptions() {
        document.getElementById('trendsPeriodSelect').innerHTML = RANGE_PRESETS.map((p) =>
          `<option value="${p.key}" ${p.key === rangePreset ? 'selected' : ''}>${p.label}</option>`
        ).join('');
      }

      // Custom is restricted to at most 12 months so bars never exceed a
      // readable count (bucketGranularity always lands on monthly bars
      // past 35 days, so this caps it at 12 monthly bars). Auto-clamps
      // and toasts rather than blocking, since there's no explicit
      // "Apply" step here — the chart updates live as the fields change.
      function updateCustomRangeFromInputs() {
        const sMonthEl = document.getElementById('trendsRangeStartMonth');
        const sYearEl = document.getElementById('trendsRangeStartYear');
        const eMonthEl = document.getElementById('trendsRangeEndMonth');
        const eYearEl = document.getElementById('trendsRangeEndYear');
        const sm = Number(sMonthEl.value), sy = Number(sYearEl.value);
        const em = Number(eMonthEl.value), ey = Number(eYearEl.value);
        const startIdx = sy * 12 + (sm - 1);
        let endIdx = ey * 12 + (em - 1);
        if (endIdx < startIdx) {
          endIdx = startIdx;
          showToast("End date can't be before start date — adjusted.");
        } else if (endIdx - startIdx > 11) {
          endIdx = startIdx + 11;
          showToast('Custom period is limited to 12 months — end date adjusted.');
        }
        if (endIdx !== ey * 12 + (em - 1)) {
          eYearEl.value = String(Math.floor(endIdx / 12));
          eMonthEl.value = pad2((endIdx % 12) + 1);
        }
        customRange = monthYearToRange(sMonthEl.value, sYearEl.value, eMonthEl.value, eYearEl.value);
        selectedNoShowBucket = null;
        loadAndRender();
      }
      ['trendsRangeStartMonth', 'trendsRangeStartYear', 'trendsRangeEndMonth', 'trendsRangeEndYear'].forEach((id) => {
        document.getElementById(id).addEventListener('change', updateCustomRangeFromInputs);
      });

      document.getElementById('trendsPeriodSelect').addEventListener('change', (e) => {
        rangePreset = e.target.value;
        document.getElementById('trendsCustomRangeFilters').style.display = rangePreset === 'custom' ? 'flex' : 'none';
        selectedNoShowBucket = null;
        if (rangePreset === 'custom') {
          updateCustomRangeFromInputs();
        } else {
          loadAndRender();
        }
      });

      // Toggling a bucket is purely a display-state change over data
      // that's already loaded, so it just re-renders from the caches
      // built during the last loadAndRender — no network round-trip.
      document.getElementById('noShowByWeekday').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-bucket]');
        if (!btn) return;
        const key = btn.dataset.bucket;
        selectedNoShowBucket = selectedNoShowBucket === key ? null : key;
        document.querySelectorAll('#noShowByWeekday [data-bucket]').forEach((b) => {
          b.classList.toggle('trend-bar-selected', b.dataset.bucket === selectedNoShowBucket);
        });
        if (selectedNoShowBucket) {
          renderNoShowBreakdown(selectedNoShowBucket, doctorByIdCache);
        } else {
          document.getElementById('noShowBreakdown').innerHTML =
            '<p class="panel-note" style="margin:14px 0 0;">Click a bar to see no-shows by day of week and by doctor for that period.</p>';
        }
      });

      const clinic = await Qlinic.getClinic();
      document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
      if (clinic && clinic.logo_url) {
        document.getElementById('clinicLogoThumb').src = clinic.logo_url;
        document.getElementById('clinicLogoThumb').style.display = 'block';
      } else {
        document.getElementById('clinicLogoThumb').style.display = 'none';
      }
      populateMonthYearSelects('trendsRangeStartMonth', 'trendsRangeStartYear');
      populateMonthYearSelects('trendsRangeEndMonth', 'trendsRangeEndYear');
      renderPeriodOptions();
      await loadAndRender();
      Qlinic.onLiveChange(loadAndRender);
    })();
  </script>
  <script>
    (function () {
      function applyTime(root) {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours() % 12;
        const sec = root.querySelector(".clock-sec");
        const min = root.querySelector(".clock-min");
        const hour = root.querySelector(".clock-hour");
        if (sec) sec.style.transform = `rotate(${s * 6}deg)`;
        if (min) min.style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
        if (hour) hour.style.transform = `rotate(${h * 30 + m * 0.5}deg)`;
      }
      function tickAll() {
        document.querySelectorAll(".clock-face").forEach(applyTime);
      }
      tickAll();
      setInterval(tickAll, 1000);
    })();
  </script>

</body>
</html>
