<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Qlinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=12" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-blob login-blob-teal"></div>
    <div class="login-blob login-blob-coral"></div>
    <div class="login-blob login-blob-purple"></div>
    <div class="login-card">
      <a href="index.html" class="brand">Qlinic</a>
      <h1>Clinic admin login</h1>

      <div id="loginError" class="login-error">Incorrect email or password.</div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn btn-accent" id="loginBtn" style="width:100%;">Log in</button>
      </form>

      <div class="login-hint">
        New clinic? <a href="signup.html">Register your clinic</a> instead.<br />
        <a href="#" id="forgotPasswordLink">Forgot your password?</a>
      </div>

      <form id="forgotForm" style="display:none;margin-top:18px;">
        <div class="field">
          <label for="forgotEmail">Email</label>
          <input type="email" id="forgotEmail" required />
        </div>
        <button type="submit" class="btn btn-ghost" style="width:100%;">Send reset link</button>
      </form>
      <div class="login-hint" id="forgotNote" style="display:none;"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=11"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorBox = document.getElementById('loginError');
      errorBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      try {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const ok = await Qlinic.login(email, password);
        if (ok) {
          window.location.href = 'dashboard.html';
          return;
        }
        errorBox.style.display = 'block';
      } catch (err) {
        errorBox.textContent = err.message || 'Something went wrong logging in.';
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    });

    document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
      e.preventDefault();
      e.target.style.display = 'none';
      document.getElementById('forgotForm').style.display = 'block';
    });

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const note = document.getElementById('forgotNote');
      try {
        const email = document.getElementById('forgotEmail').value;
        const redirectTo = window.location.href.replace(/login\.html.*$/, 'reset-password.html');
        await Qlinic.requestPasswordReset(email, redirectTo);
        document.getElementById('forgotForm').style.display = 'none';
        note.style.display = 'block';
        note.textContent = 'Check your email for a password reset link.';
      } catch (err) {
        note.style.display = 'block';
        note.textContent = err.message || 'Could not send reset email.';
      }
    });
  </script>
</body>
</html>
