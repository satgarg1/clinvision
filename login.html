<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in: ClinVision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231e1b4b'/%3E%3Ctext x='50' y='70' font-family='Georgia, serif' font-size='60' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3Crect x='30' y='80' width='40' height='7' rx='3' fill='%23c9973e'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=279" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-corner-wrap">
      <a href="index.html" class="auth-corner-brand">
        <span class="brand-word-wrap">
          <span class="brand-word">ClinVision</span>
          <span class="brand-word-bar"></span>
        </span>
        <div class="tagline">Where clinics run better</div>
      </a>
      <a href="index.html" class="auth-back-link">Back to main site</a>
    </div>

    <div class="auth-illustration">
      <div class="auth-glow" aria-hidden="true"></div>
      <div class="auth-headline">One system for every part of your day.</div>
    </div>

    <div class="auth-form-pane">
      <div class="auth-form-inner">
        <div class="auth-eyebrow">Welcome back to <b>ClinVision</b></div>
        <h1 class="auth-h1">Log in to your clinic</h1>

        <div id="loginError" class="login-error">Incorrect email or password.</div>

        <div class="id-pill mode-phone" id="idPill">
          <div class="id-pill-thumb"></div>
          <button type="button" class="active" data-mode="phone">Phone</button>
          <button type="button" data-mode="email">Email</button>
        </div>

        <form id="loginForm">
          <!-- Two separate, stable inputs -- never one input whose type
               gets swapped by the pill toggle. A browser keys saved
               credentials off a field's own type/name/autocomplete, so
               mutating those mid-session on one shared input confused
               that matching: a saved email+password combo was landing
               inside the phone field, with no way for autofill to know
               it no longer meant the same thing. Each field now keeps
               its own identity for the page's whole lifetime; only
               which one is VISIBLE changes. -->
          <div class="field" id="phoneField">
            <label for="identifierPhone">Mobile number</label>
            <input type="tel" id="identifierPhone" name="phone" autocomplete="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" />
          </div>
          <div class="field" id="emailField" style="display:none;">
            <label for="identifierEmail">Email</label>
            <input type="email" id="identifierEmail" name="email" autocomplete="username" />
          </div>
          <!-- Same split as the identifier fields above, extended to
               password -- mutating one shared password field's name/
               autocomplete at runtime (tried first) stopped the browser
               from offering the saved credential in Email mode at all:
               a password manager evaluates the form's fields once, close
               to page load, and doesn't reliably re-recognize a field
               after JS renames it later. Two permanently stable password
               inputs, each paired with its own identifier, avoids that
               entirely -- the email pair's identity never changes, so
               the browser can actually learn and offer it. -->
          <div class="field" id="phonePasswordField">
            <label for="passwordPhone">Password</label>
            <input type="password" id="passwordPhone" name="password-phone" autocomplete="off" required />
          </div>
          <div class="field" id="emailPasswordField" style="display:none;">
            <label for="passwordEmail">Password</label>
            <input type="password" id="passwordEmail" name="password" autocomplete="current-password" />
          </div>
          <div class="remember-row">
            <input type="checkbox" id="rememberMe" checked />
            <label for="rememberMe">Remember me on this device</label>
          </div>
          <button type="submit" class="btn btn-accent" id="loginBtn" style="width:100%;">Log in</button>
        </form>

        <div class="auth-hint">
          New clinic? <a href="signup.html">Register your clinic</a> instead.<br />
          <a href="forgot-password.html">Forgot your password?</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=91"></script>
  <script>
    // Pill toggle: shows/hides the two separate identifier fields --
    // never mutates either one's type. required moves with visibility,
    // so the hidden field never blocks submit and the visible one still
    // enforces itself.
    (function () {
      const pill = document.getElementById('idPill');
      const phoneField = document.getElementById('phoneField');
      const emailField = document.getElementById('emailField');
      const phoneInput = document.getElementById('identifierPhone');
      const emailInput = document.getElementById('identifierEmail');
      const phonePasswordField = document.getElementById('phonePasswordField');
      const emailPasswordField = document.getElementById('emailPasswordField');
      const passwordPhone = document.getElementById('passwordPhone');
      const passwordEmail = document.getElementById('passwordEmail');
      phoneInput.required = true;
      passwordPhone.required = true;

      pill.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          pill.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          const mode = btn.dataset.mode;
          pill.classList.toggle('mode-email', mode === 'email');
          pill.classList.toggle('mode-phone', mode === 'phone');
          if (mode === 'phone') {
            phoneField.style.display = '';
            emailField.style.display = 'none';
            phonePasswordField.style.display = '';
            emailPasswordField.style.display = 'none';
            phoneInput.required = true;
            emailInput.required = false;
            passwordPhone.required = true;
            passwordEmail.required = false;
          } else {
            phoneField.style.display = 'none';
            emailField.style.display = '';
            phonePasswordField.style.display = 'none';
            emailPasswordField.style.display = '';
            phoneInput.required = false;
            emailInput.required = true;
            passwordPhone.required = false;
            passwordEmail.required = true;
          }
        });
      });
      // Strips anything non-numeric as they type, same as every other
      // phone field sitewide (billing, Team, signup).
      phoneInput.addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 10);
      });
    })();

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorBox = document.getElementById('loginError');
      errorBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Logging in…';
      try {
        const isPhoneMode = document.getElementById('idPill').classList.contains('mode-phone');
        const password = isPhoneMode
          ? document.getElementById('passwordPhone').value
          : document.getElementById('passwordEmail').value;
        let email;
        if (isPhoneMode) {
          const phone = document.getElementById('identifierPhone').value.trim();
          if (!/^[0-9]{10}$/.test(phone)) {
            throw new Error('Please enter a valid 10-digit mobile number.');
          }
          // Pre-login lookup: a temporary, non-persisted client, never
          // the shared authenticated one -- same reasoning as Team's own
          // staff-account creation using a throwaway client for signUp.
          const tempClient = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
            auth: { persistSession: false, autoRefreshToken: false },
          });
          const { data: resolvedEmail, error: lookupError } = await tempClient.rpc('email_for_staff_phone', { staff_phone: phone });
          if (lookupError) throw lookupError;
          if (!resolvedEmail) throw new Error('No account found for this phone number.');
          email = resolvedEmail;
        } else {
          email = document.getElementById('identifierEmail').value;
        }

        // Set BEFORE login() -- the shared client's storage adapter
        // (clinic-data.js) reads this flag on every token read/write,
        // so it has to be in place before the session is created, not
        // after.
        const rememberMe = document.getElementById('rememberMe').checked;
        localStorage.setItem('qlinic_remember_me', rememberMe ? '1' : '0');

        await Qlinic.login(email, password);
        window.location.href = 'dashboard.html';
        return;
      } catch (err) {
        // Surfaces whatever Supabase actually said (wrong password, rate
        // limit, unconfirmed email, etc.) instead of a single hardcoded
        // "incorrect password" that used to show for every failure alike,
        // making a rate-limit cooldown indistinguishable from a typo.
        errorBox.textContent = err.message || 'Something went wrong logging in.';
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
