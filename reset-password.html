<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set new password: ClinVision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231e1b4b'/%3E%3Ctext x='50' y='70' font-family='Georgia, serif' font-size='60' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3Crect x='30' y='80' width='40' height='7' rx='3' fill='%23c9973e'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=287" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-corner-wrap">
      <a href="index.html" class="auth-corner-brand">
        <span class="brand-word-wrap">
          <span class="brand-word">ClinVision</span>
          <span class="brand-word-bar"></span>
        </span>
        <div class="tagline">Where clinics run better</div>
      </a>
      <a href="index.html" class="auth-back-link">Back to main site</a>
    </div>

    <div class="auth-illustration">
      <div class="auth-glow" aria-hidden="true"></div>
      <div class="auth-headline">One system for every part of your day.</div>
    </div>

    <div class="auth-form-pane">
      <div class="auth-form-inner">
        <div class="auth-eyebrow">Welcome back to <b>ClinVision</b></div>
        <h1 class="auth-h1">Set a new password</h1>

        <div id="resetError" class="login-error"></div>
        <div id="resetInvalid" class="auth-hint" style="display:none;">
          This link no longer works. <a href="login.html">Go back</a> and try again.
        </div>

        <form id="resetForm">
          <div class="field">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" minlength="6" required />
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" minlength="6" required />
          </div>
          <button type="submit" class="btn btn-accent" id="resetBtn" style="width:100%;">Set password</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=92"></script>
  <script>
    (async function () {
      const loggedIn = await Qlinic.isLoggedIn();
      if (!loggedIn) {
        document.getElementById('resetForm').style.display = 'none';
        document.getElementById('resetInvalid').style.display = 'block';
        return;
      }

      document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('resetBtn');
        const errorBox = document.getElementById('resetError');
        errorBox.style.display = 'none';
        const pass1 = document.getElementById('newPassword').value;
        const pass2 = document.getElementById('confirmPassword').value;
        if (pass1 !== pass2) {
          errorBox.textContent = "Passwords don't match.";
          errorBox.style.display = 'block';
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Saving...';
        try {
          await Qlinic.completePasswordReset(pass1);
          window.location.href = 'dashboard.html';
        } catch (err) {
          errorBox.textContent = err.message || 'Could not set a new password.';
          errorBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Set password';
        }
      });
    })();
  </script>
</body>
</html>
