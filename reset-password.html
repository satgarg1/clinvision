<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set new password: Qlinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%231d1d1f'/%3E%3Cline x1='50' y1='50' x2='50' y2='26' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='68' y2='58' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%230071e3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=222" />
</head>
<body>
  <div class="auth-shell">
    <a href="index.html" class="auth-corner-brand">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#1d1d1f"/><line x1="50" y1="50" x2="50" y2="26" stroke="#fff" stroke-width="9" stroke-linecap="round"/><line x1="50" y1="50" x2="68" y2="58" stroke="#fff" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="50" r="6" fill="#0071e3"/></svg>
      <div>
        <div class="name">Qlinic</div>
        <div class="tagline">Time is the one asset nobody gets back.</div>
      </div>
    </a>

    <div class="auth-illustration">
      <div class="auth-glow" aria-hidden="true"></div>
      <div class="auth-headline">One system for every part of your day.</div>
    </div>

    <div class="auth-form-pane">
      <div class="auth-form-inner">
        <div class="auth-eyebrow">Welcome back to <b>Qlinic</b></div>
        <h1 class="auth-h1">Set a new password</h1>

        <div id="resetError" class="login-error"></div>
        <div id="resetInvalid" class="auth-hint" style="display:none;">
          This link no longer works. <a href="login.html">Go back</a> and try again.
        </div>

        <form id="resetForm">
          <div class="field">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" minlength="6" required />
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" minlength="6" required />
          </div>
          <button type="submit" class="btn btn-accent" id="resetBtn" style="width:100%;">Set password</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=82"></script>
  <script>
    (async function () {
      const loggedIn = await Qlinic.isLoggedIn();
      if (!loggedIn) {
        document.getElementById('resetForm').style.display = 'none';
        document.getElementById('resetInvalid').style.display = 'block';
        return;
      }

      document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('resetBtn');
        const errorBox = document.getElementById('resetError');
        errorBox.style.display = 'none';
        const pass1 = document.getElementById('newPassword').value;
        const pass2 = document.getElementById('confirmPassword').value;
        if (pass1 !== pass2) {
          errorBox.textContent = "Passwords don't match.";
          errorBox.style.display = 'block';
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Saving...';
        try {
          await Qlinic.completePasswordReset(pass1);
          window.location.href = 'dashboard.html';
        } catch (err) {
          errorBox.textContent = err.message || 'Could not set a new password.';
          errorBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Set password';
        }
      });
    })();
  </script>
  <script>
    (function () {
      function applyTime(root) {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours() % 12;
        const sec = root.querySelector(".clock-sec");
        const min = root.querySelector(".clock-min");
        const hour = root.querySelector(".clock-hour");
        if (sec) sec.style.transform = `rotate(${s * 6}deg)`;
        if (min) min.style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
        if (hour) hour.style.transform = `rotate(${h * 30 + m * 0.5}deg)`;
      }
      function tickAll() {
        document.querySelectorAll(".clock-face").forEach(applyTime);
      }
      tickAll();
      setInterval(tickAll, 1000);
    })();
  </script>
</body>
</html>
