<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set new password: Qlinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=45" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-blob login-blob-teal"></div>
    <div class="login-blob login-blob-coral"></div>
    <div class="login-blob login-blob-purple"></div>
    <div class="login-card">
      <a href="index.html" class="brand">Qlinic</a>
      <h1>Set a new password</h1>

      <div id="resetError" class="login-error"></div>
      <div id="resetInvalid" class="login-hint" style="display:none;">
        This link no longer works. <a href="login.html">Go back</a> and try again.
      </div>

      <form id="resetForm">
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" minlength="6" required />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-accent" id="resetBtn" style="width:100%;">Set password</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=23"></script>
  <script>
    (async function () {
      const loggedIn = await Qlinic.isLoggedIn();
      if (!loggedIn) {
        document.getElementById('resetForm').style.display = 'none';
        document.getElementById('resetInvalid').style.display = 'block';
        return;
      }

      document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('resetBtn');
        const errorBox = document.getElementById('resetError');
        errorBox.style.display = 'none';
        const pass1 = document.getElementById('newPassword').value;
        const pass2 = document.getElementById('confirmPassword').value;
        if (pass1 !== pass2) {
          errorBox.textContent = "Passwords don't match.";
          errorBox.style.display = 'block';
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Saving...';
        try {
          await Qlinic.completePasswordReset(pass1);
          window.location.href = 'dashboard.html';
        } catch (err) {
          errorBox.textContent = err.message || 'Could not set a new password.';
          errorBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Set password';
        }
      });
    })();
  </script>
</body>
</html>
