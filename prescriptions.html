<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prescriptions: ClinVision</title>
<script>if (localStorage.getItem('qlinic_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/png" href="clinvision-favicon.png?v=2" />
<link rel="stylesheet" href="styles.css?v=365" />
</head>
<body style="visibility:hidden;">
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand">
        <span class="brand-top">
        <span class="brand-word-wrap">
          <span class="brand-word">ClinVision</span>
          <span class="brand-word-bar"></span>
        </span>
      </span>
      <span class="brand-tagline">Where clinics run better</span>
      </a>
      <div class="clinic-name-row">
        <img class="clinic-logo-thumb" id="clinicLogoThumb" style="display:none;" alt="" />
        <div class="clinic-name" id="clinicName">Loading…</div>
      </div>
      <nav>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="reception.html" class="nav-link" id="receptionNavLink">Reception</a>
        <a href="doctor.html" class="nav-link">Doctor View</a>
        <a href="billing.html" class="nav-link" id="billingNavLink">Billing</a>
        <a href="prescriptions.html" class="nav-link active">Prescriptions</a>
        <a href="revenue.html" class="nav-link" id="revenueNavLink">Revenue</a>
        <a href="trends.html" class="nav-link" id="trendsNavLink">Insights</a>
        <a href="display.html" class="nav-link" id="displayNavLink">Display Screen</a>
        <a href="settings.html" class="nav-link pinned-bottom" id="settingsNavLink">Settings</a>
      </nav>
    </aside>

    <main class="app-main">
      <div class="app-topbar">
        <h1>Prescriptions</h1>
        <div style="display:flex;align-items:center;gap:12px;">
          <button type="button" class="quick-walkin-btn" id="quickWalkinBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Quick Walk-In Rx
          </button>
          <div class="clock-pill">
            <span><span class="live-dot" style="width:7px;height:7px;margin-right:8px;"></span>Time: <span class="time" id="clockTime">--</span></span>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header" style="align-items:center;flex-wrap:nowrap;">
          <select id="rxDoctorFilter" style="display:none;flex:0 0 25%;min-width:0;"></select>
          <input type="text" id="rxSearchInput" placeholder="Search by name or phone… (searches full history)" autocomplete="off" style="flex:1;min-width:0;margin-bottom:0;" />
          <button type="button" id="rxSearchClearBtn" class="rx-search-clear-btn" style="display:none;">Clear</button>
        </div>
        <div id="rxListContainer"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Quick Walk-In Rx — for a doctor who doesn't manage appointments
       through the app at all. Patient details are entered here directly
       (Option A from the reviewed scope: no linked patients row at all —
       see migration 094 and Qlinic.createPrescription's walkin* params);
       everything below Patient Details is the exact same Chief complaint/
       Vitals & Tests/Medicines/Advice flow doctor.html's own Write
       Prescription modal already has, duplicated here since this page
       has no shared module to import it from (same convention as
       buildRxSidebarHtml/buildPrintHtml above). -->
  <div class="rx-modal-backdrop" id="wrxModalBackdrop" style="display:none;">
    <div class="rx-modal">
      <div class="rx-modal-bar">
        <h2>Quick Walk-In Prescription</h2>
        <button type="button" class="rx-modal-close" id="wrxModalCloseBtn" title="Close">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="rx-modal-body">
        <div>
          <div class="panel">
            <div class="panel-header"><h2>Patient details</h2></div>
            <div class="field" id="wrxDoctorFieldWrap" style="display:none;">
              <label>Doctor</label>
              <select id="wrxDoctorSelect"></select>
            </div>
            <div class="rx-vitals-grid">
              <div class="field"><label>Full name <span style="color:var(--accent);">*</span></label><input type="text" id="wrxName" placeholder="Patient's full name" autocomplete="off"></div>
              <div class="field"><label>Phone number <span style="color:var(--accent);">*</span></label><input type="tel" id="wrxPhone" placeholder="10-digit mobile number" autocomplete="off" maxlength="10"></div>
              <div class="field"><label>Age <span style="color:var(--accent);">*</span></label><input type="number" id="wrxAge" min="0" max="120" placeholder="e.g. 41" autocomplete="off"><span class="field-hint" id="wrxAgeError" style="display:none;color:var(--danger);">Enter an age between 0 and 120.</span></div>
              <div class="field">
                <label>Gender <span style="color:var(--accent);">*</span></label>
                <select id="wrxGender"><option value="">Select…</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="field">
              <label>Chief complaint</label>
              <textarea id="wrxComplaints" rows="2" placeholder="e.g. Sore throat, mild fever for 2 days"></textarea>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label>Diagnosis</label>
              <textarea id="wrxDiagnosis" rows="2" placeholder="e.g. Acute upper respiratory tract infection"></textarea>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header"><h2>Vitals &amp; Tests</h2></div>
            <div class="rx-vitals-grid">
              <div class="field"><label>BP (mmHg)</label><input type="text" id="wrxVitalBp" placeholder="e.g. 120/80" autocomplete="off"></div>
              <div class="field"><label>Pulse (bpm)</label><input type="text" id="wrxVitalPulse" placeholder="e.g. 78" autocomplete="off"></div>
              <div class="field"><label>Temp (°F)</label><input type="text" id="wrxVitalTemp" placeholder="e.g. 98.6" autocomplete="off"></div>
              <div class="field"><label>Weight (kg)</label><input type="text" id="wrxVitalWeight" placeholder="e.g. 68" autocomplete="off"></div>
            </div>
            <div class="field rx-med-search" style="margin-top:12px;margin-bottom:0;">
              <label>Tests advised</label>
              <input type="text" id="wrxTestInput" placeholder="Search X-Ray, MRI, CBC, Blood Sugar…" autocomplete="off">
              <div class="rx-med-suggest-list" id="wrxTestSuggestList" style="display:none;"></div>
            </div>
            <div class="rx-test-chips" id="wrxTestChips"></div>
          </div>

          <div class="panel">
            <div class="panel-header"><h2>Medicines</h2></div>
            <div id="wrxRowsContainer"></div>
            <div class="rx-row" id="wrxActiveRow">
              <div class="rx-row-head">
                <div style="flex:1;">
                  <div class="field rx-med-search" style="margin-bottom:0;">
                    <label>Medicine name</label>
                    <input type="text" id="wrxMedNameInput" placeholder="Type a brand, generic, or manufacturer…" autocomplete="off" />
                    <div class="rx-med-suggest-list" id="wrxMedSuggestList" style="display:none;"></div>
                  </div>
                </div>
                <button type="button" class="rx-remove" id="wrxDiscardDraftBtn" title="Clear this medicine">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
              </div>
              <div class="rx-field-grid">
                <div class="rx-field rx-combo"><label>Frequency</label><input type="text" id="wrxFrequencyInput" placeholder="e.g. 1-0-1 (BD)" autocomplete="off"><div class="rx-med-suggest-list" id="wrxFrequencySuggestList" style="display:none;"></div></div>
                <div class="rx-field rx-combo"><label>Duration</label><input type="text" id="wrxDurationInput" placeholder="e.g. 5 days" autocomplete="off"><div class="rx-med-suggest-list" id="wrxDurationSuggestList" style="display:none;"></div></div>
                <div class="rx-field rx-combo"><label>Instructions</label><input type="text" id="wrxInstructionsInput" placeholder="e.g. After food" autocomplete="off"><div class="rx-med-suggest-list" id="wrxInstructionsSuggestList" style="display:none;"></div></div>
              </div>
            </div>
            <button type="button" class="btn-sm accent-outline" id="wrxAddMedBtn" style="margin-top:4px;">+ Add this medicine</button>
          </div>

          <div class="panel">
            <div class="panel-header"><h2>Advice &amp; Follow Up</h2></div>
            <div class="field" style="margin-bottom:8px;">
              <label>General Advice</label>
              <textarea id="wrxAdvice" rows="2" placeholder="e.g. Warm salt-water gargles, plenty of fluids"></textarea>
            </div>
            <div class="field" style="max-width:280px;">
              <label>Follow Up (optional)</label>
              <div class="time-picker" id="wrxDatePickerWrap">
                <button type="button" class="time-picker-trigger placeholder" id="wrxDateTrigger">
                  <span id="wrxDateTriggerText">Choose a date</span>
                  <span class="time-picker-caret">▾</span>
                </button>
                <div class="time-picker-panel rx-date-panel" id="wrxDatePanel" style="display:none;"></div>
              </div>
              <span class="field-hint" id="wrxFollowUpHint" style="display:none;"></span>
            </div>
            <div class="rx-action-row">
              <button type="button" class="rx-action-btn" id="wrxSavePrintBtn"><span class="rx-action-icon">🖨️</span>Save &amp; print</button>
              <button type="button" class="rx-action-btn" id="wrxSaveOnlyBtn"><span class="rx-action-icon">💾</span>Save only</button>
            </div>
          </div>
        </div>

        <div class="rx-preview-wrap">
          <div class="a4" id="wrxLivePreview"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Same reusable print target/CSS every other prescription surface uses
       (see doctor.html) — one #printRx per page, filled right before
       window.print(). -->
  <div class="a4" id="printRx"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=125"></script>
  <script>
    (async function () {
      if (!(await Qlinic.requireLogin('login.html'))) return;

      document.querySelector('a.brand').addEventListener('click', async (e) => {
        e.preventDefault();
        if (await Qlinic.confirmDialog({ message: "Going to the homepage will end your session here, you'll need to log in again to get back in." })) {
          window.location.href = 'index.html';
        }
      });

      if (!(await Qlinic.canAccessPrescriptions())) {
        window.location.href = 'dashboard.html';
        return;
      }
      const amAdmin = await Qlinic.isAdmin();
      if (!amAdmin) {
        document.getElementById('receptionNavLink').style.display = 'none';
        document.getElementById('billingNavLink').style.display = 'none';
        document.getElementById('displayNavLink').style.display = 'none';
        document.getElementById('revenueNavLink').style.display = 'none';
      }
      await Qlinic.applyFeatureNavGating();
      document.body.style.visibility = 'visible';

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      function formatAgeGender(rx) {
        const age = rx.patientAge != null ? `${rx.patientAge} yrs` : '';
        const gender = rx.patientGender ? rx.patientGender.charAt(0).toUpperCase() + rx.patientGender.slice(1) : '';
        return [age, gender].filter(Boolean).join(', ');
      }
      function formatDate(iso) {
        return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
      }
      function initialsOf(name) {
        return (name || '').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
      }

      const clinic = await Qlinic.getClinic();
      document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
      if (clinic && clinic.logo_url) {
        document.getElementById('clinicLogoThumb').src = clinic.logo_url;
        document.getElementById('clinicLogoThumb').style.display = 'block';
      } else {
        document.getElementById('clinicLogoThumb').style.display = 'none';
      }
      document.getElementById('clockTime').textContent = Qlinic.formatTimestamp(new Date());
      setInterval(() => { document.getElementById('clockTime').textContent = Qlinic.formatTimestamp(new Date()); }, 30000);

      // Also doubles as Quick Walk-In Rx's own doctor list — an admin
      // picks who it's for there the same way they narrow this page's own
      // list; a doctor writes it under themselves, same as every other
      // prescription.
      let walkinDoctors = [];
      if (amAdmin) {
        walkinDoctors = await Qlinic.getDoctors();
        const sel = document.getElementById('rxDoctorFilter');
        sel.innerHTML = '<option value="">All doctors</option>' +
          walkinDoctors.map((d) => `<option value="${d.id}">${Qlinic.escapeHtml(d.name)}, ${Qlinic.escapeHtml(d.specialty)}</option>`).join('');
        sel.style.display = '';
        sel.addEventListener('change', () => { rxListPage = 0; loadCurrentTab(); });
      } else {
        const myProfile = await Qlinic.getMyProfile();
        if (myProfile && myProfile.doctorId) {
          const myDoctor = await Qlinic.getDoctor(myProfile.doctorId);
          if (myDoctor) walkinDoctors = [myDoctor];
        }
      }

      let expandedId = null;
      let searchDebounce = null;
      let searchSeq = 0;
      let rxListPage = 0;
      const RX_LIST_PAGE_SIZE = 10;

      // Cards are colored per doctor (hashed from name+specialty, stable
      // without needing a doctor id everywhere this renders) — a real
      // signal in the admin view where several doctors are mixed
      // together, and a harmless single repeated color when a doctor is
      // looking at only their own list. Reviewed as a mockup first; see
      // styles.css's own comment on .rx-history-card for why the actual
      // separation (shadow, spacing, alternating shade) never depends on
      // this color at all.
      const RX_ACCENT_COLORS = [
        { color: '#0d9488', bg: '#ccfbf1' },
        { color: '#2563eb', bg: '#dbeafe' },
        { color: '#7c3aed', bg: '#ede9fe' },
        { color: '#f97316', bg: '#ffedd5' },
        { color: '#db2777', bg: '#fce7f3' },
      ];
      function rxAccentFor(key) {
        let hash = 0;
        const s = key || '';
        for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
        return RX_ACCENT_COLORS[hash % RX_ACCENT_COLORS.length];
      }
      function formatTime(iso) {
        return new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
      }

      function renderList(items) {
        const container = document.getElementById('rxListContainer');
        const isSearching = document.getElementById('rxSearchInput').value.trim().length >= 2;
        if (!items.length) {
          container.innerHTML = `<div class="empty-state">${isSearching ? 'No prescriptions found for that search.' : 'No prescriptions yet.'}</div>`;
          return;
        }
        const totalPages = Math.max(1, Math.ceil(items.length / RX_LIST_PAGE_SIZE));
        if (rxListPage >= totalPages) rxListPage = totalPages - 1;
        const pageItems = items.slice(rxListPage * RX_LIST_PAGE_SIZE, rxListPage * RX_LIST_PAGE_SIZE + RX_LIST_PAGE_SIZE);
        container.innerHTML = pageItems.map((rx) => {
          const isOpen = rx.id === expandedId;
          const accent = rxAccentFor((rx.doctorName || '') + '|' + (rx.doctorSpecialty || ''));
          const doctorPill = amAdmin ? `<div class="rx-history-doctor-pill"><span class="dot"></span>Dr. ${Qlinic.escapeHtml(rx.doctorName)}</div>` : '';
          return `
            <div class="rx-history-card${isOpen ? ' expanded' : ''}" data-id="${rx.id}" style="--rx-card-color:${accent.color};--rx-card-bg-tint:${accent.bg};">
              <div class="rx-history-top">
                <div class="rx-history-who">
                  <div class="rx-history-avatar">${Qlinic.escapeHtml(initialsOf(rx.patientName))}</div>
                  <div style="min-width:0;">
                    <div class="rx-history-name">${Qlinic.escapeHtml(rx.patientName)}${formatAgeGender(rx) ? ' · ' + Qlinic.escapeHtml(formatAgeGender(rx)) : ''}${rx.isWalkin ? ' <span class="rx-walkin-flag">Walk-in</span>' : ''}</div>
                    <div class="rx-history-meta">${Qlinic.escapeHtml(rx.patientPhone || '')}</div>
                    ${doctorPill}
                  </div>
                </div>
                <div class="rx-history-middle">
                  ${rx.diagnosis ? `
                    <div class="rx-history-dx-label">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v6a4 4 0 0 0 4 4h0a4 4 0 0 0 4-4V2"/><path d="M8 15a6 6 0 1 0 12 0v-3"/><circle cx="20" cy="10" r="2"/></svg>
                      Diagnosis
                    </div>
                    <div class="rx-history-dx-text">${Qlinic.escapeHtml(rx.diagnosis)}</div>
                  ` : ''}
                  <div class="rx-history-tags">
                    <span class="rx-tag">${rx.items.length} medicine${rx.items.length === 1 ? '' : 's'}</span>
                    ${rx.followUpDate ? `<span class="rx-tag follow">Follow up: ${formatDate(rx.followUpDate)}</span>` : ''}
                  </div>
                </div>
                <div class="rx-history-right">
                  <div class="rx-history-time">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                    ${formatTime(rx.createdAt)}
                  </div>
                  <div class="rx-history-date">${formatDate(rx.createdAt)}</div>
                  <svg class="rx-history-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
                </div>
              </div>
              ${isOpen ? renderDetail(rx) : ''}
            </div>
          `;
        }).join('') + `<div id="rxListPagerWrap">${Qlinic.pagerHtml(rxListPage + 1, totalPages)}</div>`;
        Qlinic.wirePager(document.getElementById('rxListPagerWrap'), rxListPage + 1, totalPages, (p) => {
          rxListPage = p - 1;
          renderList(items);
          document.getElementById('rxListContainer').scrollIntoView({ block: 'start', behavior: 'smooth' });
        });
      }

      // Same left-column layout doctor.html's own preview/history use —
      // kept as an identical copy here since this page has no shared
      // module to import it from (renderDetail/buildPrintHtml below are
      // already independent copies of doctor.html's own functions).
      function buildRxSidebarHtml({ vitalsBp, vitalsPulse, vitalsTemp, vitalsWeight, testsOrdered }) {
        const hasVitals = vitalsBp || vitalsPulse || vitalsTemp || vitalsWeight;
        const vitalsHtml = hasVitals ? `
          <div class="rx-vital-block">
            <span class="lbl">Vitals</span>
            ${vitalsBp ? `<div class="rx-vital-line"><span class="vk">BP:</span> ${Qlinic.escapeHtml(vitalsBp)} mmHg</div>` : ''}
            ${vitalsPulse ? `<div class="rx-vital-line"><span class="vk">Pulse:</span> ${Qlinic.escapeHtml(vitalsPulse)} bpm</div>` : ''}
            ${vitalsTemp ? `<div class="rx-vital-line"><span class="vk">Temp:</span> ${Qlinic.escapeHtml(vitalsTemp)}°F</div>` : ''}
            ${vitalsWeight ? `<div class="rx-vital-line"><span class="vk">Weight:</span> ${Qlinic.escapeHtml(vitalsWeight)} kg</div>` : ''}
          </div>
        ` : '';
        const testsHtml = (testsOrdered && testsOrdered.length) ? `
          <div class="rx-vital-block">
            <span class="lbl">Tests advised</span>
            ${testsOrdered.map((t) => `<div class="rx-sidebar-test-item">${Qlinic.escapeHtml(t)}</div>`).join('')}
          </div>
        ` : '';
        return (vitalsHtml || testsHtml) ? `<div class="rx-sidebar">${vitalsHtml}${testsHtml}</div>` : '';
      }

      // Vitals as icon cards, tests as a checklist, clinical details and
      // the medicine table in their own panels, advice/follow-up/print
      // grouped on the right — reviewed as a mockup first (Prescription
      // Detail Redesign), adapted from a Gemini reference to this app's
      // real tokens and real features only (no Save-to-PDF/WhatsApp/
      // Order-Online — those aren't things this app does). Deliberately
      // separate from buildRxSidebarHtml/buildPrintHtml above, which
      // stay exactly as they are for the actual printed page.
      function buildRxDetailPanelsHtml(rx) {
        const vitalDefs = [
          { label: 'Pulse', value: rx.vitalsPulse ? `${rx.vitalsPulse} bpm` : '', cls: 'pulse', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>' },
          { label: 'Temp', value: rx.vitalsTemp ? `${rx.vitalsTemp}°F` : '', cls: 'temp', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg>' },
          { label: 'Weight', value: rx.vitalsWeight ? `${rx.vitalsWeight} kg` : '', cls: 'weight', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5h5"/></svg>' },
          { label: 'BP', value: rx.vitalsBp ? `${rx.vitalsBp} mmHg` : '', cls: 'bp', icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-9.33-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.33 6c-2.33 4.5-9.33 9-9.33 9Z"/></svg>' },
        ].filter((v) => v.value);
        const testsOrdered = rx.testsOrdered || [];
        const hasLeft = vitalDefs.length > 0 || testsOrdered.length > 0;

        const leftHtml = hasLeft ? `
          <div>
            ${vitalDefs.length ? `
              <div class="rx-panel-h">Vitals</div>
              <div class="rx-vitals-grid-view">
                ${vitalDefs.map((v) => `
                  <div class="rx-vital-card">
                    <div class="rx-vital-icon ${v.cls}">${v.icon}</div>
                    <div class="rx-vital-label">${v.label.toUpperCase()}</div>
                    <div class="rx-vital-value">${Qlinic.escapeHtml(v.value)}</div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
            ${testsOrdered.length ? `
              <div class="rx-panel-h">Tests advised</div>
              <div class="rx-tests-list">
                ${testsOrdered.map((t) => `<div class="rx-test-item"><span class="rx-test-check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>${Qlinic.escapeHtml(t)}</div>`).join('')}
              </div>
            ` : ''}
          </div>
        ` : '';

        const medsHtml = rx.items.length
          ? rx.items.map((item, i) => `
              <tr>
                <td style="color:var(--grey-500);">${i + 1}</td>

                  ${rx.complaints ? `<div class="rx-clinical-box"><div class="k">Chief complaint</div><div class="v">${Qlinic.escapeHtml(rx.complaints)}</div></div>` : ''}
                  ${rx.diagnosis ? `<div class="rx-clinical-box"><div class="k">Diagnosis</div><div class="v">${Qlinic.escapeHtml(rx.diagnosis)}</div></div>` : ''}
                </div>

              <div class="rx-panel-h">Prescription (Rx)</div>
              <table class="rx-table">
                <thead><tr><th style="width:16px;">#</th><th>Medicine</th><th>Dosage</th><th>Duration</th></tr></thead>
                <tbody>${medsHtml}</tbody>

            </div>
            <div>
              ${rx.advice ? `
                <div class="rx-panel-h">Advice</div>
                <div class="rx-advice-box"><div class="v">${Qlinic.escapeHtml(rx.advice)}</div></div>
              ` : ''}
              ${rx.followUpDate ? `
                <div class="rx-followup-chip">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                  <div><span class="f-date">Follow up</span>${Qlinic.escapeHtml(formatDate(rx.followUpDate))}</div>
                </div>
              ` : ''}
              <button type="button" class="rx-print-btn" data-print-id="${rx.id}">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                Print

            </div>

        `;
      }

      function renderDetail(rx) {
        return `<div class="rx-history-detail">${buildRxDetailPanelsHtml(rx)}</div>`;
      }

      let currentItems = [];

      function buildPrintHtml(rx) {
        const logoHtml = (clinic && clinic.logo_url) ? `<img class="rx-logo-img" src="${Qlinic.escapeHtml(clinic.logo_url)}" alt="" />` : '';
        const addressParts = clinic ? [clinic.address_line, clinic.city, clinic.state && clinic.pincode ? `${clinic.state} ${clinic.pincode}` : clinic.state].filter(Boolean) : [];
        const doctorQualLine = [rx.doctorQualification, rx.doctorRegistrationNumber ? `Reg. No. ${rx.doctorRegistrationNumber}` : ''].filter(Boolean).join(' · ');
        const medsHtml = rx.items.length
          ? rx.items.map((item, i) => `
              <tr>
                <td style="color:var(--grey-500);">${i + 1}</td>

        const footerLogoHtml = (clinic && clinic.logo_url) ? `<img class="rx-footer-logo" src="${Qlinic.escapeHtml(clinic.logo_url)}" alt="" />` : '';
        const sidebarHtml = buildRxSidebarHtml({
          vitalsBp: rx.vitalsBp, vitalsPulse: rx.vitalsPulse, vitalsTemp: rx.vitalsTemp, vitalsWeight: rx.vitalsWeight,
          testsOrdered: rx.testsOrdered,

        return `
          <div class="rx-head">
            ${logoHtml}
            <div>
              <div class="rx-clinic-name">${clinic ? Qlinic.escapeHtml(clinic.name) : ''}</div>

            </div>
            <div class="rx-doc-block">
              <div class="rx-doc-name">Dr. ${Qlinic.escapeHtml(rx.doctorName)}</div>
              <div class="rx-doc-qual">${Qlinic.escapeHtml(rx.doctorSpecialty)}</div>
              <div class="rx-doc-qual">${Qlinic.escapeHtml(doctorQualLine)}</div>

          </div>
          <div class="rx-body-row">
            ${sidebarHtml}
            <div class="rx-main">
              <div class="rx-info-grid">
                <div><span class="k">Patient:</span> ${Qlinic.escapeHtml(rx.patientName)}</div>
                <div><span class="k">Date:</span> ${Qlinic.escapeHtml(formatDate(rx.createdAt))}</div>
                <div><span class="k">Age &amp; Gender:</span> ${Qlinic.escapeHtml(formatAgeGender(rx))}</div>
                <div><span class="k">Phone:</span> ${Qlinic.escapeHtml(rx.patientPhone || '—')}</div>
              </div>
              <div class="rx-pair-row">
                ${rx.complaints ? `<div class="rx-dx"><b>Chief complaint</b><span>${Qlinic.escapeHtml(rx.complaints)}</span></div>` : ''}
                ${rx.diagnosis ? `<div class="rx-dx"><b>Diagnosis</b><span>${Qlinic.escapeHtml(rx.diagnosis)}</span></div>` : ''}
              </div>
              <table class="rx-table">
                <thead><tr><th style="width:16px;">#</th><th>Medicine</th><th>Dosage</th><th>Duration</th></tr></thead>
                <tbody>${medsHtml}</tbody>
              </table>
              <div class="rx-pair-row">
                ${rx.advice ? `<div class="rx-advice"><b>Advice</b><span>${Qlinic.escapeHtml(rx.advice)}</span></div>` : ''}
                ${rx.followUpDate ? `<div class="rx-advice"><b>Follow Up</b><span>${Qlinic.escapeHtml(formatDate(rx.followUpDate))}</span></div>` : ''}
              </div>
            </div>

          <div class="rx-footer">
            ${footerLogoHtml}
            <div>Thank you for visiting ${clinic ? Qlinic.escapeHtml(clinic.name) : ''}</div>

      }

      document.getElementById('rxListContainer').addEventListener('click', (e) => {
        const printBtn = e.target.closest('[data-print-id]');
        if (printBtn) {
          const rx = currentItems.find((r) => r.id === printBtn.dataset.printId);
          if (!rx) return;
          document.getElementById('printRx').innerHTML = buildPrintHtml(rx);
          window.print();
          return;
        }
        const card = e.target.closest('.rx-history-card');
        if (card) {
          const id = card.dataset.id;
          expandedId = expandedId === id ? null : id;
          renderList(currentItems);
          // Whether this just opened (revealing detail below) or closed
          // (snapping back to one line, likely leaving the page scrolled
          // to where that now-gone detail used to be), scroll back to
          // this exact card either way instead of leaving the page
          // wherever it happened to land.
          const target = document.querySelector(`.rx-history-card[data-id="${id}"]`);
          if (target) target.scrollIntoView({ block: 'start', behavior: 'smooth' });
        }
      });

      // No tabs, no period picker — an empty search box always means
      // "today" (the common case, one tap away from Write prescription),
      // and typing 2+ characters searches the patient's full history
      // instead, since that's the only other thing a doctor here ever
      // actually wants (see search_clinic_prescriptions, which already
      // has no date bound of its own).
      async function loadCurrentTab() {
        const container = document.getElementById('rxListContainer');
        container.innerHTML = '<div class="empty-state">Loading…</div>';
        try {
          const q = document.getElementById('rxSearchInput').value.trim();
          if (q.length >= 2) {
            currentItems = await Qlinic.searchClinicPrescriptions(q);
          } else {
            // This is a history feature — the default view is every
            // prescription the caller can see, most recent first, not
            // just today's.
            const doctorId = amAdmin ? (document.getElementById('rxDoctorFilter').value || null) : null;
            currentItems = await Qlinic.getClinicPrescriptions({ doctorId });
          }
        } catch (err) {
          showToast(err.message || 'Could not load prescriptions');
          currentItems = [];
        }
        renderList(currentItems);
      }

      function updateSearchClearBtn() {
        document.getElementById('rxSearchClearBtn').style.display = document.getElementById('rxSearchInput').value.trim() ? '' : 'none';
      }
      document.getElementById('rxSearchInput').addEventListener('input', () => {
        updateSearchClearBtn();
        clearTimeout(searchDebounce);
        const mySeq = ++searchSeq;
        searchDebounce = setTimeout(() => {
          if (mySeq === searchSeq) { rxListPage = 0; expandedId = null; loadCurrentTab(); }
        }, 300);
      });
      document.getElementById('rxSearchClearBtn').addEventListener('click', () => {
        const input = document.getElementById('rxSearchInput');
        input.value = '';
        updateSearchClearBtn();
        rxListPage = 0;
        expandedId = null;
        loadCurrentTab();
        input.focus();
      });

      // ============================================================
      // Quick Walk-In Rx — scoped and mocked up first (Option A: no
      // patients row ever created; identity lives directly on the
      // prescription via walkin_name/age/gender/phone). Everything below
      // Patient details mirrors doctor.html's own Write Prescription
      // modal as closely as possible (medicine search, combo fields,
      // vitals/tests) — duplicated here since this page has no shared
      // module to import that logic from, same convention already used
      // for buildRxSidebarHtml/buildPrintHtml above. The one deliberate
      // simplification: Follow Up uses a plain native date input instead
      // of doctor.html's closure-aware calendar — a walk-in Rx patient
      // isn't tied to a specific doctor's clinic-closure calendar the way
      // a queued follow-up visit is, so that complexity doesn't carry
      // over cleanly here.
      // ============================================================
      const WRX_FREQUENCY_PRESETS = [
        '1-0-0 (Once daily / OD)', '0-0-1 (Once at night / HS)', '1-0-1 (Twice daily / BD)',
        '1-1-1 (Thrice daily / TDS)', '1-1-1-1 (Four times daily / QID)', 'SOS (As needed)',
        'Stat (Single dose)', 'Every 4 hours', 'Every 6 hours', 'Every 8 hours', 'Every 12 hours',
        'Once weekly', 'Alternate day',
      ];
      const WRX_DURATION_PRESETS = [
        '1 day', '2 days', '3 days', '5 days', '7 days', '10 days', '14 days', '15 days',
        '1 month', '2 months', '3 months', 'Continue', 'SOS',
      ];
      const WRX_INSTRUCTIONS_PRESETS = [
        'Before food', 'After food', 'With food', 'Empty stomach', 'With warm water', 'With milk',
        'At bedtime', 'Morning only', 'Do not skip doses', 'Complete the course', 'Avoid alcohol',
        'Chew and swallow', 'Dissolve in water', 'Shake well before use',
      ];
      const WRX_TEST_CATALOG = [
        'X-Ray Chest', 'X-Ray Abdomen', 'X-Ray Spine', 'X-Ray Limb/Joint',
        'Ultrasound (USG) Abdomen', 'Ultrasound (USG) Pelvis', 'Ultrasound (USG) Obstetric',
        'CT Scan', 'MRI', 'Mammography', 'ECG (Electrocardiogram)', '2D Echo (Echocardiogram)', 'Doppler Study',
        'CBC (Complete Blood Count)', 'Blood Sugar - Fasting', 'Blood Sugar - Post Prandial', 'Blood Sugar - Random',
        'HbA1c (Diabetes)', 'Lipid Profile', 'Liver Function Test (LFT)', 'Kidney Function Test (KFT/RFT)',
        'Thyroid Profile (T3 T4 TSH)', 'Urine Routine & Microscopy', 'Stool Routine', 'Blood Group & Rh Typing',
        'ESR', 'CRP', 'Widal Test (Typhoid)', 'Dengue NS1/IgG/IgM', 'Malaria Antigen', 'HIV Test',
        'HBsAg (Hepatitis B)', 'VDRL (Syphilis)', 'Vitamin D', 'Vitamin B12', 'Serum Creatinine', 'Blood Urea',
        'Uric Acid', 'PSA (Prostate Specific Antigen)', 'Pregnancy Test (Beta hCG)', 'Sputum Culture/AFB',
        'COVID-19 RT-PCR/Antigen',
      ];

      let wrxItems = [];
      let wrxDraftMed = null;
      let wrxTestsOrdered = [];
      let wrxClinicMedicinesCache = [];
      let wrxMedSearchDebounce = null;
      let wrxMedSearchAbort = null;
      let wrxMedSearchSeq = 0;
      let wrxSearchErrorShown = false;
      let wrxSaving = false;
      let wrxSelectedDoctor = null;

      // Name/age/phone validation — same rules and behavior as Reception's
      // own Add Patient form (isValidPhone/isValidAge/digit-stripping in
      // reception.html): no digits in the name, phone strips to digits
      // and caps at 10, age is a plain 0-120 number input.
      document.getElementById('wrxName').addEventListener('input', function () {
        this.value = this.value.replace(/[0-9]/g, '');
      });
      document.getElementById('wrxPhone').addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 10);
      });
      function wrxIsValidAge(value) {
        if (value === '') return true;
        return /^[0-9]+$/.test(value) && Number(value) <= 120;
      }
      document.getElementById('wrxAge').addEventListener('input', function () {
        document.getElementById('wrxAgeError').style.display = wrxIsValidAge(this.value) ? 'none' : '';
      });

      // Follow-up date — the exact same shortcuts+calendar widget
      // doctor.html's Write Prescription modal uses (a plain date input
      // was tried first and rejected — it read as a step down from the
      // rest of the app). Closure/holiday awareness is scoped to
      // whichever doctor is selected for this prescription, reloaded on
      // open and whenever that selection changes.
      const WRX_DAY_NAMES = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
      let wrxClosedDateSet = new Set();
      let wrxWeeklyOffDays = [];
      let wrxFollowUpValue = null;
      let wrxCalendarViewDate = new Date();

      async function wrxLoadClosureData(doctorId) {
        wrxClosedDateSet = new Set();
        wrxWeeklyOffDays = (clinic && clinic.weekly_off_days) || [];
        if (!doctorId) return;
        try {
          const [closures, holidays] = await Promise.all([Qlinic.getClinicClosures(), Qlinic.getDoctorHolidays(doctorId)]);
          closures.forEach((c) => wrxClosedDateSet.add(c.date));
          holidays.forEach((h) => wrxClosedDateSet.add(h.date));
        } catch (err) {
          // Shortcuts still work without closure data — they just won't skip a holiday this once.
        }
      }
      function wrxToDateInputValue(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }
      function wrxIsClosedDate(d) {
        if (wrxWeeklyOffDays.includes(WRX_DAY_NAMES[d.getDay()])) return true;
        return wrxClosedDateSet.has(wrxToDateInputValue(d));
      }
      function wrxSelectedDateObj() {
        if (!wrxFollowUpValue) return null;
        const [y, m, d] = wrxFollowUpValue.split('-').map(Number);
        return new Date(y, m - 1, d);
      }
      function wrxUpdateDateTriggerText() {
        const trigger = document.getElementById('wrxDateTrigger');
        const text = document.getElementById('wrxDateTriggerText');
        if (!wrxFollowUpValue) {
          text.textContent = 'Choose a date';
          trigger.classList.add('placeholder');
          return;
        }
        trigger.classList.remove('placeholder');
        const d = wrxSelectedDateObj();
        const todayStr = wrxToDateInputValue(new Date());
        const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
        if (wrxFollowUpValue === todayStr) text.textContent = `Today, ${d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}`;
        else if (wrxFollowUpValue === wrxToDateInputValue(tomorrow)) text.textContent = `Tomorrow, ${d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}`;
        else text.textContent = d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
      }
      function wrxPickFollowUpDate(daysFromNow) {
        const d = new Date();
        d.setDate(d.getDate() + daysFromNow);
        let shifted = false;
        while (wrxIsClosedDate(d)) { d.setDate(d.getDate() + 1); shifted = true; }
        wrxFollowUpValue = wrxToDateInputValue(d);
        wrxUpdateDateTriggerText();
        const hint = document.getElementById('wrxFollowUpHint');
        if (shifted) {
          hint.textContent = 'Adjusted forward to skip a clinic holiday or weekly off day.';
          hint.style.display = 'block';
        } else {
          hint.style.display = 'none';
        }
        wrxUpdatePreview();
      }
      function wrxRenderDatePanel() {
        const panel = document.getElementById('wrxDatePanel');
        const y = wrxCalendarViewDate.getFullYear();
        const m = wrxCalendarViewDate.getMonth();
        const first = new Date(y, m, 1);
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const todayStr = wrxToDateInputValue(new Date());
        let cells = '';
        for (let i = 0; i < first.getDay(); i++) cells += '<div class="rx-cal-cell empty"></div>';
        for (let day = 1; day <= daysInMonth; day++) {
          const d = new Date(y, m, day);
          const dStr = wrxToDateInputValue(d);
          const isPast = dStr < todayStr;
          const closed = !isPast && wrxIsClosedDate(d);
          const classes = ['rx-cal-cell'];
          if (dStr === todayStr) classes.push('today');
          if (dStr === wrxFollowUpValue) classes.push('selected');
          if (isPast) classes.push('past');
          else if (closed) classes.push('closed');
          cells += `<div class="${classes.join(' ')}" ${(isPast || closed) ? '' : `data-date="${dStr}"`}>${day}</div>`;
        }
        panel.innerHTML = `
          <div class="rx-cal-shortcuts">
            <button type="button" class="btn-sm accent-outline" data-followup-days="7">In 7 days</button>
            <button type="button" class="btn-sm accent-outline" data-followup-days="15">In 15 days</button>
            <button type="button" class="btn-sm accent-outline" data-followup-days="28">In 4 weeks</button>
          </div>
          <div class="rx-cal-nav">
            <button type="button" class="rx-cal-nav-btn" data-cal-nav="prev">&lsaquo;</button>
            <div class="rx-cal-month-label">${first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</div>
            <button type="button" class="rx-cal-nav-btn" data-cal-nav="next">&rsaquo;</button>
          </div>
          <div class="rx-cal-weekdays">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((w) => `<div>${w}</div>`).join('')}</div>
          <div class="rx-cal-grid">${cells}</div>
        `;
      }
      function wrxOpenDatePanel() {
        wrxCalendarViewDate = wrxSelectedDateObj() || new Date();
        wrxRenderDatePanel();
        const panel = document.getElementById('wrxDatePanel');
        const trigger = document.getElementById('wrxDateTrigger');
        const rect = trigger.getBoundingClientRect();
        panel.classList.toggle('flip-up', (window.innerHeight - rect.bottom) < 360 && rect.top > (window.innerHeight - rect.bottom));
        panel.style.display = 'block';
      }
      function wrxCloseDatePanel() {
        document.getElementById('wrxDatePanel').style.display = 'none';
      }
      document.getElementById('wrxDateTrigger').addEventListener('click', (e) => {
        e.stopPropagation();
        const panel = document.getElementById('wrxDatePanel');
        if (panel.style.display === 'block') wrxCloseDatePanel();
        else wrxOpenDatePanel();
      });
      document.getElementById('wrxDatePanel').addEventListener('click', (e) => {
        e.stopPropagation();
        const shortcutBtn = e.target.closest('[data-followup-days]');
        if (shortcutBtn) { wrxPickFollowUpDate(Number(shortcutBtn.dataset.followupDays)); wrxCloseDatePanel(); return; }
        const navBtn = e.target.closest('[data-cal-nav]');
        if (navBtn) {
          const y = wrxCalendarViewDate.getFullYear();
          const m = wrxCalendarViewDate.getMonth();
          wrxCalendarViewDate = new Date(y, navBtn.dataset.calNav === 'prev' ? m - 1 : m + 1, 1);
          wrxRenderDatePanel();
          return;
        }
        const cell = e.target.closest('.rx-cal-cell[data-date]');
        if (cell) {
          wrxFollowUpValue = cell.dataset.date;
          wrxUpdateDateTriggerText();
          document.getElementById('wrxFollowUpHint').style.display = 'none';
          wrxCloseDatePanel();
          wrxUpdatePreview();
        }
      });
      document.addEventListener('click', (e) => {
        if (!document.getElementById('wrxDatePickerWrap').contains(e.target)) wrxCloseDatePanel();
      });

      function wrxShouldFlipUp(triggerEl, estimatedPanelHeight) {
        const rect = triggerEl.getBoundingClientRect();
        const spaceBelow = window.innerHeight - rect.bottom;
        const spaceAbove = rect.top;
        return spaceBelow < estimatedPanelHeight && spaceAbove > spaceBelow;
      }

      function wrxSetupComboField(inputId, listId, options) {
        const input = document.getElementById(inputId);
        const list = document.getElementById(listId);
        function render(filterText) {
          const q = (filterText || '').trim().toLowerCase();
          const matches = q ? options.filter((o) => o.toLowerCase().includes(q)) : options;
          if (!matches.length) { list.style.display = 'none'; list.innerHTML = ''; return; }
          list.innerHTML = matches.map((o, i) => `<div class="rx-med-suggest-item" data-i="${i}"><div class="mr-name">${Qlinic.escapeHtml(o)}</div></div>`).join('');
          list.dataset.options = JSON.stringify(matches);
          list.classList.toggle('flip-up', wrxShouldFlipUp(input, 260));
          list.style.display = 'block';
          list.scrollTop = 0;
        }
        input.addEventListener('focus', () => render(input.value));
        input.addEventListener('input', () => render(input.value));
        input.addEventListener('blur', () => setTimeout(() => { list.style.display = 'none'; }, 150));
        list.addEventListener('mousedown', (e) => {
          const item = e.target.closest('.rx-med-suggest-item');
          if (!item) return;
          const opts = JSON.parse(list.dataset.options || '[]');
          input.value = opts[Number(item.dataset.i)];
          list.style.display = 'none';
        });
      }
      wrxSetupComboField('wrxFrequencyInput', 'wrxFrequencySuggestList', WRX_FREQUENCY_PRESETS);
      wrxSetupComboField('wrxDurationInput', 'wrxDurationSuggestList', WRX_DURATION_PRESETS);
      wrxSetupComboField('wrxInstructionsInput', 'wrxInstructionsSuggestList', WRX_INSTRUCTIONS_PRESETS);

      function wrxRenderTestChips() {
        document.getElementById('wrxTestChips').innerHTML = wrxTestsOrdered.map((t, i) => `
          <span class="rx-test-chip">${Qlinic.escapeHtml(t)}<button type="button" data-idx="${i}" title="Remove">
            <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button></span>
        `).join('');
      }
      document.getElementById('wrxTestChips').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-idx]');
        if (!btn) return;
        wrxTestsOrdered.splice(Number(btn.dataset.idx), 1);
        wrxRenderTestChips();
        wrxUpdatePreview();
      });
      document.getElementById('wrxTestInput').addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        const list = document.getElementById('wrxTestSuggestList');
        if (!q) { list.style.display = 'none'; list.innerHTML = ''; return; }
        const matches = WRX_TEST_CATALOG.filter((t) => !wrxTestsOrdered.includes(t) && t.toLowerCase().includes(q)).slice(0, 8);
        if (!matches.length) { list.style.display = 'none'; list.innerHTML = ''; return; }
        list.innerHTML = matches.map((t, i) => `<div class="rx-med-suggest-item" data-i="${i}"><div class="mr-name">${Qlinic.escapeHtml(t)}</div></div>`).join('');
        list.dataset.results = JSON.stringify(matches);
        list.style.display = 'block';
      });
      document.getElementById('wrxTestInput').addEventListener('blur', () => {
        setTimeout(() => { document.getElementById('wrxTestSuggestList').style.display = 'none'; }, 150);
      });
      document.getElementById('wrxTestSuggestList').addEventListener('mousedown', (e) => {
        const item = e.target.closest('.rx-med-suggest-item');
        if (!item) return;
        const list = document.getElementById('wrxTestSuggestList');
        const results = JSON.parse(list.dataset.results || '[]');
        const t = results[Number(item.dataset.i)];
        if (!t) return;
        wrxTestsOrdered.push(t);
        document.getElementById('wrxTestInput').value = '';
        list.style.display = 'none';
        wrxRenderTestChips();
        wrxUpdatePreview();
      });

      function wrxResetDraftFields() {
        document.getElementById('wrxMedNameInput').value = '';
        document.getElementById('wrxFrequencyInput').value = '';
        document.getElementById('wrxDurationInput').value = '';
        document.getElementById('wrxInstructionsInput').value = '';
        ['wrxMedSuggestList', 'wrxFrequencySuggestList', 'wrxDurationSuggestList', 'wrxInstructionsSuggestList'].forEach((id) => {
          const list = document.getElementById(id);
          list.style.display = 'none';
          list.innerHTML = '';
        });
        wrxDraftMed = null;
        clearTimeout(wrxMedSearchDebounce);
        if (wrxMedSearchAbort) wrxMedSearchAbort.abort();
        wrxMedSearchSeq++;
      }

      function wrxRenderRows() {
        const container = document.getElementById('wrxRowsContainer');
        container.innerHTML = wrxItems.map((item, idx) => `
          <div class="rx-row collapsed" data-idx="${idx}">
            <span class="rc-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></span>
            <div class="rc-summary">
              <div class="rc-name">${Qlinic.escapeHtml(item.name)}</div>
              <div class="rc-detail">${Qlinic.escapeHtml([item.frequency, item.durationText, item.instructions].filter(Boolean).join(' · '))}</div>
            </div>
            <div class="rc-actions">
              <button type="button" class="rx-edit-btn" data-idx="${idx}" title="Edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
              <button type="button" class="rx-delete-btn" data-idx="${idx}" title="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
            </div>
          </div>
        `).join('');
      }
      function wrxScrollActiveMedRowIntoView() {
        document.getElementById('wrxAddMedBtn').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
      document.getElementById('wrxRowsContainer').addEventListener('click', (e) => {
        const delBtn = e.target.closest('.rx-delete-btn');
        if (delBtn) {
          wrxItems.splice(Number(delBtn.dataset.idx), 1);
          wrxRenderRows();
          wrxUpdatePreview();
          return;
        }
        const row = e.target.closest('.rx-row.collapsed');
        if (row) {
          const idx = Number(row.dataset.idx);
          const item = wrxItems[idx];
          wrxItems.splice(idx, 1);
          document.getElementById('wrxMedNameInput').value = item.name;
          document.getElementById('wrxFrequencyInput').value = item.frequency;
          document.getElementById('wrxDurationInput').value = item.durationText;
          document.getElementById('wrxInstructionsInput').value = item.instructions;
          wrxDraftMed = (item.clinicMedicineId || item.genericMedicineId)
            ? { clinicMedicineId: item.clinicMedicineId, genericMedicineId: item.genericMedicineId, name: item.name, composition: item.composition }
            : null;
          wrxRenderRows();
          wrxUpdatePreview();
          document.getElementById('wrxMedNameInput').focus();
          wrxScrollActiveMedRowIntoView();
        }
      });

      function wrxRenderMedSuggestions(results) {
        const list = document.getElementById('wrxMedSuggestList');
        const input = document.getElementById('wrxMedNameInput');
        if (!results.length) {
          list.innerHTML = '<div class="rx-med-suggest-empty">No match — this will be saved as typed</div>';
          list.removeAttribute('data-results');
          list.classList.toggle('flip-up', wrxShouldFlipUp(input, 260));
          list.style.display = 'block';
          list.scrollTop = 0;
          return;
        }
        list.innerHTML = results.map((r, i) => `
          <div class="rx-med-suggest-item" data-i="${i}">
            <div><div class="mr-name">${Qlinic.escapeHtml(r.name)}</div>${r.composition ? `<div class="mr-comp">${Qlinic.escapeHtml(r.composition)}</div>` : ''}</div>
          </div>
        `).join('');
        list.dataset.results = JSON.stringify(results);
        list.classList.toggle('flip-up', wrxShouldFlipUp(input, 260));
        list.style.display = 'block';
        list.scrollTop = 0;
      }
      document.getElementById('wrxMedNameInput').addEventListener('input', (e) => {
        wrxDraftMed = null;
        const q = e.target.value.trim();
        clearTimeout(wrxMedSearchDebounce);
        if (wrxMedSearchAbort) wrxMedSearchAbort.abort();
        const list = document.getElementById('wrxMedSuggestList');
        if (q.length < 2) { list.style.display = 'none'; list.innerHTML = ''; return; }

        const qLower = q.toLowerCase();
        const localMatches = wrxClinicMedicinesCache.filter((m) => m.name.toLowerCase().startsWith(qLower)).slice(0, 8);
        if (localMatches.length) wrxRenderMedSuggestions(localMatches);
        else { list.style.display = 'none'; list.innerHTML = ''; }

        const mySeq = ++wrxMedSearchSeq;
        wrxMedSearchDebounce = setTimeout(async () => {
          const controller = new AbortController();
          wrxMedSearchAbort = controller;
          let results = [];
          try {
            results = await Qlinic.searchMedicinesForRx(q, controller.signal);
          } catch (err) {
            if (err.name === 'AbortError') return;
            console.error('Medicine search failed:', err);
            if (!wrxSearchErrorShown) { wrxSearchErrorShown = true; showToast(err.message || 'Medicine search failed'); }
            return;
          }
          if (mySeq !== wrxMedSearchSeq) return;
          if (wrxDraftMed) return;
          if (document.activeElement !== document.getElementById('wrxMedNameInput')) return;
          const seen = new Set(localMatches.map((m) => m.name.toLowerCase()));
          const merged = localMatches.concat(results.filter((r) => !seen.has(r.name.toLowerCase())));
          wrxRenderMedSuggestions(merged);
        }, 180);
      });
      document.getElementById('wrxMedNameInput').addEventListener('blur', () => {
        setTimeout(() => { document.getElementById('wrxMedSuggestList').style.display = 'none'; }, 150);
      });
      document.getElementById('wrxMedSuggestList').addEventListener('mousedown', (e) => {
        const item = e.target.closest('.rx-med-suggest-item');
        if (!item) return;
        const list = document.getElementById('wrxMedSuggestList');
        const results = JSON.parse(list.dataset.results || '[]');
        const r = results[Number(item.dataset.i)];
        if (!r) return;
        wrxDraftMed = { clinicMedicineId: r.clinicMedicineId, genericMedicineId: r.genericMedicineId, name: r.name, composition: r.composition };
        document.getElementById('wrxMedNameInput').value = r.name;
        list.style.display = 'none';
      });
      document.getElementById('wrxDiscardDraftBtn').addEventListener('click', () => wrxResetDraftFields());
      document.getElementById('wrxAddMedBtn').addEventListener('click', () => {
        const nameInput = document.getElementById('wrxMedNameInput');
        const name = nameInput.value.trim();
        if (!name) { nameInput.focus(); return; }
        wrxItems.push({
          clinicMedicineId: wrxDraftMed ? wrxDraftMed.clinicMedicineId : null,
          genericMedicineId: wrxDraftMed ? wrxDraftMed.genericMedicineId : null,
          freeTextName: wrxDraftMed ? null : name,
          name,
          composition: wrxDraftMed ? wrxDraftMed.composition : '',
          frequency: document.getElementById('wrxFrequencyInput').value.trim(),
          durationText: document.getElementById('wrxDurationInput').value.trim(),
          instructions: document.getElementById('wrxInstructionsInput').value.trim(),
        });
        wrxResetDraftFields();
        wrxRenderRows();
        wrxUpdatePreview();
        nameInput.focus();
        wrxScrollActiveMedRowIntoView();
      });

      function wrxFormatAgeGender() {
        const age = document.getElementById('wrxAge').value.trim();
        const genderRaw = document.getElementById('wrxGender').value;
        const gender = genderRaw ? genderRaw.charAt(0).toUpperCase() + genderRaw.slice(1) : '';
        return [age ? `${age} yrs` : '', gender].filter(Boolean).join(', ');
      }

      function wrxBuildHtml() {
        const doctor = wrxSelectedDoctor;
        const logoHtml = (clinic && clinic.logo_url) ? `<img class="rx-logo-img" src="${Qlinic.escapeHtml(clinic.logo_url)}" alt="" />` : '';
        const addressParts = clinic ? [clinic.address_line, clinic.city, clinic.state && clinic.pincode ? `${clinic.state} ${clinic.pincode}` : clinic.state].filter(Boolean) : [];
        const doctorQualLine = doctor ? [doctor.qualification, doctor.registrationNumber ? `Reg. No. ${doctor.registrationNumber}` : ''].filter(Boolean).join(' · ') : '';

        const name = document.getElementById('wrxName').value.trim();
        const phone = document.getElementById('wrxPhone').value.trim();
        const complaints = document.getElementById('wrxComplaints').value.trim();
        const dx = document.getElementById('wrxDiagnosis').value.trim();
        const advice = document.getElementById('wrxAdvice').value.trim();
        const followUpLabel = wrxFollowUpValue
          ? wrxSelectedDateObj().toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })
          : '';

        const vitalsBp = document.getElementById('wrxVitalBp').value.trim();
        const vitalsPulse = document.getElementById('wrxVitalPulse').value.trim();
        const vitalsTemp = document.getElementById('wrxVitalTemp').value.trim();
        const vitalsWeight = document.getElementById('wrxVitalWeight').value.trim();
        const sidebarHtml = buildRxSidebarHtml({ vitalsBp, vitalsPulse, vitalsTemp, vitalsWeight, testsOrdered: wrxTestsOrdered });

        const medsHtml = wrxItems.length
          ? wrxItems.map((item, i) => `
              <tr>
                <td style="color:var(--grey-500);">${i + 1}</td>
                <td><div class="rt-name">${Qlinic.escapeHtml(item.name)}${item.composition ? ` <span class="rt-comp" style="font-weight:400;">(${Qlinic.escapeHtml(item.composition)})</span>` : ''}</div>${item.instructions ? `<div class="rt-instr">${Qlinic.escapeHtml(item.instructions)}</div>` : ''}</td>
                <td style="white-space:nowrap;">${Qlinic.escapeHtml(item.frequency)}</td>
                <td>${Qlinic.escapeHtml(item.durationText)}</td>
              </tr>
            `).join('')
          : '<tr><td colspan="4" style="color:var(--grey-500);font-style:italic;">No medicines added yet</td></tr>';
        const footerLogoHtml = (clinic && clinic.logo_url) ? `<img class="rx-footer-logo" src="${Qlinic.escapeHtml(clinic.logo_url)}" alt="" />` : '';

        return `
          <div class="rx-head">
            ${logoHtml}
            <div>
              <div class="rx-clinic-name">${clinic ? Qlinic.escapeHtml(clinic.name) : ''}</div>
              <div class="rx-clinic-addr">${Qlinic.escapeHtml(addressParts.join(', '))}</div>
            </div>
            <div class="rx-doc-block">
              <div class="rx-doc-name">${doctor ? `Dr. ${Qlinic.escapeHtml(doctor.name)}` : ''}</div>
              <div class="rx-doc-qual">${Qlinic.escapeHtml((doctor && doctor.specialty) || '')}</div>
              <div class="rx-doc-qual">${Qlinic.escapeHtml(doctorQualLine)}</div>
            </div>
          </div>
          <div class="rx-body-row">
            ${sidebarHtml}
            <div class="rx-main">
              <div class="rx-info-grid">
                <div><span class="k">Patient:</span> ${Qlinic.escapeHtml(name)}</div>
                <div><span class="k">Date:</span> ${Qlinic.escapeHtml(new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }))}</div>
                <div><span class="k">Age &amp; Gender:</span> ${Qlinic.escapeHtml(wrxFormatAgeGender())}</div>
                <div><span class="k">Phone:</span> ${Qlinic.escapeHtml(phone || '—')}</div>
              </div>
              <div class="rx-pair-row">
                ${complaints ? `<div class="rx-dx"><b>Chief complaint</b><span>${Qlinic.escapeHtml(complaints)}</span></div>` : ''}
                ${dx ? `<div class="rx-dx"><b>Diagnosis</b><span>${Qlinic.escapeHtml(dx)}</span></div>` : ''}
              </div>
              <table class="rx-table">
                <thead><tr><th style="width:16px;">#</th><th>Medicine</th><th>Dosage</th><th>Duration</th></tr></thead>
                <tbody>${medsHtml}</tbody>
              </table>
              <div class="rx-pair-row">
                ${advice ? `<div class="rx-advice"><b>Advice</b><span>${Qlinic.escapeHtml(advice)}</span></div>` : ''}
                ${followUpLabel ? `<div class="rx-advice"><b>Follow Up</b><span>${Qlinic.escapeHtml(followUpLabel)}</span></div>` : ''}
              </div>
            </div>
          </div>
          <div class="rx-footer">
            ${footerLogoHtml}
            <div>Thank you for visiting ${clinic ? Qlinic.escapeHtml(clinic.name) : ''}</div>
          </div>
        `;
      }
      function wrxUpdatePreview() {
        const html = wrxBuildHtml();
        document.getElementById('wrxLivePreview').innerHTML = html;
        document.getElementById('printRx').innerHTML = html;
      }
      // Vitals are numbers (plus / for BP's "120/80" and - for a negative
      // reading), never free text — strips anything else as it's typed.
      // Registered before the preview-update listeners below (same input
      // event, same elements) so the preview reflects the already-
      // stripped value rather than lagging one keystroke behind it.
      ['wrxVitalBp', 'wrxVitalPulse', 'wrxVitalTemp', 'wrxVitalWeight'].forEach((id) => {
        document.getElementById(id).addEventListener('input', function () {
          this.value = this.value.replace(/[^0-9/.-]/g, '');
        });
      });
      [
        'wrxName', 'wrxPhone', 'wrxAge', 'wrxGender', 'wrxComplaints', 'wrxDiagnosis', 'wrxAdvice',
        'wrxVitalBp', 'wrxVitalPulse', 'wrxVitalTemp', 'wrxVitalWeight',
      ].forEach((id) => {
        document.getElementById(id).addEventListener('input', wrxUpdatePreview);
        document.getElementById(id).addEventListener('change', wrxUpdatePreview);
      });
      document.getElementById('wrxDoctorSelect').addEventListener('change', () => {
        wrxSelectedDoctor = walkinDoctors.find((d) => d.id === document.getElementById('wrxDoctorSelect').value) || null;
        wrxLoadClosureData(wrxSelectedDoctor ? wrxSelectedDoctor.id : null);
        wrxUpdatePreview();
      });

      function wrxResetModalState() {
        wrxItems = [];
        wrxTestsOrdered = [];
        wrxSearchErrorShown = false;
        wrxResetDraftFields();
        document.getElementById('wrxName').value = '';
        document.getElementById('wrxPhone').value = '';
        document.getElementById('wrxAge').value = '';
        document.getElementById('wrxGender').value = '';
        document.getElementById('wrxComplaints').value = '';
        document.getElementById('wrxDiagnosis').value = '';
        document.getElementById('wrxAdvice').value = '';
        document.getElementById('wrxVitalBp').value = '';
        document.getElementById('wrxVitalPulse').value = '';
        document.getElementById('wrxVitalTemp').value = '';
        document.getElementById('wrxVitalWeight').value = '';
        document.getElementById('wrxAgeError').style.display = 'none';
        wrxFollowUpValue = null;
        wrxUpdateDateTriggerText();
        document.getElementById('wrxFollowUpHint').style.display = 'none';
        wrxRenderTestChips();
        wrxRenderRows();
        wrxUpdatePreview();
      }

      function openWrxModal() {
        wrxResetModalState();
        const doctorFieldWrap = document.getElementById('wrxDoctorFieldWrap');
        const doctorSelect = document.getElementById('wrxDoctorSelect');
        if (amAdmin) {
          doctorSelect.innerHTML = walkinDoctors.map((d) => `<option value="${d.id}">${Qlinic.escapeHtml(d.name)}, ${Qlinic.escapeHtml(d.specialty)}</option>`).join('');
          doctorFieldWrap.style.display = walkinDoctors.length ? '' : 'none';
          wrxSelectedDoctor = walkinDoctors[0] || null;
          if (wrxSelectedDoctor) doctorSelect.value = wrxSelectedDoctor.id;
        } else {
          doctorFieldWrap.style.display = 'none';
          wrxSelectedDoctor = walkinDoctors[0] || null;
        }
        Qlinic.getClinicMedicinesForRx().then((meds) => { wrxClinicMedicinesCache = meds; }).catch(() => { wrxClinicMedicinesCache = []; });
        if (wrxSelectedDoctor) wrxLoadClosureData(wrxSelectedDoctor.id);
        document.getElementById('wrxModalBackdrop').style.display = 'flex';
        wrxUpdatePreview();
      }
      function closeWrxModal() {
        document.getElementById('wrxModalBackdrop').style.display = 'none';
      }
      document.getElementById('quickWalkinBtn').addEventListener('click', () => {
        if (!walkinDoctors.length) { showToast(amAdmin ? 'Add a doctor first, from Team settings.' : 'Your account isn\'t linked to a doctor profile yet.'); return; }
        openWrxModal();
      });
      document.getElementById('wrxModalCloseBtn').addEventListener('click', closeWrxModal);
      document.getElementById('wrxModalBackdrop').addEventListener('click', (e) => {
        if (e.target === document.getElementById('wrxModalBackdrop')) closeWrxModal();
      });

      async function saveWrxPrescription(shouldPrint) {
        if (wrxSaving) return;
        const name = document.getElementById('wrxName').value.trim();
        const phone = document.getElementById('wrxPhone').value.trim();
        const age = document.getElementById('wrxAge').value.trim();
        const gender = document.getElementById('wrxGender').value;
        if (!name) { showToast('Full name is required'); document.getElementById('wrxName').focus(); return; }
        if (!/^[0-9]{10}$/.test(phone)) { showToast('Enter a valid 10-digit phone number'); document.getElementById('wrxPhone').focus(); return; }
        if (!age || !wrxIsValidAge(age)) { showToast('Enter a valid age (0-120)'); document.getElementById('wrxAge').focus(); return; }
        if (!gender) { showToast('Gender is required'); document.getElementById('wrxGender').focus(); return; }
        if (!wrxSelectedDoctor) { showToast('Choose which doctor this is for'); return; }
        if (!wrxItems.length) { showToast('Add at least one medicine first'); return; }
        wrxSaving = true;
        document.getElementById('wrxSavePrintBtn').disabled = true;
        document.getElementById('wrxSaveOnlyBtn').disabled = true;
        try {
          await Qlinic.createPrescription({
            complaints: document.getElementById('wrxComplaints').value.trim(),
            diagnosis: document.getElementById('wrxDiagnosis').value.trim(),
            advice: document.getElementById('wrxAdvice').value.trim(),
            followUpDate: wrxFollowUpValue || null,
            items: wrxItems,
            doctorId: wrxSelectedDoctor.id,
            vitalsBp: document.getElementById('wrxVitalBp').value.trim(),
            vitalsPulse: document.getElementById('wrxVitalPulse').value.trim(),
            vitalsTemp: document.getElementById('wrxVitalTemp').value.trim(),
            vitalsWeight: document.getElementById('wrxVitalWeight').value.trim(),
            testsOrdered: wrxTestsOrdered,
            walkinName: name,
            walkinAge: Number(age) || null,
            walkinGender: gender,
            walkinPhone: phone,
          });
          showToast('Prescription saved');
          rxListPage = 0;
          loadCurrentTab();
          if (shouldPrint) {
            window.addEventListener('afterprint', function onAfterPrint() {
              window.removeEventListener('afterprint', onAfterPrint);
              closeWrxModal();
            });
            window.print();
          } else {
            closeWrxModal();
          }
        } catch (err) {
          console.error('Save walk-in prescription failed:', err);
          showToast(err.message || 'Could not save the prescription');
        } finally {
          wrxSaving = false;
          document.getElementById('wrxSavePrintBtn').disabled = false;
          document.getElementById('wrxSaveOnlyBtn').disabled = false;
        }
      }
      document.getElementById('wrxSavePrintBtn').addEventListener('click', () => saveWrxPrescription(true));
      document.getElementById('wrxSaveOnlyBtn').addEventListener('click', () => saveWrxPrescription(false));

      loadCurrentTab();
    })();
  </script>
</body>
</html>
