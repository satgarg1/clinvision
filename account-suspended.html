<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account status: Qlinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%231d1d1f'/%3E%3Cline x1='50' y1='50' x2='50' y2='26' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='68' y2='58' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%230071e3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=227" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-blob login-blob-teal"></div>
    <div class="login-blob login-blob-coral"></div>
    <div class="login-blob login-blob-purple"></div>
    <a href="index.html" class="brand login-brand-corner">
      <span class="brand-top">
        <span class="brand-clock clock-face" id="navClock">
          <svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block;color:var(--black);">
            <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="5"></circle>
            <line class="clock-hour" x1="50" y1="50" x2="50" y2="30" stroke="currentColor" stroke-width="6" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
            <line class="clock-min" x1="50" y1="50" x2="50" y2="18" stroke="currentColor" stroke-width="4" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
            <line class="clock-sec" x1="50" y1="50" x2="50" y2="14" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
            <circle cx="50" cy="50" r="3" fill="currentColor"></circle>
          </svg>
        </span>
        Qlinic
      </span>
      <span class="brand-tagline">Time is the one asset nobody gets back</span>
    </a>
    <div class="login-card">
      <h1 id="suspendedTitle">Checking your account…</h1>
      <p class="panel-note" id="suspendedBody" style="text-align:left;"></p>

      <div id="suspendedActions" style="display:flex;flex-direction:column;gap:10px;margin-top:8px;">
        <a href="#" id="whatsappLink" class="btn btn-accent" style="width:100%;text-align:center;text-decoration:none;display:none;box-sizing:border-box;">Message us on WhatsApp</a>
        <button type="button" class="btn btn-ghost" id="recheckBtn" style="width:100%;">I've sorted this out — check again</button>
      </div>

      <div class="login-hint">
        <a href="#" id="logoutLink">Log out</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=83"></script>
  <script>
    (async function () {
      // Deliberately NOT Qlinic.requireLogin() here - that's the exact
      // check that lands someone on THIS page in the first place, so
      // calling it again would just bounce straight back. Checking
      // isLoggedIn() directly still keeps this page from being useful
      // to reach while logged out.
      if (!(await Qlinic.isLoggedIn())) {
        window.location.href = 'login.html';
        return;
      }

      // TODO before this goes live to real clinics: WHATSAPP_NUMBER
      // below is a placeholder (91XXXXXXXXXX), same as contact.html's
      // own TODO. Replace it with the real support number.
      const WHATSAPP_NUMBER = '91XXXXXXXXXX';

      const clinic = await Qlinic.getClinic();

      // Reached this page, but the clinic is actually fine (activated
      // since the redirect happened, or this URL was opened directly
      // out of curiosity) - straight through to the app instead of
      // showing an alarming message about nothing.
      if (Qlinic.isSubscriptionActive(clinic)) {
        window.location.href = 'dashboard.html';
        return;
      }

      const titleEl = document.getElementById('suspendedTitle');
      const bodyEl = document.getElementById('suspendedBody');
      const waLink = document.getElementById('whatsappLink');
      const clinicName = clinic ? clinic.name : 'your clinic';

      const isTrialExpired = clinic && clinic.subscription_status === 'trialing';
      if (isTrialExpired) {
        titleEl.textContent = 'Your trial has ended';
        bodyEl.textContent = `${clinicName}'s free trial is over. Get in touch to activate your subscription and pick back up right where you left off — nothing about your data changes.`;
      } else {
        titleEl.textContent = 'Access paused';
        bodyEl.textContent = `${clinicName}'s access to Qlinic has been paused. Get in touch if you think this is a mistake, or to sort out billing.`;
      }

      waLink.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(`Hi, I'd like to sort out billing for ${clinicName} on Qlinic.`)}`;
      waLink.style.display = 'block';

      document.getElementById('recheckBtn').addEventListener('click', () => {
        window.location.reload();
      });

      document.getElementById('logoutLink').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          await Qlinic.logout();
        } catch (err) { /* best-effort - send them to login either way */ }
        window.location.href = 'login.html';
      });
    })();
  </script>
  <script>
    (function () {
      function applyTime(root) {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours() % 12;
        const sec = root.querySelector(".clock-sec");
        const min = root.querySelector(".clock-min");
        const hour = root.querySelector(".clock-hour");
        if (sec) sec.style.transform = `rotate(${s * 6}deg)`;
        if (min) min.style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
        if (hour) hour.style.transform = `rotate(${h * 30 + m * 0.5}deg)`;
      }
      function tickAll() {
        document.querySelectorAll(".clock-face").forEach(applyTime);
      }
      tickAll();
      setInterval(tickAll, 1000);
    })();
  </script>
</body>
</html>
