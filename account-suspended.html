<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account status: ClinVision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/png" href="clinvision-favicon.png?v=2" />
<link rel="stylesheet" href="styles.css?v=324" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-blob login-blob-teal"></div>
    <div class="login-blob login-blob-coral"></div>
    <div class="login-blob login-blob-purple"></div>
    <a href="index.html" class="brand login-brand-corner">
      <span class="brand-top">
        <span class="brand-word-wrap">
          <span class="brand-word">ClinVision</span>
          <span class="brand-word-bar"></span>
        </span>
      </span>
      <span class="brand-tagline">Where clinics run better</span>
    </a>
    <div class="login-card">
      <h1 id="suspendedTitle">Checking your account…</h1>
      <p class="panel-note" id="suspendedBody" style="text-align:left;"></p>

      <div id="suspendedActions" style="display:flex;flex-direction:column;gap:10px;margin-top:8px;">
        <a href="#" id="whatsappLink" class="btn btn-accent" style="width:100%;text-align:center;text-decoration:none;display:none;box-sizing:border-box;">Message us on WhatsApp</a>
        <button type="button" class="btn btn-ghost" id="recheckBtn" style="width:100%;">I've sorted this out — check again</button>
      </div>

      <div class="login-hint">
        <a href="#" id="logoutLink">Log out</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=110"></script>
  <script>
    (async function () {
      if (!(await Qlinic.isLoggedIn())) {
        window.location.href = 'login.html';
        return;
      }

      const WHATSAPP_NUMBER = '91XXXXXXXXXX';

      const clinic = await Qlinic.getClinic();

      if (Qlinic.isSubscriptionActive(clinic)) {
        window.location.href = 'dashboard.html';
        return;
      }

      const titleEl = document.getElementById('suspendedTitle');
      const bodyEl = document.getElementById('suspendedBody');
      const waLink = document.getElementById('whatsappLink');
      const clinicName = clinic ? clinic.name : 'your clinic';

      const isTrialExpired = clinic && clinic.subscription_status === 'trialing';
      if (isTrialExpired) {
        titleEl.textContent = 'Your trial has ended';
        bodyEl.textContent = `${clinicName}'s free trial is over. Get in touch to activate your subscription and pick back up right where you left off — nothing about your data changes.`;
      } else {
        titleEl.textContent = 'Access paused';
        bodyEl.textContent = `${clinicName}'s access to ClinVision has been paused. Get in touch if you think this is a mistake, or to sort out billing.`;
      }

      waLink.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(`Hi, I'd like to sort out billing for ${clinicName} on ClinVision.`)}`;
      waLink.style.display = 'block';

      document.getElementById('recheckBtn').addEventListener('click', () => {
        window.location.reload();
      });

      document.getElementById('logoutLink').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          await Qlinic.logout();
        } catch (err) { }
        window.location.href = 'login.html';
      });
    })();
  </script>
</body>
</html>
