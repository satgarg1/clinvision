<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot password: Qlinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%231d1d1f'/%3E%3Cline x1='50' y1='50' x2='50' y2='26' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='68' y2='58' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%230071e3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=190" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-blob login-blob-teal"></div>
    <div class="login-blob login-blob-coral"></div>
    <div class="login-blob login-blob-purple"></div>
    <a href="index.html" class="brand login-brand-corner">
      <span class="brand-top">
        <span class="brand-clock clock-face" id="navClock">
          <svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block;color:var(--black);">
            <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="5"></circle>
            <line class="clock-hour" x1="50" y1="50" x2="50" y2="30" stroke="currentColor" stroke-width="6" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
            <line class="clock-min" x1="50" y1="50" x2="50" y2="18" stroke="currentColor" stroke-width="4" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
            <line class="clock-sec" x1="50" y1="50" x2="50" y2="14" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
            <circle cx="50" cy="50" r="3" fill="currentColor"></circle>
          </svg>
        </span>
        Qlinic
      </span>
      <span class="brand-tagline">Time is the one asset nobody gets back</span>
    </a>
    <div class="login-card">
      <h1>Reset your password</h1>
      <p class="panel-note" style="text-align:center;margin:-14px 0 22px;">
        Enter the email on your clinic account and we'll send you a link to set a new password.
      </p>

      <div id="forgotNote" class="login-hint" style="display:none;"></div>

      <form id="forgotForm">
        <div class="field">
          <label for="forgotEmail">Email</label>
          <input type="email" id="forgotEmail" required />
        </div>
        <button type="submit" class="btn btn-accent" id="forgotBtn" style="width:100%;">Send reset link</button>
      </form>

      <div class="login-hint">
        <a href="login.html">Back to login</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=73"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('forgotBtn');
      const note = document.getElementById('forgotNote');
      note.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        const email = document.getElementById('forgotEmail').value;
        const redirectTo = window.location.href.replace(/forgot-password\.html.*$/, 'reset-password.html');
        await Qlinic.requestPasswordReset(email, redirectTo);
        e.target.style.display = 'none';
        note.style.display = 'block';
        note.textContent = 'Check your email for a password reset link.';
      } catch (err) {
        note.style.display = 'block';
        note.textContent = err.message || 'Could not send reset email.';
        btn.disabled = false;
        btn.textContent = 'Send reset link';
      }
    });
  </script>
  <script>
    (function () {
      function applyTime(root) {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours() % 12;
        const sec = root.querySelector(".clock-sec");
        const min = root.querySelector(".clock-min");
        const hour = root.querySelector(".clock-hour");
        if (sec) sec.style.transform = `rotate(${s * 6}deg)`;
        if (min) min.style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
        if (hour) hour.style.transform = `rotate(${h * 30 + m * 0.5}deg)`;
      }
      function tickAll() {
        document.querySelectorAll(".clock-face").forEach(applyTime);
      }
      tickAll();
      setInterval(tickAll, 1000);
    })();
  </script>
</body>
</html>
