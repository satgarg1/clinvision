<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot password: Qlinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%231d1d1f'/%3E%3Cline x1='50' y1='50' x2='50' y2='26' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='68' y2='58' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%230071e3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=225" />
</head>
<body>
  <div class="auth-shell">
    <a href="index.html" class="auth-corner-brand">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#1d1d1f"/><line x1="50" y1="50" x2="50" y2="26" stroke="#fff" stroke-width="9" stroke-linecap="round"/><line x1="50" y1="50" x2="68" y2="58" stroke="#fff" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="50" r="6" fill="#0071e3"/></svg>
      <div>
        <div class="name">Qlinic</div>
        <div class="tagline">Time is the one asset nobody gets back.</div>
      </div>
    </a>

    <div class="auth-illustration">
      <div class="auth-glow" aria-hidden="true"></div>
      <div class="auth-headline">One system for every part of your day.</div>
    </div>

    <div class="auth-form-pane">
      <div class="auth-form-inner">
        <div class="auth-eyebrow">Welcome back to <b>Qlinic</b></div>
        <h1 class="auth-h1">Reset your password</h1>
        <p class="auth-sub">Enter the email on your clinic account and we'll send you a link to set a new password.</p>

        <div id="forgotNote" class="auth-hint" style="display:none;margin-top:0;padding-top:0;border-top:none;"></div>

        <form id="forgotForm">
          <div class="field">
            <label for="forgotEmail">Email</label>
            <input type="email" id="forgotEmail" required />
          </div>
          <button type="submit" class="btn btn-accent" id="forgotBtn" style="width:100%;">Send reset link</button>
        </form>

        <div class="auth-hint">
          <a href="login.html">Back to login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=82"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('forgotBtn');
      const note = document.getElementById('forgotNote');
      note.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        const email = document.getElementById('forgotEmail').value;
        const redirectTo = window.location.href.replace(/forgot-password\.html.*$/, 'reset-password.html');
        await Qlinic.requestPasswordReset(email, redirectTo);
        e.target.style.display = 'none';
        note.style.display = 'block';
        note.textContent = 'Check your email for a password reset link.';
      } catch (err) {
        note.style.display = 'block';
        note.textContent = err.message || 'Could not send reset email.';
        btn.disabled = false;
        btn.textContent = 'Send reset link';
      }
    });
  </script>
  <script>
    (function () {
      function applyTime(root) {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours() % 12;
        const sec = root.querySelector(".clock-sec");
        const min = root.querySelector(".clock-min");
        const hour = root.querySelector(".clock-hour");
        if (sec) sec.style.transform = `rotate(${s * 6}deg)`;
        if (min) min.style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
        if (hour) hour.style.transform = `rotate(${h * 30 + m * 0.5}deg)`;
      }
      function tickAll() {
        document.querySelectorAll(".clock-face").forEach(applyTime);
      }
      tickAll();
      setInterval(tickAll, 1000);
    })();
  </script>
</body>
</html>
