<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot password: ClinVision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231e1b4b'/%3E%3Ctext x='50' y='70' font-family='Georgia, serif' font-size='60' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3Crect x='30' y='80' width='40' height='7' rx='3' fill='%23c9973e'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=276" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-corner-wrap">
      <a href="index.html" class="auth-corner-brand">
        <span class="brand-word-wrap">
          <span class="brand-word">ClinVision</span>
          <span class="brand-word-bar"></span>
        </span>
        <div class="tagline">Where clinics run better</div>
      </a>
      <a href="index.html" class="auth-back-link">Back to main site</a>
    </div>

    <div class="auth-illustration">
      <div class="auth-glow" aria-hidden="true"></div>
      <div class="auth-headline">One system for every part of your day.</div>
    </div>

    <div class="auth-form-pane">
      <div class="auth-form-inner">
        <div class="auth-eyebrow">Welcome back to <b>ClinVision</b></div>
        <h1 class="auth-h1">Reset your password</h1>
        <p class="auth-sub">Enter the phone or email on your clinic account and we'll send a reset link to the email on file.</p>

        <div id="forgotNote" class="auth-hint" style="display:none;margin-top:0;padding-top:0;border-top:none;"></div>

        <!-- Same gradient-pill toggle as login.html, same reason: phone
             is just a lookup (email_for_staff_phone) to find the email
             the reset link actually goes to -- there's no SMS delivery
             to send it to a phone directly. -->
        <div class="id-pill mode-phone" id="idPill">
          <div class="id-pill-thumb"></div>
          <button type="button" class="active" data-mode="phone">Phone</button>
          <button type="button" data-mode="email">Email</button>
        </div>

        <form id="forgotForm">
          <div class="field" id="phoneField">
            <label for="forgotPhone">Mobile number</label>
            <input type="tel" id="forgotPhone" autocomplete="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" />
          </div>
          <div class="field" id="emailField" style="display:none;">
            <label for="forgotEmail">Email</label>
            <input type="email" id="forgotEmail" autocomplete="username" />
          </div>
          <button type="submit" class="btn btn-accent" id="forgotBtn" style="width:100%;">Send reset link</button>
        </form>

        <div class="auth-hint">
          <a href="login.html">Back to login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=90"></script>
  <script>
    // Same pill-toggle pattern as login.html: two stable fields, only
    // visibility (and required) changes, never one field's type.
    (function () {
      const pill = document.getElementById('idPill');
      const phoneField = document.getElementById('phoneField');
      const emailField = document.getElementById('emailField');
      const phoneInput = document.getElementById('forgotPhone');
      const emailInput = document.getElementById('forgotEmail');
      phoneInput.required = true;

      pill.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          pill.querySelectorAll('button').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          const mode = btn.dataset.mode;
          pill.classList.toggle('mode-email', mode === 'email');
          pill.classList.toggle('mode-phone', mode === 'phone');
          if (mode === 'phone') {
            phoneField.style.display = '';
            emailField.style.display = 'none';
            phoneInput.required = true;
            emailInput.required = false;
          } else {
            phoneField.style.display = 'none';
            emailField.style.display = '';
            phoneInput.required = false;
            emailInput.required = true;
          }
        });
      });
      phoneInput.addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 10);
      });
    })();

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('forgotBtn');
      const note = document.getElementById('forgotNote');
      note.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        const isPhoneMode = document.getElementById('idPill').classList.contains('mode-phone');
        let email;
        if (isPhoneMode) {
          const phone = document.getElementById('forgotPhone').value.trim();
          if (!/^[0-9]{10}$/.test(phone)) {
            throw new Error('Please enter a valid 10-digit mobile number.');
          }
          // Pre-auth lookup: a temporary, non-persisted client, same
          // reasoning as login.html's own phone-mode lookup.
          const tempClient = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
            auth: { persistSession: false, autoRefreshToken: false },
          });
          const { data: resolvedEmail, error: lookupError } = await tempClient.rpc('email_for_staff_phone', { staff_phone: phone });
          if (lookupError) throw lookupError;
          if (!resolvedEmail) throw new Error('No account found for this phone number.');
          email = resolvedEmail;
        } else {
          email = document.getElementById('forgotEmail').value;
        }
        const redirectTo = window.location.href.replace(/forgot-password\.html.*$/, 'reset-password.html');
        await Qlinic.requestPasswordReset(email, redirectTo);
        e.target.style.display = 'none';
        note.style.display = 'block';
        note.textContent = 'Check your email for a password reset link.';
      } catch (err) {
        note.style.display = 'block';
        note.textContent = err.message || 'Could not send reset email.';
        btn.disabled = false;
        btn.textContent = 'Send reset link';
      }
    });
  </script>
</body>
</html>
