      <!-- One shared row instead of the pill sitting alone above 2-3
           stacked rows of date fields below it - singleDayFilters/
           rangePresetField/customRangeFilters are still toggled by the
           exact same JS (.style.display = 'flex'/'none' by id), just
           nested here as flex children instead of separate top-level
           blocks, so a hidden one simply drops out of this row's flow.
           "Date"/"Period" labels dropped as redundant (a calendar icon
           and a dropdown are self-explanatory on their own) - From/To
           keep theirs since nothing else distinguishes them. Each
           nested group (singleDayFilters/customRangeFilters) is
           flex-wrap:nowrap on itself - only the OUTER row is allowed to
           wrap. Without that, Date and Today (now bare siblings with no
           wrapping div of their own since their labels were dropped)
           could wrap independently of each other and visually
           interleave with the pill in a scrambled order.

           Alignment: the pill/Date/Today/Custom-dropdown have no label
           of their own, but From/To do ("From"/"To" - nothing else
           distinguishes them) - align-items:flex-end bottom-aligns
           every group's actual control regardless of that difference,
           since flex-end lines up each item's own bottom edge rather
           than the whole column's midpoint. No spacer needed. Every
           control in the row is also height/shape-matched in
           styles.css (search "Revenue/No-shows' filter row") so
           nothing here reads shorter or squarer than its neighbours. -->

  <script>
    (async function () {
      if (!(await Qlinic.requireLogin('login.html'))) return;

      document.querySelector('a.brand').addEventListener('click', async (e) => {
        e.preventDefault();
        if (await Qlinic.confirmDialog({ message: "Going to the homepage will end your session here, you'll need to log in again to get back in." })) {
          window.location.href = 'index.html';
        }
      });

      if (!(await Qlinic.isAdmin())) {
        window.location.href = 'dashboard.html';
        return;
      }
      // Body starts hidden (see the <body> tag) specifically so a non-
      // admin hitting this URL never sees this admin-only page's content
      // even for a moment before the redirect above fires -- reveal only
      // once we know for certain they're allowed to be here.
      document.body.style.visibility = 'visible';

      const PAGE_SIZE = 25;
      const FEE_TYPE_LABELS = { consultation: 'Consultation', emergency: 'Emergency', waived: 'Follow up' };
      const PAYMENT_MODE_LABELS = { cash: 'Cash', upi: 'UPI', card: 'Card' };

      let allInvoices = [];
      let currentPage = 1;
      let doctorById = {};
      let doctorsListCache = []; // same doctors as doctorById, kept as an ordered array too - only needed for the revenue chip's doctor-color dots
      let editingInvoiceId = null;
      let viewMode = 'single'; // 'single' | 'range'
      let rangePreset = 'lastweek';
      let customRange = null; // exact {start,end} for the 'custom' preset
      let doctorFilterIds = new Set();
      let typeFilterValues = new Set();
      let paymentModeFilterValues = new Set();
      let sortDirection = 'asc'; // 'asc' = oldest visit first, 'desc' = newest first
      let outstandingOnly = false;

      function pad2(n) { return String(n).padStart(2, '0'); }
      function toDateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }

      // Presets split into two families: "complete prior period" ones
      // (last week/month/3-6-12 months/FY — a finished statement, like a
      // bank statement) and "current, in-progress period" ones (current
      // week/month/FY — capped at today since it hasn't finished yet).
      // Both live here now; Trends' own presets are separately still
      // always "current, in-progress," which is a deliberate difference
      // in what each page answers, not an inconsistency.
      function computeLastWeekRange() {
        const today = new Date();
        const day = today.getDay();
        const diffToMonday = day === 0 ? 6 : day - 1;
        const thisMonday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - diffToMonday);
        const lastMonday = new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate() - 7);
        const lastSunday = new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate() - 1);
        return { start: toDateStr(lastMonday), end: toDateStr(lastSunday) };
      }
      function computeCurrentWeekRange() {
        const today = new Date();
        const day = today.getDay();
        const diffToMonday = day === 0 ? 6 : day - 1;
        const monday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - diffToMonday);
        const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
        const todayStr = toDateStr(today);
        const sundayStr = toDateStr(sunday);
        return { start: toDateStr(monday), end: sundayStr > todayStr ? todayStr : sundayStr };
      }
      function computeCurrentMonthRange() {
        const today = new Date();
        const first = new Date(today.getFullYear(), today.getMonth(), 1);
        const last = new Date(today.getFullYear(), today.getMonth() + 1, 0);
        const todayStr = toDateStr(today);
        const lastStr = toDateStr(last);
        return { start: toDateStr(first), end: lastStr > todayStr ? todayStr : lastStr };
      }
      function computeLastMonthRange() {
        const today = new Date();
        const firstOfThisMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        const lastOfLastMonth = new Date(firstOfThisMonth.getFullYear(), firstOfThisMonth.getMonth(), 0);
        const firstOfLastMonth = new Date(lastOfLastMonth.getFullYear(), lastOfLastMonth.getMonth(), 1);
        return { start: toDateStr(firstOfLastMonth), end: toDateStr(lastOfLastMonth) };
      }
      // N complete calendar months immediately before the current one —
      // "Current month" covers the in-progress one separately, so these
      // two never overlap.
      function computeLastNMonthsRange(n) {
        const today = new Date();
        const firstOfThisMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        const end = new Date(firstOfThisMonth.getFullYear(), firstOfThisMonth.getMonth(), 0);
        const start = new Date(firstOfThisMonth.getFullYear(), firstOfThisMonth.getMonth() - n, 1);
        return { start: toDateStr(start), end: toDateStr(end) };
      }
      // Indian financial year: April 1 - March 31. If we're in Jan-Mar,
      // the current FY started in April of the previous calendar year.
      const CURRENT_FY_START_YEAR = (() => {
        const today = new Date();
        return today.getMonth() >= 3 ? today.getFullYear() : today.getFullYear() - 1;
      })();
      function computeCurrentFYRange() {
        const today = new Date();
        const start = new Date(CURRENT_FY_START_YEAR, 3, 1);
        const naturalEnd = new Date(CURRENT_FY_START_YEAR + 1, 2, 31);
        const todayStr = toDateStr(today);
        const naturalEndStr = toDateStr(naturalEnd);
        return { start: toDateStr(start), end: naturalEndStr > todayStr ? todayStr : naturalEndStr };
      }
      function computeLastFYRange() {
        const lastFYStartYear = CURRENT_FY_START_YEAR - 1;
        const start = new Date(lastFYStartYear, 3, 1);
        const end = new Date(lastFYStartYear + 1, 2, 31);
        return { start: toDateStr(start), end: toDateStr(end) };
      }
      function fyLabel(startYear) {
        return `Apr '${String(startYear).slice(-2)} - Mar '${String(startYear + 1).slice(-2)}`;
      }
      // Custom is the only preset with visible date fields - real
      // From/To calendars (Qlinic.attachDatePicker, same component as
      // the single-day filter above) rather than Month+Year dropdowns,
      // so an exact day can be picked, not just "somewhere in March
      // 2026." No cap on how far apart From/To can be.
      const RANGE_PRESETS = [
        { key: 'lastweek', label: 'Last week', compute: computeLastWeekRange },
        { key: 'currentweek', label: 'Current week', compute: computeCurrentWeekRange },
        { key: 'currentmonth', label: 'Current month', compute: computeCurrentMonthRange },
        { key: 'lastmonth', label: 'Last month', compute: computeLastMonthRange },
        { key: 'last3months', label: 'Last 3 months', compute: () => computeLastNMonthsRange(3) },
        { key: 'last6months', label: 'Last 6 months', compute: () => computeLastNMonthsRange(6) },
        { key: 'last12months', label: 'Last 12 months', compute: () => computeLastNMonthsRange(12) },
        { key: 'currentfy', label: `Current financial year (${fyLabel(CURRENT_FY_START_YEAR)})`, compute: computeCurrentFYRange },
        { key: 'lastfy', label: `Last financial year (${fyLabel(CURRENT_FY_START_YEAR - 1)})`, compute: computeLastFYRange },
        { key: 'custom', label: 'Custom', compute: null },
      ];
      function rangeForPreset(preset) {
        const entry = RANGE_PRESETS.find((p) => p.key === preset);
        return entry && entry.compute ? entry.compute() : null;
      }

      // Clicking a bar on Trends links here with ?start=&end= — same page,
      // just opened straight into Range mode with those dates pre-filled,
      // not a special one-way "linked view."
      const urlParams = new URLSearchParams(window.location.search);
      const linkedStart = urlParams.get('start');
      const linkedEnd = urlParams.get('end');

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      function csvCell(value) {
        const s = String(value == null ? '' : value);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }
      function downloadCsv(filename, csvText) {
        const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }
      // Exports exactly what's currently filtered/visible (search, doctor,
      // type), not just the current page of the table — matches Reception's
      // own "Export CSV" the same way, so both act the same on the current
      // view, not just what fits on screen.
      function buildRevenueCsv(invoices) {
        const rows = [['Patient', 'Phone', 'Age', 'Address', 'Doctor', 'Type', 'Payment mode', 'Amount billed', 'Amount received', 'Balance']];
        invoices.forEach((inv) => {
          const doctor = doctorById[inv.doctorId];
          rows.push([
            inv.patientName,
            inv.patientPhone || '',
            inv.patientAge || '',
            inv.patientAddress || '',
            doctor ? doctor.name : '',
            FEE_TYPE_LABELS[inv.feeType] || inv.feeType,
            PAYMENT_MODE_LABELS[inv.paymentMode] || inv.paymentMode,
            inv.amount,
            inv.amountReceived,
            inv.amount - inv.amountReceived,
          ]);
        });
        return rows.map((r) => r.map(csvCell).join(',')).join('\r\n');
      }

      async function loadDoctorFilterOptions() {
        // includeInactive so a deactivated doctor's past invoices still
        // show a real name in the filter and table, not a blank/missing one.
        const doctors = await Qlinic.getDoctors({ includeInactive: true });
        doctorById = Object.fromEntries(doctors.map((d) => [d.id, d]));
        doctorsListCache = doctors;
      }

      // Same 5-color identity palette used app-wide (Reception, Doctor
      // View, the waiting-room board) - only used here for the revenue
      // chip's doctor dots.
      const ACCENT_COLORS = ['teal', 'blue', 'purple', 'coral', 'pink'];
      function accentForDoctor(doctorId) {
        const idx = doctorsListCache.findIndex((d) => d.id === doctorId);
        return ACCENT_COLORS[Math.max(idx, 0) % ACCENT_COLORS.length];
      }

      // Same "yesterday at the same clock time, not yesterday's whole
      // day" fairness rule as Dashboard's own trend chips - percentChip
      // itself is a straight copy of that function.
      function percentChip(todayVal, yesterdayVal, higherIsGood) {
        if (!yesterdayVal || todayVal == null) return null;
        const pct = Math.round(((todayVal - yesterdayVal) / yesterdayVal) * 100);
        if (pct === 0) return null;
        const isIncrease = pct > 0;
        return { text: `${Math.abs(pct)}%`, arrow: isIncrease ? '▲' : '▼', good: isIncrease === higherIsGood };
      }

      // One-tap insights chip: today vs. yesterday, this month's best/
      // worst day, the busiest doctor today and this week (by distinct
      // patients, not revenue - a doctor earnings ranking was pulled per
      // feedback), and all-time outstanding balances with phone numbers
      // for follow-up. Every number here is read from
      // getInvoicesForDateRange/getOutstandingInvoices - both already
      // used elsewhere in this app - nothing new is fetched beyond one
      // extra range query and one extra outstanding query.
      async function renderRevenueChip() {
        const todayStr = Qlinic.getTodayDate();
        const cutoffYesterday = new Date(Date.now() - 24 * 3600000);
        const yesterdayStr = toDateStr(cutoffYesterday);
        const monthStart = toDateStr(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
        const weekRange = computeCurrentWeekRange();
        const fetchStart = [monthStart, weekRange.start, yesterdayStr].sort()[0];

        const [rangeInvoices, outstandingInvoices] = await Promise.all([
          Qlinic.getInvoicesForDateRange(fetchStart, todayStr),
          Qlinic.getOutstandingInvoices(),
        ]);

        const wrap = document.getElementById('revenueChipWrap');
        if (doctorsListCache.length === 0) { wrap.style.display = 'none'; return; }
        wrap.style.display = '';

        const sumReceived = (invs) => invs.reduce((sum, inv) => sum + inv.amountReceived, 0);
        const todayTotal = sumReceived(rangeInvoices.filter((inv) => inv.invoiceDate === todayStr));
        const yesterdayTotal = sumReceived(rangeInvoices.filter((inv) =>
          inv.invoiceDate === yesterdayStr && new Date(inv.createdAt) <= cutoffYesterday
        ));
        const trend = percentChip(todayTotal, yesterdayTotal, true);
        const trendBadge = trend ? `<span class="trend-chip ${trend.good ? 'good' : 'bad'}">${trend.arrow} ${trend.text}</span>` : '';

        document.getElementById('revenueChipText').innerHTML = `₹${todayTotal} today ${trendBadge}`;

        // Best/worst day this month, by amount actually collected.
        const monthInvoices = rangeInvoices.filter((inv) => inv.invoiceDate >= monthStart);
        const byDay = {};
        monthInvoices.forEach((inv) => { byDay[inv.invoiceDate] = (byDay[inv.invoiceDate] || 0) + inv.amountReceived; });
        const dayEntries = Object.entries(byDay).sort((a, b) => b[1] - a[1]);
        const bestDay = dayEntries[0] || null;
        const worstDay = dayEntries.length ? dayEntries[dayEntries.length - 1] : null;

        // Busiest doctor by distinct patients seen, not revenue. patientId
        // is null for a manually-billed invoice with no linked queue row
        // (a real, accepted gap - see createInvoice's own comment) -
        // several such invoices would otherwise all add the same `null`
        // to the Set and collapse into one "patient," undercounting a
        // doctor who's actually seen more people than that. Each null
        // patientId is given its own unique placeholder key instead, so
        // it counts as its own distinct visit rather than merging with
        // every other unlinked one.
        function busiestDoctor(invs) {
          const byDoctor = {};
          invs.forEach((inv) => {
            if (!byDoctor[inv.doctorId]) byDoctor[inv.doctorId] = new Set();
            byDoctor[inv.doctorId].add(inv.patientId || `unlinked:${inv.id}`);
          });
          let top = null;
          Object.entries(byDoctor).forEach(([doctorId, patients]) => {
            if (!top || patients.size > top.count) top = { doctorId, count: patients.size };
          });
          return top;
        }
        const busiestToday = busiestDoctor(rangeInvoices.filter((inv) => inv.invoiceDate === todayStr));
        const busiestWeek = busiestDoctor(rangeInvoices.filter((inv) => inv.invoiceDate >= weekRange.start && inv.invoiceDate <= weekRange.end));

        const outstandingTotal = outstandingInvoices.reduce((sum, inv) => sum + Math.max(0, inv.amount - inv.amountReceived), 0);
        const outstandingShown = outstandingInvoices.slice(0, 10);

        function docRow(label, best) {
          if (!best || !doctorById[best.doctorId]) {
            return `<div class="revenue-doc-row"><span class="revenue-doc-period">${label}</span><span class="revenue-empty-note">No visits yet</span></div>`;
          }
          const doctor = doctorById[best.doctorId];
          return `
            <div class="revenue-doc-row">
              <span class="revenue-doc-period">${label}</span>
              <span class="revenue-doc-dot dot-${accentForDoctor(best.doctorId)}"></span>
              <div class="revenue-doc-info"><div class="revenue-doc-name">${Qlinic.escapeHtml(doctor.name)}</div></div>
              <span class="revenue-doc-count">${best.count} patient${best.count === 1 ? '' : 's'}</span>
            </div>
          `;
        }

        document.getElementById('revenuePopover').innerHTML = `
          <div class="revenue-section">
            <div class="revenue-eyebrow">Today vs. yesterday</div>
            <div class="revenue-today-row">
              <span class="revenue-today-num">₹${todayTotal}</span>
              ${trendBadge}
            </div>
            <div class="revenue-today-sub">₹${yesterdayTotal} yesterday at this time</div>
          </div>

          <div class="revenue-section">
            <div class="revenue-eyebrow">Best &amp; worst day this month</div>
            ${bestDay ? `
              <div class="revenue-daypair">
                <div class="revenue-day-row">
                  <span class="revenue-day-tag best">Best</span>
                  <span class="revenue-day-date">${Qlinic.escapeHtml(Qlinic.formatDateLabel(bestDay[0]))}</span>
                  <span class="revenue-day-amt">₹${bestDay[1]}</span>
                </div>
                <div class="revenue-day-row">
                  <span class="revenue-day-tag worst">Worst</span>
                  <span class="revenue-day-date">${Qlinic.escapeHtml(Qlinic.formatDateLabel(worstDay[0]))}</span>
                  <span class="revenue-day-amt">₹${worstDay[1]}</span>
                </div>
              </div>
            ` : '<div class="revenue-empty-note">Not enough data yet</div>'}
          </div>

          <div class="revenue-section">
            <div class="revenue-eyebrow">Busiest doctor</div>
            ${docRow('Today', busiestToday)}
            ${docRow('This week', busiestWeek)}
          </div>

          <div class="revenue-section">
            <div class="revenue-eyebrow">Outstanding</div>
            <button type="button" class="revenue-outstanding-btn" id="revenueOutstandingToggle">
              <div>
                <div class="revenue-outstanding-amt">₹${outstandingTotal}</div>
                <div class="revenue-outstanding-count">Across ${outstandingInvoices.length} bill${outstandingInvoices.length === 1 ? '' : 's'}</div>
              </div>
              <span class="revenue-outstanding-arrow" id="revenueOutstandingArrow">▾</span>
            </button>
            ${outstandingInvoices.length ? `
              <div class="revenue-outstanding-list" id="revenueOutstandingList">
                ${outstandingShown.map((inv) => `
                  <div class="revenue-outstanding-row">
                    <div class="info">
                      <div class="name">${Qlinic.escapeHtml(inv.patientName)}</div>
                      <div class="phone">${Qlinic.escapeHtml(inv.patientPhone || '·')}</div>
                    </div>
                    <span class="amt">₹${Math.max(0, inv.amount - inv.amountReceived)}</span>
                  </div>
                `).join('')}
                ${outstandingInvoices.length > 10 ? `<div class="revenue-empty-note">Showing oldest 10 of ${outstandingInvoices.length}</div>` : ''}
              </div>
            ` : ''}
          </div>
        `;
        const outstandingToggleBtn = document.getElementById('revenueOutstandingToggle');
        if (outstandingToggleBtn) {
          outstandingToggleBtn.addEventListener('click', () => {
            document.getElementById('revenueOutstandingList').classList.toggle('open');
            document.getElementById('revenueOutstandingArrow').classList.toggle('open');
          });
        }
      }
      function closeRevenuePopover() {
        document.getElementById('revenuePopover').classList.remove('open');
        document.getElementById('revenueChipBtn').setAttribute('aria-expanded', 'false');
      }
      document.getElementById('revenueChipBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        const popover = document.getElementById('revenuePopover');
        const isOpen = popover.classList.toggle('open');
        document.getElementById('revenueChipBtn').setAttribute('aria-expanded', String(isOpen));
      });
      document.addEventListener('click', (e) => {
        if (!document.getElementById('revenueChipWrap').contains(e.target)) closeRevenuePopover();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeRevenuePopover();
      });

      function searchTerm() {
        return document.getElementById('patientSearch').value.trim().toLowerCase();
      }

      // Search + date-range only, before any of the three column filters
      // or the outstanding-only toggle — the base set the filter-dropdown
      // checklists count against, so each option shows how many bills it
      // would match given the current search/date range, not narrowed by
      // whatever's already selected in that same or another checklist.
      function searchAndDateInvoices() {
        const search = searchTerm();
        return allInvoices.filter((inv) => !search || inv.patientName.toLowerCase().includes(search));
      }

      function filteredInvoices() {
        let result = searchAndDateInvoices().filter((inv) => {
          if (typeFilterValues.size > 0 && !typeFilterValues.has(inv.feeType)) return false;
          if (doctorFilterIds.size > 0 && !doctorFilterIds.has(inv.doctorId)) return false;
          if (paymentModeFilterValues.size > 0 && !paymentModeFilterValues.has(inv.paymentMode)) return false;
          if (outstandingOnly && inv.amount - inv.amountReceived <= 0) return false;
          return true;
        });
        result.sort((a, b) => (a.invoiceDate || '').localeCompare(b.invoiceDate || '') || new Date(a.createdAt) - new Date(b.createdAt));
        if (sortDirection === 'desc') result.reverse();
        return result;
      }

      function doctorFilterOptions() {
        const counting = searchAndDateInvoices();
        return Object.values(doctorById)
          .map((d) => ({ value: d.id, label: d.name, count: counting.filter((inv) => inv.doctorId === d.id).length }))
          .filter((o) => o.count > 0)
          .sort((a, b) => b.count - a.count);
      }
      function typeFilterOptions() {
        const counting = searchAndDateInvoices();
        return Object.keys(FEE_TYPE_LABELS)
          .map((key) => ({ value: key, label: FEE_TYPE_LABELS[key], count: counting.filter((inv) => inv.feeType === key).length }))
          .filter((o) => o.count > 0);
      }
      function paymentModeFilterOptions() {
        const counting = searchAndDateInvoices();
        return Object.keys(PAYMENT_MODE_LABELS)
          .map((key) => ({ value: key, label: PAYMENT_MODE_LABELS[key], count: counting.filter((inv) => inv.paymentMode === key).length }))
          .filter((o) => o.count > 0);
      }

      // ---------------- Excel-style column-header filter dropdowns ----------------
      // Checking/unchecking a box filters instantly and closes the
      // dropdown right away, so the filtered table is immediately
      // visible — picking a second value in the same column means
      // reopening it (one filter decision at a time), which reads more
      // predictably than a dropdown that lingers open. Clearing every
      // active filter at once (across all columns) is the separate
      // global Reset button next to Export CSV, not a per-dropdown one.
      let openFilterColumn = null;
      function closeColumnFilter() {
        openFilterColumn = null;
        document.querySelectorAll('.filter-dropdown').forEach((el) => el.remove());
      }
      function openColumnFilter(column, anchorTh, options, selectedSet, onChange) {
        if (openFilterColumn === column) { closeColumnFilter(); return; }
        closeColumnFilter();
        openFilterColumn = column;
        const dropdown = document.createElement('div');
        dropdown.className = 'filter-dropdown';
        dropdown.innerHTML = options.map((o) => `
          <label><input type="checkbox" value="${Qlinic.escapeHtml(o.value)}" ${selectedSet.has(o.value) ? 'checked' : ''} /> ${Qlinic.escapeHtml(o.label)}<span class="fd-count">${o.count}</span></label>
        `).join('');
        dropdown.addEventListener('click', (e) => e.stopPropagation());
        dropdown.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
          cb.addEventListener('change', () => {
            if (cb.checked) selectedSet.add(cb.value); else selectedSet.delete(cb.value);
            closeColumnFilter();
            onChange();
          });
        });
        anchorTh.appendChild(dropdown);
      }
      function onRevenueFilterChange() {
        currentPage = 1;
        renderSummary();
        renderTable();
      }
      function resetAllFilters() {
        doctorFilterIds.clear();
        typeFilterValues.clear();
        paymentModeFilterValues.clear();
        outstandingOnly = false;
        onRevenueFilterChange();
      }
      document.addEventListener('click', () => closeColumnFilter());

      // Every summary card — Total revenue, Outstanding, Patients served,
      // and the three type-breakdown counts — tracks every active filter
      // (doctor, type, payment mode, search) exactly the same way the
      // Bills table does. Picking Type = Follow up correctly zeroes out
      // Consultation/Emergency here, rather than only zeroing the Bills
      // table while the cards kept showing the unfiltered breakdown —
      // one filtered view, not two disagreeing ones. Patients served
      // counts distinct people
      // (by patientId), not invoices — one patient can have more than one
      // bill in a range.
      function renderSummary() {
        const inSummary = searchAndDateInvoices().filter((inv) =>
          (doctorFilterIds.size === 0 || doctorFilterIds.has(inv.doctorId)) &&
          (typeFilterValues.size === 0 || typeFilterValues.has(inv.feeType)) &&
          (paymentModeFilterValues.size === 0 || paymentModeFilterValues.has(inv.paymentMode))
        );

        const totalCollected = inSummary.reduce((sum, inv) => sum + inv.amountReceived, 0);
        const totalOutstanding = inSummary.reduce((sum, inv) => sum + Math.max(0, inv.amount - inv.amountReceived), 0);
        // Same null-patientId fix as busiestDoctor above - a manually-
        // billed invoice with no linked queue row has patientId null, and
        // several of those would otherwise all collapse into one "patient"
        // in the Set, undercounting how many people were actually served.
        const patientsServedCount = new Set(inSummary.map((inv) => inv.patientId || `unlinked:${inv.id}`)).size;
        const consultationCount = inSummary.filter((inv) => inv.feeType === 'consultation').length;
        const emergencyCount = inSummary.filter((inv) => inv.feeType === 'emergency').length;
        const followUpCount = inSummary.filter((inv) => inv.feeType === 'waived').length;

        document.getElementById('summaryCards').innerHTML = `
          <div class="stat-card accent-teal"><div class="value value-teal">₹${totalCollected}</div><div class="label">Total revenue</div></div>
          <div class="stat-card accent-danger clickable${outstandingOnly ? ' active-filter' : ''}" id="outstandingCard" title="Click to show only bills with an outstanding balance"><div class="value value-danger">₹${totalOutstanding}</div><div class="label">Outstanding</div></div>
          <div class="stat-card accent-purple"><div class="value value-purple">${patientsServedCount}</div><div class="label">Total patients served</div></div>
          <div class="stat-card accent-blue"><div class="value value-blue">${consultationCount}</div><div class="label">Consultation</div></div>
          <div class="stat-card accent-coral"><div class="value value-coral">${emergencyCount}</div><div class="label">Emergency</div></div>
          <div class="stat-card accent-pink"><div class="value value-pink">${followUpCount}</div><div class="label">Follow up</div></div>
        `;
        document.getElementById('outstandingCard').addEventListener('click', () => {
          outstandingOnly = !outstandingOnly;
          currentPage = 1;
          renderSummary();
          renderTable();
        });
      }

      function renderPager(total) {
        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PAGE_SIZE;
        const end = Math.min(start + PAGE_SIZE, total);
        const summary = `<span class="pager-summary">Showing ${total === 0 ? 0 : start + 1}-${end} of ${total}</span>`;
        const pager = document.getElementById('revenuePager');
        if (totalPages <= 1) {
          pager.innerHTML = summary;
          return;
        }
        pager.innerHTML = `
          ${summary}
          <div class="pager-controls">
            <button class="btn-sm" id="pagerPrev" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>
            <span class="pager-label">Page ${currentPage} of ${totalPages}</span>
            <button class="btn-sm" id="pagerNext" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
          </div>
        `;
        // Prev/Next sit at the bottom of a long table, but the new page's
        // rows start at the top — without this, switching pages leaves
        // the reader staring at the same pager buttons with a table
        // that's silently changed above them.
        document.getElementById('pagerPrev').addEventListener('click', () => { currentPage -= 1; renderTable(); document.getElementById('revenueTableWrap').scrollIntoView({ block: 'start', behavior: 'smooth' }); });
        document.getElementById('pagerNext').addEventListener('click', () => { currentPage += 1; renderTable(); document.getElementById('revenueTableWrap').scrollIntoView({ block: 'start', behavior: 'smooth' }); });
      }

      // One removable chip per active column filter, so a filtered Bills
      // table is visibly and specifically flagged as filtered (which
      // column, which values) rather than looking identical to the
      // unfiltered table. Outstanding-only keeps its own red chip (an
      // alert, not just a filter); the rest render in .filter-chip's
      // neutral accent-blue.
      function activeFilterChipsHtml() {
        const chips = [];
        if (doctorFilterIds.size > 0) {
          const labels = Object.values(doctorById).filter((d) => doctorFilterIds.has(d.id)).map((d) => d.name);
          chips.push({ key: 'doctor', label: `Doctor: ${labels.join(', ')}` });
        }
        if (typeFilterValues.size > 0) {
          const labels = [...typeFilterValues].map((v) => FEE_TYPE_LABELS[v] || v);
          chips.push({ key: 'type', label: `Type: ${labels.join(', ')}` });
        }
        if (paymentModeFilterValues.size > 0) {
          const labels = [...paymentModeFilterValues].map((v) => PAYMENT_MODE_LABELS[v] || v);
          chips.push({ key: 'payment', label: `Payment mode: ${labels.join(', ')}` });
        }
        const chipsHtml = chips.map((c) => `<div class="filter-chip">${Qlinic.escapeHtml(c.label)}<button type="button" class="clear-filter-chip" data-key="${c.key}" aria-label="Clear filter">×</button></div>`).join('');
        const outstandingHtml = outstandingOnly ? `<div class="active-filter-chip">Showing: outstanding balance only <button type="button" class="clear-filter-chip" data-key="outstanding" aria-label="Clear filter">×</button></div>` : '';
        if (!chipsHtml && !outstandingHtml) return '';
        return `<div class="active-filter-chips">${chipsHtml}${outstandingHtml}</div>`;
      }
      function clearFilterByKey(key) {
        if (key === 'doctor') doctorFilterIds.clear();
        else if (key === 'type') typeFilterValues.clear();
        else if (key === 'payment') paymentModeFilterValues.clear();
        else if (key === 'outstanding') outstandingOnly = false;
        onRevenueFilterChange();
      }

      function FILTER_ICON_SVG(className) {
        return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>`;
      }
      function SORT_ARROW_SVG() {
        const rotated = sortDirection === 'desc' ? ' style="transform:rotate(180deg);"' : '';
        return `<svg class="th-filter-icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"${rotated}><path d="M12 5v14M6 11l6-6 6 6"/></svg>`;
      }

      function renderTable() {
        const filtered = filteredInvoices();
        const wrap = document.getElementById('revenueTableWrap');

        // Rendered into the panel-header row (next to Export CSV/Reset
        // filters) rather than as its own block above the table, so
        // filtering doesn't shift the table down or move it back up when
        // cleared — and it stays visible even when a filter zeroes out
        // every row, so there's still something to clear.
        document.getElementById('activeFilterChipsRow').innerHTML = activeFilterChipsHtml();
        document.querySelectorAll('#activeFilterChipsRow .clear-filter-chip').forEach((btn) => {
          btn.addEventListener('click', () => clearFilterByKey(btn.dataset.key));
        });

        if (allInvoices.length === 0) {
          wrap.innerHTML = `<div class="empty-state">No bills for this ${viewMode === 'range' ? 'period' : 'date'}.</div>`;
          document.getElementById('revenuePager').innerHTML = '';
          return;
        }
        if (filtered.length === 0) {
          wrap.innerHTML = '<div class="empty-state">No bills match these filters.</div>';
          document.getElementById('revenuePager').innerHTML = '';
          return;
        }
        const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageItems = filtered.slice(start, start + PAGE_SIZE);

        const doctorIconClass = doctorFilterIds.size > 0 ? 'th-filter-icon active' : 'th-filter-icon';
        const typeIconClass = typeFilterValues.size > 0 ? 'th-filter-icon active' : 'th-filter-icon';
        const paymentIconClass = paymentModeFilterValues.size > 0 ? 'th-filter-icon active' : 'th-filter-icon';

        wrap.innerHTML = `
          <table class="qtable qtable-fixed">
            <colgroup>
              <col style="width:20%;"><col style="width:10%;"><col style="width:10%;">
              <col style="width:12%;"><col style="width:10%;"><col style="width:15%;"><col style="width:23%;">
            </colgroup>
            <thead><tr>
              <th>Patient</th><th>Phone</th>
              <th class="th-filterable"><span class="th-filter-trigger" id="dateSortTrigger">Visit date ${SORT_ARROW_SVG()}</span></th>
              <th class="th-filterable"><span class="th-filter-trigger" id="doctorFilterTrigger" title="Click to filter by Doctor">Doctor ${FILTER_ICON_SVG(doctorIconClass)}</span></th>
              <th class="th-filterable"><span class="th-filter-trigger" id="typeFilterTrigger" title="Click to filter by Type">Type ${FILTER_ICON_SVG(typeIconClass)}</span></th>
              <th class="th-filterable"><span class="th-filter-trigger" id="paymentFilterTrigger" title="Click to filter by Payment mode">Payment mode ${FILTER_ICON_SVG(paymentIconClass)}</span></th>
              <th>Payment collected</th>
            </tr></thead>
            <tbody>
              ${pageItems.map((inv) => {
                const balance = inv.amount - inv.amountReceived;
                const doctor = doctorById[inv.doctorId];
                const subInfo = [inv.patientAge ? `${inv.patientAge} yrs` : '', inv.patientAddress ? Qlinic.escapeHtml(inv.patientAddress) : ''].filter(Boolean).join(' · ');
                return `
                <tr>
                  <td class="qtable-wrap">
                    <div>${Qlinic.escapeHtml(inv.patientName)}</div>
                    ${subInfo ? `<div class="sub-line">${subInfo}</div>` : ''}
                  </td>
                  <td>${Qlinic.escapeHtml(inv.patientPhone || '—')}</td>
                  <td>${Qlinic.formatDateLabel(inv.invoiceDate)}</td>
                  <td>${doctor ? Qlinic.escapeHtml(doctor.name) : '—'}</td>
                  <td>${FEE_TYPE_LABELS[inv.feeType] || inv.feeType}</td>
                  <td>${PAYMENT_MODE_LABELS[inv.paymentMode] || inv.paymentMode}</td>
                  <td>${billingCell(inv, doctor)}</td>
                </tr>
              `;
              }).join('')}
            </tbody>
          </table>
        `;
        document.getElementById('dateSortTrigger').addEventListener('click', () => {
          sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
          renderTable();
        });
        document.getElementById('doctorFilterTrigger').addEventListener('click', (e) => {
          e.stopPropagation();
          openColumnFilter('doctor', e.currentTarget.closest('th'), doctorFilterOptions(), doctorFilterIds, onRevenueFilterChange);
        });
        document.getElementById('typeFilterTrigger').addEventListener('click', (e) => {
          e.stopPropagation();
          openColumnFilter('type', e.currentTarget.closest('th'), typeFilterOptions(), typeFilterValues, onRevenueFilterChange);
        });
        document.getElementById('paymentFilterTrigger').addEventListener('click', (e) => {
          e.stopPropagation();
          openColumnFilter('payment', e.currentTarget.closest('th'), paymentModeFilterOptions(), paymentModeFilterValues, onRevenueFilterChange);
        });
        renderPager(filtered.length);
      }

      // Same fields, save flow, and field classes as Reception's Adjust
      // editor (fee type recomputes amount server-side, payment mode,
      // amount received) — just without the Print link, since this page
      // is for correcting a figure, not reprinting a receipt.
      function billingCell(inv, doctor) {
        const balance = inv.amount - inv.amountReceived;
        if (editingInvoiceId === inv.id) {
          return `
            <div class="adj-box">
              <select class="adj-fee-type" data-fee-normal="${(doctor && doctor.feeNormal) || 0}" data-fee-emergency="${(doctor && doctor.feeEmergency) || 0}" onchange="syncAdjustAmount(this)">
                <option value="consultation" ${inv.feeType === 'consultation' ? 'selected' : ''}>Consultation</option>
                <option value="emergency" ${inv.feeType === 'emergency' ? 'selected' : ''}>Emergency</option>
                <option value="waived" ${inv.feeType === 'waived' ? 'selected' : ''}>Follow up</option>
              </select>
              <select class="adj-payment-mode">
                <option value="cash" ${inv.paymentMode === 'cash' ? 'selected' : ''}>Cash</option>
                <option value="upi" ${inv.paymentMode === 'upi' ? 'selected' : ''}>UPI</option>
                <option value="card" ${inv.paymentMode === 'card' ? 'selected' : ''}>Card</option>
              </select>
              <input type="number" min="0" step="1" class="adj-amount-received" value="${inv.amountReceived}" />
              <div class="adj-actions">
                <button type="button" class="btn-sm primary" onclick="saveInvoiceEdit('${inv.id}')">Save</button>
                <button type="button" class="btn-sm" onclick="cancelInvoiceEdit()">Cancel</button>
              </div>
            </div>
          `;
        }
        return `
          <div><span style="display:inline-block;min-width:64px;">₹${inv.amountReceived}</span><a href="#" onclick="startEditInvoice('${inv.id}'); return false;" style="color:var(--accent);text-decoration:none;">Adjust</a></div>
          ${balance > 0 ? `<div class="sub-line" style="color:var(--danger);">Balance: ₹${balance}</div>` : ''}
        `;
      }

      function startEditInvoice(invoiceId) {
        editingInvoiceId = invoiceId;
        renderTable();
      }
      function cancelInvoiceEdit() {
        editingInvoiceId = null;
        renderTable();
      }
      async function saveInvoiceEdit(invoiceId) {
        const row = document.querySelector(`[onclick*="saveInvoiceEdit('${invoiceId}')"]`).closest('td');
        const feeType = row.querySelector('.adj-fee-type').value;
        const paymentMode = row.querySelector('.adj-payment-mode').value;
        const amountReceived = row.querySelector('.adj-amount-received').value;
        try {
          await Qlinic.updateInvoicePayment({ invoiceId, feeType, paymentMode, amountReceived });
        } catch (err) {
          showToast(err.message || 'Could not update billing — please try again.');
          return;
        }
        editingInvoiceId = null;
        showToast('Billing updated');
        await loadInvoices();
      }
      window.startEditInvoice = startEditInvoice;
      window.cancelInvoiceEdit = cancelInvoiceEdit;
      window.saveInvoiceEdit = saveInvoiceEdit;

      // Mirrors Reception's syncAdjustAmount: keeps the amount field
      // showing the fee that would actually be saved the instant fee
      // type changes, so Save never submits a stale amount against a
      // different fee type.
      function syncAdjustAmount(selectEl) {
        const cell = selectEl.closest('td');
        const amountInput = cell.querySelector('.adj-amount-received');
        const feeType = selectEl.value;
        const amount = feeType === 'waived' ? 0
          : feeType === 'emergency' ? Number(selectEl.dataset.feeEmergency) || 0
          : Number(selectEl.dataset.feeNormal) || 0;
        amountInput.value = amount;
      }
      window.syncAdjustAmount = syncAdjustAmount;

      function currentRange() {
        if (viewMode !== 'range') return null;
        return rangePreset === 'custom' ? customRange : rangeForPreset(rangePreset);
      }

      async function loadInvoices() {
        // Fired here, not just from onLiveChange - every filter/date
        // change on this page calls loadInvoices() directly right after
        // itself, without waiting for the realtime round-trip (same fix
        // as Reception's waiting-chip needed after it shipped lagging
        // behind local actions).
        renderRevenueChip();
        const range = currentRange();
        allInvoices = viewMode === 'range'
          ? (range ? await Qlinic.getInvoicesForDateRange(range.start, range.end) : [])
          : await Qlinic.getInvoicesForDate(document.getElementById('dateFilter').value);
        currentPage = 1;
        renderSummary();
        renderTable();
      }

      document.getElementById('dateFilter').addEventListener('change', loadInvoices);
      document.getElementById('todayBtn').addEventListener('click', () => {
        document.getElementById('dateFilter').value = Qlinic.getTodayDate();
        loadInvoices();
      });
      // ISO "YYYY-MM-DD" strings compare correctly with plain <=/>=, so
      // no Date parsing needed here - just swap if From ends up after To
      // rather than silently returning an empty/backwards range.
      function updateCustomRangeFromInputs() {
        const s = document.getElementById('rangeStartDate').value;
        const e = document.getElementById('rangeEndDate').value;
        customRange = (s && e) ? { start: s <= e ? s : e, end: s <= e ? e : s } : null;
        loadInvoices();
      }
      ['rangeStartDate', 'rangeEndDate'].forEach((id) => {
        document.getElementById(id).addEventListener('change', updateCustomRangeFromInputs);
      });

      function renderRangePresetOptions() {
        document.getElementById('rangePresetSelect').innerHTML = RANGE_PRESETS.map((p) =>
          `<option value="${p.key}" ${p.key === rangePreset ? 'selected' : ''}>${p.label}</option>`
        ).join('');
      }
      document.getElementById('rangePresetSelect').addEventListener('change', (e) => {
        rangePreset = e.target.value;
        document.getElementById('customRangeFilters').style.display = rangePreset === 'custom' ? 'flex' : 'none';
        loadInvoices();
      });
      document.getElementById('viewModeToggle').addEventListener('click', (e) => {
        const btn = e.target.closest('.period-pill');
        if (!btn) return;
        viewMode = btn.dataset.mode;
        document.querySelectorAll('#viewModeToggle .period-pill').forEach((p) => p.classList.toggle('active', p === btn));
        document.getElementById('singleDayFilters').style.display = viewMode === 'single' ? 'flex' : 'none';
        document.getElementById('rangePresetField').style.display = viewMode === 'range' ? 'flex' : 'none';
        document.getElementById('customRangeFilters').style.display = (viewMode === 'range' && rangePreset === 'custom') ? 'flex' : 'none';
        loadInvoices();
      });
      document.getElementById('patientSearch').addEventListener('input', () => {
        currentPage = 1;
        renderSummary();
        renderTable();
      });
      document.getElementById('resetFiltersBtn').addEventListener('click', resetAllFilters);
      document.getElementById('exportCsvBtn').addEventListener('click', () => {
        const csv = buildRevenueCsv(filteredInvoices());
        let label;
        if (viewMode === 'range') {
          const range = currentRange();
          label = range ? `${range.start}_to_${range.end}` : 'range';
        } else {
          label = document.getElementById('dateFilter').value;
        }
        downloadCsv(`revenue-${label}.csv`, csv);
      });

      Qlinic.attachDatePicker(document.getElementById('dateFilter'));
      document.getElementById('dateFilter').max = Qlinic.getTodayDate();
      document.getElementById('dateFilter').value = Qlinic.getTodayDate();
      // Today/Tomorrow/In a week dropped - jumping just one end of a
      // custom range to "today" independent of the other rarely makes
      // sense as a range boundary. (dateFilter above keeps them - it's
      // picking a single specific day, where the jump is useful.)
      Qlinic.attachDatePicker(document.getElementById('rangeStartDate'), { quickButtons: false });
      Qlinic.attachDatePicker(document.getElementById('rangeEndDate'), { quickButtons: false });
      document.getElementById('rangeStartDate').max = Qlinic.getTodayDate();
      document.getElementById('rangeEndDate').max = Qlinic.getTodayDate();
      renderRangePresetOptions();
      if (linkedStart && linkedEnd) {
        // A Trends bar links to an exact day-level range - now that From/
        // To are real date pickers rather than Month+Year dropdowns, it's
        // shown exactly as given instead of the previous best-effort
        // month-level approximation.
        viewMode = 'range';
        rangePreset = 'custom';
        customRange = { start: linkedStart, end: linkedEnd };
        document.querySelectorAll('#viewModeToggle .period-pill').forEach((p) => p.classList.toggle('active', p.dataset.mode === 'range'));
        document.getElementById('rangePresetSelect').value = 'custom';
        document.getElementById('singleDayFilters').style.display = 'none';
        document.getElementById('rangePresetField').style.display = 'flex';
        document.getElementById('customRangeFilters').style.display = 'flex';
        document.getElementById('rangeStartDate').value = linkedStart;
        document.getElementById('rangeEndDate').value = linkedEnd;
      }

      const clinic = await Qlinic.getClinic();
      document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
      if (clinic && clinic.logo_url) {
        document.getElementById('clinicLogoThumb').src = clinic.logo_url;
        document.getElementById('clinicLogoThumb').style.display = 'block';
      } else {
        document.getElementById('clinicLogoThumb').style.display = 'none';
      }
      await loadDoctorFilterOptions();
      await loadInvoices();
      Qlinic.onLiveChange(loadInvoices);
    })();
  </script>

</body>
</html>
