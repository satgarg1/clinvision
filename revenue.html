  <script>
    (async function () {
      if (!(await Qlinic.requireLogin('login.html'))) return;

      document.querySelector('a.brand').addEventListener('click', async (e) => {
        e.preventDefault();
        if (await Qlinic.confirmDialog({ message: "Going to the homepage will end your session here, you'll need to log in again to get back in." })) {
          window.location.href = 'index.html';
        }
      });

      if (!(await Qlinic.isAdmin())) {
        window.location.href = 'dashboard.html';
        return;
      }
      if (!(await Qlinic.hasFeature('insights'))) {
        window.location.href = 'dashboard.html';
        return;
      }
      await Qlinic.applyFeatureNavGating();
      document.body.style.visibility = 'visible';

      let pageSize = 25;
      const FEE_TYPE_LABELS = { consultation: 'Consultation', emergency: 'Emergency', waived: 'Follow up' };
      const PAYMENT_MODE_LABELS = { cash: 'Cash', upi: 'UPI', card: 'Card' };

      let allInvoices = [];
      let currentPage = 1;
      let doctorById = {};
      let doctorsListCache = [];
      let viewMode = 'single';
      let rangePreset = 'lastweek';
      let customRange = null;
      let doctorFilterIds = new Set();
      let typeFilterValues = new Set();
      let paymentModeFilterValues = new Set();
      let sortDirection = 'asc';
      let outstandingOnly = false;

      function pad2(n) { return String(n).padStart(2, '0'); }
      function toDateStr(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }

      function computeLastWeekRange() {
        const today = new Date();
        const day = today.getDay();
        const diffToMonday = day === 0 ? 6 : day - 1;
        const thisMonday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - diffToMonday);
        const lastMonday = new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate() - 7);
        const lastSunday = new Date(thisMonday.getFullYear(), thisMonday.getMonth(), thisMonday.getDate() - 1);
        return { start: toDateStr(lastMonday), end: toDateStr(lastSunday) };
      }
      function computeCurrentWeekRange() {
        const today = new Date();
        const day = today.getDay();
        const diffToMonday = day === 0 ? 6 : day - 1;
        const monday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - diffToMonday);
        const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
        const todayStr = toDateStr(today);
        const sundayStr = toDateStr(sunday);
        return { start: toDateStr(monday), end: sundayStr > todayStr ? todayStr : sundayStr };
      }
      function computeCurrentMonthRange() {
        const today = new Date();
        const first = new Date(today.getFullYear(), today.getMonth(), 1);
        const last = new Date(today.getFullYear(), today.getMonth() + 1, 0);
        const todayStr = toDateStr(today);
        const lastStr = toDateStr(last);
        return { start: toDateStr(first), end: lastStr > todayStr ? todayStr : lastStr };
      }
      function computeLastMonthRange() {
        const today = new Date();
        const firstOfThisMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        const lastOfLastMonth = new Date(firstOfThisMonth.getFullYear(), firstOfThisMonth.getMonth(), 0);
        const firstOfLastMonth = new Date(lastOfLastMonth.getFullYear(), lastOfLastMonth.getMonth(), 1);
        return { start: toDateStr(firstOfLastMonth), end: toDateStr(lastOfLastMonth) };
      }
      function computeLastNMonthsRange(n) {
        const today = new Date();
        const firstOfThisMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        const end = new Date(firstOfThisMonth.getFullYear(), firstOfThisMonth.getMonth(), 0);
        const start = new Date(firstOfThisMonth.getFullYear(), firstOfThisMonth.getMonth() - n, 1);
        return { start: toDateStr(start), end: toDateStr(end) };
      }
      const CURRENT_FY_START_YEAR = (() => {
        const today = new Date();
        return today.getMonth() >= 3 ? today.getFullYear() : today.getFullYear() - 1;
      })();
      function computeCurrentFYRange() {
        const today = new Date();
        const start = new Date(CURRENT_FY_START_YEAR, 3, 1);
        const naturalEnd = new Date(CURRENT_FY_START_YEAR + 1, 2, 31);
        const todayStr = toDateStr(today);
        const naturalEndStr = toDateStr(naturalEnd);
        return { start: toDateStr(start), end: naturalEndStr > todayStr ? todayStr : naturalEndStr };
      }
      function computeLastFYRange() {
        const lastFYStartYear = CURRENT_FY_START_YEAR - 1;
        const start = new Date(lastFYStartYear, 3, 1);
        const end = new Date(lastFYStartYear + 1, 2, 31);
        return { start: toDateStr(start), end: toDateStr(end) };
      }
      function fyLabel(startYear) {
        return `Apr '${String(startYear).slice(-2)} - Mar '${String(startYear + 1).slice(-2)}`;
      }
      const RANGE_PRESETS = [
        { key: 'lastweek', label: 'Last week', compute: computeLastWeekRange },
        { key: 'currentweek', label: 'Current week', compute: computeCurrentWeekRange },
        { key: 'currentmonth', label: 'Current month', compute: computeCurrentMonthRange },
        { key: 'lastmonth', label: 'Last month', compute: computeLastMonthRange },
        { key: 'last3months', label: 'Last 3 months', compute: () => computeLastNMonthsRange(3) },
        { key: 'last6months', label: 'Last 6 months', compute: () => computeLastNMonthsRange(6) },
        { key: 'last12months', label: 'Last 12 months', compute: () => computeLastNMonthsRange(12) },
        { key: 'currentfy', label: `Current financial year (${fyLabel(CURRENT_FY_START_YEAR)})`, compute: computeCurrentFYRange },
        { key: 'lastfy', label: `Last financial year (${fyLabel(CURRENT_FY_START_YEAR - 1)})`, compute: computeLastFYRange },
        { key: 'custom', label: 'Custom', compute: null },
      ];
      function rangeForPreset(preset) {
        const entry = RANGE_PRESETS.find((p) => p.key === preset);
        return entry && entry.compute ? entry.compute() : null;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const linkedStart = urlParams.get('start');
      const linkedEnd = urlParams.get('end');

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      function csvCell(value) {
        let s = String(value == null ? '' : value);
        // A leading = + - or @ would run as a formula when the file is opened in Excel, so text like that is forced to plain text.
        if (typeof value !== 'number' && /^[=+\-@\t\r]/.test(s)) s = "'" + s;
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }
      function downloadCsv(filename, csvText) {
        const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }
      function buildRevenueCsv(invoices) {
        const rows = [['Patient', 'Phone', 'Age', 'Address', 'Doctor', 'Type', 'Payment mode', 'Amount billed', 'Amount received', 'Balance']];
        invoices.forEach((inv) => {
          const doctor = doctorById[inv.doctorId];
          rows.push([
            inv.patientName,
            inv.patientPhone || '',
            inv.patientAge ?? '',
            inv.patientAddress || '',
            Qlinic.doctorLabel(doctor),
            FEE_TYPE_LABELS[inv.feeType] || inv.feeType,
            PAYMENT_MODE_LABELS[inv.paymentMode] || inv.paymentMode,
            inv.amount,
            inv.amountReceived,
            inv.amount - inv.amountReceived,
          ]);
        });
        return rows.map((r) => r.map(csvCell).join(',')).join('\r\n');
      }

      async function loadDoctorFilterOptions() {
        const doctors = await Qlinic.getDoctors({ includeInactive: true });
        doctorById = Object.fromEntries(doctors.map((d) => [d.id, d]));
        doctorsListCache = doctors;
      }

      const ACCENT_COLORS = ['teal', 'blue', 'purple', 'coral', 'pink'];
      function accentForDoctor(doctorId) {
        const idx = doctorsListCache.findIndex((d) => d.id === doctorId);
        return ACCENT_COLORS[Math.max(idx, 0) % ACCENT_COLORS.length];
      }

      function percentChip(todayVal, yesterdayVal, higherIsGood) {
        if (!yesterdayVal || todayVal == null) return null;
        const pct = Math.round(((todayVal - yesterdayVal) / yesterdayVal) * 100);
        if (pct === 0) return null;
        const isIncrease = pct > 0;
        return { text: `${Math.abs(pct)}%`, arrow: isIncrease ? '▲' : '▼', good: isIncrease === higherIsGood };
      }

      async function renderRevenueChip() {
        const todayStr = Qlinic.getTodayDate();
        const cutoffYesterday = new Date(Date.now() - 24 * 3600000);
        const yesterdayStr = toDateStr(cutoffYesterday);
        const monthStart = toDateStr(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
        const weekRange = computeCurrentWeekRange();
        const fetchStart = [monthStart, weekRange.start, yesterdayStr].sort()[0];

        const [rangeInvoices, outstandingInvoices] = await Promise.all([
          Qlinic.getInvoicesForDateRange(fetchStart, todayStr),
          Qlinic.getOutstandingInvoices(),
        ]);

        const wrap = document.getElementById('revenueChipWrap');
        if (doctorsListCache.length === 0) { wrap.style.display = 'none'; return; }
        wrap.style.display = '';

        const sumReceived = (invs) => invs.reduce((sum, inv) => sum + inv.amountReceived, 0);
        const todayTotal = sumReceived(rangeInvoices.filter((inv) => inv.invoiceDate === todayStr));
        const yesterdayTotal = sumReceived(rangeInvoices.filter((inv) =>
          inv.invoiceDate === yesterdayStr && new Date(inv.createdAt) <= cutoffYesterday
        ));
        const trend = percentChip(todayTotal, yesterdayTotal, true);
        const trendBadge = trend ? `<span class="trend-chip ${trend.good ? 'good' : 'bad'}">${trend.arrow} ${trend.text}</span>` : '';

        document.getElementById('revenueChipText').innerHTML = `₹${todayTotal} today ${trendBadge}`;

        const monthInvoices = rangeInvoices.filter((inv) => inv.invoiceDate >= monthStart);
        const byDay = {};
        monthInvoices.forEach((inv) => { byDay[inv.invoiceDate] = (byDay[inv.invoiceDate] || 0) + inv.amountReceived; });
        const dayEntries = Object.entries(byDay).sort((a, b) => b[1] - a[1]);
        const bestDay = dayEntries[0] || null;
        const worstDay = dayEntries.length ? dayEntries[dayEntries.length - 1] : null;

        function busiestDoctor(invs) {
          const byDoctor = {};
          invs.forEach((inv) => {
            if (!byDoctor[inv.doctorId]) byDoctor[inv.doctorId] = new Set();
            byDoctor[inv.doctorId].add(inv.patientId || `unlinked:${inv.id}`);
          });
          let top = null;
          Object.entries(byDoctor).forEach(([doctorId, patients]) => {
            if (!top || patients.size > top.count) top = { doctorId, count: patients.size };
          });
          return top;
        }
        const busiestToday = busiestDoctor(rangeInvoices.filter((inv) => inv.invoiceDate === todayStr));
        const busiestWeek = busiestDoctor(rangeInvoices.filter((inv) => inv.invoiceDate >= weekRange.start && inv.invoiceDate <= weekRange.end));

        const outstandingTotal = outstandingInvoices.reduce((sum, inv) => sum + Math.max(0, inv.amount - inv.amountReceived), 0);
        const outstandingShown = outstandingInvoices.slice(0, 10);

        function docRow(label, best) {
          if (!best || !doctorById[best.doctorId]) {
            return `<div class="rv-doc-row"><span class="rv-doc-period">${label}</span><span class="rv-empty-note">No visits yet</span></div>`;
          }
          const doctor = doctorById[best.doctorId];
          return `
            <div class="rv-doc-row">
              <span class="rv-doc-period">${label}</span>
              <span class="rv-doc-name" title="${Qlinic.escapeHtml(Qlinic.doctorLabel(doctor))}">${Qlinic.escapeHtml(Qlinic.doctorLabel(doctor))}</span>
              <span class="rv-doc-count">${best.count} patient${best.count === 1 ? '' : 's'}</span>
            </div>
          `;
        }
        const sectionIcon = (tone, inner) => `<div class="rv-sec-ic ${tone}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg></div>`;
        const dayRow = (kind, label, entry) => `
          <div class="rv-day-row">
            <span class="rv-day-tag ${kind}">${label}</span>
            <span class="rv-day-date">${Qlinic.escapeHtml(Qlinic.formatDateLabel(entry[0]))}</span>
            <span class="rv-day-amt">₹${entry[1]}</span>
          </div>`;

        document.getElementById('revenuePopover').innerHTML = `
          <div class="rv-sec first">
            ${sectionIcon('green', '<line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="6"/><line x1="18" y1="20" x2="18" y2="14"/>')}
            <div class="rv-sec-body">
              <div class="rv-eyebrow">Today vs. yesterday</div>
              <div class="rv-today-row"><span class="rv-today-num">₹${todayTotal}</span>${trendBadge}</div>
              <div class="rv-today-sub">₹${yesterdayTotal} yesterday at this time</div>
            </div>
          </div>

          <div class="rv-sec">
            ${sectionIcon('blue', '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>')}
            <div class="rv-sec-body">
              <div class="rv-eyebrow">Best &amp; worst day this month</div>
              ${dayEntries.length === 0 ? '<div class="rv-empty-note">Not enough data yet</div>' : dayEntries.length === 1 ? `
                <div class="rv-daypair">
                  <div class="rv-day-row">
                    <span class="rv-day-date">${Qlinic.escapeHtml(Qlinic.formatDateLabel(bestDay[0]))}</span>
                    <span class="rv-day-amt">₹${bestDay[1]}</span>
                  </div>
                </div>
                <div class="rv-empty-note" style="margin-top:8px;">Best and worst will show once there is more than 1 day of revenue this month.</div>
              ` : `
                <div class="rv-daypair">
                  ${dayRow('best', 'BEST', bestDay)}
                  ${dayRow('worst', 'WORST', worstDay)}
                </div>
              `}
            </div>
          </div>

          <div class="rv-sec">
            ${sectionIcon('purple', '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>')}
            <div class="rv-sec-body">
              <div class="rv-eyebrow">Busiest doctor</div>
              ${docRow('Today', busiestToday)}
              ${docRow('This week', busiestWeek)}
            </div>
          </div>

          <div class="rv-sec">
            ${sectionIcon('red', '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="14 3 14 8 19 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/>')}
            <div class="rv-sec-body">
              <div class="rv-eyebrow">Outstanding</div>
              <div class="rv-out-amt">₹${outstandingTotal}</div>
              <div class="rv-today-sub">Across ${outstandingInvoices.length} bill${outstandingInvoices.length === 1 ? '' : 's'}</div>
            </div>
            ${outstandingInvoices.length ? `<button type="button" class="rv-out-toggle" id="revenueOutstandingToggle" aria-label="Show outstanding bills" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" id="revenueOutstandingArrow"><polyline points="6 9 12 15 18 9"/></svg></button>` : ''}
          </div>
          ${outstandingInvoices.length ? `
            <div class="rv-out-list" id="revenueOutstandingList">
              ${outstandingShown.map((inv) => `
                <div class="rv-out-row">
                  <div class="info">
                    <div class="name">${Qlinic.escapeHtml(inv.patientName)}</div>
                    <div class="phone">${inv.patientPhone ? Qlinic.escapeHtml(inv.patientPhone) : 'No phone'}</div>
                  </div>
                  <span class="amt">₹${Math.max(0, inv.amount - inv.amountReceived)}</span>
                </div>
              `).join('')}
              ${outstandingInvoices.length > 10 ? `<div class="rv-empty-note">Showing oldest 10 of ${outstandingInvoices.length}</div>` : ''}
            </div>
          ` : ''}
        `;
        const outstandingToggleBtn = document.getElementById('revenueOutstandingToggle');
        if (outstandingToggleBtn) {
          outstandingToggleBtn.addEventListener('click', () => {
            const open = document.getElementById('revenueOutstandingList').classList.toggle('open');
            outstandingToggleBtn.setAttribute('aria-expanded', String(open));
            document.getElementById('revenueOutstandingArrow').classList.toggle('open', open);
          });
        }
      }
      function closeRevenuePopover() {
        document.getElementById('revenuePopover').classList.remove('open');
        document.getElementById('revenueChipBtn').setAttribute('aria-expanded', 'false');
      }
      document.getElementById('revenueChipBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        const popover = document.getElementById('revenuePopover');
        const isOpen = popover.classList.toggle('open');
        document.getElementById('revenueChipBtn').setAttribute('aria-expanded', String(isOpen));
      });
      document.addEventListener('click', (e) => {
        if (!document.getElementById('revenueChipWrap').contains(e.target)) closeRevenuePopover();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeRevenuePopover();
      });

      function searchTerm() {
        return document.getElementById('revenueSearch').value.trim().toLowerCase();
      }

      function searchAndDateInvoices() {
        const search = searchTerm();
        return allInvoices.filter((inv) => !search || inv.patientName.toLowerCase().includes(search));
      }

      function filteredInvoices() {
        let result = searchAndDateInvoices().filter((inv) => {
          if (typeFilterValues.size > 0 && !typeFilterValues.has(inv.feeType)) return false;
          if (doctorFilterIds.size > 0 && !doctorFilterIds.has(inv.doctorId)) return false;
          if (paymentModeFilterValues.size > 0 && !paymentModeFilterValues.has(inv.paymentMode)) return false;
          if (outstandingOnly && inv.amount - inv.amountReceived <= 0) return false;
          return true;
        });
        result.sort((a, b) => (a.invoiceDate || '').localeCompare(b.invoiceDate || '') || new Date(a.createdAt) - new Date(b.createdAt));
        if (sortDirection === 'desc') result.reverse();
        return result;
      }

      function doctorFilterOptions() {
        const counting = searchAndDateInvoices();
        return Object.values(doctorById)
          .map((d) => ({ value: d.id, label: d.name, count: counting.filter((inv) => inv.doctorId === d.id).length }))
          .filter((o) => o.count > 0)
          .sort((a, b) => b.count - a.count);
      }
      function typeFilterOptions() {
        const counting = searchAndDateInvoices();
        return Object.keys(FEE_TYPE_LABELS)
          .map((key) => ({ value: key, label: FEE_TYPE_LABELS[key], count: counting.filter((inv) => inv.feeType === key).length }))
          .filter((o) => o.count > 0);
      }
      function paymentModeFilterOptions() {
        const counting = searchAndDateInvoices();
        return Object.keys(PAYMENT_MODE_LABELS)
          .map((key) => ({ value: key, label: PAYMENT_MODE_LABELS[key], count: counting.filter((inv) => inv.paymentMode === key).length }))
          .filter((o) => o.count > 0);
      }

      let openFilterColumn = null;
      function closeColumnFilter() {
        openFilterColumn = null;
        document.querySelectorAll('.filter-dropdown').forEach((el) => el.remove());
      }
      function openColumnFilter(column, anchorTh, options, selectedSet, onChange) {
        if (openFilterColumn === column) { closeColumnFilter(); return; }
        closeColumnFilter();
        openFilterColumn = column;
        const dropdown = document.createElement('div');
        dropdown.className = 'filter-dropdown';
        dropdown.innerHTML = options.map((o) => `
          <label><input type="checkbox" value="${Qlinic.escapeHtml(o.value)}" ${selectedSet.has(o.value) ? 'checked' : ''} /> ${Qlinic.escapeHtml(o.label)}<span class="fd-count">${o.count}</span></label>
        `).join('');
        dropdown.addEventListener('click', (e) => e.stopPropagation());
        dropdown.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
          cb.addEventListener('change', () => {
            if (cb.checked) selectedSet.add(cb.value); else selectedSet.delete(cb.value);
            closeColumnFilter();
            onChange();
          });
        });
        const anchorRect = anchorTh.getBoundingClientRect();
        dropdown.style.top = (anchorRect.bottom + 6) + 'px';
        dropdown.style.left = Math.max(8, Math.min(anchorRect.left, window.innerWidth - 208)) + 'px';
        document.body.appendChild(dropdown);
      }
      function onRevenueFilterChange() {
        currentPage = 1;
        renderSummary();
        renderTable();
      }
      function resetAllFilters() {
        doctorFilterIds.clear();
        typeFilterValues.clear();
        paymentModeFilterValues.clear();
        outstandingOnly = false;
        document.getElementById('revenueSearch').value = '';
        onRevenueFilterChange();
      }
      document.addEventListener('click', () => closeColumnFilter());

      function renderSummary() {
        const inSummary = searchAndDateInvoices().filter((inv) =>
          (doctorFilterIds.size === 0 || doctorFilterIds.has(inv.doctorId)) &&
          (typeFilterValues.size === 0 || typeFilterValues.has(inv.feeType)) &&
          (paymentModeFilterValues.size === 0 || paymentModeFilterValues.has(inv.paymentMode))
        );

        const totalCollected = inSummary.reduce((sum, inv) => sum + inv.amountReceived, 0);
        const totalOutstanding = inSummary.reduce((sum, inv) => sum + Math.max(0, inv.amount - inv.amountReceived), 0);
        const patientsServedCount = new Set(inSummary.map((inv) => inv.patientId || `unlinked:${inv.id}`)).size;
        const consultationCount = inSummary.filter((inv) => inv.feeType === 'consultation').length;
        const emergencyCount = inSummary.filter((inv) => inv.feeType === 'emergency').length;
        const followUpCount = inSummary.filter((inv) => inv.feeType === 'waived').length;

        const icon = (inner) => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
        const WAVE = '<svg class="rv-kpi-wave" width="100%" height="34" viewBox="0 0 200 34" preserveAspectRatio="none" aria-hidden="true"><path d="M0 20 C40 4 80 30 120 18 C150 10 175 24 200 12 L200 34 L0 34 Z" fill="currentColor"/></svg>';
        const card = (tone, ic, value, label, extra) => `
          <${extra ? 'button type="button" id="outstandingCard" aria-pressed="' + outstandingOnly + '" title="Click to show only bills with an outstanding balance"' : 'div'} class="rv-kpi ${tone}${extra && outstandingOnly ? ' active-filter' : ''}">
            ${WAVE}
            <div class="rv-kpi-ic">${ic}</div>
            <div class="rv-kpi-body"><div class="rv-kpi-v">${value}</div><div class="rv-kpi-l">${label}</div></div>
          </${extra ? 'button' : 'div'}>`;
        document.getElementById('summaryCards').innerHTML =
          card('teal', icon('<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'), `₹${totalCollected}`, 'Total revenue')
          + card('red', icon('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="14 3 14 8 19 8"/><line x1="9" y1="13" x2="15" y2="13"/>'), `₹${totalOutstanding}`, 'Outstanding', true)
          + card('purple', icon('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'), patientsServedCount, 'Total patients served')
          + card('blue', icon('<path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6 6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/>'), consultationCount, 'Consultation')
          + card('orange', icon('<path d="M7 18a5 5 0 0 1 10 0"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="4.2" y1="5.2" x2="5.6" y2="6.6"/><line x1="19.8" y1="5.2" x2="18.4" y2="6.6"/><line x1="2" y1="18" x2="22" y2="18"/><line x1="4" y1="22" x2="20" y2="22"/>'), emergencyCount, 'Emergency')
          + card('pink', icon('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/>'), followUpCount, 'Follow up');
        document.getElementById('outstandingCard').addEventListener('click', () => {
          outstandingOnly = !outstandingOnly;
          currentPage = 1;
          renderSummary();
          renderTable();
        });
      }

      function pageList(current, totalPages) {
        if (totalPages <= 7) return Array.from({ length: totalPages }, (_, i) => i + 1);
        const set = new Set([1, totalPages, current, current - 1, current + 1]);
        if (current <= 3) { set.add(2); set.add(3); set.add(4); set.add(5); }
        if (current >= totalPages - 2) { [2, 3, 4].forEach((k) => set.add(totalPages - k)); }
        const pages = [...set].filter((p) => p >= 1 && p <= totalPages).sort((a, b) => a - b);
        const out = [];
        pages.forEach((p, i) => {
          if (i > 0 && p - pages[i - 1] > 1) out.push('…');
          out.push(p);
        });
        return out;
      }
      function renderPager(total) {
        const totalPages = Math.max(1, Math.ceil(total / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * pageSize;
        const end = Math.min(start + pageSize, total);
        document.getElementById('revenueShowing').textContent = `Showing ${total === 0 ? 0 : start + 1} to ${end} of ${total}`;
        const pager = document.getElementById('revenuePager');
        if (totalPages <= 1) { pager.innerHTML = ''; return; }
        pager.innerHTML = `
          <button type="button" class="pd-pg" data-page="${currentPage - 1}" aria-label="Previous page" ${currentPage === 1 ? 'disabled' : ''}>&lsaquo;</button>
          ${pageList(currentPage, totalPages).map((p) => p === '…'
            ? '<span class="pd-pg-gap">…</span>'
            : `<button type="button" class="pd-pg${p === currentPage ? ' active' : ''}" data-page="${p}" ${p === currentPage ? 'aria-current="page"' : ''}>${p}</button>`).join('')}
          <button type="button" class="pd-pg" data-page="${currentPage + 1}" aria-label="Next page" ${currentPage === totalPages ? 'disabled' : ''}>&rsaquo;</button>
        `;
        pager.querySelectorAll('[data-page]').forEach((btn) => {
          btn.addEventListener('click', () => { currentPage = Number(btn.dataset.page); renderTable(); Qlinic.scrollToTop(); });
        });
      }

      const RESET_ICON_SVG = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>';
      function activeFilterChipsHtml() {
        const chips = [];
        if (doctorFilterIds.size > 0) {
          const labels = Object.values(doctorById).filter((d) => doctorFilterIds.has(d.id)).map((d) => d.name);
          chips.push({ key: 'doctor', label: `Doctor: ${labels.join(', ')}` });
        }
        if (typeFilterValues.size > 0) {
          const labels = [...typeFilterValues].map((v) => FEE_TYPE_LABELS[v] || v);
          chips.push({ key: 'type', label: `Type: ${labels.join(', ')}` });
        }
        if (paymentModeFilterValues.size > 0) {
          const labels = [...paymentModeFilterValues].map((v) => PAYMENT_MODE_LABELS[v] || v);
          chips.push({ key: 'payment', label: `Payment mode: ${labels.join(', ')}` });
        }
        if (outstandingOnly) chips.push({ key: 'outstanding', label: 'Outstanding bills only' });
        if (chips.length === 0 && !searchTerm()) return '';
        return chips.map((c) => `<div class="filter-chip">${Qlinic.escapeHtml(c.label)}<button type="button" class="clear-filter-chip" data-key="${c.key}" aria-label="Clear filter">×</button></div>`).join('')
          + `<button type="button" class="pd-reset" id="resetFiltersBtn">${RESET_ICON_SVG}Reset filters</button>`;
      }
      function clearFilterByKey(key) {
        if (key === 'doctor') doctorFilterIds.clear();
        else if (key === 'type') typeFilterValues.clear();
        else if (key === 'payment') paymentModeFilterValues.clear();
        else if (key === 'outstanding') outstandingOnly = false;
        onRevenueFilterChange();
      }

      function FILTER_ICON_SVG(className) {
        return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>`;
      }
      function SORT_ARROW_SVG() {
        const rotated = sortDirection === 'desc' ? ' style="transform:rotate(180deg);"' : '';
        return `<svg class="th-filter-icon active" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"${rotated}><path d="M12 5v14M6 11l6-6 6 6"/></svg>`;
      }

      // Row menu (print receipt, copy phone), drawn fixed so the table never clips it.
      let openRowMenuId = null;
      function closeRowMenu() {
        openRowMenuId = null;
        document.querySelectorAll('.fb-row-menu').forEach((el) => el.remove());
      }
      function openRowMenu(id, btn) {
        if (openRowMenuId === id) { closeRowMenu(); return; }
        closeRowMenu();
        closeColumnFilter();
        closeExportMenu();
        closeRevenuePopover();
        const inv = allInvoices.find((x) => String(x.id) === String(id));
        if (!inv) return;
        openRowMenuId = id;
        const menu = document.createElement('div');
        menu.className = 'fb-menu fb-row-menu';
        menu.setAttribute('role', 'menu');
        menu.innerHTML = `<a role="menuitem" class="fb-menu-item" href="billing-consultation.html?invoiceId=${encodeURIComponent(inv.id)}">Print receipt</a>${inv.patientPhone ? '<button type="button" role="menuitem" class="fb-menu-item" data-act="copy">Copy phone number</button>' : ''}`;
        menu.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (ev.target.closest('[data-act="copy"]')) {
            if (navigator.clipboard) navigator.clipboard.writeText(inv.patientPhone).then(() => showToast('Phone number copied'), () => showToast('Could not copy'));
            else showToast('Could not copy');
            closeRowMenu();
          }
        });
        const r = btn.getBoundingClientRect();
        menu.style.top = (r.bottom + 6) + 'px';
        menu.style.left = Math.max(8, Math.min(r.right - 210, window.innerWidth - 218)) + 'px';
        menu.style.width = '210px';
        document.body.appendChild(menu);
      }

      function renderTable() {
        const filtered = filteredInvoices();
        const wrap = document.getElementById('revenueTableWrap');

        const noun = filtered.length === 1 ? 'bill' : 'bills';
        const dayValue = document.getElementById('dateFilter').value;
        const where = viewMode === 'range' ? ' in this period' : (dayValue === Qlinic.getTodayDate() ? ' today' : ` on ${Qlinic.formatDateLabel(dayValue)}`);
        document.getElementById('revenueSummary').textContent = filtered.length !== allInvoices.length
          ? `${filtered.length} of ${allInvoices.length} bills`
          : `${allInvoices.length} ${allInvoices.length === 1 ? 'bill' : 'bills'}${where}`;

        const chipsRow = document.getElementById('activeFilterChipsRow');
        chipsRow.innerHTML = activeFilterChipsHtml();
        chipsRow.querySelectorAll('.clear-filter-chip').forEach((btn) => {
          btn.addEventListener('click', () => clearFilterByKey(btn.dataset.key));
        });
        const resetBtn = document.getElementById('resetFiltersBtn');
        if (resetBtn) resetBtn.addEventListener('click', resetAllFilters);

        if (allInvoices.length === 0) {
          wrap.innerHTML = `<div class="empty-state">No bills for this ${viewMode === 'range' ? 'period' : 'date'}.</div>`;
          document.getElementById('revenuePager').innerHTML = '';
          document.getElementById('revenueShowing').textContent = '';
          return;
        }
        if (filtered.length === 0) {
          wrap.innerHTML = '<div class="empty-state">No bills match these filters.</div>';
          document.getElementById('revenuePager').innerHTML = '';
          document.getElementById('revenueShowing').textContent = '';
          return;
        }
        const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * pageSize;
        const pageItems = filtered.slice(start, start + pageSize);

        const doctorIconClass = doctorFilterIds.size > 0 ? 'th-filter-icon active' : 'th-filter-icon';
        const typeIconClass = typeFilterValues.size > 0 ? 'th-filter-icon active' : 'th-filter-icon';
        const paymentIconClass = paymentModeFilterValues.size > 0 ? 'th-filter-icon active' : 'th-filter-icon';

        wrap.innerHTML = `
          <div class="dd-table fb-table rv-table" role="table" aria-label="Bills">
            <div class="dd-row dd-head rv-cols" role="row">
              <span role="columnheader">Patient</span>
              <span role="columnheader">Phone</span>
              <span role="columnheader"><span class="th-filter-trigger fb-th-filter" id="dateSortTrigger" tabindex="0" role="button" aria-label="Sort by visit date">Visit date ${SORT_ARROW_SVG()}</span></span>
              <span role="columnheader"><span class="th-filter-trigger fb-th-filter" id="doctorFilterTrigger" tabindex="0" role="button" aria-label="Filter by doctor">Doctor ${FILTER_ICON_SVG(doctorIconClass)}</span></span>
              <span role="columnheader"><span class="th-filter-trigger fb-th-filter" id="typeFilterTrigger" tabindex="0" role="button" aria-label="Filter by type">Type ${FILTER_ICON_SVG(typeIconClass)}</span></span>
              <span role="columnheader"><span class="th-filter-trigger fb-th-filter" id="paymentFilterTrigger" tabindex="0" role="button" aria-label="Filter by payment mode">Payment mode ${FILTER_ICON_SVG(paymentIconClass)}</span></span>
              <span role="columnheader">Payment collected</span>
              <span role="columnheader" class="dd-right">Action</span>
            </div>
            ${pageItems.map((inv) => {
              const balance = inv.amount - inv.amountReceived;
              const doctor = doctorById[inv.doctorId];
              const subInfo = [inv.patientAge != null && inv.patientAge !== '' ? `${inv.patientAge} yrs` : '', inv.patientAddress ? Qlinic.escapeHtml(inv.patientAddress) : ''].filter(Boolean).join(' · ');
              return `
              <div class="dd-row dd-body rv-cols" role="row">
                <div role="cell">
                  <div class="dd-name-text">${Qlinic.escapeHtml(inv.patientName)}</div>
                  ${subInfo ? `<div class="ns-sub">${subInfo}</div>` : ''}
                </div>
                <div role="cell">${inv.patientPhone ? Qlinic.escapeHtml(inv.patientPhone) : '<span class="tm-none">Not added</span>'}</div>
                <div role="cell">${Qlinic.formatDateLabel(inv.invoiceDate)}</div>
                <div role="cell">${doctor ? `<span class="pd-doc-pill">${Qlinic.escapeHtml(Qlinic.doctorLabel(doctor))}</span>` : '<span class="tm-none">Not recorded</span>'}</div>
                <div role="cell"><span class="rv-type ${Qlinic.escapeHtml(inv.feeType)}">${Qlinic.escapeHtml(FEE_TYPE_LABELS[inv.feeType] || inv.feeType)}</span></div>
                <div role="cell">${Qlinic.escapeHtml(PAYMENT_MODE_LABELS[inv.paymentMode] || inv.paymentMode)}</div>
                <div role="cell">
                  <div class="rv-paid">₹${inv.amountReceived}</div>
                  ${balance > 0 ? `<div class="rv-balance">Balance: ₹${balance}</div>` : ''}
                </div>
                <div role="cell" class="rv-actions">
                  <a href="#" class="rv-adjust" onclick="openAdjustBilling('${inv.id}'); return false;">Adjust</a>
                  <button type="button" class="fb-kebab" data-id="${inv.id}" aria-label="More actions" aria-haspopup="menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
                </div>
              </div>
            `;
            }).join('')}
          </div>
        `;
        const bind = (id, column, optionsFn, set) => {
          const t = document.getElementById(id);
          const open = (e) => { e.stopPropagation(); closeRowMenu(); closeExportMenu(); closeRevenuePopover(); openColumnFilter(column, e.currentTarget.closest('[role="columnheader"]'), optionsFn(), set, onRevenueFilterChange); };
          t.addEventListener('click', open);
          t.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(e); } });
        };
        bind('doctorFilterTrigger', 'doctor', doctorFilterOptions, doctorFilterIds);
        bind('typeFilterTrigger', 'type', typeFilterOptions, typeFilterValues);
        bind('paymentFilterTrigger', 'payment', paymentModeFilterOptions, paymentModeFilterValues);
        const sortTrigger = document.getElementById('dateSortTrigger');
        const flip = () => { sortDirection = sortDirection === 'asc' ? 'desc' : 'asc'; renderTable(); };
        sortTrigger.addEventListener('click', flip);
        sortTrigger.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
        wrap.querySelectorAll('.fb-kebab').forEach((btn) => {
          btn.addEventListener('click', (e) => { e.stopPropagation(); openRowMenu(btn.dataset.id, btn); });
        });
        renderPager(filtered.length);
      }

      document.getElementById('revenuePerPage').addEventListener('change', (e) => {
        pageSize = Number(e.target.value);
        currentPage = 1;
        renderTable();
      });

      // Export what the filters currently show (CSV, or a real Excel file).
      function exportRows() {
        return filteredInvoices().map((inv) => {
          const doctor = doctorById[inv.doctorId];
          return [inv.patientName, inv.patientPhone || '', inv.patientAge ?? '', inv.patientAddress || '', Qlinic.doctorLabel(doctor), FEE_TYPE_LABELS[inv.feeType] || inv.feeType, PAYMENT_MODE_LABELS[inv.paymentMode] || inv.paymentMode, inv.amount, inv.amountReceived, inv.amount - inv.amountReceived];
        });
      }
      const EXPORT_HEAD = ['Patient', 'Phone', 'Age', 'Address', 'Doctor', 'Type', 'Payment mode', 'Amount billed', 'Amount received', 'Balance'];
      function exportLabel() {
        if (viewMode === 'range') {
          const range = currentRange();
          return range ? `${range.start}_to_${range.end}` : 'range';
        }
        return document.getElementById('dateFilter').value;
      }
      function loadXlsxLibrary() {
        if (window.XLSX) return Promise.resolve();
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
          s.integrity = 'sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw';
          s.crossOrigin = 'anonymous';
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }
      async function doExport(kind) {
        const rows = exportRows();
        if (rows.length === 0) { showToast('Nothing to export'); return; }
        const base = `revenue-${exportLabel()}`;
        if (kind === 'csv') {
          const csv = [EXPORT_HEAD].concat(rows).map((r) => r.map(csvCell).join(',')).join('\r\n');
          downloadCsv(`${base}.csv`, '﻿' + csv);
          return;
        }
        try {
          await loadXlsxLibrary();
          const ws = XLSX.utils.aoa_to_sheet([EXPORT_HEAD].concat(rows));
          ws['!cols'] = [22, 14, 6, 26, 22, 14, 14, 14, 16, 10].map((w) => ({ wch: w }));
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Revenue');
          XLSX.writeFile(wb, `${base}.xlsx`);
        } catch (err) {
          showToast('Could not make the Excel file, try CSV instead');
        }
      }
      const exportBtn = document.getElementById('revenueExportBtn');
      const exportMenu = document.getElementById('revenueExportMenu');
      function closeExportMenu() {
        exportMenu.hidden = true;
        exportBtn.setAttribute('aria-expanded', 'false');
      }
      exportBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const willOpen = exportMenu.hidden;
        closeColumnFilter();
        closeRowMenu();
        closeRevenuePopover();
        exportMenu.hidden = !willOpen;
        exportBtn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      });
      exportMenu.addEventListener('click', (e) => {
        e.stopPropagation();
        const item = e.target.closest('[data-export]');
        if (!item) return;
        closeExportMenu();
        doExport(item.dataset.export);
      });
      document.addEventListener('click', () => { closeRowMenu(); closeExportMenu(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeRowMenu(); closeExportMenu(); closeColumnFilter(); } });

      function openAdjustBilling(invoiceId) {
        const inv = allInvoices.find((i) => i.id === invoiceId);
        if (!inv) return;
        const doctor = doctorById[inv.doctorId];
        Qlinic.openAdjustBillingModal({
          invoice: inv,
          doctor,
          onSaved: async () => { showToast('Billing updated'); await loadInvoices(); },
        });
      }
      window.openAdjustBilling = openAdjustBilling;

      function currentRange() {
        if (viewMode !== 'range') return null;
        return rangePreset === 'custom' ? customRange : rangeForPreset(rangePreset);
      }

      let loadSeq = 0;
      async function loadInvoices(keepPage) {
        renderRevenueChip().catch(() => { });
        const mySeq = ++loadSeq;
        const range = currentRange();
        const rows = viewMode === 'range'
          ? (range ? await Qlinic.getInvoicesForDateRange(range.start, range.end) : [])
          : await Qlinic.getInvoicesForDate(document.getElementById('dateFilter').value);
        if (mySeq !== loadSeq) return; // an older request finished after a newer one
        allInvoices = rows;
        if (keepPage !== true) currentPage = 1; // a live update keeps the page the admin is reading
        renderSummary();
        renderTable();
      }

      document.getElementById('dateFilter').addEventListener('change', loadInvoices);
      document.getElementById('todayBtn').addEventListener('click', () => {
        document.getElementById('dateFilter').value = Qlinic.getTodayDate();
        loadInvoices();
      });
      function updateCustomRangeFromInputs() {
        const s = document.getElementById('rangeStartDate').value;
        const e = document.getElementById('rangeEndDate').value;
        customRange = (s && e) ? { start: s <= e ? s : e, end: s <= e ? e : s } : null;
        loadInvoices();
      }
      ['rangeStartDate', 'rangeEndDate'].forEach((id) => {
        document.getElementById(id).addEventListener('change', updateCustomRangeFromInputs);
      });

      function renderRangePresetOptions() {
        document.getElementById('rangePresetSelect').innerHTML = RANGE_PRESETS.map((p) =>
          `<option value="${p.key}" ${p.key === rangePreset ? 'selected' : ''}>${p.label}</option>`
        ).join('');
      }
      document.getElementById('rangePresetSelect').addEventListener('change', (e) => {
        rangePreset = e.target.value;
        document.getElementById('customRangeFilters').style.display = rangePreset === 'custom' ? 'flex' : 'none';
        loadInvoices();
      });
      document.getElementById('viewModeToggle').addEventListener('click', (e) => {
        const btn = e.target.closest('.ns-tab');
        if (!btn) return;
        viewMode = btn.dataset.mode;
        document.querySelectorAll('#viewModeToggle .ns-tab').forEach((p) => { p.classList.toggle('active', p === btn); p.setAttribute('aria-selected', p === btn ? 'true' : 'false'); });
        document.getElementById('singleDayFilters').style.display = viewMode === 'single' ? 'flex' : 'none';
        document.getElementById('rangePresetField').style.display = viewMode === 'range' ? 'flex' : 'none';
        document.getElementById('customRangeFilters').style.display = (viewMode === 'range' && rangePreset === 'custom') ? 'flex' : 'none';
        loadInvoices();
      });
      document.getElementById('revenueSearch').addEventListener('input', () => {
        currentPage = 1;
        renderSummary();
        renderTable();
      });
      Qlinic.attachDatePicker(document.getElementById('dateFilter'));
      document.getElementById('dateFilter').max = Qlinic.getTodayDate();
      document.getElementById('dateFilter').value = Qlinic.getTodayDate();
      Qlinic.attachDatePicker(document.getElementById('rangeStartDate'), { quickButtons: false });
      Qlinic.attachDatePicker(document.getElementById('rangeEndDate'), { quickButtons: false });
      document.getElementById('rangeStartDate').max = Qlinic.getTodayDate();
      document.getElementById('rangeEndDate').max = Qlinic.getTodayDate();
      renderRangePresetOptions();
      if (linkedStart && linkedEnd) {
        viewMode = 'range';
        rangePreset = 'custom';
        customRange = { start: linkedStart, end: linkedEnd };
        document.querySelectorAll('#viewModeToggle .ns-tab').forEach((p) => { p.classList.toggle('active', p.dataset.mode === 'range'); p.setAttribute('aria-selected', p.dataset.mode === 'range' ? 'true' : 'false'); });
        document.getElementById('rangePresetSelect').value = 'custom';
        document.getElementById('singleDayFilters').style.display = 'none';
        document.getElementById('rangePresetField').style.display = 'flex';
        document.getElementById('customRangeFilters').style.display = 'flex';
        document.getElementById('rangeStartDate').value = linkedStart;
        document.getElementById('rangeEndDate').value = linkedEnd;
      }

      await loadDoctorFilterOptions();
      await loadInvoices();
      Qlinic.onLiveChange(() => loadInvoices(true));
    })();
  </script>

</body>
</html>
