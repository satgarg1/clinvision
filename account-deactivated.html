<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account status: ClinVision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231e1b4b'/%3E%3Ctext x='50' y='70' font-family='Georgia, serif' font-size='60' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3Crect x='30' y='80' width='40' height='7' rx='3' fill='%23c9973e'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=307" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-blob login-blob-teal"></div>
    <div class="login-blob login-blob-coral"></div>
    <div class="login-blob login-blob-purple"></div>
    <a href="index.html" class="brand login-brand-corner">
      <span class="brand-top">
        <span class="brand-word-wrap">
          <span class="brand-word">ClinVision</span>
          <span class="brand-word-bar"></span>
        </span>
      </span>
      <span class="brand-tagline">Where clinics run better</span>
    </a>
    <div class="login-card">
      <h1 id="deactivatedTitle">Checking your account…</h1>
      <p class="panel-note" id="deactivatedBody" style="text-align:left;"></p>

      <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px;">
        <button type="button" class="btn btn-ghost" id="recheckBtn" style="width:100%;">I've sorted this out, check again</button>
      </div>

      <div class="login-hint">
        <a href="#" id="logoutLink">Log out</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=101"></script>
  <script>
    (async function () {
      // Deliberately NOT Qlinic.requireLogin() here, same reasoning as
      // account-suspended.html: that's the exact check that lands someone
      // on THIS page, so calling it again would just bounce straight back.
      if (!(await Qlinic.isLoggedIn())) {
        window.location.href = 'login.html';
        return;
      }

      const profile = await Qlinic.getMyProfile();

      // Reached this page, but the profile is actually active (reactivated
      // since the redirect happened, or this URL was opened directly out
      // of curiosity) - straight through to the app instead of showing an
      // alarming message about nothing.
      if (profile && profile.isActive !== false) {
        window.location.href = 'dashboard.html';
        return;
      }

      const clinic = await Qlinic.getClinic();
      const clinicName = clinic ? clinic.name : 'this clinic';

      document.getElementById('deactivatedTitle').textContent = 'Access removed';
      document.getElementById('deactivatedBody').textContent =
        `Your access to ${clinicName} on ClinVision has been removed. Contact your clinic admin if you think this is a mistake.`;

      document.getElementById('recheckBtn').addEventListener('click', () => {
        window.location.reload();
      });

      document.getElementById('logoutLink').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          await Qlinic.logout();
        } catch (err) { /* best-effort - send them to login either way */ }
        window.location.href = 'login.html';
      });
    })();
  </script>
</body>
</html>
