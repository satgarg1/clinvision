<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doctors — Qlinic</title>
<script>if (localStorage.getItem('qlinic_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=21" />
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand">Qlinic</a>
      <div class="clinic-name" id="clinicName">Loading…</div>
      <nav>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="reception.html" class="nav-link">Reception</a>
        <a href="doctor.html" class="nav-link">Doctor View</a>
        <a href="display.html" class="nav-link">Display Screen</a>
        <a href="settings.html" class="nav-link active">Settings</a>
        <a href="account-security.html" class="nav-link">Account</a>
      </nav>
    </aside>

    <main class="app-main">
      <div class="app-topbar">
        <div>
          <div class="breadcrumb"><a href="settings.html">Settings</a> <span>/</span> Doctors</div>
          <h1>Doctors</h1>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header"><h2>Add a doctor</h2></div>
        <form id="addDoctorForm" class="inline-form">
          <div class="field">
            <label>Name</label>
            <input type="text" id="newDoctorName" placeholder="Dr. Jane Doe" required />
          </div>
          <div class="field">
            <label>Specialty</label>
            <select id="newDoctorSpecialty"></select>
          </div>
          <div class="field" id="newDoctorSpecialtyOtherField" style="display:none;">
            <label>Specify specialty</label>
            <input type="text" id="newDoctorSpecialtyOther" placeholder="e.g. Podiatrist" />
          </div>
          <button type="submit" class="btn-sm primary">Add doctor</button>
        </form>
      </div>

      <div class="panel">
        <div class="panel-header"><h2>All doctors</h2></div>
        <div class="doctor-search-row">
          <input type="search" id="doctorSearch" placeholder="Search by name…" class="doctor-search-input" />
          <span class="panel-note" id="doctorCountNote"></span>
        </div>
        <div id="doctorList"></div>
        <div class="pager" id="doctorPager"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=16"></script>
  <script>
    (async function () {
      await Qlinic.requireLogin('login.html');

      // The sidebar logo links to the marketing site, which has no way
      // back into the app without logging in again — worth a heads-up
      // before someone loses their place by accident.
      document.querySelector('a.brand').addEventListener('click', (e) => {
        e.preventDefault();
        if (confirm("Going to the homepage will end your session here — you'll need to log in again to get back in. Continue?")) {
          window.location.href = 'index.html';
        }
      });

      if (!(await Qlinic.isAdmin())) {
        window.location.href = 'dashboard.html';
        return;
      }

      const PAGE_SIZE = 10;
      let allDoctors = [];
      let searchTerm = '';
      let currentPage = 1;

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      const SPECIALTIES = [
        'General Physician',
        'Pediatrician',
        'Gynecologist',
        'Dermatologist',
        'Dentist',
        'ENT Specialist',
        'Ophthalmologist',
        'Orthopedic',
        'Cardiologist',
        'Neurologist',
        'Psychiatrist',
        'General Surgeon',
        'Urologist',
        'Gastroenterologist',
        'Endocrinologist',
        'Pulmonologist',
        'Diabetologist',
        'Physiotherapist',
      ];
      const OTHER_SPECIALTY = '__other__';

      function specialtyOptionsHtml(selected) {
        const isKnown = SPECIALTIES.includes(selected);
        return SPECIALTIES.map((s) => `<option value="${s}" ${s === selected ? 'selected' : ''}>${s}</option>`).join('')
          + `<option value="${OTHER_SPECIALTY}" ${!isKnown && selected ? 'selected' : ''}>Other…</option>`;
      }

      function filteredDoctors() {
        const term = searchTerm.trim().toLowerCase();
        if (!term) return allDoctors;
        return allDoctors.filter((d) => d.name.toLowerCase().includes(term));
      }

      function renderPager(total) {
        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const pager = document.getElementById('doctorPager');
        if (totalPages <= 1) {
          pager.innerHTML = '';
          return;
        }
        pager.innerHTML = `
          <button class="btn-sm" id="pagerPrev" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>
          <span class="pager-label">Page ${currentPage} of ${totalPages}</span>
          <button class="btn-sm" id="pagerNext" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
        `;
        document.getElementById('pagerPrev').addEventListener('click', () => { currentPage -= 1; renderDoctors(); });
        document.getElementById('pagerNext').addEventListener('click', () => { currentPage += 1; renderDoctors(); });
      }

      function renderDoctors() {
        const filtered = filteredDoctors();
        const box = document.getElementById('doctorList');
        const countNote = document.getElementById('doctorCountNote');

        if (allDoctors.length === 0) {
          box.innerHTML = '<div class="empty-state">No doctors yet — add your first one above.</div>';
          countNote.textContent = '';
          document.getElementById('doctorPager').innerHTML = '';
          return;
        }
        if (filtered.length === 0) {
          box.innerHTML = '<div class="empty-state">No doctors match your search.</div>';
          countNote.textContent = `0 of ${allDoctors.length} doctors`;
          document.getElementById('doctorPager').innerHTML = '';
          return;
        }

        const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageDoctors = filtered.slice(start, start + PAGE_SIZE);

        countNote.textContent = searchTerm.trim()
          ? `${filtered.length} of ${allDoctors.length} doctors`
          : `${allDoctors.length} doctor${allDoctors.length === 1 ? '' : 's'}`;

        box.innerHTML = `
          <table class="qtable">
            <thead><tr><th>Name</th><th>Specialty</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${pageDoctors.map((d) => {
                const isKnown = SPECIALTIES.includes(d.specialty);
                return `
                <tr style="${d.isActive ? '' : 'opacity:0.5;'}">
                  <td><input type="text" class="doc-edit-name" data-id="${d.id}" value="${d.name.replace(/"/g, '&quot;')}" style="width:100%;padding:8px 10px;border:1px solid var(--grey-300);border-radius:8px;font-family:var(--font);" /></td>
                  <td>
                    <select class="doc-edit-specialty" data-id="${d.id}" style="width:100%;padding:8px 10px;border:1px solid var(--grey-300);border-radius:8px;font-family:var(--font);">${specialtyOptionsHtml(d.specialty)}</select>
                    <input type="text" class="doc-edit-specialty-other" data-id="${d.id}" value="${(!isKnown ? (d.specialty || '') : '').replace(/"/g, '&quot;')}" placeholder="Specify specialty" style="width:100%;margin-top:6px;padding:8px 10px;border:1px solid var(--grey-300);border-radius:8px;font-family:var(--font);${isKnown ? 'display:none;' : ''}" />
                  </td>
                  <td>${d.isActive ? '<span class="badge badge-booked">Active</span>' : '<span class="badge badge-no-show">Deactivated</span>'}</td>
                  <td style="white-space:nowrap;">
                    <button class="btn-sm primary" onclick="doSaveDoctor('${d.id}')">Save</button>
                    ${d.isActive
                      ? `<button class="btn-sm danger" onclick="doSetDoctorActive('${d.id}', false)">Deactivate</button>`
                      : `<button class="btn-sm" onclick="doSetDoctorActive('${d.id}', true)">Reactivate</button>`}
                  </td>
                </tr>
              `;
              }).join('')}
            </tbody>
          </table>
        `;
        renderPager(filtered.length);
      }

      async function loadDoctors() {
        allDoctors = await Qlinic.getDoctors({ includeInactive: true });
        renderDoctors();
      }

      async function doSaveDoctor(id) {
        const name = document.querySelector(`.doc-edit-name[data-id="${id}"]`).value;
        const specialtySelect = document.querySelector(`.doc-edit-specialty[data-id="${id}"]`).value;
        const specialty = specialtySelect === OTHER_SPECIALTY
          ? document.querySelector(`.doc-edit-specialty-other[data-id="${id}"]`).value
          : specialtySelect;
        await Qlinic.updateDoctor(id, { name, specialty });
        showToast('Doctor updated');
        loadDoctors();
      }

      async function doSetDoctorActive(id, isActive) {
        if (!isActive && !confirm('Deactivate this doctor? They’ll disappear from Reception, Doctor View, and the display board, but their patient history is kept. You can reactivate them anytime.')) {
          return;
        }
        await Qlinic.setDoctorActive(id, isActive);
        showToast(isActive ? 'Doctor reactivated' : 'Doctor deactivated');
        loadDoctors();
      }
      window.doSaveDoctor = doSaveDoctor;
      window.doSetDoctorActive = doSetDoctorActive;

      document.getElementById('doctorList').addEventListener('change', (e) => {
        if (!e.target.classList.contains('doc-edit-specialty')) return;
        const id = e.target.getAttribute('data-id');
        const otherField = document.querySelector(`.doc-edit-specialty-other[data-id="${id}"]`);
        otherField.style.display = e.target.value === OTHER_SPECIALTY ? 'block' : 'none';
      });

      document.getElementById('doctorSearch').addEventListener('input', (e) => {
        searchTerm = e.target.value;
        currentPage = 1;
        renderDoctors();
      });

      document.getElementById('newDoctorSpecialty').innerHTML = specialtyOptionsHtml(null);
      document.getElementById('newDoctorSpecialty').addEventListener('change', (e) => {
        document.getElementById('newDoctorSpecialtyOtherField').style.display = e.target.value === OTHER_SPECIALTY ? 'block' : 'none';
      });

      document.getElementById('addDoctorForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('newDoctorName').value;
        const specialtySelect = document.getElementById('newDoctorSpecialty').value;
        const specialty = specialtySelect === OTHER_SPECIALTY
          ? document.getElementById('newDoctorSpecialtyOther').value
          : specialtySelect;
        await Qlinic.addDoctor({ name, specialty });
        e.target.reset();
        document.getElementById('newDoctorSpecialtyOtherField').style.display = 'none';
        searchTerm = '';
        document.getElementById('doctorSearch').value = '';
        currentPage = 1;
        showToast('Doctor added');
        loadDoctors();
      });

      const clinic = await Qlinic.getClinic();
      document.getElementById('clinicName').textContent = clinic ? clinic.name : '';

      await loadDoctors();
      Qlinic.onLiveChange(loadDoctors);
    })();
  </script>
</body>
</html>
