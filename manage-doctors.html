<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doctors: ClinVision</title>
<script>if (localStorage.getItem('qlinic_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231e1b4b'/%3E%3Ctext x='50' y='70' font-family='Georgia, serif' font-size='60' font-weight='700' fill='%23fff' text-anchor='middle'%3EC%3C/text%3E%3Crect x='30' y='80' width='40' height='7' rx='3' fill='%23c9973e'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=305" />
</head>
<body style="visibility:hidden;">
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand">
        <span class="brand-top">
        <span class="brand-word-wrap">
          <span class="brand-word">ClinVision</span>
          <span class="brand-word-bar"></span>
        </span>
      </span>
      <span class="brand-tagline">Where clinics run better</span>
      </a>
      <div class="clinic-name-row">
        <img class="clinic-logo-thumb" id="clinicLogoThumb" style="display:none;" alt="" />
        <div class="clinic-name" id="clinicName">Loading…</div>
      </div>
      <nav>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="reception.html" class="nav-link" id="receptionNavLink">Reception</a>
        <a href="doctor.html" class="nav-link">Doctor View</a>
        <a href="billing.html" class="nav-link" id="billingNavLink">Billing</a>
        <a href="revenue.html" class="nav-link" id="revenueNavLink">Revenue</a>
        <a href="trends.html" class="nav-link" id="trendsNavLink">Insights</a>
        <a href="end-of-day.html" class="nav-link" id="endOfDayNavLink">End of day</a>
        <a href="display.html" class="nav-link" id="displayNavLink">Display Screen</a>
        <a href="settings.html" class="nav-link active pinned-bottom">Settings</a>
      </nav>
    </aside>

    <main class="app-main">
      <div class="app-topbar">
        <div>
          <div class="breadcrumb"><a href="settings.html">Settings</a> <span>/</span> Doctors</div>
          <h1>Doctors</h1>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header"><h2>Add a doctor</h2></div>
        <form id="addDoctorForm" class="doctor-form">
          <div class="doctor-form-field" style="flex:1.4;min-width:160px;">
            <label>Name</label>
            <input type="text" id="newDoctorName" placeholder="Dr. Jane Doe" required />
          </div>
          <div class="doctor-form-field" style="flex:1;min-width:150px;">
            <label>Specialty</label>
            <select id="newDoctorSpecialty"></select>
          </div>
          <div class="doctor-form-field" id="newDoctorSpecialtyOtherField" style="display:none;flex:1;min-width:150px;">
            <label>Specify specialty</label>
            <input type="text" id="newDoctorSpecialtyOther" placeholder="e.g. Podiatrist" />
          </div>
          <div class="doctor-form-field" style="width:130px;">
            <label>Consultation fee (&#8377;)</label>
            <input type="number" id="newDoctorFeeNormal" min="0" step="1" />
          </div>
          <div class="doctor-form-field" style="width:130px;">
            <label>Emergency fee (&#8377;)</label>
            <input type="number" id="newDoctorFeeEmergency" min="0" step="1" />
          </div>
          <div class="doctor-form-field" style="width:150px;">
            <label>HPR ID <span style="font-weight:400;color:var(--grey-500);">(optional)</span></label>
            <input type="text" id="newDoctorHprId" placeholder="e.g., 12-3456-7890-1234" style="text-transform:uppercase;" />
          </div>
          <button type="submit" class="btn-sm primary">Add doctor</button>
        </form>
        <div id="newDoctorFeeHint" class="slot-hint" style="display:none;"></div>
      </div>

      <div class="panel">
        <div class="panel-header"><h2>All doctors</h2></div>
        <div class="doctor-search-row">
          <input type="search" id="doctorSearch" placeholder="Search by name…" class="doctor-search-input" />
          <span class="panel-note" id="doctorCountNote"></span>
        </div>
        <div id="doctorList"></div>
        <div class="pager" id="doctorPager"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=94"></script>
  <script>
    (async function () {
      if (!(await Qlinic.requireLogin('login.html'))) return;

      // The sidebar logo links to the marketing site, which has no way
      // back into the app without logging in again, worth a heads-up
      // before someone loses their place by accident.
      document.querySelector('a.brand').addEventListener('click', async (e) => {
        e.preventDefault();
        if (await Qlinic.confirmDialog({ message: "Going to the homepage will end your session here, you'll need to log in again to get back in." })) {
          window.location.href = 'index.html';
        }
      });

      if (!(await Qlinic.isAdmin())) {
        window.location.href = 'dashboard.html';
        return;
      }
      // Body starts hidden (see the <body> tag) specifically so a non-
      // admin hitting this URL never sees this admin-only page's content
      // even for a moment before the redirect above fires -- reveal only
      // once we know for certain they're allowed to be here.
      document.body.style.visibility = 'visible';

      const PAGE_SIZE = 10;
      let allDoctors = [];
      let searchTerm = '';
      let currentPage = 1;

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      const SPECIALTIES = [
        'General Physician',
        'Pediatrician',
        'Gynecologist',
        'Dermatologist',
        'Dentist',
        'ENT Specialist',
        'Ophthalmologist',
        'Orthopedic',
        'Cardiologist',
        'Neurologist',
        'Psychiatrist',
        'General Surgeon',
        'Urologist',
        'Gastroenterologist',
        'Endocrinologist',
        'Pulmonologist',
        'Diabetologist',
        'Physiotherapist',
      ];
      const OTHER_SPECIALTY = '__other__';

      // Passive heads-up only, same as the no-show note on Reception: it
      // never blocks Save, it just flags a fee that's worth a second look.
      const HIGH_FEE_THRESHOLD = 4000;
      function feeWarningMessage(normal, emergency) {
        const highNormal = normal > HIGH_FEE_THRESHOLD;
        const highEmergency = emergency > HIGH_FEE_THRESHOLD;
        if (!highNormal && !highEmergency) return null;
        if (highNormal && highEmergency) {
          return `Both fees are above &#8377;${HIGH_FEE_THRESHOLD}, that's unusually high for a consultation, worth double-checking before saving.`;
        }
        return `${highNormal ? 'Consultation fee' : 'Emergency fee'} is above &#8377;${HIGH_FEE_THRESHOLD}, that's unusually high for a consultation, worth double-checking before saving.`;
      }
      function feeWarningHtml(msg) {
        return `<div style="color:var(--warning);background:var(--warning-bg);padding:8px 12px;border-radius:8px;">&#9888; ${msg}</div>`;
      }

      function pencilIconSvg() {
        return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
      }
      function powerIconSvg() {
        return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/></svg>';
      }

      function specialtyOptionsHtml(selected) {
        const isKnown = SPECIALTIES.includes(selected);
        return SPECIALTIES.map((s) => `<option value="${s}" ${s === selected ? 'selected' : ''}>${s}</option>`).join('')
          + `<option value="${OTHER_SPECIALTY}" ${!isKnown && selected ? 'selected' : ''}>Other…</option>`;
      }

      function filteredDoctors() {
        const term = searchTerm.trim().toLowerCase();
        if (!term) return allDoctors;
        return allDoctors.filter((d) => d.name.toLowerCase().includes(term));
      }

      function renderPager(total) {
        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const pager = document.getElementById('doctorPager');
        pager.innerHTML = Qlinic.pagerHtml(currentPage, totalPages);
        Qlinic.wirePager(pager, currentPage, totalPages, (p) => { currentPage = p; renderDoctors(); });
      }

      function renderDoctors() {
        const filtered = filteredDoctors();
        const box = document.getElementById('doctorList');
        const countNote = document.getElementById('doctorCountNote');

        if (allDoctors.length === 0) {
          box.innerHTML = '<div class="empty-state">No doctors yet, add your first one above.</div>';
          countNote.textContent = '';
          document.getElementById('doctorPager').innerHTML = '';
          return;
        }
        if (filtered.length === 0) {
          box.innerHTML = '<div class="empty-state">No doctors match your search.</div>';
          countNote.textContent = `0 of ${allDoctors.length} doctors`;
          document.getElementById('doctorPager').innerHTML = '';
          return;
        }

        const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageDoctors = filtered.slice(start, start + PAGE_SIZE);

        countNote.textContent = searchTerm.trim()
          ? `${filtered.length} of ${allDoctors.length} doctors`
          : `${allDoctors.length} doctor${allDoctors.length === 1 ? '' : 's'}`;

        box.innerHTML = `
          <table class="qtable">
            <thead><tr><th>Name</th><th>Specialty</th><th>Consultation fee (&#8377;)</th><th>Emergency fee (&#8377;)</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${pageDoctors.map((d) => `
                <tr style="${d.isActive ? '' : 'opacity:0.5;'}">
                  <td>${Qlinic.escapeHtml(d.name)}</td>
                  <td>${Qlinic.escapeHtml(d.specialty)}</td>
                  <td>&#8377;${d.feeNormal || 0}</td>
                  <td>&#8377;${d.feeEmergency || 0}</td>
                  <td><span class="status-dot-label"><span class="status-dot ${d.isActive ? 'active' : 'inactive'}"></span>${d.isActive ? 'Active' : 'Deactivated'}</span></td>
                  <td class="row-actions">
                    <button type="button" class="icon-btn" onclick="doOpenEditDoctor('${d.id}')" title="Edit" aria-label="Edit ${Qlinic.escapeHtml(d.name)}">${pencilIconSvg()}</button>
                    <button type="button" class="icon-btn ${d.isActive ? 'danger' : ''}" onclick="doSetDoctorActive('${d.id}', ${!d.isActive})" title="${d.isActive ? 'Deactivate' : 'Reactivate'}" aria-label="${d.isActive ? 'Deactivate' : 'Reactivate'} ${Qlinic.escapeHtml(d.name)}">${powerIconSvg()}</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        renderPager(filtered.length);
      }

      async function loadDoctors() {
        allDoctors = await Qlinic.getDoctors({ includeInactive: true });
        renderDoctors();
      }

      function doOpenEditDoctor(id) {
        const doctor = allDoctors.find((d) => d.id === id);
        if (doctor) openEditDoctorModal(doctor);
      }

      // A dialog, not an inline row-edit — keeps the table itself plain
      // text always, rather than turning into a form the moment you touch
      // one row (which is the exact "looks cheap" complaint this replaced).
      function openEditDoctorModal(doctor) {
        const isKnown = SPECIALTIES.includes(doctor.specialty);
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop';
        backdrop.innerHTML = `
          <div class="modal-card" role="dialog" aria-modal="true">
            <h2 class="modal-title">Edit doctor</h2>
            <div class="doctor-form-field" style="margin-bottom:14px;">
              <label>Name</label>
              <input type="text" id="editDoctorName" value="${doctor.name.replace(/"/g, '&quot;')}" />
            </div>
            <div class="doctor-form-field" style="margin-bottom:14px;">
              <label>Specialty</label>
              <select id="editDoctorSpecialty">${specialtyOptionsHtml(doctor.specialty)}</select>
            </div>
            <div class="doctor-form-field" id="editDoctorSpecialtyOtherField" style="margin-bottom:14px;${isKnown ? 'display:none;' : ''}">
              <label>Specify specialty</label>
              <input type="text" id="editDoctorSpecialtyOther" value="${(!isKnown ? (doctor.specialty || '') : '').replace(/"/g, '&quot;')}" placeholder="e.g. Podiatrist" />
            </div>
            <div style="display:flex;gap:12px;margin-bottom:14px;">
              <div class="doctor-form-field" style="flex:1;">
                <label>Consultation fee (&#8377;)</label>
                <input type="number" min="0" step="1" id="editDoctorFeeNormal" value="${doctor.feeNormal || 0}" />
              </div>
              <div class="doctor-form-field" style="flex:1;">
                <label>Emergency fee (&#8377;)</label>
                <input type="number" min="0" step="1" id="editDoctorFeeEmergency" value="${doctor.feeEmergency || 0}" />
              </div>
            </div>
            <div id="editDoctorFeeHint" class="slot-hint" style="display:none;margin-bottom:14px;"></div>
            <div class="doctor-form-field" style="margin-bottom:14px;">
              <label>HPR ID <span style="font-weight:400;color:var(--grey-500);">(optional)</span></label>
              <input type="text" id="editDoctorHprId" value="${(doctor.hprId || '').replace(/"/g, '&quot;')}" placeholder="e.g., 12-3456-7890-1234" style="text-transform:uppercase;" />
            </div>
            <div class="modal-actions">
              <button type="button" class="btn-sm primary" id="editDoctorSaveBtn">Save</button>
              <button type="button" class="btn-sm" id="editDoctorCancelBtn">Cancel</button>
            </div>
          </div>
        `;
        document.body.appendChild(backdrop);

        function cleanup() {
          backdrop.remove();
          document.removeEventListener('keydown', onKeydown);
        }
        function onKeydown(e) {
          if (e.key === 'Escape') cleanup();
        }
        document.addEventListener('keydown', onKeydown);
        backdrop.addEventListener('click', (e) => { if (e.target === backdrop) cleanup(); });
        backdrop.querySelector('#editDoctorCancelBtn').addEventListener('click', cleanup);

        backdrop.querySelector('#editDoctorName').addEventListener('input', function () {
          this.value = this.value.replace(/[0-9]/g, '');
        });

        backdrop.querySelector('#editDoctorSpecialty').addEventListener('change', (e) => {
          backdrop.querySelector('#editDoctorSpecialtyOtherField').style.display = e.target.value === OTHER_SPECIALTY ? 'flex' : 'none';
        });

        function updateEditFeeHint() {
          const normal = Number(backdrop.querySelector('#editDoctorFeeNormal').value) || 0;
          const emergency = Number(backdrop.querySelector('#editDoctorFeeEmergency').value) || 0;
          const hint = backdrop.querySelector('#editDoctorFeeHint');
          const msg = feeWarningMessage(normal, emergency);
          if (!msg) { hint.style.display = 'none'; hint.innerHTML = ''; return; }
          hint.innerHTML = feeWarningHtml(msg);
          hint.style.display = 'block';
        }
        backdrop.querySelector('#editDoctorFeeNormal').addEventListener('input', updateEditFeeHint);
        backdrop.querySelector('#editDoctorFeeEmergency').addEventListener('input', updateEditFeeHint);
        updateEditFeeHint();

        backdrop.querySelector('#editDoctorSaveBtn').addEventListener('click', async () => {
          const name = backdrop.querySelector('#editDoctorName').value;
          const specialtySelect = backdrop.querySelector('#editDoctorSpecialty').value;
          const specialty = specialtySelect === OTHER_SPECIALTY
            ? backdrop.querySelector('#editDoctorSpecialtyOther').value
            : specialtySelect;
          const feeNormal = Number(backdrop.querySelector('#editDoctorFeeNormal').value) || 0;
          const feeEmergency = Number(backdrop.querySelector('#editDoctorFeeEmergency').value) || 0;
          const hprId = backdrop.querySelector('#editDoctorHprId').value.trim().toUpperCase();
          try {
            await Qlinic.updateDoctor(doctor.id, { name, specialty, feeNormal, feeEmergency, hprId });
          } catch (err) {
            showToast(err.message || 'Could not update doctor — please try again.');
            return;
          }
          cleanup();
          showToast('Doctor updated');
          loadDoctors();
        });

        backdrop.querySelector('#editDoctorName').focus();
      }

      async function doSetDoctorActive(id, isActive) {
        if (!isActive && !(await Qlinic.confirmDialog({
          title: 'Deactivate this doctor?',
          message: 'They’ll disappear from Reception, Doctor View, and the display board, but their patient history is kept. You can reactivate them anytime.',
          confirmLabel: 'Deactivate doctor',
          danger: true,
        }))) {
          return;
        }
        try {
          await Qlinic.setDoctorActive(id, isActive);
        } catch (err) {
          showToast(err.message || 'Could not update doctor — please try again.');
          return;
        }
        showToast(isActive ? 'Doctor reactivated' : 'Doctor deactivated');
        loadDoctors();
      }
      window.doOpenEditDoctor = doOpenEditDoctor;
      window.doSetDoctorActive = doSetDoctorActive;

      document.getElementById('doctorSearch').addEventListener('input', (e) => {
        searchTerm = e.target.value;
        currentPage = 1;
        renderDoctors();
      });

      document.getElementById('newDoctorSpecialty').innerHTML = specialtyOptionsHtml(null);
      document.getElementById('newDoctorSpecialty').addEventListener('change', (e) => {
        document.getElementById('newDoctorSpecialtyOtherField').style.display = e.target.value === OTHER_SPECIALTY ? 'flex' : 'none';
      });

      function clearNewDoctorFeeHint() {
        const hint = document.getElementById('newDoctorFeeHint');
        hint.style.display = 'none';
        hint.innerHTML = '';
      }
      function updateNewDoctorFeeHint() {
        const normal = Number(document.getElementById('newDoctorFeeNormal').value) || 0;
        const emergency = Number(document.getElementById('newDoctorFeeEmergency').value) || 0;
        const msg = feeWarningMessage(normal, emergency);
        if (!msg) { clearNewDoctorFeeHint(); return; }
        const hint = document.getElementById('newDoctorFeeHint');
        hint.innerHTML = feeWarningHtml(msg);
        hint.style.display = 'block';
      }
      document.getElementById('newDoctorFeeNormal').addEventListener('input', updateNewDoctorFeeHint);
      document.getElementById('newDoctorFeeEmergency').addEventListener('input', updateNewDoctorFeeHint);

      document.getElementById('newDoctorName').addEventListener('input', function () {
        this.value = this.value.replace(/[0-9]/g, '');
      });

      document.getElementById('addDoctorForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('newDoctorName').value;
        const specialtySelect = document.getElementById('newDoctorSpecialty').value;
        const specialty = specialtySelect === OTHER_SPECIALTY
          ? document.getElementById('newDoctorSpecialtyOther').value
          : specialtySelect;
        const feeNormal = Number(document.getElementById('newDoctorFeeNormal').value) || 0;
        const feeEmergency = Number(document.getElementById('newDoctorFeeEmergency').value) || 0;
        const hprId = document.getElementById('newDoctorHprId').value.trim().toUpperCase();
        try {
          await Qlinic.addDoctor({ name, specialty, feeNormal, feeEmergency, hprId });
        } catch (err) {
          showToast(err.message || 'Could not add doctor — please try again.');
          return;
        }
        e.target.reset();
        document.getElementById('newDoctorSpecialtyOtherField').style.display = 'none';
        clearNewDoctorFeeHint();
        searchTerm = '';
        document.getElementById('doctorSearch').value = '';
        currentPage = 1;
        showToast('Doctor added');
        loadDoctors();
      });

      const clinic = await Qlinic.getClinic();
      document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
      if (clinic && clinic.logo_url) {
        document.getElementById('clinicLogoThumb').src = clinic.logo_url;
        document.getElementById('clinicLogoThumb').style.display = 'block';
      } else {
        document.getElementById('clinicLogoThumb').style.display = 'none';
      }

      await loadDoctors();
      Qlinic.onLiveChange(loadDoctors);
    })();
  </script>

</body>
</html>
