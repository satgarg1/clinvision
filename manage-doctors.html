<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Doctors: Qlinic</title>
<script>if (localStorage.getItem('qlinic_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%231d1d1f'/%3E%3Cline x1='50' y1='50' x2='50' y2='26' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='68' y2='58' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%230071e3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=122" />
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand">
        <span class="brand-top">
          <span class="brand-clock clock-face" id="navClock">
            <svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block;color:var(--black);">
              <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="5"></circle>
              <line class="clock-hour" x1="50" y1="50" x2="50" y2="30" stroke="currentColor" stroke-width="6" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
              <line class="clock-min" x1="50" y1="50" x2="50" y2="18" stroke="currentColor" stroke-width="4" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
              <line class="clock-sec" x1="50" y1="50" x2="50" y2="14" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
              <circle cx="50" cy="50" r="3" fill="currentColor"></circle>
            </svg>
          </span>
          Qlinic
        </span>
        <span class="brand-tagline">Time is the one asset nobody gets back</span>
      </a>
      <div class="clinic-name-row">
        <img class="clinic-logo-thumb" id="clinicLogoThumb" style="display:none;" alt="" />
        <div class="clinic-name" id="clinicName">Loading…</div>
      </div>
      <nav>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="reception.html" class="nav-link">Reception</a>
        <a href="doctor.html" class="nav-link">Doctor View</a>
        <a href="billing.html" class="nav-link" id="billingNavLink">Billing</a>
        <a href="revenue.html" class="nav-link" id="revenueNavLink">Revenue</a>
        <a href="trends.html" class="nav-link" id="trendsNavLink">Trends</a>
        <a href="end-of-day.html" class="nav-link" id="endOfDayNavLink">End of day</a>
        <a href="display.html" class="nav-link">Display Screen</a>
        <a href="settings.html" class="nav-link active pinned-bottom">Settings</a>
      </nav>
    </aside>

    <main class="app-main">
      <div class="app-topbar">
        <div>
          <div class="breadcrumb"><a href="settings.html">Settings</a> <span>/</span> Doctors</div>
          <h1>Doctors</h1>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header"><h2>Add a doctor</h2></div>
        <form id="addDoctorForm" class="inline-form">
          <div class="field">
            <label>Name</label>
            <input type="text" id="newDoctorName" placeholder="Dr. Jane Doe" required />
          </div>
          <div class="field">
            <label>Specialty</label>
            <select id="newDoctorSpecialty"></select>
          </div>
          <div class="field" id="newDoctorSpecialtyOtherField" style="display:none;">
            <label>Specify specialty</label>
            <input type="text" id="newDoctorSpecialtyOther" placeholder="e.g. Podiatrist" />
          </div>
          <div class="field" style="max-width:140px;">
            <label>Consultation fee (&#8377;)</label>
            <input type="number" id="newDoctorFeeNormal" min="0" step="1" />
          </div>
          <div class="field" style="max-width:140px;">
            <label>Emergency fee (&#8377;)</label>
            <input type="number" id="newDoctorFeeEmergency" min="0" step="1" />
          </div>
          <div class="field" style="flex:0;">
            <label>&nbsp;</label>
            <button type="submit" class="btn-sm primary">Add doctor</button>
          </div>
        </form>
        <div id="newDoctorFeeHint" class="slot-hint" style="display:none;"></div>
      </div>

      <div class="panel">
        <div class="panel-header"><h2>All doctors</h2></div>
        <div class="doctor-search-row">
          <input type="search" id="doctorSearch" placeholder="Search by name…" class="doctor-search-input" />
          <span class="panel-note" id="doctorCountNote"></span>
        </div>
        <div id="doctorList"></div>
        <div class="pager" id="doctorPager"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=41"></script>
  <script>
    (async function () {
      await Qlinic.requireLogin('login.html');

      // The sidebar logo links to the marketing site, which has no way
      // back into the app without logging in again, worth a heads-up
      // before someone loses their place by accident.
      document.querySelector('a.brand').addEventListener('click', (e) => {
        e.preventDefault();
        if (confirm("Going to the homepage will end your session here, you'll need to log in again to get back in. Continue?")) {
          window.location.href = 'index.html';
        }
      });

      if (!(await Qlinic.isAdmin())) {
        window.location.href = 'dashboard.html';
        return;
      }

      const PAGE_SIZE = 10;
      let allDoctors = [];
      let searchTerm = '';
      let currentPage = 1;

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      const SPECIALTIES = [
        'General Physician',
        'Pediatrician',
        'Gynecologist',
        'Dermatologist',
        'Dentist',
        'ENT Specialist',
        'Ophthalmologist',
        'Orthopedic',
        'Cardiologist',
        'Neurologist',
        'Psychiatrist',
        'General Surgeon',
        'Urologist',
        'Gastroenterologist',
        'Endocrinologist',
        'Pulmonologist',
        'Diabetologist',
        'Physiotherapist',
      ];
      const OTHER_SPECIALTY = '__other__';

      // Passive heads-up only, same as the no-show note on Reception: it
      // never blocks Save, it just flags a fee that's worth a second look.
      const HIGH_FEE_THRESHOLD = 4000;
      function feeWarningMessage(normal, emergency) {
        const highNormal = normal > HIGH_FEE_THRESHOLD;
        const highEmergency = emergency > HIGH_FEE_THRESHOLD;
        if (!highNormal && !highEmergency) return null;
        if (highNormal && highEmergency) {
          return `Both fees are above &#8377;${HIGH_FEE_THRESHOLD}, that's unusually high for a consultation, worth double-checking before saving.`;
        }
        return `${highNormal ? 'Consultation fee' : 'Emergency fee'} is above &#8377;${HIGH_FEE_THRESHOLD}, that's unusually high for a consultation, worth double-checking before saving.`;
      }
      function feeWarningHtml(msg) {
        return `<div style="color:var(--warning);background:var(--warning-bg);padding:8px 12px;border-radius:8px;">&#9888; ${msg}</div>`;
      }

      function specialtyOptionsHtml(selected) {
        const isKnown = SPECIALTIES.includes(selected);
        return SPECIALTIES.map((s) => `<option value="${s}" ${s === selected ? 'selected' : ''}>${s}</option>`).join('')
          + `<option value="${OTHER_SPECIALTY}" ${!isKnown && selected ? 'selected' : ''}>Other…</option>`;
      }

      function filteredDoctors() {
        const term = searchTerm.trim().toLowerCase();
        if (!term) return allDoctors;
        return allDoctors.filter((d) => d.name.toLowerCase().includes(term));
      }

      function renderPager(total) {
        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const pager = document.getElementById('doctorPager');
        if (totalPages <= 1) {
          pager.innerHTML = '';
          return;
        }
        pager.innerHTML = `
          <button class="btn-sm" id="pagerPrev" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>
          <span class="pager-label">Page ${currentPage} of ${totalPages}</span>
          <button class="btn-sm" id="pagerNext" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
        `;
        document.getElementById('pagerPrev').addEventListener('click', () => { currentPage -= 1; renderDoctors(); });
        document.getElementById('pagerNext').addEventListener('click', () => { currentPage += 1; renderDoctors(); });
      }

      function renderDoctors() {
        const filtered = filteredDoctors();
        const box = document.getElementById('doctorList');
        const countNote = document.getElementById('doctorCountNote');

        if (allDoctors.length === 0) {
          box.innerHTML = '<div class="empty-state">No doctors yet, add your first one above.</div>';
          countNote.textContent = '';
          document.getElementById('doctorPager').innerHTML = '';
          return;
        }
        if (filtered.length === 0) {
          box.innerHTML = '<div class="empty-state">No doctors match your search.</div>';
          countNote.textContent = `0 of ${allDoctors.length} doctors`;
          document.getElementById('doctorPager').innerHTML = '';
          return;
        }

        const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageDoctors = filtered.slice(start, start + PAGE_SIZE);

        countNote.textContent = searchTerm.trim()
          ? `${filtered.length} of ${allDoctors.length} doctors`
          : `${allDoctors.length} doctor${allDoctors.length === 1 ? '' : 's'}`;

        box.innerHTML = `
          <table class="qtable">
            <thead><tr><th>Name</th><th>Specialty</th><th>Consultation fee (&#8377;)</th><th>Emergency fee (&#8377;)</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${pageDoctors.map((d) => {
                const isKnown = SPECIALTIES.includes(d.specialty);
                return `
                <tr style="${d.isActive ? '' : 'opacity:0.5;'}">
                  <td><input type="text" class="doc-edit-name" data-id="${d.id}" value="${d.name.replace(/"/g, '&quot;')}" style="width:100%;padding:8px 10px;border:1px solid var(--grey-300);border-radius:8px;font-family:var(--font);" /></td>
                  <td>
                    <select class="doc-edit-specialty" data-id="${d.id}" style="width:100%;padding:8px 10px;border:1px solid var(--grey-300);border-radius:8px;font-family:var(--font);">${specialtyOptionsHtml(d.specialty)}</select>
                    <input type="text" class="doc-edit-specialty-other" data-id="${d.id}" value="${(!isKnown ? (d.specialty || '') : '').replace(/"/g, '&quot;')}" placeholder="Specify specialty" style="width:100%;margin-top:6px;padding:8px 10px;border:1px solid var(--grey-300);border-radius:8px;font-family:var(--font);${isKnown ? 'display:none;' : ''}" />
                  </td>
                  <td><input type="number" min="0" step="1" class="doc-edit-fee-normal" data-id="${d.id}" value="${d.feeNormal || 0}" style="width:90px;padding:8px 10px;border:1px solid var(--grey-300);border-radius:8px;font-family:var(--font);" /></td>
                  <td><input type="number" min="0" step="1" class="doc-edit-fee-emergency" data-id="${d.id}" value="${d.feeEmergency || 0}" style="width:90px;padding:8px 10px;border:1px solid var(--grey-300);border-radius:8px;font-family:var(--font);" /></td>
                  <td>${d.isActive ? '<span class="badge badge-booked">Active</span>' : '<span class="badge badge-no-show">Deactivated</span>'}</td>
                  <td style="white-space:nowrap;">
                    <button class="btn-sm primary" onclick="doSaveDoctor('${d.id}')">Save</button>
                    ${d.isActive
                      ? `<button class="btn-sm danger" onclick="doSetDoctorActive('${d.id}', false)">Deactivate</button>`
                      : `<button class="btn-sm" onclick="doSetDoctorActive('${d.id}', true)">Reactivate</button>`}
                  </td>
                </tr>
                <tr class="fee-warn-row" data-id="${d.id}" style="display:none;">
                  <td colspan="6" style="padding-top:0;"><div class="fee-warn-note"></div></td>
                </tr>
              `;
              }).join('')}
            </tbody>
          </table>
        `;
        renderPager(filtered.length);
      }

      async function loadDoctors() {
        allDoctors = await Qlinic.getDoctors({ includeInactive: true });
        renderDoctors();
      }

      async function doSaveDoctor(id) {
        const name = document.querySelector(`.doc-edit-name[data-id="${id}"]`).value;
        const specialtySelect = document.querySelector(`.doc-edit-specialty[data-id="${id}"]`).value;
        const specialty = specialtySelect === OTHER_SPECIALTY
          ? document.querySelector(`.doc-edit-specialty-other[data-id="${id}"]`).value
          : specialtySelect;
        const feeNormal = Number(document.querySelector(`.doc-edit-fee-normal[data-id="${id}"]`).value) || 0;
        const feeEmergency = Number(document.querySelector(`.doc-edit-fee-emergency[data-id="${id}"]`).value) || 0;
        await Qlinic.updateDoctor(id, { name, specialty, feeNormal, feeEmergency });
        showToast('Doctor updated');
        loadDoctors();
      }

      async function doSetDoctorActive(id, isActive) {
        if (!isActive && !confirm('Deactivate this doctor? They’ll disappear from Reception, Doctor View, and the display board, but their patient history is kept. You can reactivate them anytime.')) {
          return;
        }
        await Qlinic.setDoctorActive(id, isActive);
        showToast(isActive ? 'Doctor reactivated' : 'Doctor deactivated');
        loadDoctors();
      }
      window.doSaveDoctor = doSaveDoctor;
      window.doSetDoctorActive = doSetDoctorActive;

      document.getElementById('doctorList').addEventListener('change', (e) => {
        if (!e.target.classList.contains('doc-edit-specialty')) return;
        const id = e.target.getAttribute('data-id');
        const otherField = document.querySelector(`.doc-edit-specialty-other[data-id="${id}"]`);
        otherField.style.display = e.target.value === OTHER_SPECIALTY ? 'block' : 'none';
      });

      document.getElementById('doctorList').addEventListener('input', (e) => {
        if (e.target.classList.contains('doc-edit-name')) {
          e.target.value = e.target.value.replace(/[0-9]/g, '');
        }
        if (!e.target.classList.contains('doc-edit-fee-normal') && !e.target.classList.contains('doc-edit-fee-emergency')) return;
        const id = e.target.getAttribute('data-id');
        const normal = Number(document.querySelector(`.doc-edit-fee-normal[data-id="${id}"]`).value) || 0;
        const emergency = Number(document.querySelector(`.doc-edit-fee-emergency[data-id="${id}"]`).value) || 0;
        const warnRow = document.querySelector(`.fee-warn-row[data-id="${id}"]`);
        const note = warnRow.querySelector('.fee-warn-note');
        const msg = feeWarningMessage(normal, emergency);
        if (!msg) { warnRow.style.display = 'none'; note.innerHTML = ''; return; }
        note.innerHTML = feeWarningHtml(msg);
        warnRow.style.display = 'table-row';
      });

      document.getElementById('doctorSearch').addEventListener('input', (e) => {
        searchTerm = e.target.value;
        currentPage = 1;
        renderDoctors();
      });

      document.getElementById('newDoctorSpecialty').innerHTML = specialtyOptionsHtml(null);
      document.getElementById('newDoctorSpecialty').addEventListener('change', (e) => {
        document.getElementById('newDoctorSpecialtyOtherField').style.display = e.target.value === OTHER_SPECIALTY ? 'block' : 'none';
      });

      function clearNewDoctorFeeHint() {
        const hint = document.getElementById('newDoctorFeeHint');
        hint.style.display = 'none';
        hint.innerHTML = '';
      }
      function updateNewDoctorFeeHint() {
        const normal = Number(document.getElementById('newDoctorFeeNormal').value) || 0;
        const emergency = Number(document.getElementById('newDoctorFeeEmergency').value) || 0;
        const msg = feeWarningMessage(normal, emergency);
        if (!msg) { clearNewDoctorFeeHint(); return; }
        const hint = document.getElementById('newDoctorFeeHint');
        hint.innerHTML = feeWarningHtml(msg);
        hint.style.display = 'block';
      }
      document.getElementById('newDoctorFeeNormal').addEventListener('input', updateNewDoctorFeeHint);
      document.getElementById('newDoctorFeeEmergency').addEventListener('input', updateNewDoctorFeeHint);

      document.getElementById('newDoctorName').addEventListener('input', function () {
        this.value = this.value.replace(/[0-9]/g, '');
      });

      document.getElementById('addDoctorForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('newDoctorName').value;
        const specialtySelect = document.getElementById('newDoctorSpecialty').value;
        const specialty = specialtySelect === OTHER_SPECIALTY
          ? document.getElementById('newDoctorSpecialtyOther').value
          : specialtySelect;
        const feeNormal = Number(document.getElementById('newDoctorFeeNormal').value) || 0;
        const feeEmergency = Number(document.getElementById('newDoctorFeeEmergency').value) || 0;
        await Qlinic.addDoctor({ name, specialty, feeNormal, feeEmergency });
        e.target.reset();
        document.getElementById('newDoctorSpecialtyOtherField').style.display = 'none';
        clearNewDoctorFeeHint();
        searchTerm = '';
        document.getElementById('doctorSearch').value = '';
        currentPage = 1;
        showToast('Doctor added');
        loadDoctors();
      });

      const clinic = await Qlinic.getClinic();
      document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
      if (clinic && clinic.logo_url) {
        document.getElementById('clinicLogoThumb').src = clinic.logo_url;
        document.getElementById('clinicLogoThumb').style.display = 'block';
      } else {
        document.getElementById('clinicLogoThumb').style.display = 'none';
      }

      await loadDoctors();
      Qlinic.onLiveChange(loadDoctors);
    })();
  </script>
  <script>
    (function () {
      function applyTime(root) {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours() % 12;
        const sec = root.querySelector(".clock-sec");
        const min = root.querySelector(".clock-min");
        const hour = root.querySelector(".clock-hour");
        if (sec) sec.style.transform = `rotate(${s * 6}deg)`;
        if (min) min.style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
        if (hour) hour.style.transform = `rotate(${h * 30 + m * 0.5}deg)`;
      }
      function tickAll() {
        document.querySelectorAll(".clock-face").forEach(applyTime);
      }
      tickAll();
      setInterval(tickAll, 1000);
    })();
  </script>

</body>
</html>
