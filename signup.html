<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register your clinic: Qlinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%231d1d1f'/%3E%3Cline x1='50' y1='50' x2='50' y2='26' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='68' y2='58' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%230071e3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=117" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-blob login-blob-teal"></div>
    <div class="login-blob login-blob-coral"></div>
    <div class="login-blob login-blob-purple"></div>
    <a href="index.html" class="brand login-brand-corner">
      <span class="brand-top">
        <span class="brand-clock clock-face" id="navClock">
          <svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block;color:var(--black);">
            <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="5"></circle>
            <line class="clock-hour" x1="50" y1="50" x2="50" y2="30" stroke="currentColor" stroke-width="6" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
            <line class="clock-min" x1="50" y1="50" x2="50" y2="18" stroke="currentColor" stroke-width="4" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
            <line class="clock-sec" x1="50" y1="50" x2="50" y2="14" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
            <circle cx="50" cy="50" r="3" fill="currentColor"></circle>
          </svg>
        </span>
        Qlinic
      </span>
      <span class="brand-tagline">Time is the one asset nobody gets back</span>
    </a>
    <div class="login-card login-card-compact">
      <h1>Register your clinic</h1>

      <div id="signupError" class="login-error"></div>

      <form id="signupForm">
        <div class="field">
          <label for="clinicName">Clinic name</label>
          <input type="text" id="clinicName" placeholder="e.g., Rao Family Clinic" required />
        </div>
        <div class="field">
          <label for="pincode">Pincode</label>
          <input type="text" id="pincode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit pincode" required />
        </div>
        <div class="field">
          <label for="buildingLine">Flat, house no., building</label>
          <input type="text" id="buildingLine" placeholder="e.g., Flat 4B, Sunrise Apartments" required />
        </div>
        <div class="field">
          <label for="areaLine">Area, street, sector</label>
          <input type="text" id="areaLine" placeholder="e.g., MG Road, Sector 12" required />
        </div>
        <div class="field">
          <label for="landmark">Landmark <span style="font-weight:400;color:var(--grey-500);">(optional)</span></label>
          <input type="text" id="landmark" placeholder="e.g., near Apollo Hospital" />
        </div>
        <div style="display:flex;gap:12px;">
          <div class="field" style="flex:1;min-width:0;">
            <label for="city">City</label>
            <input type="text" id="city" placeholder="From pincode" required />
          </div>
          <div class="field" style="flex:1;min-width:0;">
            <label for="state">State</label>
            <select id="state">
              <option value="">From pincode</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="phoneNumber">Your mobile number</label>
          <div style="display:flex;gap:8px;">
            <input type="text" value="+91" disabled style="flex:0 0 76px;text-align:center;" />
            <input type="tel" id="phoneNumber" inputmode="numeric" maxlength="10" placeholder="10-digit number" required style="flex:1;min-width:0;" />
          </div>
          <div id="phoneError" style="display:none;color:var(--danger);font-size:13px;margin-top:6px;"></div>
        </div>
        <div class="field">
          <label for="email">Your email</label>
          <input type="email" id="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" minlength="6" required />
        </div>
        <div class="field">
          <label>Clinic logo <span style="font-weight:400;color:var(--grey-500);">(optional)</span></label>
          <div class="logo-upload-row">
            <div class="logo-preview empty" id="signupLogoPreview"></div>
            <div>
              <input type="file" id="logoFileInput" accept="image/png,image/jpeg,image/webp" style="display:none;" />
              <button type="button" class="btn-sm primary" id="chooseLogoBtn">Choose file</button>
            </div>
          </div>
          <div id="logoError" style="display:none;color:var(--danger);font-size:13px;margin-top:6px;"></div>
        </div>
        <button type="submit" class="btn btn-accent" id="signupBtn" style="width:100%;">Create account</button>
      </form>

      <div class="login-hint" id="signupHint">
        Already registered? <a href="login.html">Log in</a> instead.
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=41"></script>
  <script>
    document.getElementById('state').innerHTML = '<option value="">Select state</option>' +
      Qlinic.INDIA_STATES_AND_UTS.map((s) => `<option value="${s}">${s}</option>`).join('');

    // The pincode API's state names don't always exactly match the
    // dropdown's official names (e.g. abbreviated forms); rather than
    // silently dropping a match-less value, add it as a one-off option so
    // nothing the API found is ever lost, and it's still a one-click fix
    // via the dropdown if it doesn't look right.
    function setStateValue(selectEl, state) {
      if (!state) return;
      const hasMatch = Array.from(selectEl.options).some((o) => o.value === state);
      if (!hasMatch) {
        const opt = document.createElement('option');
        opt.value = state;
        opt.textContent = state;
        selectEl.appendChild(opt);
      }
      selectEl.value = state;
    }

    // Starts the lookup the moment the 6th digit is typed, not only once
    // the field is blurred: that means the network round-trip is already
    // in flight (or done) by the time the user's attention has moved to
    // City/State, instead of only starting after they've already clicked
    // away and are staring at an empty field. lastLookedUp skips a
    // redundant repeat call for the exact same value.
    let lastLookedUp = '';
    async function runPincodeLookup(value) {
      const clean = (value || '').trim();
      if (clean.length !== 6 || clean === lastLookedUp) return;
      lastLookedUp = clean;
      const cityInput = document.getElementById('city');
      const stateInput = document.getElementById('state');
      const cityPlaceholder = cityInput.placeholder;
      cityInput.placeholder = 'Looking up…';
      const { city, state } = await Qlinic.lookupCityStateForPincode(clean);
      cityInput.placeholder = cityPlaceholder;
      if (city) cityInput.value = city;
      setStateValue(stateInput, state);
    }
    document.getElementById('pincode').addEventListener('input', function () {
      runPincodeLookup(this.value);
    });
    document.getElementById('pincode').addEventListener('blur', function () {
      runPincodeLookup(this.value);
    });

    // Strips anything non-numeric as they type, so a pasted or typed
    // letter/symbol never even lands in the field rather than being
    // rejected after the fact.
    document.getElementById('phoneNumber').addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '').slice(0, 10);
    });
    function validatePhone() {
      const val = document.getElementById('phoneNumber').value.trim();
      const errorEl = document.getElementById('phoneError');
      if (!/^[0-9]{10}$/.test(val)) {
        errorEl.textContent = 'Please provide a correct 10-digit mobile number.';
        errorEl.style.display = 'block';
        return false;
      }
      errorEl.style.display = 'none';
      return true;
    }
    document.getElementById('phoneNumber').addEventListener('blur', validatePhone);

    // Held in memory only — the actual Storage upload happens after
    // Qlinic.signUp() below, once a clinic row (and therefore a clinic_id
    // to scope the file to) actually exists. A File object can't survive
    // navigating to a different page, so this only works for the
    // immediate-session path; see the submit handler's comment.
    let selectedLogoFile = null;
    document.getElementById('chooseLogoBtn').addEventListener('click', () => {
      document.getElementById('logoFileInput').click();
    });
    document.getElementById('logoFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      const errorEl = document.getElementById('logoError');
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) {
        errorEl.textContent = 'Logo must be under 2 MB.';
        errorEl.style.display = 'block';
        e.target.value = '';
        return;
      }
      errorEl.style.display = 'none';
      selectedLogoFile = file;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const preview = document.getElementById('signupLogoPreview');
        preview.innerHTML = `<img src="${ev.target.result}" alt="Clinic logo" />`;
        preview.classList.remove('empty');
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('signupForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!validatePhone()) {
        document.getElementById('phoneNumber').focus();
        return;
      }
      const btn = document.getElementById('signupBtn');
      const errorBox = document.getElementById('signupError');
      errorBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Creating account…';
      try {
        const clinicName = document.getElementById('clinicName').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const clinicPhone = '+91' + document.getElementById('phoneNumber').value.trim();
        // Split into Amazon-style Building / Area-Street-Sector / Landmark
        // fields for easier entry, then joined back into one line — the
        // clinics table still stores address as a single column, and
        // nothing else in the app needs the parts separately.
        const building = document.getElementById('buildingLine').value.trim();
        const area = document.getElementById('areaLine').value.trim();
        const landmark = document.getElementById('landmark').value.trim();
        const addressParts = [building, area];
        if (landmark) addressParts.push(`near ${landmark}`);
        const clinicAddress = {
          addressLine: addressParts.filter(Boolean).join(', '),
          city: document.getElementById('city').value,
          pincode: document.getElementById('pincode').value,
          state: document.getElementById('state').value,
        };
        const result = await Qlinic.signUp(email, password, clinicName, clinicAddress, clinicPhone);

        if (result.session) {
          // Email confirmation is off for this project: clinic is set up
          // and the user is already logged in, so a clinic_id already
          // exists to scope the upload to. Best-effort: a failed logo
          // upload shouldn't block a successful signup — they can always
          // add one later from Settings.
          if (selectedLogoFile) {
            try {
              await Qlinic.uploadClinicLogo(selectedLogoFile);
            } catch (err) {
              console.error('Logo upload failed:', err);
            }
          }
          window.location.href = 'dashboard.html';
          return;
        }

        // Email confirmation is required: the clinic gets created
        // automatically the moment they confirm and log in for the first
        // time (see finishClinicSetupIfNeeded in clinic-data.js).
        document.getElementById('signupForm').style.display = 'none';
        document.getElementById('signupHint').innerHTML =
          `<strong>Check your email</strong> to confirm your account. Once confirmed, ` +
          `<a href="login.html">log in</a> and "${clinicName}" will be set up automatically.`;
      } catch (err) {
        errorBox.textContent = err.message || 'Something went wrong creating your account.';
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    });
  </script>
  <script>
    (function () {
      function applyTime(root) {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours() % 12;
        const sec = root.querySelector(".clock-sec");
        const min = root.querySelector(".clock-min");
        const hour = root.querySelector(".clock-hour");
        if (sec) sec.style.transform = `rotate(${s * 6}deg)`;
        if (min) min.style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
        if (hour) hour.style.transform = `rotate(${h * 30 + m * 0.5}deg)`;
      }
      function tickAll() {
        document.querySelectorAll(".clock-face").forEach(applyTime);
      }
      tickAll();
      setInterval(tickAll, 1000);
    })();
  </script>
</body>
</html>
