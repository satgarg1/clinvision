<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register your clinic: Qlinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=68" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-blob login-blob-teal"></div>
    <div class="login-blob login-blob-coral"></div>
    <div class="login-blob login-blob-purple"></div>
    <div class="login-card" style="max-width:440px;">
      <a href="index.html" class="brand">Qlinic</a>
      <h1>Register your clinic</h1>

      <div id="signupError" class="login-error"></div>

      <form id="signupForm">
        <div class="field">
          <label for="clinicName">Clinic name</label>
          <input type="text" id="clinicName" placeholder="e.g., Rao Family Clinic" required />
        </div>
        <div class="field">
          <label for="addressLine">Address</label>
          <input type="text" id="addressLine" placeholder="Building, street, area" required />
        </div>
        <div class="field">
          <label for="pincode">Pincode</label>
          <input type="text" id="pincode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required />
        </div>
        <div style="display:flex;gap:12px;">
          <div class="field" style="flex:1;min-width:0;">
            <label for="city">City</label>
            <input type="text" id="city" placeholder="Auto-filled from pincode" required />
          </div>
          <div class="field" style="flex:1;min-width:0;">
            <label for="state">State</label>
            <select id="state">
              <option value="">Auto-filled from pincode</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="email">Your email</label>
          <input type="email" id="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-accent" id="signupBtn" style="width:100%;">Create account</button>
      </form>

      <div class="login-hint" id="signupHint">
        Already registered? <a href="login.html">Log in</a> instead.
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=31"></script>
  <script>
    document.getElementById('state').innerHTML = '<option value="">Select state</option>' +
      Qlinic.INDIA_STATES_AND_UTS.map((s) => `<option value="${s}">${s}</option>`).join('');

    // The pincode API's state names don't always exactly match the
    // dropdown's official names (e.g. abbreviated forms); rather than
    // silently dropping a match-less value, add it as a one-off option so
    // nothing the API found is ever lost, and it's still a one-click fix
    // via the dropdown if it doesn't look right.
    function setStateValue(selectEl, state) {
      if (!state) return;
      const hasMatch = Array.from(selectEl.options).some((o) => o.value === state);
      if (!hasMatch) {
        const opt = document.createElement('option');
        opt.value = state;
        opt.textContent = state;
        selectEl.appendChild(opt);
      }
      selectEl.value = state;
    }

    // Starts the lookup the moment the 6th digit is typed, not only once
    // the field is blurred: that means the network round-trip is already
    // in flight (or done) by the time the user's attention has moved to
    // City/State, instead of only starting after they've already clicked
    // away and are staring at an empty field. lastLookedUp skips a
    // redundant repeat call for the exact same value.
    let lastLookedUp = '';
    async function runPincodeLookup(value) {
      const clean = (value || '').trim();
      if (clean.length !== 6 || clean === lastLookedUp) return;
      lastLookedUp = clean;
      const cityInput = document.getElementById('city');
      const stateInput = document.getElementById('state');
      const cityPlaceholder = cityInput.placeholder;
      cityInput.placeholder = 'Looking up…';
      const { city, state } = await Qlinic.lookupCityStateForPincode(clean);
      cityInput.placeholder = cityPlaceholder;
      if (city) cityInput.value = city;
      setStateValue(stateInput, state);
    }
    document.getElementById('pincode').addEventListener('input', function () {
      runPincodeLookup(this.value);
    });
    document.getElementById('pincode').addEventListener('blur', function () {
      runPincodeLookup(this.value);
    });

    document.getElementById('signupForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('signupBtn');
      const errorBox = document.getElementById('signupError');
      errorBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Creating account…';
      try {
        const clinicName = document.getElementById('clinicName').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const clinicAddress = {
          addressLine: document.getElementById('addressLine').value,
          city: document.getElementById('city').value,
          pincode: document.getElementById('pincode').value,
          state: document.getElementById('state').value,
        };
        const result = await Qlinic.signUp(email, password, clinicName, clinicAddress);

        if (result.session) {
          // Email confirmation is off for this project: clinic is set up
          // and the user is already logged in.
          window.location.href = 'dashboard.html';
          return;
        }

        // Email confirmation is required: the clinic gets created
        // automatically the moment they confirm and log in for the first
        // time (see finishClinicSetupIfNeeded in clinic-data.js).
        document.getElementById('signupForm').style.display = 'none';
        document.getElementById('signupHint').innerHTML =
          `<strong>Check your email</strong> to confirm your account. Once confirmed, ` +
          `<a href="login.html">log in</a> and "${clinicName}" will be set up automatically.`;
      } catch (err) {
        errorBox.textContent = err.message || 'Something went wrong creating your account.';
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
