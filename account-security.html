<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account &amp; security: Qlinic</title>
<script>if (localStorage.getItem('qlinic_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%231d1d1f'/%3E%3Cline x1='50' y1='50' x2='50' y2='26' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Cline x1='50' y1='50' x2='68' y2='58' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='50' r='6' fill='%230071e3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="styles.css?v=186" />
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand">
        <span class="brand-top">
          <span class="brand-clock clock-face" id="navClock">
            <svg viewBox="0 0 100 100" style="width:100%;height:100%;display:block;color:var(--black);">
              <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="5"></circle>
              <line class="clock-hour" x1="50" y1="50" x2="50" y2="30" stroke="currentColor" stroke-width="6" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
              <line class="clock-min" x1="50" y1="50" x2="50" y2="18" stroke="currentColor" stroke-width="4" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
              <line class="clock-sec" x1="50" y1="50" x2="50" y2="14" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" style="transform-origin:50px 50px;"></line>
              <circle cx="50" cy="50" r="3" fill="currentColor"></circle>
            </svg>
          </span>
          Qlinic
        </span>
        <span class="brand-tagline">Time is the one asset nobody gets back</span>
      </a>
      <div class="clinic-name-row">
        <img class="clinic-logo-thumb" id="clinicLogoThumb" style="display:none;" alt="" />
        <div class="clinic-name" id="clinicName">Loading…</div>
      </div>
      <nav>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="reception.html" class="nav-link" id="receptionNavLink">Reception</a>
        <a href="doctor.html" class="nav-link">Doctor View</a>
        <a href="billing.html" class="nav-link" id="billingNavLink">Billing</a>
        <a href="revenue.html" class="nav-link" id="revenueNavLink">Revenue</a>
        <a href="trends.html" class="nav-link" id="trendsNavLink">Analytics</a>
        <a href="end-of-day.html" class="nav-link" id="endOfDayNavLink">End of day</a>
        <a href="display.html" class="nav-link" id="displayNavLink">Display Screen</a>
        <a href="settings.html" class="nav-link pinned-bottom" id="settingsNavLink">Settings</a>
      </nav>
    </aside>

    <main class="app-main">
      <div class="app-topbar">
        <div>
          <div class="breadcrumb"><a href="settings.html">Settings</a> <span>/</span> Account &amp; security</div>
          <h1>Account &amp; security</h1>
        </div>
      </div>

      <div class="panel">
        <div class="account-section" id="emailPanel">
          <div class="account-section-header">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            <h2>Email</h2>
            <span class="account-section-current" id="currentEmail">·</span>
          </div>
          <form id="emailForm" class="inline-form">
            <div class="field">
              <label>New email</label>
              <input type="email" id="newEmailInput" required />
            </div>
            <div class="field" style="flex:0;">
              <label>&nbsp;</label>
              <button type="submit" class="btn-sm primary">Change email</button>
            </div>
          </form>
          <p class="panel-note" id="emailNote" style="display:none;"></p>
        </div>

        <div class="account-section-divider" id="phoneDivider"></div>

        <div class="account-section" id="phonePanel">
          <div class="account-section-header">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <h2>Phone</h2>
            <span class="account-section-current" id="currentPhone">·</span>
          </div>
          <form id="phoneForm" class="inline-form">
            <div class="field">
              <label>New phone number</label>
              <div style="display:flex;gap:8px;">
                <input type="text" value="+91" disabled style="flex:0 0 60px;text-align:center;" />
                <input type="tel" id="newPhoneInput" inputmode="numeric" maxlength="10" placeholder="10-digit number" required style="flex:1;min-width:0;" />
              </div>
            </div>
            <div class="field" style="flex:0;">
              <label>&nbsp;</label>
              <button type="submit" class="btn-sm primary">Change phone</button>
            </div>
          </form>
          <p class="panel-note" id="phoneNote" style="display:none;"></p>
        </div>

        <div class="account-section-divider"></div>

        <div class="account-section" id="passwordPanel">
          <div class="account-section-header">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <h2>Password</h2>
          </div>
          <form id="passwordForm" class="inline-form">
            <div class="field">
              <label>New password</label>
              <input type="password" id="newPasswordInput" minlength="6" required />
            </div>
            <div class="field">
              <label>Confirm new password</label>
              <input type="password" id="confirmPasswordInput" minlength="6" required />
            </div>
            <div class="field" style="flex:0;min-width:180px;">
              <label>&nbsp;</label>
              <button type="submit" class="btn-sm primary">Change password</button>
            </div>
          </form>
          <p class="panel-note" id="passwordNote" style="display:none;"></p>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=72"></script>
  <script>
    (async function () {
      await Qlinic.requireLogin('login.html');

      // The sidebar logo links to the marketing site, which has no way
      // back into the app without logging in again, worth a heads-up
      // before someone loses their place by accident.
      document.querySelector('a.brand').addEventListener('click', async (e) => {
        e.preventDefault();
        if (await Qlinic.confirmDialog({ message: "Going to the homepage will end your session here, you'll need to log in again to get back in." })) {
          window.location.href = 'index.html';
        }
      });

      // Email and password change the logged-in user's own login — personal
      // to whoever's signed in, open to every role. Phone is the one panel
      // here that isn't personal at all: it edits the clinic's own contact
      // number (Qlinic.updateClinic), so it stays admin-only.
      const [admin, amDoctor] = await Promise.all([Qlinic.isAdmin(), Qlinic.isDoctor()]);
      if (!admin) {
        document.getElementById('phonePanel').style.display = 'none';
        document.getElementById('phoneDivider').style.display = 'none';
      }
      if (amDoctor) {
        document.getElementById('receptionNavLink').style.display = 'none';
        document.getElementById('billingNavLink').style.display = 'none';
        document.getElementById('displayNavLink').style.display = 'none';
      }
      if (!admin) {
        document.getElementById('revenueNavLink').style.display = 'none';
        document.getElementById('endOfDayNavLink').style.display = 'none';
      }
      if (!admin && !amDoctor) {
        document.getElementById('trendsNavLink').style.display = 'none';
      }

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      document.getElementById('emailForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const note = document.getElementById('emailNote');
        try {
          await Qlinic.changeEmail(document.getElementById('newEmailInput').value);
          note.style.display = 'block';
          note.textContent = 'Check both your old and new inbox to confirm this change; it won’t take effect until then.';
          e.target.reset();
        } catch (err) {
          note.style.display = 'block';
          note.textContent = err.message || 'Could not change email.';
        }
      });

      // Strips anything non-numeric as they type, matching registration's
      // phone field, so a pasted or typed letter/symbol never even lands
      // in the input rather than being rejected after the fact.
      document.getElementById('newPhoneInput').addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 10);
      });

      document.getElementById('phoneForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const note = document.getElementById('phoneNote');
        const val = document.getElementById('newPhoneInput').value.trim();
        if (!/^[0-9]{10}$/.test(val)) {
          note.style.display = 'block';
          note.textContent = 'Please provide a correct 10-digit mobile number.';
          return;
        }
        try {
          const newPhone = '+91' + val;
          await Qlinic.updateClinic({ phone: newPhone });
          note.style.display = 'block';
          note.textContent = 'Phone number updated.';
          document.getElementById('currentPhone').textContent = newPhone;
          e.target.reset();
        } catch (err) {
          note.style.display = 'block';
          note.textContent = err.message || 'Could not update phone number.';
        }
      });

      document.getElementById('passwordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const note = document.getElementById('passwordNote');
        const newPassword = document.getElementById('newPasswordInput').value;
        const confirmPassword = document.getElementById('confirmPasswordInput').value;
        if (newPassword !== confirmPassword) {
          note.style.display = 'block';
          note.textContent = "Passwords don't match.";
          return;
        }
        try {
          await Qlinic.changePassword(newPassword);
          note.style.display = 'block';
          note.textContent = 'Password updated.';
          e.target.reset();
        } catch (err) {
          note.style.display = 'block';
          note.textContent = err.message || 'Could not change password.';
        }
      });

      const clinic = await Qlinic.getClinic();
      document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
      if (clinic && clinic.logo_url) {
        document.getElementById('clinicLogoThumb').src = clinic.logo_url;
        document.getElementById('clinicLogoThumb').style.display = 'block';
      } else {
        document.getElementById('clinicLogoThumb').style.display = 'none';
      }
      document.getElementById('currentEmail').textContent = (await Qlinic.getCurrentUserEmail()) || '·';
      document.getElementById('currentPhone').textContent = (clinic && clinic.phone) || '·';
    })();
  </script>
  <script>
    (function () {
      function applyTime(root) {
        const now = new Date();
        const s = now.getSeconds();
        const m = now.getMinutes();
        const h = now.getHours() % 12;
        const sec = root.querySelector(".clock-sec");
        const min = root.querySelector(".clock-min");
        const hour = root.querySelector(".clock-hour");
        if (sec) sec.style.transform = `rotate(${s * 6}deg)`;
        if (min) min.style.transform = `rotate(${m * 6 + s * 0.1}deg)`;
        if (hour) hour.style.transform = `rotate(${h * 30 + m * 0.5}deg)`;
      }
      function tickAll() {
        document.querySelectorAll(".clock-face").forEach(applyTime);
      }
      tickAll();
      setInterval(tickAll, 1000);
    })();
  </script>

</body>
</html>
