<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Patient Feedback: ClinVision</title>
<script>if (localStorage.getItem('qlinic_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=optional" rel="stylesheet">
<link rel="icon" type="image/png" href="clinvision-favicon.png?v=2" />
<link rel="stylesheet" href="styles.css?v=383" />
</head>
<body style="visibility:hidden;">
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="index.html" class="brand">
        <span class="brand-top">
        <span class="brand-word-wrap">
          <span class="brand-word">ClinVision</span>
          <span class="brand-word-bar"></span>
        </span>
      </span>
      <span class="brand-tagline">Where clinics run better</span>
      </a>
      <div class="clinic-name-row">
        <img class="clinic-logo-thumb" id="clinicLogoThumb" style="display:none;" alt="" />
        <div class="clinic-name" id="clinicName">Loading…</div>
      </div>
      <nav>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="reception.html" class="nav-link" id="receptionNavLink">Reception</a>
        <a href="doctor.html" class="nav-link">Doctor View</a>
        <a href="billing.html" class="nav-link" id="billingNavLink">Billing</a>
        <a href="prescriptions.html" class="nav-link" id="prescriptionsNavLink">Prescriptions</a>
        <a href="revenue.html" class="nav-link" id="revenueNavLink">Revenue</a>
        <a href="trends.html" class="nav-link" id="trendsNavLink">Insights</a>
        <a href="display.html" class="nav-link" id="displayNavLink">Display Screen</a>
        <a href="settings.html" class="nav-link active pinned-bottom">Settings</a>
      </nav>
    </aside>

    <main class="app-main">
      <div class="app-topbar" style="margin-bottom:16px;">
        <div>
          <div class="breadcrumb"><a href="settings.html">Settings</a> <span>/</span> Patient Feedback</div>
          <h1>Patient Feedback</h1>
        </div>
      </div>

      <div class="card-grid" id="feedbackStatCards" style="margin-bottom:20px;">
        <div class="stat-card accent-amber">
          <div class="value" id="summaryAvg">—</div>
          <div class="label">Average rating</div>
        </div>
        <div class="stat-card accent-blue">
          <div class="value" id="summaryCount">—</div>
          <div class="label">Total responses</div>
        </div>
        <div class="stat-card accent-teal">
          <div class="value" id="summaryRouted">—</div>
          <div class="label">Shared to Google</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2 id="feedbackListSummary">Loading…</h2>
          <div id="activeFilterChipsRow" class="active-filter-chips" style="margin-bottom:0;"></div>
          <button type="button" class="btn-sm primary" id="resetFiltersBtn" style="margin-left:auto;">Reset filters</button>
        </div>
        <div id="feedbackTableWrap"></div>
        <div class="pager" id="feedbackPager"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=132"></script>
  <script>
    (async function () {
      if (!(await Qlinic.requireLogin('login.html'))) return;

      if (await Qlinic.isPharmacist()) { window.location.href = 'pharmacy.html'; return; }
      if (await Qlinic.isDoctor()) { window.location.href = 'dashboard.html'; return; }
      if (!(await Qlinic.isAdmin())) { window.location.href = 'dashboard.html'; return; }

      document.querySelector('a.brand').addEventListener('click', async (e) => {
        e.preventDefault();
        if (await Qlinic.confirmDialog({ message: "Going to the homepage will end your session here, you'll need to log in again to get back in." })) {
          window.location.href = 'index.html';
        }
      });

      await Qlinic.applyFeatureNavGating();
      document.body.style.visibility = 'visible';

      const PAGE_SIZE = 15;
      let allEntries = [];
      let currentPage = 1;
      let doctorById = {};
      let doctorFilterIds = new Set();

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      function starsHtml(rating) {
        let out = '';
        for (let i = 1; i <= 5; i++) {
          out += `<svg class="fb-star${i <= rating ? ' lit' : ''}" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-4-6.3 4 1.7-7L2 9.5l7.1-.6z"/></svg>`;
        }
        return `<span class="fb-stars">${out}</span>`;
      }

      function FILTER_ICON_SVG(className) {
        return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>`;
      }

      function filteredEntries() {
        if (doctorFilterIds.size === 0) return allEntries;
        return allEntries.filter((e) => doctorFilterIds.has(e.doctorId));
      }

      function doctorFilterOptions() {
        return Object.values(doctorById)
          .map((d) => ({ value: d.id, label: d.name, count: allEntries.filter((e) => e.doctorId === d.id).length }))
          .filter((o) => o.count > 0)
          .sort((a, b) => b.count - a.count);
      }

      let openFilterColumn = null;
      function closeColumnFilter() {
        openFilterColumn = null;
        document.querySelectorAll('.filter-dropdown').forEach((el) => el.remove());
      }
      function openColumnFilter(column, anchorTh, options, selectedSet, onChange) {
        if (openFilterColumn === column) { closeColumnFilter(); return; }
        closeColumnFilter();
        openFilterColumn = column;
        const dropdown = document.createElement('div');
        dropdown.className = 'filter-dropdown';
        dropdown.innerHTML = options.map((o) => `
          <label><input type="checkbox" value="${Qlinic.escapeHtml(o.value)}" ${selectedSet.has(o.value) ? 'checked' : ''} /> ${Qlinic.escapeHtml(o.label)}<span class="fd-count">${o.count}</span></label>
        `).join('');
        dropdown.addEventListener('click', (e) => e.stopPropagation());
        dropdown.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
          cb.addEventListener('change', () => {
            if (cb.checked) selectedSet.add(cb.value); else selectedSet.delete(cb.value);
            closeColumnFilter();
            onChange();
          });
        });
        const anchorRect = anchorTh.getBoundingClientRect();
        dropdown.style.top = (anchorRect.bottom + 6) + 'px';
        dropdown.style.left = Math.max(8, Math.min(anchorRect.left, window.innerWidth - 208)) + 'px';
        document.body.appendChild(dropdown);
      }
      document.addEventListener('click', () => closeColumnFilter());

      function onFeedbackFilterChange() {
        currentPage = 1;
        renderTable();
      }

      function activeFilterChipsHtml() {
        const chips = [];
        if (doctorFilterIds.size > 0) {
          const labels = Object.values(doctorById).filter((d) => doctorFilterIds.has(d.id)).map((d) => d.name);
          chips.push({ key: 'doctor', label: `Doctor: ${labels.join(', ')}` });
        }
        if (chips.length === 0) return '';
        return `<div class="active-filter-chips">${chips.map((c) => `<div class="filter-chip">${Qlinic.escapeHtml(c.label)}<button type="button" class="clear-filter-chip" data-key="${c.key}" aria-label="Clear filter">×</button></div>`).join('')}</div>`;
      }
      function clearFilterByKey(key) {
        if (key === 'doctor') {
          doctorFilterIds.clear();
        }
        onFeedbackFilterChange();
      }
      function resetAllFilters() {
        doctorFilterIds.clear();
        onFeedbackFilterChange();
      }

      function renderSummary() {
        if (!allEntries.length) {
          document.getElementById('summaryAvg').textContent = '—';
          document.getElementById('summaryCount').textContent = '0';
          document.getElementById('summaryRouted').textContent = '0';
          return;
        }
        const avg = allEntries.reduce((sum, e) => sum + e.rating, 0) / allEntries.length;
        document.getElementById('summaryAvg').textContent = avg.toFixed(1);
        document.getElementById('summaryCount').textContent = String(allEntries.length);
        document.getElementById('summaryRouted').textContent = String(allEntries.filter((e) => e.routedToReview).length);
      }

      function renderPager(total) {
        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PAGE_SIZE;
        const end = Math.min(start + PAGE_SIZE, total);
        const summary = `<span class="pager-summary">Showing ${total === 0 ? 0 : start + 1}-${end} of ${total}</span>`;
        const pager = document.getElementById('feedbackPager');
        pager.innerHTML = `${summary}${Qlinic.pagerHtml(currentPage, totalPages)}`;
        Qlinic.wirePager(pager, currentPage, totalPages, (p) => { currentPage = p; renderTable(); });
      }

      function renderTable() {
        const filtered = filteredEntries();
        const wrap = document.getElementById('feedbackTableWrap');
        const isFiltered = filtered.length !== allEntries.length;
        document.getElementById('feedbackListSummary').textContent = isFiltered
          ? `${filtered.length} of ${allEntries.length} responses`
          : `${allEntries.length} response${allEntries.length === 1 ? '' : 's'}`;

        document.getElementById('activeFilterChipsRow').innerHTML = activeFilterChipsHtml();
        document.querySelectorAll('#activeFilterChipsRow .clear-filter-chip').forEach((btn) => {
          btn.addEventListener('click', () => clearFilterByKey(btn.dataset.key));
        });

        if (allEntries.length === 0) {
          wrap.innerHTML = '<div class="empty-state">No feedback collected yet. It starts showing up here once patients rate their visit from their queue link.</div>';
          document.getElementById('feedbackPager').innerHTML = '';
          return;
        }
        if (filtered.length === 0) {
          wrap.innerHTML = '<div class="empty-state">No feedback matches these filters.</div>';
          document.getElementById('feedbackPager').innerHTML = '';
          return;
        }

        const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageItems = filtered.slice(start, start + PAGE_SIZE);

        const doctorIconClass = doctorFilterIds.size > 0 ? 'th-filter-icon active' : 'th-filter-icon';
        wrap.innerHTML = `
          <table class="qtable qtable-fixed">
            <colgroup>
              <col style="width:11%;"><col style="width:14%;"><col style="width:14%;">
              <col style="width:18%;"><col style="width:13%;"><col style="width:13%;"><col style="width:17%;">
            </colgroup>
            <thead><tr>
              <th>Patient</th><th>Phone</th><th>Rating</th><th>Comment</th>
              <th class="th-filterable"><span class="th-filter-trigger" id="doctorFilterTrigger">Doctor ${FILTER_ICON_SVG(doctorIconClass)}</span></th>
              <th>To Google</th><th>Date</th>
            </tr></thead>
            <tbody>
              ${pageItems.map((e) => `
                <tr>
                  <td class="qtable-wrap">${e.patientName ? Qlinic.escapeHtml(e.patientName) : '—'}</td>
                  <td>${e.patientPhone ? Qlinic.escapeHtml(e.patientPhone) : '—'}</td>
                  <td>${starsHtml(e.rating)}</td>
                  <td class="qtable-wrap">${e.feedbackText ? Qlinic.escapeHtml(e.feedbackText) : '<span style="color:var(--grey-500);">No comment</span>'}</td>
                  <td class="qtable-wrap">${e.doctorId && doctorById[e.doctorId] ? Qlinic.escapeHtml(doctorById[e.doctorId].name) : '—'}</td>
                  <td>${e.routedToReview ? '<span class="fb-routed-yes">Yes</span>' : '—'}</td>
                  <td>${Qlinic.formatDateTime(e.submittedAt)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
        document.getElementById('doctorFilterTrigger').addEventListener('click', (e) => {
          e.stopPropagation();
          openColumnFilter('doctor', e.currentTarget.closest('th'), doctorFilterOptions(), doctorFilterIds, onFeedbackFilterChange);
        });
        renderPager(filtered.length);
      }

      document.getElementById('resetFiltersBtn').addEventListener('click', resetAllFilters);

      const clinic = await Qlinic.getClinic();
      document.getElementById('clinicName').textContent = clinic ? clinic.name : '';
      if (clinic && clinic.logo_url) {
        document.getElementById('clinicLogoThumb').src = clinic.logo_url;
        document.getElementById('clinicLogoThumb').style.display = 'block';
      } else {
        document.getElementById('clinicLogoThumb').style.display = 'none';
      }

      const doctors = await Qlinic.getDoctors({ includeInactive: true });
      doctorById = Object.fromEntries(doctors.map((d) => [d.id, d]));

      try {
        allEntries = await Qlinic.getClinicFeedback();
      } catch (err) {
        showToast(err.message || 'Could not load feedback');
        allEntries = [];
      }
      renderSummary();
      renderTable();
    })();
  </script>

</body>
</html>
