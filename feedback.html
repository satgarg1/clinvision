      <div class="fb-kpi-grid">
        <div class="fb-kpi-card">

        </div>
        <div class="fb-kpi-card">

            <div class="fb-kpi-value" id="summaryCount">—</div>

          </div>
        </div>
        <div class="fb-kpi-card">
          <div class="fb-kpi-icon purple">
            <svg width="22" height="22" viewBox="0 0 48 48">
              <path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
              <path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
              <path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/>
              <path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>

      <div class="panel" id="feedbackPanel">

          <div style="flex:1;min-width:220px;">

              <label class="pill-label" for="feedbackDateFrom">From</label>

            <div>

            </div>
            <div>
              <label class="pill-label" for="feedbackRatingFilter">Rating</label>
              <select id="feedbackRatingFilter">
                <option value="">All Ratings</option>
                <option value="5">5 stars</option>
                <option value="4">4 stars</option>
                <option value="3">3 stars</option>
                <option value="2">2 stars</option>
                <option value="1">1 star</option>
              </select>
            </div>
          </div>
        </div>

        <div id="activeFilterChipsRow" class="active-filter-chips" style="margin-bottom:12px;"></div>
        <h2 id="feedbackListSummary" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Loading…</h2>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="clinic-config.js"></script>
  <script src="clinic-data.js?v=135"></script>
  <script src="app-topbar.js?v=5"></script>
  <script>
    (async function () {
      if (!(await Qlinic.requireLogin('login.html'))) return;

      if (await Qlinic.isPharmacist()) { window.location.href = 'pharmacy.html'; return; }
      if (await Qlinic.isDoctor()) { window.location.href = 'dashboard.html'; return; }
      if (!(await Qlinic.isAdmin())) { window.location.href = 'dashboard.html'; return; }

      document.querySelector('a.brand').addEventListener('click', async (e) => {
        e.preventDefault();
        if (await Qlinic.confirmDialog({ message: "Going to the homepage will end your session here, you'll need to log in again to get back in." })) {
          window.location.href = 'index.html';
        }
      });

      await Qlinic.applyFeatureNavGating();
      document.body.style.visibility = 'visible';

      const PAGE_SIZE = 15;
      let allEntries = [];
      let currentPage = 1;
      let doctorById = {};
      let doctorFilterIds = new Set();
      let dateFrom = '';
      let dateTo = '';
      let ratingFilter = '';

      const GOOGLE_G_SVG = '<svg width="12" height="12" viewBox="0 0 48 48"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC05" d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg>';
      const PHONE_ICON_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--grey-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
      const CALENDAR_ICON_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--grey-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px;flex-shrink:0;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
      const AVATAR_COLORS = ['mkt-teal', 'mkt-coral', 'mkt-blue', 'mkt-purple', 'mkt-pink'];

      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
      }

      function starsHtml(rating) {
        let out = '';
        for (let i = 1; i <= 5; i++) {
          out += `<svg class="fb-star${i <= rating ? ' lit' : ''}" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-4-6.3 4 1.7-7L2 9.5l7.1-.6z"/></svg>`;
        }
        return `<span class="fb-stars">${out}</span>`;
      }

      function FILTER_ICON_SVG(className) {
        return `<svg class="${className}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>`;
      }

      function avatarColorFor(key) {
        return AVATAR_COLORS[Qlinic.hashIndex(key, AVATAR_COLORS.length)];
      }
      function splitDateTime(iso) {
        const d = new Date(iso);
        const dateLabel = d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
        const timeLabel = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }).toLowerCase();
        return { dateLabel, timeLabel };
      }

      function pad2(n) { return String(n).padStart(2, '0'); }
      function entryDateStr(e) {
        const d = new Date(e.submittedAt);
        return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
      }
      // Either bound may be left empty (open-ended: only From = that day
      // onward, only To = up to that day); when both are set a reversed
      // pair is swapped so it never breaks.
      function computeDateRange() {
        if (!dateFrom && !dateTo) return null;
        if (dateFrom && dateTo && dateFrom > dateTo) return { start: dateTo, end: dateFrom };
        return { start: dateFrom, end: dateTo };
      }

      function searchTerm() {
        return document.getElementById('feedbackSearch').value.trim().toLowerCase();
      }

      function searchDateRatingEntries() {
        const term = searchTerm();
        const range = computeDateRange();
        return allEntries.filter((e) => {
          if (term && !(
            (e.patientName || '').toLowerCase().includes(term) ||
            (e.patientPhone || '').toLowerCase().includes(term)
          )) return false;
          if (range) {
            const day = entryDateStr(e);
            if (range.start && day < range.start) return false;
            if (range.end && day > range.end) return false;
          }
          if (ratingFilter && String(e.rating) !== ratingFilter) return false;
          return true;
        });
      }

      function filteredEntries() {
        return searchDateRatingEntries().filter((e) => {
          if (doctorFilterIds.size > 0 && !doctorFilterIds.has(e.doctorId)) return false;
          return true;
        });
      }

      function doctorFilterOptions() {
        const counting = searchDateRatingEntries();
        return Object.values(doctorById)
          .map((d) => ({ value: d.id, label: d.name, count: counting.filter((e) => e.doctorId === d.id).length }))
          .filter((o) => o.count > 0)
          .sort((a, b) => b.count - a.count);
      }

      let openFilterColumn = null;
      function closeColumnFilter() {
        openFilterColumn = null;
        document.querySelectorAll('.filter-dropdown').forEach((el) => el.remove());
      }
      function openColumnFilter(column, anchorTh, options, selectedSet, onChange) {
        if (openFilterColumn === column) { closeColumnFilter(); return; }
        closeColumnFilter();
        openFilterColumn = column;
        const dropdown = document.createElement('div');
        dropdown.className = 'filter-dropdown';
        dropdown.innerHTML = options.map((o) => `
          <label><input type="checkbox" value="${Qlinic.escapeHtml(o.value)}" ${selectedSet.has(o.value) ? 'checked' : ''} /> ${Qlinic.escapeHtml(o.label)}<span class="fd-count">${o.count}</span></label>
        `).join('');
        dropdown.addEventListener('click', (e) => e.stopPropagation());
        dropdown.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
          cb.addEventListener('change', () => {
            if (cb.checked) selectedSet.add(cb.value); else selectedSet.delete(cb.value);
            closeColumnFilter();
            onChange();
          });
        });
        const anchorRect = anchorTh.getBoundingClientRect();
        dropdown.style.top = (anchorRect.bottom + 6) + 'px';
        dropdown.style.left = Math.max(8, Math.min(anchorRect.left, window.innerWidth - 208)) + 'px';
        document.body.appendChild(dropdown);
      }
      document.addEventListener('click', () => closeColumnFilter());

      function onFeedbackFilterChange() {
        currentPage = 1;
        renderTable();
      }

      function activeFilterChipsHtml() {
        const chips = [];
        if (doctorFilterIds.size > 0) {
          const labels = Object.values(doctorById).filter((d) => doctorFilterIds.has(d.id)).map((d) => d.name);
          chips.push({ key: 'doctor', label: `Doctor: ${labels.join(', ')}` });
        }
        if (ratingFilter) {
          chips.push({ key: 'rating', label: `Rating: ${ratingFilter} star${ratingFilter === '1' ? '' : 's'}` });
        }
        const range = computeDateRange();
        if (range) {
          const dateLabel = range.start && range.end
            ? `${Qlinic.formatDateLabel(range.start)} to ${Qlinic.formatDateLabel(range.end)}`
            : range.start
            ? `from ${Qlinic.formatDateLabel(range.start)}`
            : `up to ${Qlinic.formatDateLabel(range.end)}`;
          chips.push({ key: 'date', label: `Date: ${dateLabel}` });
        }
        if (chips.length === 0) return '';
        return chips.map((c) => `<div class="filter-chip">${Qlinic.escapeHtml(c.label)}<button type="button" class="clear-filter-chip" data-key="${c.key}" aria-label="Clear filter">×</button></div>`).join('');
      }
      function clearFilterByKey(key) {
        if (key === 'doctor') {
          doctorFilterIds.clear();
        } else if (key === 'rating') {
          ratingFilter = '';
          document.getElementById('feedbackRatingFilter').value = '';
        } else if (key === 'date') {
          dateFrom = '';
          dateTo = '';
          document.getElementById('feedbackDateFrom').value = '';
          document.getElementById('feedbackDateTo').value = '';
        }
        onFeedbackFilterChange();
      }

      function renderSummary() {
        if (!allEntries.length) {
          document.getElementById('summaryAvg').textContent = '—';
          document.getElementById('summaryCount').textContent = '0';
          document.getElementById('summaryRouted').textContent = '0';
          return;
        }
        const avg = allEntries.reduce((sum, e) => sum + e.rating, 0) / allEntries.length;
        document.getElementById('summaryAvg').textContent = avg.toFixed(1);
        document.getElementById('summaryCount').textContent = String(allEntries.length);
        document.getElementById('summaryRouted').textContent = String(allEntries.filter((e) => e.routedToReview).length);
      }

      function renderPager(total) {
        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PAGE_SIZE;
        const end = Math.min(start + PAGE_SIZE, total);
        const summary = `<span class="pager-summary">Showing ${total === 0 ? 0 : start + 1}-${end} of ${total}</span>`;
        const pager = document.getElementById('feedbackPager');
        pager.innerHTML = `${summary}${Qlinic.pagerHtml(currentPage, totalPages)}`;
        Qlinic.wirePager(pager, currentPage, totalPages, (p) => { currentPage = p; renderTable(); });
      }

      function renderTable() {
        const filtered = filteredEntries();
        const wrap = document.getElementById('feedbackTableWrap');
        const isFiltered = filtered.length !== allEntries.length;
        document.getElementById('feedbackListSummary').textContent = isFiltered
          ? `Patient Feedback (${filtered.length} of ${allEntries.length})`
          : `Patient Feedback (${allEntries.length})`;

        document.getElementById('activeFilterChipsRow').innerHTML = activeFilterChipsHtml();
        document.querySelectorAll('#activeFilterChipsRow .clear-filter-chip').forEach((btn) => {
          btn.addEventListener('click', () => clearFilterByKey(btn.dataset.key));
        });

        if (allEntries.length === 0) {
          wrap.innerHTML = '<div class="empty-state">No feedback collected yet. It starts showing up here once patients rate their visit from their queue link.</div>';
          document.getElementById('feedbackPager').innerHTML = '';
          return;
        }
        if (filtered.length === 0) {
          wrap.innerHTML = '<div class="empty-state">No feedback matches these filters.</div>';
          document.getElementById('feedbackPager').innerHTML = '';
          return;
        }

        const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageItems = filtered.slice(start, start + PAGE_SIZE);

        const doctorIconClass = doctorFilterIds.size > 0 ? 'th-filter-icon active' : 'th-filter-icon';
        wrap.innerHTML = `
          <table class="qtable qtable-fixed">
            <colgroup>
              <col style="width:15%;"><col style="width:13%;"><col style="width:15%;">
              <col style="width:18%;"><col style="width:14%;"><col style="width:11%;"><col style="width:14%;">
            </colgroup>
            <thead><tr>
              <th>Patient</th><th>Phone</th><th>Rating</th><th>Comment</th>
              <th class="th-filterable"><span class="th-filter-trigger" id="doctorFilterTrigger">Doctor ${FILTER_ICON_SVG(doctorIconClass)}</span></th>
              <th>To Google</th><th>Date</th>
            </tr></thead>
            <tbody>
              ${pageItems.map((e) => {
                const doctor = e.doctorId ? doctorById[e.doctorId] : null;
                const { dateLabel, timeLabel } = splitDateTime(e.submittedAt);
                return `
                <tr>
                  <td class="qtable-wrap">
                    <div style="display:flex;align-items:center;gap:10px;">
                      <div class="fb-avatar ${avatarColorFor(e.id)}">${Qlinic.escapeHtml(Qlinic.initialsFor(e.patientName))}</div>
                      <span style="font-weight:600;color:var(--black);">${e.patientName ? Qlinic.escapeHtml(e.patientName) : '—'}</span>
                    </div>
                  </td>
                  <td><div class="fb-phone-cell">${e.patientPhone ? PHONE_ICON_SVG + Qlinic.escapeHtml(e.patientPhone) : '—'}</div></td>
                  <td>
                    <div style="display:flex;align-items:center;gap:6px;">
                      ${starsHtml(e.rating)}
                      <span style="font-size:var(--text-sm);font-weight:600;color:var(--grey-700);">${e.rating.toFixed(1)}</span>
                    </div>
                  </td>
                  <td class="qtable-wrap">
                    ${e.feedbackText
                      ? `<div class="fb-comment-cell"><span class="fb-comment-quote">&ldquo;</span><span class="fb-comment-text">${Qlinic.escapeHtml(e.feedbackText)}</span></div>`
                      : '<span style="color:var(--grey-500);">No comment</span>'}
                  </td>
                  <td class="qtable-wrap">
                    ${doctor
                      ? `<div><div style="font-size:var(--text-sm);font-weight:600;color:var(--black);">Dr. ${Qlinic.escapeHtml(doctor.name)}</div>${doctor.specialty ? `<div style="font-size:var(--text-xs);color:var(--grey-500);">${Qlinic.escapeHtml(doctor.specialty)}</div>` : ''}</div>`
                      : '—'}
                  </td>
                  <td>${e.routedToReview ? `<span class="fb-google-pill">${GOOGLE_G_SVG}Yes</span>` : '—'}</td>
                  <td><div class="fb-date-cell">${CALENDAR_ICON_SVG}<div><div style="font-size:var(--text-sm);color:var(--black);">${dateLabel},</div><div style="font-size:var(--text-xs);color:var(--grey-500);">${timeLabel}</div></div></div></td>
                </tr>
              `;
              }).join('')}
            </tbody>
          </table>
        `;
        document.getElementById('doctorFilterTrigger').addEventListener('click', (e) => {
          e.stopPropagation();
          openColumnFilter('doctor', e.currentTarget.closest('th'), doctorFilterOptions(), doctorFilterIds, onFeedbackFilterChange);
        });
        renderPager(filtered.length);
      }

      document.getElementById('feedbackSearch').addEventListener('input', () => {
        currentPage = 1;
        renderTable();
      });
      function syncDateInputs() {
        const fromEl = document.getElementById('feedbackDateFrom');
        const toEl = document.getElementById('feedbackDateTo');
        if (fromEl.value && toEl.value && fromEl.value > toEl.value) {
          const swap = fromEl.value;
          fromEl.value = toEl.value;
          toEl.value = swap;
        }
        dateFrom = fromEl.value;
        dateTo = toEl.value;
        onFeedbackFilterChange();
      }
      document.getElementById('feedbackDateFrom').addEventListener('change', syncDateInputs);
      document.getElementById('feedbackDateTo').addEventListener('change', syncDateInputs);
      document.getElementById('feedbackRatingFilter').addEventListener('change', (e) => {
        ratingFilter = e.target.value;
        onFeedbackFilterChange();
      });
      Qlinic.attachDatePicker(document.getElementById('feedbackDateFrom'), { quickButtons: false });
      Qlinic.attachDatePicker(document.getElementById('feedbackDateTo'), { quickButtons: false });
      document.getElementById('feedbackDateFrom').max = Qlinic.getTodayDate();
      document.getElementById('feedbackDateTo').max = Qlinic.getTodayDate();


      const doctors = await Qlinic.getDoctors({ includeInactive: true });
      doctorById = Object.fromEntries(doctors.map((d) => [d.id, d]));

      try {
        allEntries = await Qlinic.getClinicFeedback();
      } catch (err) {
        showToast(err.message || 'Could not load feedback');
        allEntries = [];
      }
      renderSummary();
      renderTable();
    })();
  </script>

</body>
</html>
